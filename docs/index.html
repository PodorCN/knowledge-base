tive\n1. **Leverage effect** — price ↓ → leverage ↑ → vol ↑.\n2. **Crash fear** — hedgers' demand for downside puts (post-1987).\n3. **Supply of upside calls** from overwriters.\n→ OTM puts richer than OTM calls; $\\partial\\sigma/\\partial K<0$.\n\n### Where skew shows up in prices\n- [[digital-options]]: skew term $-\\mathcal V\\,\\partial\\sigma/\\partial K>0$ makes digital calls dearer.\n- [[variance-swaps]]: $1/K^2$ weights on expensive puts → var strike > ATM vol.\n- [[autocallables]]: investor sells a deep OTM put priced in the steep part of the skew.\n- [[sticky-strike-vs-sticky-moneyness]]: skew makes delta depend on dynamics.\n\n### Models producing skew\nHeston ρ < 0 ([[heston-model]]); jumps for short-dated skew ([[jump-diffusion]]); SVI ρ parameter.\n\n<a id=\"fx-vol-conventions\"><\/a>\n\n## FX Vol Quoting (ATM, Risk Reversal, Butterfly)\n<!-- section: fx-vol-conventions | prerequisites: [volatility-surface] | related: [second-order-greeks, sabr, volatility-skew] | tags: [fx, risk-reversal, butterfly, delta-quoting] -->\n\n$$\\sigma_{25C}=\\sigma_{ATM}+\\tfrac12RR+BF,\\qquad \\sigma_{25P}=\\sigma_{ATM}-\\tfrac12RR+BF$$\n\n**Variables:**\n\n- $\\sigma_{ATM}$ delta-neutral straddle vol\n- $RR$ 25-delta risk reversal (call vol − put vol\n- skew)\n- $BF$ 25-delta butterfly (avg wing − ATM\n- curvature)\n\nATM 7.0%, RR −0.5%, BF 0.2% → 25Δ call 6.95%, put 7.45%.\n\n- OTC market quotes **vol**, not price; per tenor, often also 10Δ.\n- Interpolate across delta: vanna–volga (standard, not arb-free), SABR, polynomial.\n- Traps: delta conventions (spot vs forward, premium-adjusted), market vs smile strangle.", "summary": "", "topic": "", "sections": ["implied-volatility", "realized-volatility", "vol-term-structure", "volatility-skew", "fx-vol-conventions"], "degree": 9}, {"id": "ols-regression", "title": "OLS Linear Regression (derivation & geometry)", "type": "concept", "domain": "signal-research", "tags": ["ols", "normal-equations", "projection", "fwl"], "path": "topics/linear-regression.md", "content": "<a id=\"ols-regression\"><\/a>\n\n## OLS Linear Regression (derivation & geometry)\n<!-- section: ols-regression | prerequisites: [variance-covariance-correlation] | related: [r-squared, gauss-markov-assumptions, conditional-expectation-best-predictor, implied-forward-regression, capm-alpha-beta, ridge-regression] | tags: [ols, normal-equations, projection, fwl] -->\n\n### Simple regression (with intercept)\n$$\\hat\\beta_1=\\frac{\\sum(x_i-\\bar x)(y_i-\\bar y)}{\\sum(x_i-\\bar x)^2}=r_{xy}\\frac{s_y}{s_x},\\qquad \\hat\\beta_0=\\bar y-\\hat\\beta_1\\bar x$$\n\n**Reverse regressions:** $\\hat\\beta_{Y|X}\\hat\\beta_{X|Y}=r^2$ (reciprocals only if $|r|=1$). E.g. $s_x=2,s_y=3,r=0.6$ → 0.9 and 0.4.\n\n**No intercept:** $\\hat\\beta=\\sum x_iy_i/\\sum x_i^2$; product of the two slopes = squared raw cosine, not $r^2$.\n\n### Multiple regression\n$$X^\\top X\\hat\\beta=X^\\top y\\ \\Rightarrow\\ \\hat\\beta=(X^\\top X)^{-1}X^\\top y,\\qquad H=X(X^\\top X)^{-1}X^\\top,\\ \\hat y=Hy,\\ X^\\top e=0$$\n\n**Variables:**\n\n- $x_i,y_i$ observations\n- $r_{xy}$ sample correlation\n- $s_x,s_y$ sample std devs\n- $X$ $n\\times p$ design matrix (column of 1s = intercept)\n- $y$ response\n- $\\hat\\beta$ coefficients\n- $H$ hat (projection) matrix, symmetric & idempotent\n- $e$ residuals\n\n### Key points\n- Line passes through $(\\bar x,\\bar y)$; with intercept $\\sum e_i=0$.\n- Compute with **QR/SVD**, not an explicit inverse.\n- **Frisch–Waugh–Lovell:** coefficient on $x_j$ = regress residualised $y$ on residualised $x_j$ → why signs change when controls are added.\n- Slope is association, not causation, without extra assumptions.\n\n### Connections\n- **Builds on:** [[variance-covariance-correlation]]; approximates [[conditional-expectation-best-predictor]].\n- **Assumptions / inference:** [[gauss-markov-assumptions]], [[robust-standard-errors]], [[r-squared]].\n- **Failure modes:** [[omitted-variable-bias]], [[multicollinearity]] → [[ridge-regression]].\n- **Finance applications:** [[capm-alpha-beta]] (beta = slope), [[implied-forward-regression]] (regress $C-P$ on $K$).", "summary": "<a id=\"ols-regression\"><\/a>", "topic": "linear-regression", "degree": 20}, {"id": "r-squared", "title": "R² and Adjusted R²", "type": "concept", "domain": "signal-research", "tags": ["goodness-of-fit"], "path": "topics/linear-regression.md", "content": "<a id=\"r-squared\"><\/a>\n\n## R² and Adjusted R²\n<!-- section: r-squared | prerequisites: [ols-regression] | related: [bias-variance-tradeoff, cross-validation-leakage] | tags: [goodness-of-fit] -->\n\n### Formulas\n$$R^2=1-\\frac{SSE}{SST},\\qquad \\bar R^2=1-\\frac{SSE/(n-p)}{SST/(n-1)}$$\n\n**Variables:**\n\n- $SSE=\\sum e_i^2$\n- $SST=\\sum(y_i-\\bar y)^2$\n- $n$ observations\n- $p$ coefficients incl. intercept\n\n### Key points\n- Simple OLS with intercept: $R^2=r_{xy}^2$.\n- Adding regressors can't lower training $R^2$ (nested model still feasible) — adjusted $R^2$ and **test** performance can fall.\n- Test $R^2$ can be **negative** (worse than predicting the mean).\n\n### Connections\n- **Why training R² misleads:** [[bias-variance-tradeoff]], [[cross-validation-leakage]].", "summary": "<a id=\"r-squared\"><\/a>", "topic": "linear-regression", "degree": 6}, {"id": "gauss-markov-assumptions", "title": "Regression Assumptions (Gauss–Markov) & Inference", "type": "concept", "domain": "signal-research", "tags": ["blue", "unbiasedness", "t-test", "f-test"], "path": "topics/linear-regression.md", "content": "<a id=\"gauss-markov-assumptions\"><\/a>\n\n## Regression Assumptions (Gauss–Markov) & Inference\n<!-- section: gauss-markov-assumptions | prerequisites: [ols-regression, hypothesis-testing] | related: [robust-standard-errors, omitted-variable-bias, multicollinearity] | tags: [blue, unbiasedness, t-test, f-test] -->\n\n| Claim | Needs |\n|---|---|\n| Unique $\\hat\\beta$ exists | $X$ full column rank |\n| Unbiased | correct linear mean + $E[\\varepsilon\\mid X]=0$ |\n| Classical SE formula valid | also $\\mathrm{Var}(\\varepsilon\\mid X)=\\sigma^2I$ |\n| BLUE | Gauss–Markov conditions |\n| Exact finite-sample t/F | also $\\varepsilon\\mid X\\sim N(0,\\sigma^2I)$ |\n\n### Formulas\n$$\\hat\\beta=\\beta+(X^\\top X)^{-1}X^\\top\\varepsilon,\\quad \\mathrm{Var}(\\hat\\beta\\mid X)=\\sigma^2(X^\\top X)^{-1},\\quad \\hat\\sigma^2=\\frac{SSE}{n-p},\\quad SE(\\hat\\beta_1)=\\frac{\\hat\\sigma}{\\sqrt{\\sum(x_i-\\bar x)^2}}$$\n$$t_j=\\frac{\\hat\\beta_j-b_0}{SE(\\hat\\beta_j)}\\sim t_{n-p},\\qquad F=\\frac{(SSE_R-SSE_U)/q}{SSE_U/(n-p_U)}\\sim F_{q,n-p_U}$$\n\n**Variables:**\n\n- $\\beta$ true coefficients\n- $\\varepsilon$ errors\n- $b_0$ null value\n- $q$ number of restrictions\n- $R/U$ restricted/unrestricted\n\n### Key points\n- **Normality is NOT needed for unbiasedness** (classic trap).\n- More spread in $x$ → smaller slope SE.\n- All individual t-stats weak but joint F significant: possible with correlated regressors.\n\n### Connections\n- **Violations:** [[robust-standard-errors]] (heteroskedasticity / autocorrelation), [[omitted-variable-bias]] (endogeneity), [[multicollinearity]].", "summary": "<a id=\"gauss-markov-assumptions\"><\/a>", "topic": "linear-regression", "degree": 13}, {"id": "robust-standard-errors", "title": "Heteroskedasticity, Serial Correlation & Robust SEs", "type": "concept", "domain": "signal-research", "tags": ["hc0", "hac", "newey-west"], "path": "topics/linear-regression.md", "content": "<a id=\"robust-standard-errors\"><\/a>\n\n## Heteroskedasticity, Serial Correlation & Robust SEs\n<!-- section: robust-standard-errors | prerequisites: [gauss-markov-assumptions] | related: [effective-sample-size, stationarity-ar1] | tags: [hc0, hac, newey-west] -->\n\n### Formulas\n$$\\mathrm{Var}(\\hat\\beta\\mid X)=(X^\\top X)^{-1}X^\\top\\Omega X(X^\\top X)^{-1},\\qquad \\text{HC0: }(X^\\top X)^{-1}\\Big(\\sum_i e_i^2x_ix_i^\\top\\Big)(X^\\top X)^{-1}$$\n\n**Variables:**\n\n- $\\Omega$ error covariance\n- $e_i$ residual\n- $x_i$ regressor vector for row $i$\n\n### Key points\n- Heteroskedasticity **doesn't bias** $\\hat\\beta$ (if $E[\\varepsilon|X]=0$) but breaks the classical SE.\n- Serial correlation → HAC (Newey–West) or clustering; \"robust\" SEs don't fix endogeneity or every dependence.\n\n### Connections\n- **Time-series cause:** [[stationarity-ar1]]; quantified by [[effective-sample-size]].", "summary": "<a id=\"robust-standard-errors\"><\/a>", "topic": "linear-regression", "degree": 7}, {"id": "omitted-variable-bias", "title": "Omitted-Variable Bias", "type": "concept", "domain": "signal-research", "tags": ["endogeneity", "confounding"], "path": "topics/linear-regression.md", "content": "<a id=\"omitted-variable-bias\"><\/a>\n\n## Omitted-Variable Bias\n<!-- section: omitted-variable-bias | prerequisites: [ols-regression] | related: [gauss-markov-assumptions, capm-alpha-beta] | tags: [endogeneity, confounding] -->\n\n### Formula\nTrue $Y=\\beta_0+\\beta_1X+\\beta_2Z+\\varepsilon$; regress $Y$ on $X$ only:\n\n$$\\tilde\\beta_1=\\beta_1+\\beta_2\\frac{\\mathrm{Cov}(X,Z)}{\\mathrm{Var}(X)}$$\n\n**Variables:**\n\n- $Z$ omitted variable\n- $\\beta_2$ its effect on $Y$\n\n### Key points\n- Bias needs **both** $\\beta_2\\ne0$ and $\\mathrm{Cov}(X,Z)\\ne0$.\n- Explains coefficient sign flips when adding controls (also via FWL).\n- Finance: \"alpha\" can be an omitted risk factor ([[capm-alpha-beta]]).", "summary": "<a id=\"omitted-variable-bias\"><\/a>", "topic": "linear-regression", "degree": 7}, {"id": "multicollinearity", "title": "Multicollinearity & VIF", "type": "concept", "domain": "signal-research", "tags": ["vif", "ill-conditioning"], "path": "topics/linear-regression.md", "content": "<a id=\"multicollinearity\"><\/a>\n\n## Multicollinearity & VIF\n<!-- section: multicollinearity | prerequisites: [ols-regression, eigen-svd-psd] | related: [ridge-regression, pca, regression-invariances] | tags: [vif, ill-conditioning] -->\n\n### Formula\n$$VIF_j=\\frac{1}{1-R_j^2}$$\n\n**Variables:** $R_j^2$ from regressing regressor $j$ on the other regressors.\n\n### Key points\n- Perfect collinearity → coefficients non-unique (fitted values still unique = projection).\n- Near-collinearity → small singular values → coefficients unstable; prediction may still be fine.\n- Remedies: drop/combine variables, more data, [[ridge-regression]], [[pca]] regression — choose by goal.\n\n### Connections\n- **Diagnosed by:** [[eigen-svd-psd]] (small eigenvalues of $X^\\top X$). **Fixed by:** [[ridge-regression]].", "summary": "<a id=\"multicollinearity\"><\/a>", "topic": "linear-regression", "degree": 11}, {"id": "regression-invariances", "title": "Regression Invariances (duplication, scaling)", "type": "concept", "domain": "signal-research", "tags": ["interview-variations"], "path": "topics/linear-regression.md", "content": "<a id=\"regression-invariances\"><\/a>\n\n## Regression Invariances (duplication, scaling)\n<!-- section: regression-invariances | prerequisites: [gauss-markov-assumptions] | related: [ridge-regression, effective-sample-size] | tags: [interview-variations] -->\n\n### Duplicate every row\n$X^\\top X$, $X^\\top y$ double → **coefficients unchanged**. SSE doubles; naive software uses $2n-p$ dof:\n\n$$\\text{SE}_{new}=\\text{SE}_{old}\\sqrt{\\frac{n-p}{2n-p}}\\approx\\frac{\\text{SE}_{old}}{\\sqrt2}$$\nThe shrink is **fictitious** — no new information. (Ridge with fixed λ on an unnormalised SSE *does* change: effective λ halves.)\n\n### Other variations\n- $y\\to cy$: coefficients & residuals ×$c$, SEs ×$|c|$, $R^2$ unchanged.\n- $x_j\\to cx_j$: its coefficient ÷$c$; fits unchanged.\n- Add a constant to $x_j$ (with intercept): slope unchanged.\n- Exact duplicate column: OLS non-unique; ridge splits the weight equally.\n- Add noise feature: training fit can't worsen; test may.\n\n**Variables:** $n$ rows, $p$ coefficients, $c$ nonzero constant.\n\n### Connections\n- **Related:** [[effective-sample-size]] (correlated rows ≈ fewer real observations), [[ridge-regression]].", "summary": "<a id=\"regression-invariances\"><\/a>", "topic": "linear-regression", "degree": 8}, {"id": "prediction-vs-confidence-interval", "title": "Prediction Interval vs Confidence Interval", "type": "concept", "domain": "signal-research", "tags": ["intervals"], "path": "topics/linear-regression.md", "content": "<a id=\"prediction-vs-confidence-interval\"><\/a>\n\n## Prediction Interval vs Confidence Interval\n<!-- section: prediction-vs-confidence-interval | prerequisites: [gauss-markov-assumptions, confidence-intervals] | related: [] | tags: [intervals] -->\n\n$$SE(\\text{mean at }x_0)=\\hat\\sigma\\sqrt{\\tfrac1n+\\tfrac{(x_0-\\bar x)^2}{S_{xx}}},\\qquad SE(\\text{new obs})=\\hat\\sigma\\sqrt{1+\\tfrac1n+\\tfrac{(x_0-\\bar x)^2}{S_{xx}}}$$\n\n**Variables:**\n\n- $x_0$ query point\n- $S_{xx}=\\sum(x_i-\\bar x)^2$\n- $\\hat\\sigma$ residual std error\n\nThe extra \"1\" = irreducible noise of a new observation → prediction intervals are always wider.", "summary": "<a id=\"prediction-vs-confidence-interval\"><\/a>", "topic": "linear-regression", "degree": 5}, {"id": "linear-regression", "title": "Linear Regression", "type": "topic", "domain": "signal-research", "tags": [], "path": "topics/linear-regression.md", "content": "# Linear Regression\n\n**Sections:** [[ols-regression]] · [[r-squared]] · [[gauss-markov-assumptions]] · [[robust-standard-errors]] · [[omitted-variable-bias]] · [[multicollinearity]] · [[regression-invariances]] · [[prediction-vs-confidence-interval]]\n\n<a id=\"ols-regression\"><\/a>\n\n## OLS Linear Regression (derivation & geometry)\n<!-- section: ols-regression | prerequisites: [variance-covariance-correlation] | related: [r-squared, gauss-markov-assumptions, conditional-expectation-best-predictor, implied-forward-regression, capm-alpha-beta, ridge-regression] | tags: [ols, normal-equations, projection, fwl] -->\n\n### Simple regression (with intercept)\n$$\\hat\\beta_1=\\frac{\\sum(x_i-\\bar x)(y_i-\\bar y)}{\\sum(x_i-\\bar x)^2}=r_{xy}\\frac{s_y}{s_x},\\qquad \\hat\\beta_0=\\bar y-\\hat\\beta_1\\bar x$$\n\n**Reverse regressions:** $\\hat\\beta_{Y|X}\\hat\\beta_{X|Y}=r^2$ (reciprocals only if $|r|=1$). E.g. $s_x=2,s_y=3,r=0.6$ → 0.9 and 0.4.\n\n**No intercept:** $\\hat\\beta=\\sum x_iy_i/\\sum x_i^2$; product of the two slopes = squared raw cosine, not $r^2$.\n\n### Multiple regression\n$$X^\\top X\\hat\\beta=X^\\top y\\ \\Rightarrow\\ \\hat\\beta=(X^\\top X)^{-1}X^\\top y,\\qquad H=X(X^\\top X)^{-1}X^\\top,\\ \\hat y=Hy,\\ X^\\top e=0$$\n\n**Variables:**\n\n- $x_i,y_i$ observations\n- $r_{xy}$ sample correlation\n- $s_x,s_y$ sample std devs\n- $X$ $n\\times p$ design matrix (column of 1s = intercept)\n- $y$ response\n- $\\hat\\beta$ coefficients\n- $H$ hat (projection) matrix, symmetric & idempotent\n- $e$ residuals\n\n### Key points\n- Line passes through $(\\bar x,\\bar y)$; with intercept $\\sum e_i=0$.\n- Compute with **QR/SVD**, not an explicit inverse.\n- **Frisch–Waugh–Lovell:** coefficient on $x_j$ = regress residualised $y$ on residualised $x_j$ → why signs change when controls are added.\n- Slope is association, not causation, without extra assumptions.\n\n### Connections\n- **Builds on:** [[variance-covariance-correlation]]; approximates [[conditional-expectation-best-predictor]].\n- **Assumptions / inference:** [[gauss-markov-assumptions]], [[robust-standard-errors]], [[r-squared]].\n- **Failure modes:** [[omitted-variable-bias]], [[multicollinearity]] → [[ridge-regression]].\n- **Finance applications:** [[capm-alpha-beta]] (beta = slope), [[implied-forward-regression]] (regress $C-P$ on $K$).\n\n<a id=\"r-squared\"><\/a>\n\n## R² and Adjusted R²\n<!-- section: r-squared | prerequisites: [ols-regression] | related: [bias-variance-tradeoff, cross-validation-leakage] | tags: [goodness-of-fit] -->\n\n### Formulas\n$$R^2=1-\\frac{SSE}{SST},\\qquad \\bar R^2=1-\\frac{SSE/(n-p)}{SST/(n-1)}$$\n\n**Variables:**\n\n- $SSE=\\sum e_i^2$\n- $SST=\\sum(y_i-\\bar y)^2$\n- $n$ observations\n- $p$ coefficients incl. intercept\n\n### Key points\n- Simple OLS with intercept: $R^2=r_{xy}^2$.\n- Adding regressors can't lower training $R^2$ (nested model still feasible) — adjusted $R^2$ and **test** performance can fall.\n- Test $R^2$ can be **negative** (worse than predicting the mean).\n\n### Connections\n- **Why training R² misleads:** [[bias-variance-tradeoff]], [[cross-validation-leakage]].\n\n<a id=\"gauss-markov-assumptions\"><\/a>\n\n## Regression Assumptions (Gauss–Markov) & Inference\n<!-- section: gauss-markov-assumptions | prerequisites: [ols-regression, hypothesis-testing] | related: [robust-standard-errors, omitted-variable-bias, multicollinearity] | tags: [blue, unbiasedness, t-test, f-test] -->\n\n| Claim | Needs |\n|---|---|\n| Unique $\\hat\\beta$ exists | $X$ full column rank |\n| Unbiased | correct linear mean + $E[\\varepsilon\\mid X]=0$ |\n| Classical SE formula valid | also $\\mathrm{Var}(\\varepsilon\\mid X)=\\sigma^2I$ |\n| BLUE | Gauss–Markov conditions |\n| Exact finite-sample t/F | also $\\varepsilon\\mid X\\sim N(0,\\sigma^2I)$ |\n\n### Formulas\n$$\\hat\\beta=\\beta+(X^\\top X)^{-1}X^\\top\\varepsilon,\\quad \\mathrm{Var}(\\hat\\beta\\mid X)=\\sigma^2(X^\\top X)^{-1},\\quad \\hat\\sigma^2=\\frac{SSE}{n-p},\\quad SE(\\hat\\beta_1)=\\frac{\\hat\\sigma}{\\sqrt{\\sum(x_i-\\bar x)^2}}$$\n$$t_j=\\frac{\\hat\\beta_j-b_0}{SE(\\hat\\beta_j)}\\sim t_{n-p},\\qquad F=\\frac{(SSE_R-SSE_U)/q}{SSE_U/(n-p_U)}\\sim F_{q,n-p_U}$$\n\n**Variables:**\n\n- $\\beta$ true coefficients\n- $\\varepsilon$ errors\n- $b_0$ null value\n- $q$ number of restrictions\n- $R/U$ restricted/unrestricted\n\n### Key points\n- **Normality is NOT needed for unbiasedness** (classic trap).\n- More spread in $x$ → smaller slope SE.\n- All individual t-stats weak but joint F significant: possible with correlated regressors.\n\n### Connections\n- **Violations:** [[robust-standard-errors]] (heteroskedasticity / autocorrelation), [[omitted-variable-bias]] (endogeneity), [[multicollinearity]].\n\n<a id=\"robust-standard-errors\"><\/a>\n\n## Heteroskedasticity, Serial Correlation & Robust SEs\n<!-- section: robust-standard-errors | prerequisites: [gauss-markov-assumptions] | related: [effective-sample-size, stationarity-ar1] | tags: [hc0, hac, newey-west] -->\n\n### Formulas\n$$\\mathrm{Var}(\\hat\\beta\\mid X)=(X^\\top X)^{-1}X^\\top\\Omega X(X^\\top X)^{-1},\\qquad \\text{HC0: }(X^\\top X)^{-1}\\Big(\\sum_i e_i^2x_ix_i^\\top\\Big)(X^\\top X)^{-1}$$\n\n**Variables:**\n\n- $\\Omega$ error covariance\n- $e_i$ residual\n- $x_i$ regressor vector for row $i$\n\n### Key points\n- Heteroskedasticity **doesn't bias** $\\hat\\beta$ (if $E[\\varepsilon|X]=0$) but breaks the classical SE.\n- Serial correlation → HAC (Newey–West) or clustering; \"robust\" SEs don't fix endogeneity or every dependence.\n\n### Connections\n- **Time-series cause:** [[stationarity-ar1]]; quantified by [[effective-sample-size]].\n\n<a id=\"omitted-variable-bias\"><\/a>\n\n## Omitted-Variable Bias\n<!-- section: omitted-variable-bias | prerequisites: [ols-regression] | related: [gauss-markov-assumptions, capm-alpha-beta] | tags: [endogeneity, confounding] -->\n\n### Formula\nTrue $Y=\\beta_0+\\beta_1X+\\beta_2Z+\\varepsilon$; regress $Y$ on $X$ only:\n\n$$\\tilde\\beta_1=\\beta_1+\\beta_2\\frac{\\mathrm{Cov}(X,Z)}{\\mathrm{Var}(X)}$$\n\n**Variables:**\n\n- $Z$ omitted variable\n- $\\beta_2$ its effect on $Y$\n\n### Key points\n- Bias needs **both** $\\beta_2\\ne0$ and $\\mathrm{Cov}(X,Z)\\ne0$.\n- Explains coefficient sign flips when adding controls (also via FWL).\n- Finance: \"alpha\" can be an omitted risk factor ([[capm-alpha-beta]]).\n\n<a id=\"multicollinearity\"><\/a>\n\n## Multicollinearity & VIF\n<!-- section: multicollinearity | prerequisites: [ols-regression, eigen-svd-psd] | related: [ridge-regression, pca, regression-invariances] | tags: [vif, ill-conditioning] -->\n\n### Formula\n$$VIF_j=\\frac{1}{1-R_j^2}$$\n\n**Variables:** $R_j^2$ from regressing regressor $j$ on the other regressors.\n\n### Key points\n- Perfect collinearity → coefficients non-unique (fitted values still unique = projection).\n- Near-collinearity → small singular values → coefficients unstable; prediction may still be fine.\n- Remedies: drop/combine variables, more data, [[ridge-regression]], [[pca]] regression — choose by goal.\n\n### Connections\n- **Diagnosed by:** [[eigen-svd-psd]] (small eigenvalues of $X^\\top X$). **Fixed by:** [[ridge-regression]].\n\n<a id=\"regression-invariances\"><\/a>\n\n## Regression Invariances (duplication, scaling)\n<!-- section: regression-invariances | prerequisites: [gauss-markov-assumptions] | related: [ridge-regression, effective-sample-size] | tags: [interview-variations] -->\n\n### Duplicate every row\n$X^\\top X$, $X^\\top y$ double → **coefficients unchanged**. SSE doubles; naive software uses $2n-p$ dof:\n\n$$\\text{SE}_{new}=\\text{SE}_{old}\\sqrt{\\frac{n-p}{2n-p}}\\approx\\frac{\\text{SE}_{old}}{\\sqrt2}$$\nThe shrink is **fictitious** — no new information. (Ridge with fixed λ on an unnormalised SSE *does* change: effective λ halves.)\n\n### Other variations\n- $y\\to cy$: coefficients & residuals ×$c$, SEs ×$|c|$, $R^2$ unchanged.\n- $x_j\\to cx_j$: its coefficient ÷$c$; fits unchanged.\n- Add a constant to $x_j$ (with intercept): slope unchanged.\n- Exact duplicate column: OLS non-unique; ridge splits the weight equally.\n- Add noise feature: training fit can't worsen; test may.\n\n**Variables:** $n$ rows, $p$ coefficients, $c$ nonzero constant.\n\n### Connections\n- **Related:** [[effective-sample-size]] (correlated rows ≈ fewer real observations), [[ridge-regression]].\n\n<a id=\"prediction-vs-confidence-interval\"><\/a>\n\n## Prediction Interval vs Confidence Interval\n<!-- section: prediction-vs-confidence-interval | prerequisites: [gauss-markov-assumptions, confidence-intervals] | related: [] | tags: [intervals] -->\n\n$$SE(\\text{mean at }x_0)=\\hat\\sigma\\sqrt{\\tfrac1n+\\tfrac{(x_0-\\bar x)^2}{S_{xx}}},\\qquad SE(\\text{new obs})=\\hat\\sigma\\sqrt{1+\\tfrac1n+\\tfrac{(x_0-\\bar x)^2}{S_{xx}}}$$\n\n**Variables:**\n\n- $x_0$ query point\n- $S_{xx}=\\sum(x_i-\\bar x)^2$\n- $\\hat\\sigma$ residual std error\n\nThe extra \"1\" = irreducible noise of a new observation → prediction intervals are always wider.", "summary": "", "topic": "", "sections": ["ols-regression", "r-squared", "gauss-markov-assumptions", "robust-standard-errors", "omitted-variable-bias", "multicollinearity", "regression-invariances", "prediction-vs-confidence-interval"], "degree": 10}, {"id": "sharpe-ratio", "title": "Sharpe Ratio (annualisation, leverage, pitfalls)", "type": "concept", "domain": "portfolio-construction", "tags": ["sharpe", "annualisation", "performance"], "path": "topics/measuring-performance.md", "content": "<a id=\"sharpe-ratio\"><\/a>\n\n## Sharpe Ratio (annualisation, leverage, pitfalls)\n<!-- section: sharpe-ratio | prerequisites: [variance-covariance-correlation, returns-simple-log] | related: [hypothesis-testing, multiple-testing, stationarity-ar1, portfolio-variance-diversification, marginal-sharpe-improvement, risk-measures] | tags: [sharpe, annualisation, performance] -->\n\n$$SR=\\frac{E[R-r_f]}{\\sigma(R-r_f)},\\qquad SR_T=\\sqrt T\\,SR_1,\\qquad t=\\sqrt n\\,\\widehat{SR}_{\\text{period}}$$\n$$\\mathrm{Var}\\Big(\\sum_{t=1}^TZ_t\\Big)=T\\sigma^2+2\\sum_{k=1}^{T-1}(T-k)\\gamma_k$$\n\n**Variables:**\n\n- $Z=R-r_f$ excess return per period\n- $T$ periods aggregated (e.g. 252 days)\n- $n$ observations\n- $\\gamma_k$ autocovariance at lag $k$\n\n### Key points\n- Daily μ=0.1%, σ=2% → daily SR 0.05 → annual ≈ 0.794.\n- $\\sqrt T$ scaling needs **uncorrelated, stationary, summed** returns. Positive autocorrelation ⇒ naive annualisation **overstates** SR.\n- **Leverage** $k>0$ leaves SR unchanged ($k\\mu/k\\sigma$) in frictionless world; raises drawdown / ruin risk.\n- Daily SR 0.1 over 100 days → t = 1 even though annualised SR ≈ 1.59.\n- High SR can mislead: few obs, selection, stale prices, short-option (negative skew) payoffs, ignored costs, regime change.\n\n### Connections\n- **Is a t-stat in disguise:** [[hypothesis-testing]]; inflated by [[multiple-testing]]; autocorrelation from [[stationarity-ar1]].\n- **Portfolio:** [[portfolio-variance-diversification]], [[marginal-sharpe-improvement]]. **Beyond σ:** [[risk-measures]].", "summary": "<a id=\"sharpe-ratio\"><\/a>", "topic": "measuring-performance", "degree": 20}, {"id": "marginal-sharpe-improvement", "title": "When a Lower-Sharpe Strategy Improves a Portfolio", "type": "concept", "domain": "portfolio-construction", "tags": ["marginal", "correlation"], "path": "topics/measuring-performance.md", "content": "<a id=\"marginal-sharpe-improvement\"><\/a>\n\n## When a Lower-Sharpe Strategy Improves a Portfolio\n<!-- section: marginal-sharpe-improvement | prerequisites: [sharpe-ratio, portfolio-variance-diversification] | related: [mean-variance-optimization, risk-contribution] | tags: [marginal, correlation] -->\n\n$$SR(\\varepsilon)=\\frac{\\mu_P+\\varepsilon\\mu_A}{\\sqrt{\\sigma_P^2+2\\varepsilon c+\\varepsilon^2\\sigma_A^2}},\\qquad \\frac{dSR}{d\\varepsilon}\\Big|_0>0\\iff SR_A>\\rho_{PA}\\,SR_P$$\n\n**Variables:**\n\n- $P$ existing portfolio\n- $A$ candidate strategy\n- $\\varepsilon$ small financed allocation\n- $c=\\mathrm{Cov}(P,A)$\n- $\\rho_{PA}$ correlation\n\nPortfolio SR 1.2; new strategy SR 0.4, ρ=0.2 → $0.4>0.24$ ✓ adds value (locally, frictionless).", "summary": "<a id=\"marginal-sharpe-improvement\"><\/a>", "topic": "measuring-performance", "degree": 7}, {"id": "exposure-neutrality", "title": "Gross/Net Exposure, Neutrality & Trading Costs", "type": "concept", "domain": "portfolio-construction", "tags": ["long-short", "beta-neutral", "bid-ask"], "path": "topics/measuring-performance.md", "content": "<a id=\"exposure-neutrality\"><\/a>\n\n## Gross/Net Exposure, Neutrality & Trading Costs\n<!-- section: exposure-neutrality | prerequisites: [capm-alpha-beta] | related: [win-rate-expectancy] | tags: [long-short, beta-neutral, bid-ask] -->\n\n$$\\text{Gross}=\\sum_i|w_i|,\\qquad \\text{Net}=\\sum_i w_i$$\n\n**Variables:** $w_i$ portfolio weights.\n\n- Dollar-neutral ≠ beta-neutral (long and short legs may have different betas); sector/style/nonlinear exposures can remain.\n- Bid–ask spread: crossing costs half-spread vs mid. 1 bp = 0.0001.", "summary": "<a id=\"exposure-neutrality\"><\/a>", "topic": "measuring-performance", "degree": 5}, {"id": "measuring-performance", "title": "Measuring Performance", "type": "topic", "domain": "portfolio-construction", "tags": [], "path": "topics/measuring-performance.md", "content": "# Measuring Performance\n\n**Sections:** [[sharpe-ratio]] · [[marginal-sharpe-improvement]] · [[exposure-neutrality]]\n\n<a id=\"sharpe-ratio\"><\/a>\n\n## Sharpe Ratio (annualisation, leverage, pitfalls)\n<!-- section: sharpe-ratio | prerequisites: [variance-covariance-correlation, returns-simple-log] | related: [hypothesis-testing, multiple-testing, stationarity-ar1, portfolio-variance-diversification, marginal-sharpe-improvement, risk-measures] | tags: [sharpe, annualisation, performance] -->\n\n$$SR=\\frac{E[R-r_f]}{\\sigma(R-r_f)},\\qquad SR_T=\\sqrt T\\,SR_1,\\qquad t=\\sqrt n\\,\\widehat{SR}_{\\text{period}}$$\n$$\\mathrm{Var}\\Big(\\sum_{t=1}^TZ_t\\Big)=T\\sigma^2+2\\sum_{k=1}^{T-1}(T-k)\\gamma_k$$\n\n**Variables:**\n\n- $Z=R-r_f$ excess return per period\n- $T$ periods aggregated (e.g. 252 days)\n- $n$ observations\n- $\\gamma_k$ autocovariance at lag $k$\n\n### Key points\n- Daily μ=0.1%, σ=2% → daily SR 0.05 → annual ≈ 0.794.\n- $\\sqrt T$ scaling needs **uncorrelated, stationary, summed** returns. Positive autocorrelation ⇒ naive annualisation **overstates** SR.\n- **Leverage** $k>0$ leaves SR unchanged ($k\\mu/k\\sigma$) in frictionless world; raises drawdown / ruin risk.\n- Daily SR 0.1 over 100 days → t = 1 even though annualised SR ≈ 1.59.\n- High SR can mislead: few obs, selection, stale prices, short-option (negative skew) payoffs, ignored costs, regime change.\n\n### Connections\n- **Is a t-stat in disguise:** [[hypothesis-testing]]; inflated by [[multiple-testing]]; autocorrelation from [[stationarity-ar1]].\n- **Portfolio:** [[portfolio-variance-diversification]], [[marginal-sharpe-improvement]]. **Beyond σ:** [[risk-measures]].\n\n<a id=\"marginal-sharpe-improvement\"><\/a>\n\n## When a Lower-Sharpe Strategy Improves a Portfolio\n<!-- section: marginal-sharpe-improvement | prerequisites: [sharpe-ratio, portfolio-variance-diversification] | related: [mean-variance-optimization, risk-contribution] | tags: [marginal, correlation] -->\n\n$$SR(\\varepsilon)=\\frac{\\mu_P+\\varepsilon\\mu_A}{\\sqrt{\\sigma_P^2+2\\varepsilon c+\\varepsilon^2\\sigma_A^2}},\\qquad \\frac{dSR}{d\\varepsilon}\\Big|_0>0\\iff SR_A>\\rho_{PA}\\,SR_P$$\n\n**Variables:**\n\n- $P$ existing portfolio\n- $A$ candidate strategy\n- $\\varepsilon$ small financed allocation\n- $c=\\mathrm{Cov}(P,A)$\n- $\\rho_{PA}$ correlation\n\nPortfolio SR 1.2; new strategy SR 0.4, ρ=0.2 → $0.4>0.24$ ✓ adds value (locally, frictionless).\n\n<a id=\"exposure-neutrality\"><\/a>\n\n## Gross/Net Exposure, Neutrality & Trading Costs\n<!-- section: exposure-neutrality | prerequisites: [capm-alpha-beta] | related: [win-rate-expectancy] | tags: [long-short, beta-neutral, bid-ask] -->\n\n$$\\text{Gross}=\\sum_i|w_i|,\\qquad \\text{Net}=\\sum_i w_i$$\n\n**Variables:** $w_i$ portfolio weights.\n\n- Dollar-neutral ≠ beta-neutral (long and short legs may have different betas); sector/style/nonlinear exposures can remain.\n- Bid–ask spread: crossing costs half-spread vs mid. 1 bp = 0.0001.", "summary": "", "topic": "", "sections": ["sharpe-ratio", "marginal-sharpe-improvement", "exposure-neutrality"], "degree": 5}, {"id": "bias-variance-tradeoff", "title": "Bias–Variance Trade-off", "type": "concept", "domain": "signal-research", "tags": ["generalisation", "overfitting"], "path": "topics/ml-regularisation.md", "content": "<a id=\"bias-variance-tradeoff\"><\/a>\n\n## Bias–Variance Trade-off\n<!-- section: bias-variance-tradeoff | prerequisites: [estimator-properties] | related: [ridge-regression, lasso-elastic-net, cross-validation-leakage, r-squared] | tags: [generalisation, overfitting] -->\n\n$$E[(Y-\\hat f(x))^2]=\\sigma^2+\\mathrm{Bias}(\\hat f(x))^2+\\mathrm{Var}(\\hat f(x))$$\n\n**Variables:**\n\n- $Y=f(x)+\\varepsilon$\n- $\\sigma^2$ noise variance\n- $\\hat f$ model fitted on a random training set\n\n- More flexibility → less bias, more variance.\n- It's about **test** error, not training fit.\n\n### Connections\n- **Levers:** [[ridge-regression]], [[lasso-elastic-net]]; **measured by:** [[cross-validation-leakage]]. Mirrors [[estimator-properties]] (MSE = Var + Bias²).", "summary": "<a id=\"bias-variance-tradeoff\"><\/a>", "topic": "ml-regularisation", "degree": 8}, {"id": "ridge-regression", "title": "Ridge Regression (L2)", "type": "concept", "domain": "signal-research", "tags": ["regularisation", "shrinkage"], "path": "topics/ml-regularisation.md", "content": "<a id=\"ridge-regression\"><\/a>\n\n## Ridge Regression (L2)\n<!-- section: ridge-regression | prerequisites: [ols-regression, multicollinearity] | related: [lasso-elastic-net, bias-variance-tradeoff, beta-bernoulli-conjugacy, mean-variance-optimization] | tags: [regularisation, shrinkage] -->\n\n$$\\hat\\beta_R=\\arg\\min_\\beta\\|y-X\\beta\\|^2+\\lambda\\|\\beta\\|_2^2=(X^\\top X+\\lambda I)^{-1}X^\\top y$$\n\n**Variables:**\n\n- $\\lambda>0$ penalty\n- $X$ centred/standardised features (intercept unpenalised)\n\n### Key points\n- In each eigen-direction of $X^\\top X$ (eigenvalue $d$): $1/d\\to1/(d+\\lambda)$ — tames near-singular directions.\n- Biased but can lower prediction MSE; never sets coefficients exactly to 0.\n- Individual coefficients need not shrink monotonically with correlated predictors.\n- **Bayesian view:** posterior mode with prior $\\beta\\sim N(0,\\tau^2I)$, $\\lambda=\\sigma^2/\\tau^2$.\n- Fit standardisation on training data only.\n\n### Connections\n- **Fixes:** [[multicollinearity]]. **Contrast:** [[lasso-elastic-net]] (sparsity). **Same idea in portfolios:** covariance shrinkage in [[mean-variance-optimization]].", "summary": "<a id=\"ridge-regression\"><\/a>", "topic": "ml-regularisation", "degree": 14}, {"id": "lasso-elastic-net", "title": "Lasso (L1) & Elastic Net", "type": "concept", "domain": "signal-research", "tags": ["sparsity", "soft-thresholding"], "path": "topics/ml-regularisation.md", "content": "<a id=\"lasso-elastic-net\"><\/a>\n\n## Lasso (L1) & Elastic Net\n<!-- section: lasso-elastic-net | prerequisites: [ridge-regression] | related: [bias-variance-tradeoff] | tags: [sparsity, soft-thresholding] -->\n\n$$\\hat\\beta_L=\\arg\\min\\|y-X\\beta\\|^2+\\lambda\\|\\beta\\|_1;\\qquad X^\\top X=I\\Rightarrow \\hat\\beta_{L,j}=\\mathrm{sign}(z_j)(|z_j|-\\lambda/2)_+,\\ z=X^\\top y$$\nElastic net: $\\|y-X\\beta\\|^2+\\lambda_1\\|\\beta\\|_1+\\lambda_2\\|\\beta\\|_2^2$.\n\n**Variables:**\n\n- $\\lambda,\\lambda_1,\\lambda_2$ penalties\n- $z_j$ OLS coefficient under orthonormal design\n\n- L1 corner at 0 ⇒ exact zeros (feature selection). Threshold depends on loss scaling (½, 1/n) — state convention.\n- Laplace prior ⇒ L1 posterior mode. Elastic net helps with correlated predictors.", "summary": "<a id=\"lasso-elastic-net\"><\/a>", "topic": "ml-regularisation", "degree": 5}, {"id": "logistic-regression", "title": "Logistic Regression", "type": "concept", "domain": "signal-research", "tags": ["classification", "cross-entropy"], "path": "topics/ml-regularisation.md", "content": "<a id=\"logistic-regression\"><\/a>\n\n## Logistic Regression\n<!-- section: logistic-regression | prerequisites: [maximum-likelihood, ols-regression] | related: [] | tags: [classification, cross-entropy] -->\n\n$$P(Y=1\\mid x)=\\frac{1}{1+e^{-x^\\top\\beta}},\\qquad \\log\\frac{p}{1-p}=x^\\top\\beta,\\qquad \\mathcal L=-\\sum_i[y_i\\log p_i+(1-y_i)\\log(1-p_i)]$$\n\n**Variables:**\n\n- $x$ features\n- $\\beta$ coefficients\n- $p_i$ predicted probability\n\n- Models a probability (unlike OLS on 0/1).\n- Under class imbalance, accuracy misleads — calibration & decision costs matter.", "summary": "<a id=\"logistic-regression\"><\/a>", "topic": "ml-regularisation", "degree": 4}, {"id": "pca", "title": "Principal Component Analysis (PCA)", "type": "concept", "domain": "signal-research", "tags": ["dimension-reduction", "eigenvectors"], "path": "topics/ml-regularisation.md", "content": "<a id=\"pca\"><\/a>\n\n## Principal Component Analysis (PCA)\n<!-- section: pca | prerequisites: [eigen-svd-psd, variance-covariance-correlation] | related: [multicollinearity, portfolio-variance-diversification, cross-validation-leakage] | tags: [dimension-reduction, eigenvectors] -->\n\n$$\\max_v v^\\top\\Sigma v\\ \\ \\text{s.t. } v^\\top v=1\\ \\Rightarrow\\ \\Sigma v=\\lambda v,\\qquad \\text{explained share}_j=\\frac{\\lambda_j}{\\sum_i\\lambda_i}$$\n\n**Variables:**\n\n- $\\Sigma$ covariance of centred features\n- $v$ unit direction\n- $\\lambda_j$ ordered eigenvalues\n\n**Example:** $\\Sigma=\\begin{pmatrix}1&0.8\\\\0.8&1\\end{pmatrix}$ → eigenvectors $(1,1)/\\sqrt2$ (λ=1.8, 90%) and $(1,-1)/\\sqrt2$ (λ=0.2).\n\n### Pitfalls\n- **Unsupervised** — ignores $y$; the 1% low-variance direction may hold the signal.\n- Components uncorrelated, not necessarily independent; eigenvector sign arbitrary.\n- Covariance-PCA vs correlation-PCA (standardised) — units can dominate.\n- Fit centring/scaling/PCA on training data only.\n\n### Connections\n- **Builds on:** [[eigen-svd-psd]]. **Remedy for:** [[multicollinearity]]. **Leakage risk:** [[cross-validation-leakage]].", "summary": "<a id=\"pca\"><\/a>", "topic": "ml-regularisation", "degree": 9}, {"id": "ml-regularisation", "title": "ML & Regularisation", "type": "topic", "domain": "signal-research", "tags": [], "path": "topics/ml-regularisation.md", "content": "# ML & Regularisation\n\n**Sections:** [[bias-variance-tradeoff]] · [[ridge-regression]] · [[lasso-elastic-net]] · [[logistic-regression]] · [[pca]]\n\n<a id=\"bias-variance-tradeoff\"><\/a>\n\n## Bias–Variance Trade-off\n<!-- section: bias-variance-tradeoff | prerequisites: [estimator-properties] | related: [ridge-regression, lasso-elastic-net, cross-validation-leakage, r-squared] | tags: [generalisation, overfitting] -->\n\n$$E[(Y-\\hat f(x))^2]=\\sigma^2+\\mathrm{Bias}(\\hat f(x))^2+\\mathrm{Var}(\\hat f(x))$$\n\n**Variables:**\n\n- $Y=f(x)+\\varepsilon$\n- $\\sigma^2$ noise variance\n- $\\hat f$ model fitted on a random training set\n\n- More flexibility → less bias, more variance.\n- It's about **test** error, not training fit.\n\n### Connections\n- **Levers:** [[ridge-regression]], [[lasso-elastic-net]]; **measured by:** [[cross-validation-leakage]]. Mirrors [[estimator-properties]] (MSE = Var + Bias²).\n\n<a id=\"ridge-regression\"><\/a>\n\n## Ridge Regression (L2)\n<!-- section: ridge-regression | prerequisites: [ols-regression, multicollinearity] | related: [lasso-elastic-net, bias-variance-tradeoff, beta-bernoulli-conjugacy, mean-variance-optimization] | tags: [regularisation, shrinkage] -->\n\n$$\\hat\\beta_R=\\arg\\min_\\beta\\|y-X\\beta\\|^2+\\lambda\\|\\beta\\|_2^2=(X^\\top X+\\lambda I)^{-1}X^\\top y$$\n\n**Variables:**\n\n- $\\lambda>0$ penalty\n- $X$ centred/standardised features (intercept unpenalised)\n\n### Key points\n- In each eigen-direction of $X^\\top X$ (eigenvalue $d$): $1/d\\to1/(d+\\lambda)$ — tames near-singular directions.\n- Biased but can lower prediction MSE; never sets coefficients exactly to 0.\n- Individual coefficients need not shrink monotonically with correlated predictors.\n- **Bayesian view:** posterior mode with prior $\\beta\\sim N(0,\\tau^2I)$, $\\lambda=\\sigma^2/\\tau^2$.\n- Fit standardisation on training data only.\n\n### Connections\n- **Fixes:** [[multicollinearity]]. **Contrast:** [[lasso-elastic-net]] (sparsity). **Same idea in portfolios:** covariance shrinkage in [[mean-variance-optimization]].\n\n<a id=\"lasso-elastic-net\"><\/a>\n\n## Lasso (L1) & Elastic Net\n<!-- section: lasso-elastic-net | prerequisites: [ridge-regression] | related: [bias-variance-tradeoff] | tags: [sparsity, soft-thresholding] -->\n\n$$\\hat\\beta_L=\\arg\\min\\|y-X\\beta\\|^2+\\lambda\\|\\beta\\|_1;\\qquad X^\\top X=I\\Rightarrow \\hat\\beta_{L,j}=\\mathrm{sign}(z_j)(|z_j|-\\lambda/2)_+,\\ z=X^\\top y$$\nElastic net: $\\|y-X\\beta\\|^2+\\lambda_1\\|\\beta\\|_1+\\lambda_2\\|\\beta\\|_2^2$.\n\n**Variables:**\n\n- $\\lambda,\\lambda_1,\\lambda_2$ penalties\n- $z_j$ OLS coefficient under orthonormal design\n\n- L1 corner at 0 ⇒ exact zeros (feature selection). Threshold depends on loss scaling (½, 1/n) — state convention.\n- Laplace prior ⇒ L1 posterior mode. Elastic net helps with correlated predictors.\n\n<a id=\"logistic-regression\"><\/a>\n\n## Logistic Regression\n<!-- section: logistic-regression | prerequisites: [maximum-likelihood, ols-regression] | related: [] | tags: [classification, cross-entropy] -->\n\n$$P(Y=1\\mid x)=\\frac{1}{1+e^{-x^\\top\\beta}},\\qquad \\log\\frac{p}{1-p}=x^\\top\\beta,\\qquad \\mathcal L=-\\sum_i[y_i\\log p_i+(1-y_i)\\log(1-p_i)]$$\n\n**Variables:**\n\n- $x$ features\n- $\\beta$ coefficients\n- $p_i$ predicted probability\n\n- Models a probability (unlike OLS on 0/1).\n- Under class imbalance, accuracy misleads — calibration & decision costs matter.\n\n<a id=\"pca\"><\/a>\n\n## Principal Component Analysis (PCA)\n<!-- section: pca | prerequisites: [eigen-svd-psd, variance-covariance-correlation] | related: [multicollinearity, portfolio-variance-diversification, cross-validation-leakage] | tags: [dimension-reduction, eigenvectors] -->\n\n$$\\max_v v^\\top\\Sigma v\\ \\ \\text{s.t. } v^\\top v=1\\ \\Rightarrow\\ \\Sigma v=\\lambda v,\\qquad \\text{explained share}_j=\\frac{\\lambda_j}{\\sum_i\\lambda_i}$$\n\n**Variables:**\n\n- $\\Sigma$ covariance of centred features\n- $v$ unit direction\n- $\\lambda_j$ ordered eigenvalues\n\n**Example:** $\\Sigma=\\begin{pmatrix}1&0.8\\\\0.8&1\\end{pmatrix}$ → eigenvectors $(1,1)/\\sqrt2$ (λ=1.8, 90%) and $(1,-1)/\\sqrt2$ (λ=0.2).\n\n### Pitfalls\n- **Unsupervised** — ignores $y$; the 1% low-variance direction may hold the signal.\n- Components uncorrelated, not necessarily independent; eigenvector sign arbitrary.\n- Covariance-PCA vs correlation-PCA (standardised) — units can dominate.\n- Fit centring/scaling/PCA on training data only.\n\n### Connections\n- **Builds on:** [[eigen-svd-psd]]. **Remedy for:** [[multicollinearity]]. **Leakage risk:** [[cross-validation-leakage]].", "summary": "", "topic": "", "sections": ["bias-variance-tradeoff", "ridge-regression", "lasso-elastic-net", "logistic-regression", "pca"], "degree": 7}, {"id": "expectation-linearity-indicators", "title": "Linearity of Expectation & Indicators", "type": "concept", "domain": "prob-stats", "tags": ["expectation", "indicator", "linearity"], "path": "topics/moments-covariance.md", "content": "<a id=\"expectation-linearity-indicators\"><\/a>\n\n## Linearity of Expectation & Indicators\n<!-- section: expectation-linearity-indicators | prerequisites: [probability-rules-counting] | related: [variance-covariance-correlation, first-step-analysis, jensens-inequality] | tags: [expectation, indicator, linearity] -->\n\n### Formulas\n$$E[aX+bY+c]=aE[X]+bE[Y]+c,\\qquad E[I_A]=P(A),\\qquad N=\\sum_i I_i\\Rightarrow E[N]=\\sum_i P(A_i)$$\n\n**Variables:**\n\n- $X,Y$ random variables\n- $a,b,c$ constants\n- $I_A$ indicator of event $A$ (1 if $A$ happens else 0)\n- $N$ a count\n\n### Key points\n- **Hat-check problem:** $n$ random hats → each person matches w.p. $1/n$ → expected matches $=1$, for any $n$.\n- In general $E[g(X)]\\ne g(E[X])$ → see [[jensens-inequality]].\n\n### Connections\n- **Used by:** [[first-step-analysis]] (coupon collector = sum of stage waits), [[order-statistics]].\n- **Next:** [[variance-covariance-correlation]] — variance is *not* linear; covariance terms appear.", "summary": "<a id=\"expectation-linearity-indicators\"><\/a>", "topic": "moments-covariance", "degree": 11}, {"id": "variance-covariance-correlation", "title": "Variance, Covariance & Correlation", "type": "concept", "domain": "prob-stats", "tags": ["variance", "covariance", "correlation"], "path": "topics/moments-covariance.md", "content": "<a id=\"variance-covariance-correlation\"><\/a>\n\n## Variance, Covariance & Correlation\n<!-- section: variance-covariance-correlation | prerequisites: [expectation-linearity-indicators] | related: [portfolio-variance-diversification, total-expectation-variance, normal-distribution, ols-regression] | tags: [variance, covariance, correlation] -->\n\n### Formulas\n$$\\mathrm{Var}(X)=E[X^2]-E[X]^2,\\quad \\mathrm{Cov}(X,Y)=E[XY]-E[X]E[Y],\\quad \\rho_{XY}=\\frac{\\mathrm{Cov}(X,Y)}{\\sigma_X\\sigma_Y}\\in[-1,1]$$\n$$\\mathrm{Var}(aX+bY)=a^2\\sigma_X^2+b^2\\sigma_Y^2+2ab\\,\\rho\\,\\sigma_X\\sigma_Y$$\n$$\\mathrm{Var}\\Big(\\sum_{i=1}^n X_i\\Big)=n\\sigma^2+n(n-1)\\rho\\sigma^2\\ \\ \\text{(equicorrelated)}$$\n\n**Variables:**\n\n- $X,Y$ random variables\n- $a,b$ constants\n- $\\sigma$ standard deviation\n- $\\rho$ correlation\n- $n$ number of variables\n\n### Key points\n- $|\\rho|\\le1$ by Cauchy–Schwarz; undefined if a variance is 0.\n- **Uncorrelated but dependent:** $X\\sim N(0,1)$, $Y=X^2$ ⇒ $\\mathrm{Cov}=E[X^3]=0$, yet $Y$ is a function of $X$.\n- For **jointly normal** variables, zero covariance ⇔ independence (e.g. $X+Y \\perp X-Y$ for iid normals).\n- Scaling: $\\mathrm{Var}(10X)=100\\,\\mathrm{Var}(X)$; positive scaling keeps $\\rho$, negative flips its sign.\n\n### Connections\n- **Builds on:** [[expectation-linearity-indicators]].\n- **Used by:** [[portfolio-variance-diversification]] ($w^\\top\\Sigma w$), [[ols-regression]] (slope $=\\mathrm{Cov}/\\mathrm{Var}$), [[pca]] (eigen-decomposition of $\\Sigma$).\n- **Extended by:** [[total-expectation-variance]] (law of total covariance).", "summary": "<a id=\"variance-covariance-correlation\"><\/a>", "topic": "moments-covariance", "degree": 16}, {"id": "jensens-inequality", "title": "Jensen's Inequality", "type": "concept", "domain": "prob-stats", "tags": ["convexity"], "path": "topics/moments-covariance.md", "content": "<a id=\"jensens-inequality\"><\/a>\n\n## Jensen's Inequality\n<!-- section: jensens-inequality | prerequisites: [expectation-linearity-indicators] | related: [geometric-brownian-motion, returns-simple-log, gamma-theta-pnl] | tags: [convexity] -->\n\n### Formula\n$$g\\ \\text{convex}\\Rightarrow g(E[X])\\le E[g(X)];\\qquad E[\\log X]\\le\\log E[X]\\ \\ (X>0)$$\n\n**Variables:**\n\n- $X$ random variable\n- $g$ a convex function (reverse for concave)\n\n### Key points\n- Arithmetic vs geometric growth: $E[\\log(S_t/S_0)]=(\\mu-\\tfrac12\\sigma^2)t < \\mu t$.\n- Convex option payoffs gain from mean-preserving spreads — the reason long options are \"long vol\".\n- Higher variance alone doesn't rank *every* distribution for every convex payoff.\n\n### Connections\n- **Explains:** [[geometric-brownian-motion]] ($-\\tfrac12\\sigma^2$ drift), [[returns-simple-log]] (+10% then −10% = −1%), [[gamma-theta-pnl]] (convexity pays when realised vol is high).", "summary": "<a id=\"jensens-inequality\"><\/a>", "topic": "moments-covariance", "degree": 10}, {"id": "total-expectation-variance", "title": "Laws of Total Expectation, Variance & Covariance", "type": "concept", "domain": "prob-stats", "tags": ["conditioning", "random-sum", "hidden-dependence"], "path": "topics/moments-covariance.md", "content": "<a id=\"total-expectation-variance\"><\/a>\n\n## Laws of Total Expectation, Variance & Covariance\n<!-- section: total-expectation-variance | prerequisites: [variance-covariance-correlation, conditional-probability-bayes] | related: [conditional-expectation-best-predictor, exponential-poisson-process] | tags: [conditioning, random-sum, hidden-dependence] -->\n\n### Formulas\n$$E[X]=E\\big[E[X\\mid Y]\\big],\\qquad \\mathrm{Var}(X)=E[\\mathrm{Var}(X\\mid Y)]+\\mathrm{Var}(E[X\\mid Y])$$\n$$\\mathrm{Cov}(X,Z)=E[\\mathrm{Cov}(X,Z\\mid Y)]+\\mathrm{Cov}(E[X\\mid Y],E[Z\\mid Y])$$\n**Random sum** $S=\\sum_{i=1}^N X_i$ ($X_i$ iid mean $m$, variance $v$, $N$ independent):\n\n$$E[S]=E[N]m,\\qquad \\mathrm{Var}(S)=E[N]v+\\mathrm{Var}(N)m^2$$\n\n**Variables:**\n\n- $X,Z$ target variables\n- $Y$ conditioning (hidden) variable\n- $N$ random count\n\n### Worked examples\n- $Y\\sim U(0,1)$, $X\\mid Y\\sim U(0,Y)$: $E[X]=1/4$, $\\mathrm{Var}(X)=\\frac{1/3}{12}+\\frac{1/12}{4}=7/144$.\n- $N\\sim$ Poisson(10) trades, PnL mean 2, var 9: $E=20$, $\\mathrm{Var}=10\\cdot9+10\\cdot4=130$ (the extra 40 = uncertainty in trade count).\n- Selected-coin tosses: $\\mathrm{Cov}(I_1,I_2)=\\mathrm{Var}(\\Theta)=1/64$ → hidden dependence.\n\n### Key points\n- Trap: if $N$ depends on the $X_i$ (stopping time), these formulas don't apply automatically — use a recursion ([[first-step-analysis]]).\n\n### Connections\n- **Builds on:** [[variance-covariance-correlation]], [[conditional-probability-bayes]].\n- **Related:** [[conditional-expectation-best-predictor]] — same decomposition applied to prediction error.", "summary": "<a id=\"total-expectation-variance\"><\/a>", "topic": "moments-covariance", "degree": 12}, {"id": "conditional-expectation-best-predictor", "title": "Conditional Expectation as Best Predictor", "type": "concept", "domain": "prob-stats", "tags": ["prediction", "mse", "jointly-normal"], "path": "topics/moments-covariance.md", "content": "<a id=\"conditional-expectation-best-predictor\"><\/a>\n\n## Conditional Expectation as Best Predictor\n<!-- section: conditional-expectation-best-predictor | prerequisites: [total-expectation-variance] | related: [ols-regression, normal-distribution, bias-variance-tradeoff] | tags: [prediction, mse, jointly-normal] -->\n\n### Formulas\n$$E[(X-g(Y))^2]=E[\\mathrm{Var}(X\\mid Y)]+E[(E[X\\mid Y]-g(Y))^2]$$\nJointly normal:\n\n$$E[Y\\mid X=x]=\\mu_Y+\\rho\\frac{\\sigma_Y}{\\sigma_X}(x-\\mu_X),\\qquad \\mathrm{Var}(Y\\mid X=x)=\\sigma_Y^2(1-\\rho^2)$$\n\n**Variables:**\n\n- $g$ any square-integrable predictor\n- $\\mu,\\sigma$ means / std devs\n- $\\rho$ correlation\n\n### Key points\n- $E[X\\mid Y=y]$ is a number; $E[X\\mid Y]$ is a random variable.\n- Under joint normality the best predictor **is** linear with slope $\\rho\\sigma_Y/\\sigma_X$ — exactly the OLS population slope.\n\n### Connections\n- **Bridge to:** [[ols-regression]] (linear approximation of $E[Y\\mid X]$), [[bias-variance-tradeoff]].\n- **Builds on:** [[total-expectation-variance]]; uses [[normal-distribution]].", "summary": "<a id=\"conditional-expectation-best-predictor\"><\/a>", "topic": "moments-covariance", "degree": 6}, {"id": "eigen-svd-psd", "title": "Eigen-decomposition, SVD & PSD Matrices", "type": "concept", "domain": "prob-stats", "tags": ["linear-algebra"], "path": "topics/moments-covariance.md", "content": "<a id=\"eigen-svd-psd\"><\/a>\n\n## Eigen-decomposition, SVD & PSD Matrices\n<!-- section: eigen-svd-psd | prerequisites: [] | related: [pca, multicollinearity, portfolio-variance-diversification] | tags: [linear-algebra] -->\n\n- $Av=\\lambda v$; real symmetric ⇒ orthonormal eigenbasis.\n- PSD: $v^\\top Av\\ge0$ ⇔ eigenvalues ≥ 0. Covariance is PSD since $v^\\top\\Sigma v=\\mathrm{Var}(v^\\top X)\\ge0$.\n- SVD $X=UDV^\\top$; small singular values ⇒ unstable least squares.\n- Invertible ⇔ full rank.\n\n**Variables:**\n\n- $A$ square matrix\n- $v$ eigenvector\n- $\\lambda$ eigenvalue\n- $\\Sigma$ covariance\n- $U,V$ orthogonal, $D$ diagonal singular values\n\n### Connections\n- **Used by:** [[pca]], [[multicollinearity]], [[portfolio-variance-diversification]] (valid correlation matrices), [[mean-variance-optimization]] (inverting Σ amplifies small-eigenvalue noise).", "summary": "<a id=\"eigen-svd-psd\"><\/a>", "topic": "moments-covariance", "degree": 10}, {"id": "moments-covariance", "title": "Moments & Covariance", "type": "topic", "domain": "prob-stats", "tags": [], "path": "topics/moments-covariance.md", "content": "# Moments & Covariance\n\n**Sections:** [[expectation-linearity-indicators]] · [[variance-covariance-correlation]] · [[jensens-inequality]] · [[total-expectation-variance]] · [[conditional-expectation-best-predictor]] · [[eigen-svd-psd]]\n\n<a id=\"expectation-linearity-indicators\"><\/a>\n\n## Linearity of Expectation & Indicators\n<!-- section: expectation-linearity-indicators | prerequisites: [probability-rules-counting] | related: [variance-covariance-correlation, first-step-analysis, jensens-inequality] | tags: [expectation, indicator, linearity] -->\n\n### Formulas\n$$E[aX+bY+c]=aE[X]+bE[Y]+c,\\qquad E[I_A]=P(A),\\qquad N=\\sum_i I_i\\Rightarrow E[N]=\\sum_i P(A_i)$$\n\n**Variables:**\n\n- $X,Y$ random variables\n- $a,b,c$ constants\n- $I_A$ indicator of event $A$ (1 if $A$ happens else 0)\n- $N$ a count\n\n### Key points\n- **Hat-check problem:** $n$ random hats → each person matches w.p. $1/n$ → expected matches $=1$, for any $n$.\n- In general $E[g(X)]\\ne g(E[X])$ → see [[jensens-inequality]].\n\n### Connections\n- **Used by:** [[first-step-analysis]] (coupon collector = sum of stage waits), [[order-statistics]].\n- **Next:** [[variance-covariance-correlation]] — variance is *not* linear; covariance terms appear.\n\n<a id=\"variance-covariance-correlation\"><\/a>\n\n## Variance, Covariance & Correlation\n<!-- section: variance-covariance-correlation | prerequisites: [expectation-linearity-indicators] | related: [portfolio-variance-diversification, total-expectation-variance, normal-distribution, ols-regression] | tags: [variance, covariance, correlation] -->\n\n### Formulas\n$$\\mathrm{Var}(X)=E[X^2]-E[X]^2,\\quad \\mathrm{Cov}(X,Y)=E[XY]-E[X]E[Y],\\quad \\rho_{XY}=\\frac{\\mathrm{Cov}(X,Y)}{\\sigma_X\\sigma_Y}\\in[-1,1]$$\n$$\\mathrm{Var}(aX+bY)=a^2\\sigma_X^2+b^2\\sigma_Y^2+2ab\\,\\rho\\,\\sigma_X\\sigma_Y$$\n$$\\mathrm{Var}\\Big(\\sum_{i=1}^n X_i\\Big)=n\\sigma^2+n(n-1)\\rho\\sigma^2\\ \\ \\text{(equicorrelated)}$$\n\n**Variables:**\n\n- $X,Y$ random variables\n- $a,b$ constants\n- $\\sigma$ standard deviation\n- $\\rho$ correlation\n- $n$ number of variables\n\n### Key points\n- $|\\rho|\\le1$ by Cauchy–Schwarz; undefined if a variance is 0.\n- **Uncorrelated but dependent:** $X\\sim N(0,1)$, $Y=X^2$ ⇒ $\\mathrm{Cov}=E[X^3]=0$, yet $Y$ is a function of $X$.\n- For **jointly normal** variables, zero covariance ⇔ independence (e.g. $X+Y \\perp X-Y$ for iid normals).\n- Scaling: $\\mathrm{Var}(10X)=100\\,\\mathrm{Var}(X)$; positive scaling keeps $\\rho$, negative flips its sign.\n\n### Connections\n- **Builds on:** [[expectation-linearity-indicators]].\n- **Used by:** [[portfolio-variance-diversification]] ($w^\\top\\Sigma w$), [[ols-regression]] (slope $=\\mathrm{Cov}/\\mathrm{Var}$), [[pca]] (eigen-decomposition of $\\Sigma$).\n- **Extended by:** [[total-expectation-variance]] (law of total covariance).\n\n<a id=\"jensens-inequality\"><\/a>\n\n## Jensen's Inequality\n<!-- section: jensens-inequality | prerequisites: [expectation-linearity-indicators] | related: [geometric-brownian-motion, returns-simple-log, gamma-theta-pnl] | tags: [convexity] -->\n\n### Formula\n$$g\\ \\text{convex}\\Rightarrow g(E[X])\\le E[g(X)];\\qquad E[\\log X]\\le\\log E[X]\\ \\ (X>0)$$\n\n**Variables:**\n\n- $X$ random variable\n- $g$ a convex function (reverse for concave)\n\n### Key points\n- Arithmetic vs geometric growth: $E[\\log(S_t/S_0)]=(\\mu-\\tfrac12\\sigma^2)t < \\mu t$.\n- Convex option payoffs gain from mean-preserving spreads — the reason long options are \"long vol\".\n- Higher variance alone doesn't rank *every* distribution for every convex payoff.\n\n### Connections\n- **Explains:** [[geometric-brownian-motion]] ($-\\tfrac12\\sigma^2$ drift), [[returns-simple-log]] (+10% then −10% = −1%), [[gamma-theta-pnl]] (convexity pays when realised vol is high).\n\n<a id=\"total-expectation-variance\"><\/a>\n\n## Laws of Total Expectation, Variance & Covariance\n<!-- section: total-expectation-variance | prerequisites: [variance-covariance-correlation, conditional-probability-bayes] | related: [conditional-expectation-best-predictor, exponential-poisson-process] | tags: [conditioning, random-sum, hidden-dependence] -->\n\n### Formulas\n$$E[X]=E\\big[E[X\\mid Y]\\big],\\qquad \\mathrm{Var}(X)=E[\\mathrm{Var}(X\\mid Y)]+\\mathrm{Var}(E[X\\mid Y])$$\n$$\\mathrm{Cov}(X,Z)=E[\\mathrm{Cov}(X,Z\\mid Y)]+\\mathrm{Cov}(E[X\\mid Y],E[Z\\mid Y])$$\n**Random sum** $S=\\sum_{i=1}^N X_i$ ($X_i$ iid mean $m$, variance $v$, $N$ independent):\n\n$$E[S]=E[N]m,\\qquad \\mathrm{Var}(S)=E[N]v+\\mathrm{Var}(N)m^2$$\n\n**Variables:**\n\n- $X,Z$ target variables\n- $Y$ conditioning (hidden) variable\n- $N$ random count\n\n### Worked examples\n- $Y\\sim U(0,1)$, $X\\mid Y\\sim U(0,Y)$: $E[X]=1/4$, $\\mathrm{Var}(X)=\\frac{1/3}{12}+\\frac{1/12}{4}=7/144$.\n- $N\\sim$ Poisson(10) trades, PnL mean 2, var 9: $E=20$, $\\mathrm{Var}=10\\cdot9+10\\cdot4=130$ (the extra 40 = uncertainty in trade count).\n- Selected-coin tosses: $\\mathrm{Cov}(I_1,I_2)=\\mathrm{Var}(\\Theta)=1/64$ → hidden dependence.\n\n### Key points\n- Trap: if $N$ depends on the $X_i$ (stopping time), these formulas don't apply automatically — use a recursion ([[first-step-analysis]]).\n\n### Connections\n- **Builds on:** [[variance-covariance-correlation]], [[conditional-probability-bayes]].\n- **Related:** [[conditional-expectation-best-predictor]] — same decomposition applied to prediction error.\n\n<a id=\"conditional-expectation-best-predictor\"><\/a>\n\n## Conditional Expectation as Best Predictor\n<!-- section: conditional-expectation-best-predictor | prerequisites: [total-expectation-variance] | related: [ols-regression, normal-distribution, bias-variance-tradeoff] | tags: [prediction, mse, jointly-normal] -->\n\n### Formulas\n$$E[(X-g(Y))^2]=E[\\mathrm{Var}(X\\mid Y)]+E[(E[X\\mid Y]-g(Y))^2]$$\nJointly normal:\n\n$$E[Y\\mid X=x]=\\mu_Y+\\rho\\frac{\\sigma_Y}{\\sigma_X}(x-\\mu_X),\\qquad \\mathrm{Var}(Y\\mid X=x)=\\sigma_Y^2(1-\\rho^2)$$\n\n**Variables:**\n\n- $g$ any square-integrable predictor\n- $\\mu,\\sigma$ means / std devs\n- $\\rho$ correlation\n\n### Key points\n- $E[X\\mid Y=y]$ is a number; $E[X\\mid Y]$ is a random variable.\n- Under joint normality the best predictor **is** linear with slope $\\rho\\sigma_Y/\\sigma_X$ — exactly the OLS population slope.\n\n### Connections\n- **Bridge to:** [[ols-regression]] (linear approximation of $E[Y\\mid X]$), [[bias-variance-tradeoff]].\n- **Builds on:** [[total-expectation-variance]]; uses [[normal-distribution]].\n\n<a id=\"eigen-svd-psd\"><\/a>\n\n## Eigen-decomposition, SVD & PSD Matrices\n<!-- section: eigen-svd-psd | prerequisites: [] | related: [pca, multicollinearity, portfolio-variance-diversification] | tags: [linear-algebra] -->\n\n- $Av=\\lambda v$; real symmetric ⇒ orthonormal eigenbasis.\n- PSD: $v^\\top Av\\ge0$ ⇔ eigenvalues ≥ 0. Covariance is PSD since $v^\\top\\Sigma v=\\mathrm{Var}(v^\\top X)\\ge0$.\n- SVD $X=UDV^\\top$; small singular values ⇒ unstable least squares.\n- Invertible ⇔ full rank.\n\n**Variables:**\n\n- $A$ square matrix\n- $v$ eigenvector\n- $\\lambda$ eigenvalue\n- $\\Sigma$ covariance\n- $U,V$ orthogonal, $D$ diagonal singular values\n\n### Connections\n- **Used by:** [[pca]], [[multicollinearity]], [[portfolio-variance-diversification]] (valid correlation matrices), [[mean-variance-optimization]] (inverting Σ amplifies small-eigenvalue noise).", "summary": "", "topic": "", "sections": ["expectation-linearity-indicators", "variance-covariance-correlation", "jensens-inequality", "total-expectation-variance", "conditional-expectation-best-predictor", "eigen-svd-psd"], "degree": 8}, {"id": "returns-simple-log", "title": "Simple vs Log Returns", "type": "concept", "domain": "stochastic-finance", "tags": ["returns", "compounding"], "path": "topics/no-arbitrage-finance-basics.md", "content": "<a id=\"returns-simple-log\"><\/a>\n\n## Simple vs Log Returns\n<!-- section: returns-simple-log | prerequisites: [] | related: [jensens-inequality, geometric-brownian-motion, sharpe-ratio] | tags: [returns, compounding] -->\n\n$$R_t=\\frac{P_t-P_{t-1}+D_t}{P_{t-1}},\\quad r_t=\\log(1+R_t),\\quad 1+R_{0:T}=\\prod(1+R_t),\\quad r_{0:T}=\\sum r_t,\\quad \\log(1+R)\\approx R-\\tfrac12R^2$$\n\n**Variables:**\n\n- $P_t$ price\n- $D_t$ cash distribution in the period\n- $R_t$ simple return\n- $r_t$ log return\n\n- Simple returns aggregate **across assets** (portfolio = weighted sum with start-of-period weights); log returns aggregate **across time**.\n- +10% then −10% = −1% (volatility drag, [[jensens-inequality]]).", "summary": "<a id=\"returns-simple-log\"><\/a>", "topic": "no-arbitrage-finance-basics", "degree": 9}, {"id": "no-arbitrage", "title": "No-Arbitrage & the Law of One Price", "type": "concept", "domain": "stochastic-finance", "tags": ["arbitrage", "replication"], "path": "topics/no-arbitrage-finance-basics.md", "content": "<a id=\"no-arbitrage\"><\/a>\n\n## No-Arbitrage & the Law of One Price\n<!-- section: no-arbitrage | prerequisites: [] | related: [put-call-parity, forward-pricing, binomial-replication, static-replication, surface-no-arbitrage] | tags: [arbitrage, replication] -->\n\n**Arbitrage:** cost ≤ 0 today, payoff ≥ 0 in every state, > 0 in some state (or positive cash today).\n\n**Law of one price:** identical future cash flows in every state ⇒ same price today (else buy cheap, sell rich).\n\n### Connections\n- **The root of the whole pricing tree:**\n  - [[forward-pricing]] — replicate by buying the stock with borrowed money.\n  - [[put-call-parity]] — fiduciary call ≡ protective put.\n  - [[binomial-replication]] → [[black-scholes-pde]] — dynamic replication.\n  - [[static-replication]] — build exotic payoffs from vanillas.\n  - [[surface-no-arbitrage]] — calendar / butterfly constraints on the vol surface.", "summary": "<a id=\"no-arbitrage\"><\/a>", "topic": "no-arbitrage-finance-basics", "degree": 13}, {"id": "discounting-compounding", "title": "Discounting & Compounding Conventions", "type": "concept", "domain": "stochastic-finance", "tags": ["present-value", "discount-factor"], "path": "topics/no-arbitrage-finance-basics.md", "content": "<a id=\"discounting-compounding\"><\/a>\n\n## Discounting & Compounding Conventions\n<!-- section: discounting-compounding | prerequisites: [] | related: [forward-pricing, bond-duration, implied-forward-regression] | tags: [present-value, discount-factor] -->\n\n$$PV=Ke^{-rT}\\ (\\text{continuous}),\\qquad PV=\\frac{K}{(1+y)^T}\\ (\\text{annual}),\\qquad D(T)=e^{-rT}$$\n\n**Variables:**\n\n- $K$ future payment\n- $r$ continuously compounded rate\n- $y$ annual yield\n- $T$ years\n- $D(T)$ discount factor\n\n- State the convention; never mix. 1 bp = 0.01% = 0.0001.\n- The option market has its **own** discount factor (box-spread rate) ≠ Treasury — see [[implied-forward-regression]].", "summary": "<a id=\"discounting-compounding\"><\/a>", "topic": "no-arbitrage-finance-basics", "degree": 6}, {"id": "forward-pricing", "title": "Forward Pricing (carry, dividends, borrow)", "type": "concept", "domain": "stochastic-finance", "tags": ["forward", "carry", "dividends", "repo"], "path": "topics/no-arbitrage-finance-basics.md", "content": "<a id=\"forward-pricing\"><\/a>\n\n## Forward Pricing (carry, dividends, borrow)\n<!-- section: forward-pricing | prerequisites: [no-arbitrage, discounting-compounding] | related: [put-call-parity, delta-one-products, implied-forward-regression, black-76] | tags: [forward, carry, dividends, repo] -->\n\n$$F_{0,T}=S_0e^{(r-q)T}\\quad(\\text{continuous yield}),\\qquad F(0,T)=\\Big(S_0-\\sum_{t_i\\le T}D_ie^{-rt_i}\\Big)e^{(r-b)T}\\quad(\\text{discrete divs + borrow})$$\n$$V_t=S_te^{-q\\tau}-Ke^{-r\\tau}=(F_t-K)e^{-r\\tau}\\quad\\text{(value of existing long forward struck at }K)$$\n\n**Variables:**\n\n- $S_0$ spot\n- $r$ funding rate\n- $q$ dividend yield (+borrow)\n- $D_i$ cash dividend with ex-date $t_i$\n- $b$ borrow (stock-loan) cost\n- $K$ delivery price\n- $\\tau=T-t$\n\n### Key points\n- Replication: buy stock, finance at $r$ → fair delivery price. A new forward is worth 0 at inception.\n- Example: $S=100$, $r=5\\%$, 1y → $100e^{0.05}\\approx105.13$.\n- **\"The forward is the single most important input\"** — most \"wrong price\" tickets are dividend/borrow issues.\n- Futures ≈ forwards with deterministic rates; differ with stochastic rates (daily margining).\n\n### Connections\n- **Builds on:** [[no-arbitrage]], [[discounting-compounding]].\n- **Implied from options:** [[implied-forward-regression]] (parity regression gives $F$ and implied $q$).\n- **Used by:** [[put-call-parity]] ($C-P=D(F-K)$), [[black-76]], [[delta-one-products]].", "summary": "<a id=\"forward-pricing\"><\/a>", "topic": "no-arbitrage-finance-basics", "degree": 19}, {"id": "bond-duration", "title": "Bond Price & Duration", "type": "concept", "domain": "stochastic-finance", "tags": ["bonds", "duration", "ytm"], "path": "topics/no-arbitrage-finance-basics.md", "content": "<a id=\"bond-duration\"><\/a>\n\n## Bond Price & Duration\n<!-- section: bond-duration | prerequisites: [discounting-compounding] | related: [implied-volatility] | tags: [bonds, duration, ytm] -->\n\n$$P(y)=\\sum_t\\frac{CF_t}{(1+y)^t},\\quad D_{Mac}=\\frac{\\sum_t t\\,CF_t/(1+y)^t}{P},\\quad D_{mod}=\\frac{D_{Mac}}{1+y},\\quad \\frac{\\Delta P}{P}\\approx-D_{mod}\\Delta y$$\n\n**Variables:**\n\n- $CF_t$ cash flow at year $t$\n- $y$ yield to maturity\n\n- $D_{mod}=5$, +100 bp → ≈ −5%. Local approximation (convexity, curve shape matter).\n- **Analogy:** YTM is to bonds what [[implied-volatility]] is to options — a quoting unit from a \"wrong\" flat model.", "summary": "<a id=\"bond-duration\"><\/a>", "topic": "no-arbitrage-finance-basics", "degree": 5}, {"id": "no-arbitrage-finance-basics", "title": "No-Arbitrage & Finance Basics", "type": "topic", "domain": "stochastic-finance", "tags": [], "path": "topics/no-arbitrage-finance-basics.md", "content": "# No-Arbitrage & Finance Basics\n\n**Sections:** [[returns-simple-log]] · [[no-arbitrage]] · [[discounting-compounding]] · [[forward-pricing]] · [[bond-duration]]\n\n<a id=\"returns-simple-log\"><\/a>\n\n## Simple vs Log Returns\n<!-- section: returns-simple-log | prerequisites: [] | related: [jensens-inequality, geometric-brownian-motion, sharpe-ratio] | tags: [returns, compounding] -->\n\n$$R_t=\\frac{P_t-P_{t-1}+D_t}{P_{t-1}},\\quad r_t=\\log(1+R_t),\\quad 1+R_{0:T}=\\prod(1+R_t),\\quad r_{0:T}=\\sum r_t,\\quad \\log(1+R)\\approx R-\\tfrac12R^2$$\n\n**Variables:**\n\n- $P_t$ price\n- $D_t$ cash distribution in the period\n- $R_t$ simple return\n- $r_t$ log return\n\n- Simple returns aggregate **across assets** (portfolio = weighted sum with start-of-period weights); log returns aggregate **across time**.\n- +10% then −10% = −1% (volatility drag, [[jensens-inequality]]).\n\n<a id=\"no-arbitrage\"><\/a>\n\n## No-Arbitrage & the Law of One Price\n<!-- section: no-arbitrage | prerequisites: [] | related: [put-call-parity, forward-pricing, binomial-replication, static-replication, surface-no-arbitrage] | tags: [arbitrage, replication] -->\n\n**Arbitrage:** cost ≤ 0 today, payoff ≥ 0 in every state, > 0 in some state (or positive cash today).\n\n**Law of one price:** identical future cash flows in every state ⇒ same price today (else buy cheap, sell rich).\n\n### Connections\n- **The root of the whole pricing tree:**\n  - [[forward-pricing]] — replicate by buying the stock with borrowed money.\n  - [[put-call-parity]] — fiduciary call ≡ protective put.\n  - [[binomial-replication]] → [[black-scholes-pde]] — dynamic replication.\n  - [[static-replication]] — build exotic payoffs from vanillas.\n  - [[surface-no-arbitrage]] — calendar / butterfly constraints on the vol surface.\n\n<a id=\"discounting-compounding\"><\/a>\n\n## Discounting & Compounding Conventions\n<!-- section: discounting-compounding | prerequisites: [] | related: [forward-pricing, bond-duration, implied-forward-regression] | tags: [present-value, discount-factor] -->\n\n$$PV=Ke^{-rT}\\ (\\text{continuous}),\\qquad PV=\\frac{K}{(1+y)^T}\\ (\\text{annual}),\\qquad D(T)=e^{-rT}$$\n\n**Variables:**\n\n- $K$ future payment\n- $r$ continuously compounded rate\n- $y$ annual yield\n- $T$ years\n- $D(T)$ discount factor\n\n- State the convention; never mix. 1 bp = 0.01% = 0.0001.\n- The option market has its **own** discount factor (box-spread rate) ≠ Treasury — see [[implied-forward-regression]].\n\n<a id=\"forward-pricing\"><\/a>\n\n## Forward Pricing (carry, dividends, borrow)\n<!-- section: forward-pricing | prerequisites: [no-arbitrage, discounting-compounding] | related: [put-call-parity, delta-one-products, implied-forward-regression, black-76] | tags: [forward, carry, dividends, repo] -->\n\n$$F_{0,T}=S_0e^{(r-q)T}\\quad(\\text{continuous yield}),\\qquad F(0,T)=\\Big(S_0-\\sum_{t_i\\le T}D_ie^{-rt_i}\\Big)e^{(r-b)T}\\quad(\\text{discrete divs + borrow})$$\n$$V_t=S_te^{-q\\tau}-Ke^{-r\\tau}=(F_t-K)e^{-r\\tau}\\quad\\text{(value of existing long forward struck at }K)$$\n\n**Variables:**\n\n- $S_0$ spot\n- $r$ funding rate\n- $q$ dividend yield (+borrow)\n- $D_i$ cash dividend with ex-date $t_i$\n- $b$ borrow (stock-loan) cost\n- $K$ delivery price\n- $\\tau=T-t$\n\n### Key points\n- Replication: buy stock, finance at $r$ → fair delivery price. A new forward is worth 0 at inception.\n- Example: $S=100$, $r=5\\%$, 1y → $100e^{0.05}\\approx105.13$.\n- **\"The forward is the single most important input\"** — most \"wrong price\" tickets are dividend/borrow issues.\n- Futures ≈ forwards with deterministic rates; differ with stochastic rates (daily margining).\n\n### Connections\n- **Builds on:** [[no-arbitrage]], [[discounting-compounding]].\n- **Implied from options:** [[implied-forward-regression]] (parity regression gives $F$ and implied $q$).\n- **Used by:** [[put-call-parity]] ($C-P=D(F-K)$), [[black-76]], [[delta-one-products]].\n\n<a id=\"bond-duration\"><\/a>\n\n## Bond Price & Duration\n<!-- section: bond-duration | prerequisites: [discounting-compounding] | related: [implied-volatility] | tags: [bonds, duration, ytm] -->\n\n$$P(y)=\\sum_t\\frac{CF_t}{(1+y)^t},\\quad D_{Mac}=\\frac{\\sum_t t\\,CF_t/(1+y)^t}{P},\\quad D_{mod}=\\frac{D_{Mac}}{1+y},\\quad \\frac{\\Delta P}{P}\\approx-D_{mod}\\Delta y$$\n\n**Variables:**\n\n- $CF_t$ cash flow at year $t$\n- $y$ yield to maturity\n\n- $D_{mod}=5$, +100 bp → ≈ −5%. Local approximation (convexity, curve shape matter).\n- **Analogy:** YTM is to bonds what [[implied-volatility]] is to options — a quoting unit from a \"wrong\" flat model.", "summary": "", "topic": "", "sections": ["returns-simple-log", "no-arbitrage", "discounting-compounding", "forward-pricing", "bond-duration"], "degree": 9}, {"id": "option-payoffs-moneyness", "title": "Option Payoffs, Exercise Style & Moneyness", "type": "concept", "domain": "pricing", "tags": ["call", "put", "itm", "otm"], "path": "topics/no-arbitrage-parity.md", "content": "<a id=\"option-payoffs-moneyness\"><\/a>\n\n## Option Payoffs, Exercise Style & Moneyness\n<!-- section: option-payoffs-moneyness | prerequisites: [] | related: [put-call-parity, option-price-bounds, american-early-exercise] | tags: [call, put, itm, otm] -->\n\n$$\\text{Call}=(S_T-K)^+,\\qquad \\text{Put}=(K-S_T)^+,\\qquad x^+=\\max(x,0)$$\n\n**Variables:**\n\n- $S_T$ underlying at expiry\n- $K$ strike\n\n- European: exercise at expiry; American: any time up to expiry.\n- **Payoff ≠ profit** (premium, financing).\n- Call ITM if $S>K$; put ITM if $S<K$. ATM may mean spot- or **forward**-moneyness — state which. Surfaces use $k=\\ln(K/F)$.", "summary": "<a id=\"option-payoffs-moneyness\"><\/a>", "topic": "no-arbitrage-parity", "degree": 6}, {"id": "option-price-bounds", "title": "European Option Price Bounds", "type": "concept", "domain": "pricing", "tags": ["bounds", "arbitrage"], "path": "topics/no-arbitrage-parity.md", "content": "<a id=\"option-price-bounds\"><\/a>\n\n## European Option Price Bounds\n<!-- section: option-price-bounds | prerequisites: [no-arbitrage, option-payoffs-moneyness] | related: [put-call-parity, surface-no-arbitrage] | tags: [bounds, arbitrage] -->\n\n$$\\max(0,S_0-Ke^{-rT})\\le C\\le S_0,\\qquad \\max(0,Ke^{-rT}-S_0)\\le P\\le Ke^{-rT}$$\n\n**Variables:**\n\n- $S_0$ spot (no dividends)\n- $K$ strike\n- $r$ rate\n- $T$ maturity\n\n- Derived by state-by-state payoff comparison.\n- Check quotes against bounds **before** inverting implied vol (else no solution).\n- Revisit with dividends/American/negative rates.\n\n### Connections\n- **Extended to strike-derivative bounds in:** [[surface-no-arbitrage]] ($-D\\le\\partial C/\\partial K\\le0$).", "summary": "<a id=\"option-price-bounds\"><\/a>", "topic": "no-arbitrage-parity", "degree": 8}, {"id": "put-call-parity", "title": "Put–Call Parity", "type": "concept", "domain": "pricing", "tags": ["parity", "replication", "model-free"], "path": "topics/no-arbitrage-parity.md", "content": "<a id=\"put-call-parity\"><\/a>\n\n## Put–Call Parity\n<!-- section: put-call-parity | prerequisites: [no-arbitrage, forward-pricing, option-payoffs-moneyness] | related: [implied-forward-regression, otm-stitching, implied-volatility, black-scholes-formula, binomial-replication] | tags: [parity, replication, model-free] -->\n\n$$C(K,T)-P(K,T)=S_0e^{-qT}-Ke^{-rT}=D(T)\\,[F(T)-K]$$\n\n**Variables:**\n\n- $C,P$ European call/put, same $K$ and $T$\n- $S_0$ spot\n- $r$ risk-free rate\n- $q$ dividend yield / borrow\n- $D(T)=e^{-rT}$ discount factor\n- $F(T)=S_0e^{(r-q)T}$ forward\n\n### Static replication proof\n| Portfolio at t=0 | Cost | $S_T\\ge K$ | $S_T<K$ |\n|---|---|---|---|\n| A: fiduciary call = call + ZCB paying K | $C+Ke^{-rT}$ | $S_T$ | $K$ |\n| B: protective put = put + $e^{-qT}$ shares | $P+S_0e^{-qT}$ | $S_T$ | $K$ |\n\n- Both pay $\\max(S_T,K)$ in every state ⇒ same price.\n- Holds under GBM, stochastic vol, jumps — any model.\n\n### Four roles in vol-surface construction\n1. **Same IV for call & put** at $(K,T)$: $C_{BS}-P_{BS}$ doesn't depend on σ ⇒ one root σ fits both → [[implied-volatility]].\n2. **Extract $D$ and $F$** by regressing $C-P$ on $K$ → [[implied-forward-regression]].\n3. **OTM stitching**: ITM call IV = OTM put IV → [[otm-stitching]].\n4. **Data cleaning**: drop quotes violating conversion/reversal or box-spread bounds.\n\n### Arbitrage example\n$r=q=0$, $S=K=100$: $C=12$, $P=9$ but parity needs $C-P=0$. Sell call, buy put, buy share, borrow 100 → +3 today, 0 at expiry in every state.\n\n### Engineering use\nRegression test for a pricing library: any update that breaks parity on European vanillas is a bug (RBC prep).\n\n### Connections\n- **Builds on:** [[no-arbitrage]], [[forward-pricing]].\n- **Used by:** [[implied-forward-regression]], [[otm-stitching]], [[model-release-regression-testing]].\n- **American options:** parity becomes an inequality ([[american-early-exercise]]).", "summary": "<a id=\"put-call-parity\"><\/a>", "topic": "no-arbitrage-parity", "degree": 25}, {"id": "binomial-replication", "title": "One-Period Binomial Replication", "type": "concept", "domain": "pricing", "tags": ["replication", "risk-neutral", "binomial"], "path": "topics/no-arbitrage-parity.md", "content": "<a id=\"binomial-replication\"><\/a>\n\n## One-Period Binomial Replication\n<!-- section: binomial-replication | prerequisites: [no-arbitrage] | related: [risk-neutral-pricing, black-scholes-pde, delta-hedging] | tags: [replication, risk-neutral, binomial] -->\n\n$$\\Delta=\\frac{V_u-V_d}{S_u-S_d},\\quad B=\\frac{V_d-\\Delta S_d}{R},\\quad V_0=\\Delta S_0+B=\\frac{q^*V_u+(1-q^*)V_d}{R},\\quad q^*=\\frac{R-d}{u-d}$$\n\n**Variables:**\n\n- $S_u=uS_0$, $S_d=dS_0$ up/down prices\n- $V_u,V_d$ derivative payoffs\n- $R$ gross risk-free growth\n- $\\Delta$ shares held\n- $B$ bank amount\n- $q^*$ risk-neutral up-probability (in (0,1) iff $d<R<u$)\n\n**Example:** $S_0=100$, 120/80, $R=1$, $K=100$ call.\n\n- $\\Delta=0.5$, $B=-40$, $C=10$; $q^*=0.5$.\n- Your 80% \"real\" up-probability is irrelevant (using it gives 16 — wrong).\n- Put = 10 by parity.\n\n### Connections\n- **Continuous-time limit:** [[black-scholes-pde]]; **abstraction:** [[risk-neutral-pricing]]; Δ here = [[delta-hedging]] ratio.", "summary": "<a id=\"binomial-replication\"><\/a>", "topic": "no-arbitrage-parity", "degree": 9}, {"id": "static-replication", "title": "Static Replication", "type": "concept", "domain": "pricing", "tags": ["replication", "model-free"], "path": "topics/no-arbitrage-parity.md", "content": "<a id=\"static-replication\"><\/a>\n\n## Static Replication\n<!-- section: static-replication | prerequisites: [no-arbitrage, breeden-litzenberger] | related: [put-call-parity, digital-options, variance-swaps, call-spread-overhedge, principal-protected-note] | tags: [replication, model-free] -->\n\n### Examples\n- Parity: forward = call − put ([[put-call-parity]]).\n- Digital = tight call spread ([[digital-options]], [[call-spread-overhedge]]).\n- Log contract → variance swap strip with $2/K^2$ weights ([[variance-swaps]]).\n- PPN = ZCB + call ([[principal-protected-note]]).\n\nCleanest answer whenever it applies; path-dependent payoffs need dynamics (models).", "summary": "<a id=\"static-replication\"><\/a>", "topic": "no-arbitrage-parity", "degree": 13}, {"id": "no-arbitrage-parity", "title": "No-Arbitrage & Put–Call Parity", "type": "topic", "domain": "pricing", "tags": [], "path": "topics/no-arbitrage-parity.md", "content": "# No-Arbitrage & Put–Call Parity\n\n**Sections:** [[option-payoffs-moneyness]] · [[option-price-bounds]] · [[put-call-parity]] · [[binomial-replication]] · [[static-replication]]\n\n<a id=\"option-payoffs-moneyness\"><\/a>\n\n## Option Payoffs, Exercise Style & Moneyness\n<!-- section: option-payoffs-moneyness | prerequisites: [] | related: [put-call-parity, option-price-bounds, american-early-exercise] | tags: [call, put, itm, otm] -->\n\n$$\\text{Call}=(S_T-K)^+,\\qquad \\text{Put}=(K-S_T)^+,\\qquad x^+=\\max(x,0)$$\n\n**Variables:**\n\n- $S_T$ underlying at expiry\n- $K$ strike\n\n- European: exercise at expiry; American: any time up to expiry.\n- **Payoff ≠ profit** (premium, financing).\n- Call ITM if $S>K$; put ITM if $S<K$. ATM may mean spot- or **forward**-moneyness — state which. Surfaces use $k=\\ln(K/F)$.\n\n<a id=\"option-price-bounds\"><\/a>\n\n## European Option Price Bounds\n<!-- section: option-price-bounds | prerequisites: [no-arbitrage, option-payoffs-moneyness] | related: [put-call-parity, surface-no-arbitrage] | tags: [bounds, arbitrage] -->\n\n$$\\max(0,S_0-Ke^{-rT})\\le C\\le S_0,\\qquad \\max(0,Ke^{-rT}-S_0)\\le P\\le Ke^{-rT}$$\n\n**Variables:**\n\n- $S_0$ spot (no dividends)\n- $K$ strike\n- $r$ rate\n- $T$ maturity\n\n- Derived by state-by-state payoff comparison.\n- Check quotes against bounds **before** inverting implied vol (else no solution).\n- Revisit with dividends/American/negative rates.\n\n### Connections\n- **Extended to strike-derivative bounds in:** [[surface-no-arbitrage]] ($-D\\le\\partial C/\\partial K\\le0$).\n\n<a id=\"put-call-parity\"><\/a>\n\n## Put–Call Parity\n<!-- section: put-call-parity | prerequisites: [no-arbitrage, forward-pricing, option-payoffs-moneyness] | related: [implied-forward-regression, otm-stitching, implied-volatility, black-scholes-formula, binomial-replication] | tags: [parity, replication, model-free] -->\n\n$$C(K,T)-P(K,T)=S_0e^{-qT}-Ke^{-rT}=D(T)\\,[F(T)-K]$$\n\n**Variables:**\n\n- $C,P$ European call/put, same $K$ and $T$\n- $S_0$ spot\n- $r$ risk-free rate\n- $q$ dividend yield / borrow\n- $D(T)=e^{-rT}$ discount factor\n- $F(T)=S_0e^{(r-q)T}$ forward\n\n### Static replication proof\n| Portfolio at t=0 | Cost | $S_T\\ge K$ | $S_T<K$ |\n|---|---|---|---|\n| A: fiduciary call = call + ZCB paying K | $C+Ke^{-rT}$ | $S_T$ | $K$ |\n| B: protective put = put + $e^{-qT}$ shares | $P+S_0e^{-qT}$ | $S_T$ | $K$ |\n\n- Both pay $\\max(S_T,K)$ in every state ⇒ same price.\n- Holds under GBM, stochastic vol, jumps — any model.\n\n### Four roles in vol-surface construction\n1. **Same IV for call & put** at $(K,T)$: $C_{BS}-P_{BS}$ doesn't depend on σ ⇒ one root σ fits both → [[implied-volatility]].\n2. **Extract $D$ and $F$** by regressing $C-P$ on $K$ → [[implied-forward-regression]].\n3. **OTM stitching**: ITM call IV = OTM put IV → [[otm-stitching]].\n4. **Data cleaning**: drop quotes violating conversion/reversal or box-spread bounds.\n\n### Arbitrage example\n$r=q=0$, $S=K=100$: $C=12$, $P=9$ but parity needs $C-P=0$. Sell call, buy put, buy share, borrow 100 → +3 today, 0 at expiry in every state.\n\n### Engineering use\nRegression test for a pricing library: any update that breaks parity on European vanillas is a bug (RBC prep).\n\n### Connections\n- **Builds on:** [[no-arbitrage]], [[forward-pricing]].\n- **Used by:** [[implied-forward-regression]], [[otm-stitching]], [[model-release-regression-testing]].\n- **American options:** parity becomes an inequality ([[american-early-exercise]]).\n\n<a id=\"binomial-replication\"><\/a>\n\n## One-Period Binomial Replication\n<!-- section: binomial-replication | prerequisites: [no-arbitrage] | related: [risk-neutral-pricing, black-scholes-pde, delta-hedging] | tags: [replication, risk-neutral, binomial] -->\n\n$$\\Delta=\\frac{V_u-V_d}{S_u-S_d},\\quad B=\\frac{V_d-\\Delta S_d}{R},\\quad V_0=\\Delta S_0+B=\\frac{q^*V_u+(1-q^*)V_d}{R},\\quad q^*=\\frac{R-d}{u-d}$$\n\n**Variables:**\n\n- $S_u=uS_0$, $S_d=dS_0$ up/down prices\n- $V_u,V_d$ derivative payoffs\n- $R$ gross risk-free growth\n- $\\Delta$ shares held\n- $B$ bank amount\n- $q^*$ risk-neutral up-probability (in (0,1) iff $d<R<u$)\n\n**Example:** $S_0=100$, 120/80, $R=1$, $K=100$ call.\n\n- $\\Delta=0.5$, $B=-40$, $C=10$; $q^*=0.5$.\n- Your 80% \"real\" up-probability is irrelevant (using it gives 16 — wrong).\n- Put = 10 by parity.\n\n### Connections\n- **Continuous-time limit:** [[black-scholes
