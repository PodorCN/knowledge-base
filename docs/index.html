    const pre = other("prerequisite", "out"), post = other("prerequisite", "in");
    const rel = other("related", null).filter(x => !pre.includes(x) && !post.includes(x));
    out += railList("Builds on", pre) + railList("Leads to", post) + railList("Related chapters", rel);
  } else {
    const list = (adj.get(n.id) || []).filter(a => a.type !== "domain").map(a => pageOf(a.other)).filter(id => id !== n.id && !["question-bank", "source"].includes(byId.get(id).type));
    out += railList("Linked pages", [...new Set(list)].filter(id => byId.get(id).type !== "map" || id !== "home"));
  }
  return out + `<div><h4>File</h4><span class="path">${esc(n.path)}</span></div>`;
}

// ---- sidebar ----
const toc = document.getElementById("toc");
(function buildToc() {
  let h = `<a href="#home" data-id="home">Home</a>`;
  for (const g of GROUPS) {
    h += `<a class="glabel" href="#${g.id}" data-id="${g.id}">${g.name}</a>`;
    for (const t of g.tracks) {
      const tr = TRACKS[t];
      const nq = tr.banks.reduce((s, b) => s + questionsOf(b).length, 0);
      h += `<details class="track" data-track="${t}"><summary><span class="swatch" style="background:var(--d-${t})"></span>${esc(tr.name)}<span class="n">${tr.topics.length}</span></summary><div class="lvl">
        <a class="ov" href="#${tr.map.id}" data-id="${tr.map.id}">Overview</a>
        ${tr.topics.map(id => `<a class="tp" href="#${id}" data-id="${id}"><span class="num">${CHAPTER_NO[id]}</span>${esc(cleanTitle(byId.get(id).title))}</a><ul class="secs" data-secs="${id}" hidden>${byId.get(id).sections.map(s => `<li><a href="#${s}" data-id="${s}" data-sec-link="${s}"><span class="num">${secNo(s)}</span>${esc(cleanTitle(byId.get(s).title))}</a></li>`).join("")}</ul>`).join("")}
        ${tr.banks.map(b => `<a class="qb" href="#${b}" data-id="${b}">Questions · ${esc(cleanTitle(byId.get(b).title).replace(/^Questions: /, ""))} <span class="n">${questionsOf(b).length}</span></a>`).join("")}
      </div></details>`;
    }
  }
  toc.innerHTML = h;
})();
function syncToc(pageId) {
  const n = byId.get(pageId);
  toc.querySelectorAll("a.current").forEach(a => a.classList.remove("current"));
  toc.querySelectorAll("ul.secs").forEach(u => u.hidden = u.dataset.secs !== pageId);
  if (n.domain) toc.querySelectorAll("details.track").forEach(d => d.open = d.dataset.track === n.domain);
  const a = toc.querySelector(`a[data-id="${CSS.escape(pageId)}"]`);
  if (a) { a.classList.add("current"); a.scrollIntoView({ block: "nearest" }); }
}

// ---- router ----
const article = document.getElementById("article"), rail = document.getElementById("rail"), crumbs = document.getElementById("crumbs");
const mainEl = document.getElementById("main");
let current = null;
function crumbsFor(n) {
  const parts = [`<a href="#home" data-id="home">Home</a>`];
  if (n.id !== "home") {
    const t = TRACKS[n.domain];
    if (t) parts.push(`<a href="#${t.group.id}" data-id="${t.group.id}">${t.group.name}</a>`);
    if (t && t.map.id !== n.id) parts.push(`<a href="#${t.map.id}" data-id="${t.map.id}">${esc(t.name)}</a>`);
    parts.push(`<span>${esc(cleanTitle(n.title))}</span>`);
  }
  return parts.join('<span class="sep">/</span>');
}
function scrollToAnchor(anchor) {
  const el = anchor && document.getElementById(anchor);
  if (!el) { mainEl.scrollTop = 0; window.scrollTo(0, 0); return; }
  if (el.tagName === "DETAILS") el.open = true;
  el.scrollIntoView({ block: "start" });
  const sec = el.closest(".sec");
  if (sec) { sec.classList.remove("flash"); void sec.offsetWidth; sec.classList.add("flash"); }
}
function open(id, { push = true } = {}) {
  const target = byId.get(id);
  if (!target) return;
  const pid = pageOf(id);
  const anchor = target.type === "concept" ? id : target.type === "question" ? "q-" + id.split("/")[1] : null;
  if (push) { try { history.pushState(null, "", "#" + (target.type === "question" ? pid : id)); } catch (e) {} }
  closeMenu();
  if (pid === current) { scrollToAnchor(anchor); markSection(anchor); return; }
  current = pid;
  const n = byId.get(pid);
  article.style.setProperty("--dcolor", n.domain ? `var(--d-${n.domain})` : "var(--accent)");
  article.innerHTML = n.type === "topic" ? renderTopic(n) : n.type === "question-bank" ? renderBank(n) : n.type === "map" ? renderMap(n) : renderSource(n);
  enhance(article);
  rail.innerHTML = renderRail(n);
  crumbs.innerHTML = crumbsFor(n);
  syncToc(pid);
  typeset().then(() => scrollToAnchor(anchor));
  scrollToAnchor(anchor);
  watchSections();
}
function typeset() { return (window.MathJax && MathJax.typesetPromise) ? MathJax.typesetPromise([article]).catch(() => {}) : Promise.resolve(); }
window.addEventListener("popstate", () => { const id = location.hash.slice(1); open(byId.has(id) ? id : "home", { push: false }); });

// highlight the section being read in the rail and sidebar
let observer = null;
function markSection(sid) {
  document.querySelectorAll("[data-sec-link]").forEach(a => a.classList.toggle("active", a.dataset.secLink === sid));
}
function watchSections() {
  if (observer) observer.disconnect();
  const secs = article.querySelectorAll(".sec");
  if (!secs.length || !("IntersectionObserver" in window)) return;
  observer = new IntersectionObserver(entries => {
    const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (vis) markSection(vis.target.dataset.sec);
  }, { rootMargin: "-15% 0px -70% 0px" });
  secs.forEach(s => observer.observe(s));
}

document.addEventListener("click", e => {
  const expand = e.target.closest("[data-expand]");
  if (expand) {
    const sec = expand.closest("section");
    const cards = sec.querySelectorAll("details.qa");
    const openAll = [...cards].some(c => !c.open);
    cards.forEach(c => c.open = openAll);
    expand.textContent = openAll ? "Hide all solutions" : "Show all solutions";
    return;
  }
  const a = e.target.closest("a[data-id]");
  if (!a) return;
  e.preventDefault(); overlay.hidden = true; open(a.dataset.id);
});

// ---- mobile menu ----
const side = document.getElementById("side"), scrim = document.getElementById("scrim");
function closeMenu() { side.classList.remove("open"); scrim.classList.remove("open"); }
document.getElementById("menuBtn").addEventListener("click", () => { side.classList.add("open"); scrim.classList.add("open"); });
scrim.addEventListener("click", closeMenu);

// ---- search ----
const q = document.getElementById("q"), results = document.getElementById("results");
let searchable = [];
function buildSearch() {
  searchable = DATA.nodes.filter(n => n.type !== "source" && !n.locked)
    .map(n => ({ n, hay: ((n.qno || "") + " " + n.title + " " + (n.tags || []).join(" ") + " " + (n.summary || "") + (n.type === "question" ? "" : " " + n.id)).toLowerCase() }));
}
buildSearch();
let active = 0, hits = [];
const rank = n => ({ topic: 0, concept: 1, map: 2, "question-bank": 3, question: 4, source: 5 }[n.type]);
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase();
  if (!s) { results.hidden = true; return; }
  const words = s.split(/\s+/);
  hits = searchable.filter(x => words.every(w => x.hay.includes(w))).map(x => x.n)
    .sort((a, b) => (b.title.toLowerCase().includes(s) - a.title.toLowerCase().includes(s)) || rank(a) - rank(b) || a.title.length - b.title.length)
    .slice(0, 14);
  active = 0;
  results.innerHTML = hits.length ? hits.map((n, i) =>
    `<li><button type="button" data-hit="${i}" class="${i ? "" : "active"}"><span class="kind">${TYPE_LABEL[n.type]}</span><span>${n.qno ? `<b>${n.qno}</b> ` : ""}${esc(cleanTitle(n.title))}${n.type === "concept" ? `<small> in ${esc(byId.get(n.topic).title)}</small>` : ""}</span></button></li>`).join("")
    : `<li style="padding:8px;color:var(--muted)">No matches. Try a single keyword such as "skew".</li>`;
  results.hidden = false;
});
q.addEventListener("keydown", e => {
  if (results.hidden || !hits.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); active = (active + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length;
    results.querySelectorAll("button").forEach((b, i) => b.classList.toggle("active", i === active));
  } else if (e.key === "Enter") { pick(hits[active]); }
  else if (e.key === "Escape") { results.hidden = true; }
});
results.addEventListener("click", e => { const b = e.target.closest("button[data-hit]"); if (b) pick(hits[+b.dataset.hit]); });
document.addEventListener("click", e => { if (!e.target.closest(".search")) results.hidden = true; });
function pick(n) { results.hidden = true; q.value = ""; open(n.id); }

// ---- graph (secondary view): chapters and how they connect ----
const overlay = document.getElementById("graphOverlay");
let fg = null, hi = null, T = {}, fitted = false;
function tokens() {
  const cs = getComputedStyle(document.documentElement), g = k => cs.getPropertyValue(k).trim();
  T = { edge: g("--edge"), ink: g("--ink"), ground: g("--ground"), surface: g("--surface"), faint: g("--faint"), d: {} };
  for (const t of Object.keys(TRACKS)) T.d[t] = g("--d-" + t);
}
function chapterGraph() {
  const topics = DATA.nodes.filter(n => n.type === "topic");
  const w = new Map();
  for (const l of DATA.links) {
    if (!["prerequisite", "related", "mention"].includes(l.type)) continue;
    const a = pageOf(l.source), b = pageOf(l.target);
    if (a === b || byId.get(a).type !== "topic" || byId.get(b).type !== "topic") continue;
    const k = [a, b].sort().join("|"); w.set(k, (w.get(k) || 0) + 1);
  }
  return { nodes: topics.map(t => ({ id: t.id })), links: [...w].map(([k, v]) => { const [s, t] = k.split("|"); return { source: s, target: t, w: v }; }) };
}
function openGraph() {
  overlay.hidden = false; tokens();
  hi = new Set([current]);
  if (fg) fg.graphData().links.forEach(l => { if (l.source.id === current) hi.add(l.target.id); if (l.target.id === current) hi.add(l.source.id); });
  if (fg) return;
  const el = document.getElementById("graph");
  const data = chapterGraph();
  data.links.forEach(l => { if (l.source === current) hi.add(l.target); if (l.target === current) hi.add(l.source); });
  fg = ForceGraph()(el).graphData(data).backgroundColor("rgba(0,0,0,0)").autoPauseRedraw(false)
    .width(el.clientWidth).height(el.clientHeight)
    .nodeLabel(n => byId.get(n.id).title)
    .linkColor(() => T.edge).linkWidth(l => Math.min(4, 0.4 + l.w * 0.35))
    .nodeCanvasObject((n, ctx, scale) => {
      const d = byId.get(n.id), on = !hi || hi.size < 2 || hi.has(n.id);
      const r = 4 + Math.sqrt(d.sections.length) * 2.2;
      ctx.globalAlpha = on ? 1 : 0.18;
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 2 * Math.PI); ctx.fillStyle = T.d[d.domain] || T.faint; ctx.fill();
      if (n.id === current) { ctx.beginPath(); ctx.arc(n.x, n.y, r + 3, 0, 2 * Math.PI); ctx.lineWidth = 1.5; ctx.strokeStyle = T.ink; ctx.stroke(); }
      const fs = 11 / scale;
      ctx.font = `500 ${fs}px "IBM Plex Sans", system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.lineWidth = 3 / scale; ctx.strokeStyle = T.ground; ctx.strokeText(d.title, n.x, n.y + r + 2 / scale);
      ctx.fillStyle = T.ink; ctx.fillText(d.title, n.x, n.y + r + 2 / scale);
      ctx.globalAlpha = 1;
    })
    .nodePointerAreaPaint((n, color, ctx) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(n.x, n.y, 12, 0, 2 * Math.PI); ctx.fill(); })
    .onNodeClick(n => { overlay.hidden = true; open(n.id); })
    .cooldownTicks(200).onEngineStop(() => { if (!fitted) { fitted = true; fg.zoomToFit(400, 60); } });
  fg.d3Force("charge").strength(-260);
  new ResizeObserver(() => fg.width(el.clientWidth).height(el.clientHeight)).observe(el);
}
document.getElementById("graphBtn").addEventListener("click", openGraph);
document.getElementById("graphClose").addEventListener("click", () => overlay.hidden = true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !overlay.hidden) overlay.hidden = true; });

// ---- password-protected exercises ----
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(password) {
  const L = DATA.locked;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(L.salt), iterations: L.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(L.iv) }, key, b64(L.ct));
  const secret = JSON.parse(new TextDecoder().decode(plain));
  for (const [id, v] of Object.entries(secret)) { const n = byId.get(id); if (n) Object.assign(n, v, { locked: false }); }
  DATA.locked = null;
  buildSearch();
  const page = current; current = null; open(page, { push: false });
}
document.addEventListener("submit", async e => {
  const form = e.target.closest("[data-unlock]");
  if (!form) return;
  e.preventDefault();
  const input = form.querySelector("input"), err = form.querySelector(".lockerr");
  err.textContent = "Checking…";
  try {
    await unlock(input.value);
    try { sessionStorage.setItem("kb-pw", input.value); } catch (x) {}
  } catch (x) { err.textContent = "Wrong password. Try again."; input.select(); }
});

// ---- boot ----
const startId = location.hash.slice(1);
open(byId.has(startId) ? startId : "home", { push: false });
if (window.MathJax && MathJax.startup) MathJax.startup.promise.then(() => typeset()).catch(() => {});
if (DATA.locked) { try { const pw = sessionStorage.getItem("kb-pw"); if (pw) unlock(pw).catch(() => {}); } catch (x) {} }
</script>
