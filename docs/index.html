-pde]]; **abstraction:** [[risk-neutral-pricing]]; Δ here = [[delta-hedging]] ratio.\n\n<a id=\"static-replication\"><\/a>\n\n## Static Replication\n<!-- section: static-replication | prerequisites: [no-arbitrage, breeden-litzenberger] | related: [put-call-parity, digital-options, variance-swaps, call-spread-overhedge, principal-protected-note] | tags: [replication, model-free] -->\n\n### Examples\n- Parity: forward = call − put ([[put-call-parity]]).\n- Digital = tight call spread ([[digital-options]], [[call-spread-overhedge]]).\n- Log contract → variance swap strip with $2/K^2$ weights ([[variance-swaps]]).\n- PPN = ZCB + call ([[principal-protected-note]]).\n\nCleanest answer whenever it applies; path-dependent payoffs need dynamics (models).", "summary": "", "topic": "", "sections": ["option-payoffs-moneyness", "option-price-bounds", "put-call-parity", "binomial-replication", "static-replication"], "degree": 10}, {"id": "root-finding", "title": "Root Finding (Newton, Bisection, Brent)", "type": "concept", "domain": "quant-models", "tags": ["numerics", "newton", "brent"], "path": "topics/numerical-methods.md", "content": "<a id=\"root-finding\"><\/a>\n\n## Root Finding (Newton, Bisection, Brent)\n<!-- section: root-finding | prerequisites: [] | related: [implied-volatility] | tags: [numerics, newton, brent] -->\n\n$$x_{n+1}=x_n-\\frac{f(x_n)}{f'(x_n)}\\quad\\text{(Newton)}$$\n\n**Variables:**\n\n- $f$ function whose root is sought\n- $f'$ its derivative\n\n- Newton: quadratic convergence near root; explodes when $f'\\to0$.\n- Bisection: guaranteed (needs a bracket), linear. Brent: bracketed + fast — robust default.\n- For IV: check price within arbitrage bounds first, bracket, good initial guess.", "summary": "<a id=\"root-finding\"><\/a>", "topic": "numerical-methods", "degree": 5}, {"id": "pde-finite-difference", "title": "PDE / Finite-Difference Pricing", "type": "concept", "domain": "quant-models", "tags": ["pde", "grid", "crank-nicolson"], "path": "topics/numerical-methods.md", "content": "<a id=\"pde-finite-difference\"><\/a>\n\n## PDE / Finite-Difference Pricing\n<!-- section: pde-finite-difference | prerequisites: [black-scholes-pde] | related: [monte-carlo-pricing, barrier-options, american-early-exercise, local-volatility-dupire] | tags: [pde, grid, crank-nicolson] -->\n\nSolve the pricing PDE backward on a (S, t) grid.\n\n- Accurate, stable Greeks in 1–2 factors; natural for **American exercise** and **single-asset barriers** (barrier = boundary; align grid nodes with H).\n- Discrete dividends: jump conditions at ex-dates.\n- Curse of dimensionality → multi-asset goes to [[monte-carlo-pricing]].", "summary": "<a id=\"pde-finite-difference\"><\/a>", "topic": "numerical-methods", "degree": 10}, {"id": "monte-carlo-pricing", "title": "Monte Carlo Pricing", "type": "concept", "domain": "quant-models", "tags": ["monte-carlo", "aad", "longstaff-schwartz", "variance-reduction"], "path": "topics/numerical-methods.md", "content": "<a id=\"monte-carlo-pricing\"><\/a>\n\n## Monte Carlo Pricing\n<!-- section: monte-carlo-pricing | prerequisites: [risk-neutral-pricing, lln-clt] | related: [pde-finite-difference, autocallables, barrier-options, asian-options, greeks-conventions-bumping, local-stochastic-volatility] | tags: [monte-carlo, aad, longstaff-schwartz, variance-reduction] -->\n\nSimulate risk-neutral paths, average discounted payoff; error ∝ $1/\\sqrt N$ ([[lln-clt]]).\n\n- **Workhorse** for high-dimensional / path-dependent: worst-of autocallables, baskets, cliquets.\n- **Variance reduction:** antithetic paths; control variates (closed-form geometric Asian, flat-vol barrier).\n- **Greeks:** AAD (adjoint algorithmic differentiation — \"Smoking Adjoints\") or bumping with common random numbers.\n- **Early exercise:** Longstaff–Schwartz regression.\n- **Barriers:** discrete monitoring needs BGK shift; Brownian-bridge crossing probabilities for continuous ones.\n- Performance (.NET): avoid allocations in hot loops (Span, ArrayPool), parallelise paths.\n\n### Numerical method map\n| Method | Idea | Typical products |\n|---|---|---|\n| Closed form | analytic under flat vol | Reiner–Rubinstein barrier, geometric Asian, Margrabe, digital |\n| [[static-replication]] | build from vanillas | digitals, var swaps, any European |\n| [[pde-finite-difference]] | solve pricing PDE on a grid | single-asset barriers, American, local vol |\n| **Monte Carlo** | simulate paths | autocallables, baskets, cliquets |", "summary": "<a id=\"monte-carlo-pricing\"><\/a>", "topic": "numerical-methods", "degree": 20}, {"id": "numerical-methods", "title": "Numerical Methods", "type": "topic", "domain": "quant-models", "tags": [], "path": "topics/numerical-methods.md", "content": "# Numerical Methods\n\n**Sections:** [[root-finding]] · [[pde-finite-difference]] · [[monte-carlo-pricing]]\n\n<a id=\"root-finding\"><\/a>\n\n## Root Finding (Newton, Bisection, Brent)\n<!-- section: root-finding | prerequisites: [] | related: [implied-volatility] | tags: [numerics, newton, brent] -->\n\n$$x_{n+1}=x_n-\\frac{f(x_n)}{f'(x_n)}\\quad\\text{(Newton)}$$\n\n**Variables:**\n\n- $f$ function whose root is sought\n- $f'$ its derivative\n\n- Newton: quadratic convergence near root; explodes when $f'\\to0$.\n- Bisection: guaranteed (needs a bracket), linear. Brent: bracketed + fast — robust default.\n- For IV: check price within arbitrage bounds first, bracket, good initial guess.\n\n<a id=\"pde-finite-difference\"><\/a>\n\n## PDE / Finite-Difference Pricing\n<!-- section: pde-finite-difference | prerequisites: [black-scholes-pde] | related: [monte-carlo-pricing, barrier-options, american-early-exercise, local-volatility-dupire] | tags: [pde, grid, crank-nicolson] -->\n\nSolve the pricing PDE backward on a (S, t) grid.\n\n- Accurate, stable Greeks in 1–2 factors; natural for **American exercise** and **single-asset barriers** (barrier = boundary; align grid nodes with H).\n- Discrete dividends: jump conditions at ex-dates.\n- Curse of dimensionality → multi-asset goes to [[monte-carlo-pricing]].\n\n<a id=\"monte-carlo-pricing\"><\/a>\n\n## Monte Carlo Pricing\n<!-- section: monte-carlo-pricing | prerequisites: [risk-neutral-pricing, lln-clt] | related: [pde-finite-difference, autocallables, barrier-options, asian-options, greeks-conventions-bumping, local-stochastic-volatility] | tags: [monte-carlo, aad, longstaff-schwartz, variance-reduction] -->\n\nSimulate risk-neutral paths, average discounted payoff; error ∝ $1/\\sqrt N$ ([[lln-clt]]).\n\n- **Workhorse** for high-dimensional / path-dependent: worst-of autocallables, baskets, cliquets.\n- **Variance reduction:** antithetic paths; control variates (closed-form geometric Asian, flat-vol barrier).\n- **Greeks:** AAD (adjoint algorithmic differentiation — \"Smoking Adjoints\") or bumping with common random numbers.\n- **Early exercise:** Longstaff–Schwartz regression.\n- **Barriers:** discrete monitoring needs BGK shift; Brownian-bridge crossing probabilities for continuous ones.\n- Performance (.NET): avoid allocations in hot loops (Span, ArrayPool), parallelise paths.\n\n### Numerical method map\n| Method | Idea | Typical products |\n|---|---|---|\n| Closed form | analytic under flat vol | Reiner–Rubinstein barrier, geometric Asian, Margrabe, digital |\n| [[static-replication]] | build from vanillas | digitals, var swaps, any European |\n| [[pde-finite-difference]] | solve pricing PDE on a grid | single-asset barriers, American, local vol |\n| **Monte Carlo** | simulate paths | autocallables, baskets, cliquets |", "summary": "", "topic": "", "sections": ["root-finding", "pde-finite-difference", "monte-carlo-pricing"], "degree": 6}, {"id": "oop-pillars", "title": "OOP Pillars (with a pricing example)", "type": "concept", "domain": "quant-dev", "tags": ["oop", "encapsulation", "polymorphism"], "path": "topics/oop-design.md", "content": "<a id=\"oop-pillars\"><\/a>\n\n## OOP Pillars (with a pricing example)\n<!-- section: oop-pillars | prerequisites: [] | related: [solid-principles, design-patterns-pricing, pricing-app-architecture, csharp-essentials] | tags: [oop, encapsulation, polymorphism] -->\n\n| Pillar | Meaning | Pricing example |\n|---|---|---|\n| Encapsulation | hide state, expose behaviour | `VolSurface` hides its grid, exposes `GetVol(K, T)` |\n| Abstraction | model the essential interface | `IPricingModel.Price(instrument, market)` |\n| Inheritance | reuse via \"is-a\" | `EuropeanCall : VanillaOption : Instrument` |\n| Polymorphism | same call, different behaviour | `model.Price(trade)` runs BS, MC or PDE |\n\n**Composition over inheritance:** a barrier option isn't \"a vanilla with a flag\" — compose `Option { Payoff, ExerciseSchedule, Barrier? }` to avoid fragile deep hierarchies as exotic variations multiply.", "summary": "<a id=\"oop-pillars\"><\/a>", "topic": "oop-design", "degree": 12}, {"id": "solid-principles", "title": "SOLID (desk-app examples)", "type": "concept", "domain": "quant-dev", "tags": ["solid", "design"], "path": "topics/oop-design.md", "content": "<a id=\"solid-principles\"><\/a>\n\n## SOLID (desk-app examples)\n<!-- section: solid-principles | prerequisites: [oop-pillars] | related: [design-patterns-pricing, pricing-app-architecture] | tags: [solid, design] -->\n\n- **S**ingle responsibility: the pricer doesn't also format the UI.\n- **O**pen/closed: add a model by adding a class implementing `IPricingModel`, not editing a switch.\n- **L**iskov: every `IPricingModel` honours the contract (e.g. Greeks in the same units).\n- **I**nterface segregation: `IGreeksProvider` separate from `IPricer` so simple models don't fake Greeks.\n- **D**ependency inversion: ViewModels depend on an injected `IPricingService` → mockable in tests.", "summary": "<a id=\"solid-principles\"><\/a>", "topic": "oop-design", "degree": 6}, {"id": "design-patterns-pricing", "title": "Design Patterns in a Pricing App", "type": "concept", "domain": "quant-dev", "tags": ["patterns", "strategy", "adapter", "observer"], "path": "topics/oop-design.md", "content": "<a id=\"design-patterns-pricing\"><\/a>\n\n## Design Patterns in a Pricing App\n<!-- section: design-patterns-pricing | prerequisites: [oop-pillars] | related: [solid-principles, pricing-app-architecture, model-release-regression-testing] | tags: [patterns, strategy, adapter, observer] -->\n\n| Pattern | Use |\n|---|---|\n| Strategy | swap pricing model / numerical method |\n| Factory / Registry | create the right model per product + library version |\n| **Adapter** | wrap the quant library's API behind your own interface → isolates monthly changes |\n| Observer | market-data tick → reprice → UI refresh (events, `IObservable`, `INotifyPropertyChanged`) |\n| Decorator | caching, logging, timing around a pricer |\n| Builder | construct structured-product term sheets |\n| Command | undo/redo, scenario actions, bumps |\n| Visitor | price / risk / cash-flow report over an instrument tree |\n\n### Connections\n- **Adapter is key for:** [[model-release-regression-testing]].", "summary": "<a id=\"design-patterns-pricing\"><\/a>", "topic": "oop-design", "degree": 8}, {"id": "pricing-app-architecture", "title": "Pricing App Architecture (instrument / market data / model)", "type": "concept", "domain": "quant-dev", "tags": ["architecture", "market-data", "immutability"], "path": "topics/oop-design.md", "content": "<a id=\"pricing-app-architecture\"><\/a>\n\n## Pricing App Architecture (instrument / market data / model)\n<!-- section: pricing-app-architecture | prerequisites: [oop-pillars] | related: [csharp-essentials, design-patterns-pricing, forward-pricing, volatility-surface, scenario-risk-grids] | tags: [architecture, market-data, immutability] -->\n\n**Separate what (instrument, immutable) / with what (market-data snapshot) / how (model)** → swap models from the monthly library release without touching instruments or UI.\n\n```csharp\npublic interface IMarketData { double Spot(string ul); double Discount(DateTime t); double Vol(string ul, double k, DateTime t); }\npublic interface IPricingModel { bool Supports(Instrument i); PricingResult Price(Instrument i, IMarketData md, PricingSettings s); }\npublic record PricingResult(double Pv, IReadOnlyDictionary<string,double> Greeks, double? StdError);\n```\n\n### Market data an equity option needs\nSpot; discount curve per currency; dividend schedule (cash + yield, ex-dates); borrow/repo curve; implied vol surface (strike/delta × expiry); quantos: FX vol + correlation; baskets: correlation matrix; calendars, settlement conventions.\n\n### Product-thinking features (structured-products desk)\nTerm-sheet templates (autocall, RC, PPN); **solve-for** coupon/barrier/participation; scenario & Greek ladders; correlation & dividend sensitivity; lifecycle events (fixings, autocall triggers, knock-ins); pricing audit trail.\n\n### Connections\n- **Inputs explained in:** [[forward-pricing]], [[volatility-surface]]. **Language details:** [[csharp-essentials]].", "summary": "<a id=\"pricing-app-architecture\"><\/a>", "topic": "oop-design", "degree": 19}, {"id": "oop-design", "title": "OOP & Design", "type": "topic", "domain": "quant-dev", "tags": [], "path": "topics/oop-design.md", "content": "# OOP & Design\n\n**Sections:** [[oop-pillars]] · [[solid-principles]] · [[design-patterns-pricing]] · [[pricing-app-architecture]]\n\n<a id=\"oop-pillars\"><\/a>\n\n## OOP Pillars (with a pricing example)\n<!-- section: oop-pillars | prerequisites: [] | related: [solid-principles, design-patterns-pricing, pricing-app-architecture, csharp-essentials] | tags: [oop, encapsulation, polymorphism] -->\n\n| Pillar | Meaning | Pricing example |\n|---|---|---|\n| Encapsulation | hide state, expose behaviour | `VolSurface` hides its grid, exposes `GetVol(K, T)` |\n| Abstraction | model the essential interface | `IPricingModel.Price(instrument, market)` |\n| Inheritance | reuse via \"is-a\" | `EuropeanCall : VanillaOption : Instrument` |\n| Polymorphism | same call, different behaviour | `model.Price(trade)` runs BS, MC or PDE |\n\n**Composition over inheritance:** a barrier option isn't \"a vanilla with a flag\" — compose `Option { Payoff, ExerciseSchedule, Barrier? }` to avoid fragile deep hierarchies as exotic variations multiply.\n\n<a id=\"solid-principles\"><\/a>\n\n## SOLID (desk-app examples)\n<!-- section: solid-principles | prerequisites: [oop-pillars] | related: [design-patterns-pricing, pricing-app-architecture] | tags: [solid, design] -->\n\n- **S**ingle responsibility: the pricer doesn't also format the UI.\n- **O**pen/closed: add a model by adding a class implementing `IPricingModel`, not editing a switch.\n- **L**iskov: every `IPricingModel` honours the contract (e.g. Greeks in the same units).\n- **I**nterface segregation: `IGreeksProvider` separate from `IPricer` so simple models don't fake Greeks.\n- **D**ependency inversion: ViewModels depend on an injected `IPricingService` → mockable in tests.\n\n<a id=\"design-patterns-pricing\"><\/a>\n\n## Design Patterns in a Pricing App\n<!-- section: design-patterns-pricing | prerequisites: [oop-pillars] | related: [solid-principles, pricing-app-architecture, model-release-regression-testing] | tags: [patterns, strategy, adapter, observer] -->\n\n| Pattern | Use |\n|---|---|\n| Strategy | swap pricing model / numerical method |\n| Factory / Registry | create the right model per product + library version |\n| **Adapter** | wrap the quant library's API behind your own interface → isolates monthly changes |\n| Observer | market-data tick → reprice → UI refresh (events, `IObservable`, `INotifyPropertyChanged`) |\n| Decorator | caching, logging, timing around a pricer |\n| Builder | construct structured-product term sheets |\n| Command | undo/redo, scenario actions, bumps |\n| Visitor | price / risk / cash-flow report over an instrument tree |\n\n### Connections\n- **Adapter is key for:** [[model-release-regression-testing]].\n\n<a id=\"pricing-app-architecture\"><\/a>\n\n## Pricing App Architecture (instrument / market data / model)\n<!-- section: pricing-app-architecture | prerequisites: [oop-pillars] | related: [csharp-essentials, design-patterns-pricing, forward-pricing, volatility-surface, scenario-risk-grids] | tags: [architecture, market-data, immutability] -->\n\n**Separate what (instrument, immutable) / with what (market-data snapshot) / how (model)** → swap models from the monthly library release without touching instruments or UI.\n\n```csharp\npublic interface IMarketData { double Spot(string ul); double Discount(DateTime t); double Vol(string ul, double k, DateTime t); }\npublic interface IPricingModel { bool Supports(Instrument i); PricingResult Price(Instrument i, IMarketData md, PricingSettings s); }\npublic record PricingResult(double Pv, IReadOnlyDictionary<string,double> Greeks, double? StdError);\n```\n\n### Market data an equity option needs\nSpot; discount curve per currency; dividend schedule (cash + yield, ex-dates); borrow/repo curve; implied vol surface (strike/delta × expiry); quantos: FX vol + correlation; baskets: correlation matrix; calendars, settlement conventions.\n\n### Product-thinking features (structured-products desk)\nTerm-sheet templates (autocall, RC, PPN); **solve-for** coupon/barrier/participation; scenario & Greek ladders; correlation & dividend sensitivity; lifecycle events (fixings, autocall triggers, knock-ins); pricing audit trail.\n\n### Connections\n- **Inputs explained in:** [[forward-pricing]], [[volatility-surface]]. **Language details:** [[csharp-essentials]].", "summary": "", "topic": "", "sections": ["oop-pillars", "solid-principles", "design-patterns-pricing", "pricing-app-architecture"], "degree": 6}, {"id": "portfolio-variance-diversification", "title": "Portfolio Variance & Diversification", "type": "concept", "domain": "portfolio-construction", "tags": ["diversification", "correlation"], "path": "topics/portfolio-optimisation.md", "content": "<a id=\"portfolio-variance-diversification\"><\/a>\n\n## Portfolio Variance & Diversification\n<!-- section: portfolio-variance-diversification | prerequisites: [variance-covariance-correlation] | related: [sharpe-ratio, minimum-variance-portfolio, risk-contribution, worst-of-correlation, pca] | tags: [diversification, correlation] -->\n\n$$\\mu_p=w^\\top\\mu,\\quad \\sigma_p^2=w^\\top\\Sigma w,\\quad \\sigma_p^2=w^2\\sigma_1^2+(1-w)^2\\sigma_2^2+2w(1-w)\\rho\\sigma_1\\sigma_2$$\nTwo equal strategies: $\\sigma_p=\\sigma\\sqrt{\\tfrac{1+\\rho}{2}}$, $SR_p=SR\\sqrt{\\tfrac{2}{1+\\rho}}$. $n$ equicorrelated: $\\sigma_p^2=\\sigma^2\\big[\\rho+\\tfrac{1-\\rho}{n}\\big]$.\n\n**Variables:**\n\n- $w$ weights\n- $\\mu$ expected excess returns\n- $\\Sigma$ covariance\n- $\\rho$ correlation\n- $n$ assets\n\n- SR 0.5, ρ=0 → 50/50 SR ≈ 0.707; ρ=1 → 0.5 (no benefit). 10 uncorrelated SR-0.5 → $0.5\\sqrt{10}\\approx1.58$.\n- Positive common ρ leaves a **floor** $\\rho\\sigma^2$ as $n\\to\\infty$. Valid equicorrelation needs $\\rho\\ge-1/(n-1)$.\n- Averaging Sharpes or adding σ's is wrong — use covariance.\n\n### Connections\n- **Leads to:** [[minimum-variance-portfolio]], [[mean-variance-optimization]], [[risk-contribution]].\n- **Correlation as a traded risk:** [[worst-of-correlation]].", "summary": "<a id=\"portfolio-variance-diversification\"><\/a>", "topic": "portfolio-optimisation", "degree": 17}, {"id": "minimum-variance-portfolio", "title": "Minimum-Variance Portfolio (2-asset & GMV)", "type": "concept", "domain": "portfolio-construction", "tags": ["gmv", "optimisation"], "path": "topics/portfolio-optimisation.md", "content": "<a id=\"minimum-variance-portfolio\"><\/a>\n\n## Minimum-Variance Portfolio (2-asset & GMV)\n<!-- section: minimum-variance-portfolio | prerequisites: [portfolio-variance-diversification] | related: [mean-variance-optimization, risk-budgeting] | tags: [gmv, optimisation] -->\n\n$$w_1^*=\\frac{\\sigma_2^2-\\rho\\sigma_1\\sigma_2}{\\sigma_1^2+\\sigma_2^2-2\\rho\\sigma_1\\sigma_2},\\qquad w_{GMV}=\\frac{\\Sigma^{-1}\\mathbf 1}{\\mathbf 1^\\top\\Sigma^{-1}\\mathbf 1},\\qquad \\sigma^2_{GMV}=\\frac{1}{\\mathbf 1^\\top\\Sigma^{-1}\\mathbf 1}$$\n\n**Variables:**\n\n- $\\sigma_1,\\sigma_2$ vols\n- $\\rho$ correlation\n- $\\Sigma$ covariance (positive definite)\n- $\\mathbf 1$ vector of ones\n\n- Uncorrelated 10% / 20% → 0.8 / 0.2; 10% / 30% → 0.9 / 0.1: **inverse-variance**, not inverse-vol.\n- Uses no expected returns. Long-only: clip to [0,1] (convex problem).", "summary": "<a id=\"minimum-variance-portfolio\"><\/a>", "topic": "portfolio-optimisation", "degree": 7}, {"id": "mean-variance-optimization", "title": "Mean–Variance Optimisation & Tangency Portfolio", "type": "concept", "domain": "portfolio-construction", "tags": ["markowitz", "tangency", "max-sharpe", "estimation-error"], "path": "topics/portfolio-optimisation.md", "content": "<a id=\"mean-variance-optimization\"><\/a>\n\n## Mean–Variance Optimisation & Tangency Portfolio\n<!-- section: mean-variance-optimization | prerequisites: [minimum-variance-portfolio] | related: [marginal-sharpe-improvement, risk-budgeting, ridge-regression, eigen-svd-psd] | tags: [markowitz, tangency, max-sharpe, estimation-error] -->\n\n$$\\max_w\\ w^\\top\\mu-\\tfrac\\gamma2w^\\top\\Sigma w\\ \\Rightarrow\\ w^*=\\tfrac1\\gamma\\Sigma^{-1}\\mu,\\qquad SR_{max}=\\sqrt{\\mu^\\top\\Sigma^{-1}\\mu},\\qquad w_T=\\frac{\\Sigma^{-1}\\mu}{\\mathbf 1^\\top\\Sigma^{-1}\\mu}$$\n\n**Variables:**\n\n- $\\mu$ expected **excess** returns\n- $\\Sigma$ covariance\n- $\\gamma$ risk aversion\n- $w_T$ fully invested tangency portfolio (needs $\\mathbf 1^\\top\\Sigma^{-1}\\mu>0$)\n\n### Why optimised portfolios fail\n- μ is noisy, Σ unstable; $\\Sigma^{-1}$ **amplifies errors** in small-eigenvalue directions ([[eigen-svd-psd]]) → extreme weights, turnover.\n- Fixes: shrink means/covariance (cf. [[ridge-regression]]), constraints, turnover penalties, compare with equal-weight / min-var baselines, or skip μ entirely via [[risk-budgeting]].", "summary": "<a id=\"mean-variance-optimization\"><\/a>", "topic": "portfolio-optimisation", "degree": 11}, {"id": "portfolio-optimisation", "title": "Portfolio Optimisation", "type": "topic", "domain": "portfolio-construction", "tags": [], "path": "topics/portfolio-optimisation.md", "content": "# Portfolio Optimisation\n\n**Sections:** [[portfolio-variance-diversification]] · [[minimum-variance-portfolio]] · [[mean-variance-optimization]]\n\n<a id=\"portfolio-variance-diversification\"><\/a>\n\n## Portfolio Variance & Diversification\n<!-- section: portfolio-variance-diversification | prerequisites: [variance-covariance-correlation] | related: [sharpe-ratio, minimum-variance-portfolio, risk-contribution, worst-of-correlation, pca] | tags: [diversification, correlation] -->\n\n$$\\mu_p=w^\\top\\mu,\\quad \\sigma_p^2=w^\\top\\Sigma w,\\quad \\sigma_p^2=w^2\\sigma_1^2+(1-w)^2\\sigma_2^2+2w(1-w)\\rho\\sigma_1\\sigma_2$$\nTwo equal strategies: $\\sigma_p=\\sigma\\sqrt{\\tfrac{1+\\rho}{2}}$, $SR_p=SR\\sqrt{\\tfrac{2}{1+\\rho}}$. $n$ equicorrelated: $\\sigma_p^2=\\sigma^2\\big[\\rho+\\tfrac{1-\\rho}{n}\\big]$.\n\n**Variables:**\n\n- $w$ weights\n- $\\mu$ expected excess returns\n- $\\Sigma$ covariance\n- $\\rho$ correlation\n- $n$ assets\n\n- SR 0.5, ρ=0 → 50/50 SR ≈ 0.707; ρ=1 → 0.5 (no benefit). 10 uncorrelated SR-0.5 → $0.5\\sqrt{10}\\approx1.58$.\n- Positive common ρ leaves a **floor** $\\rho\\sigma^2$ as $n\\to\\infty$. Valid equicorrelation needs $\\rho\\ge-1/(n-1)$.\n- Averaging Sharpes or adding σ's is wrong — use covariance.\n\n### Connections\n- **Leads to:** [[minimum-variance-portfolio]], [[mean-variance-optimization]], [[risk-contribution]].\n- **Correlation as a traded risk:** [[worst-of-correlation]].\n\n<a id=\"minimum-variance-portfolio\"><\/a>\n\n## Minimum-Variance Portfolio (2-asset & GMV)\n<!-- section: minimum-variance-portfolio | prerequisites: [portfolio-variance-diversification] | related: [mean-variance-optimization, risk-budgeting] | tags: [gmv, optimisation] -->\n\n$$w_1^*=\\frac{\\sigma_2^2-\\rho\\sigma_1\\sigma_2}{\\sigma_1^2+\\sigma_2^2-2\\rho\\sigma_1\\sigma_2},\\qquad w_{GMV}=\\frac{\\Sigma^{-1}\\mathbf 1}{\\mathbf 1^\\top\\Sigma^{-1}\\mathbf 1},\\qquad \\sigma^2_{GMV}=\\frac{1}{\\mathbf 1^\\top\\Sigma^{-1}\\mathbf 1}$$\n\n**Variables:**\n\n- $\\sigma_1,\\sigma_2$ vols\n- $\\rho$ correlation\n- $\\Sigma$ covariance (positive definite)\n- $\\mathbf 1$ vector of ones\n\n- Uncorrelated 10% / 20% → 0.8 / 0.2; 10% / 30% → 0.9 / 0.1: **inverse-variance**, not inverse-vol.\n- Uses no expected returns. Long-only: clip to [0,1] (convex problem).\n\n<a id=\"mean-variance-optimization\"><\/a>\n\n## Mean–Variance Optimisation & Tangency Portfolio\n<!-- section: mean-variance-optimization | prerequisites: [minimum-variance-portfolio] | related: [marginal-sharpe-improvement, risk-budgeting, ridge-regression, eigen-svd-psd] | tags: [markowitz, tangency, max-sharpe, estimation-error] -->\n\n$$\\max_w\\ w^\\top\\mu-\\tfrac\\gamma2w^\\top\\Sigma w\\ \\Rightarrow\\ w^*=\\tfrac1\\gamma\\Sigma^{-1}\\mu,\\qquad SR_{max}=\\sqrt{\\mu^\\top\\Sigma^{-1}\\mu},\\qquad w_T=\\frac{\\Sigma^{-1}\\mu}{\\mathbf 1^\\top\\Sigma^{-1}\\mu}$$\n\n**Variables:**\n\n- $\\mu$ expected **excess** returns\n- $\\Sigma$ covariance\n- $\\gamma$ risk aversion\n- $w_T$ fully invested tangency portfolio (needs $\\mathbf 1^\\top\\Sigma^{-1}\\mu>0$)\n\n### Why optimised portfolios fail\n- μ is noisy, Σ unstable; $\\Sigma^{-1}$ **amplifies errors** in small-eigenvalue directions ([[eigen-svd-psd]]) → extreme weights, turnover.\n- Fixes: shrink means/covariance (cf. [[ridge-regression]]), constraints, turnover penalties, compare with equal-weight / min-var baselines, or skip μ entirely via [[risk-budgeting]].", "summary": "", "topic": "", "sections": ["portfolio-variance-diversification", "minimum-variance-portfolio", "mean-variance-optimization"], "degree": 5}, {"id": "probability-rules-counting", "title": "Probability Rules & Counting", "type": "concept", "domain": "prob-stats", "tags": ["counting", "complement", "inclusion-exclusion"], "path": "topics/probability-bayes.md", "content": "<a id=\"probability-rules-counting\"><\/a>\n\n## Probability Rules & Counting\n<!-- section: probability-rules-counting | prerequisites: [] | related: [conditional-probability-bayes, expectation-linearity-indicators] | tags: [counting, complement, inclusion-exclusion] -->\n\n### Formulas\n$$P(A\\cup B)=P(A)+P(B)-P(A\\cap B),\\qquad P(A^c)=1-P(A)$$\n$$P(n,k)=\\frac{n!}{(n-k)!},\\qquad \\binom{n}{k}=\\frac{n!}{k!\\,(n-k)!}$$\n$$P(\\text{at least one})=1-(1-p)^n$$\n\n**Variables:**\n\n- $A,B$ events\n- $n$ items / trials\n- $k$ items chosen\n- $p$ per-trial probability (independent trials)\n\n### Key points\n- **Mutually exclusive ≠ independent.** Two exclusive events with positive probability are *dependent* (one rules out the other).\n- Sampling **with** replacement → independent draws; **without** → dependent. E.g. two aces without replacement: $\\frac{4}{52}\\cdot\\frac{3}{51}=\\frac{1}{221}$.\n- At least one six in four rolls: $1-(5/6)^4\\approx 0.5177$.\n- Before using a ratio of counts, check the elementary outcomes are **equally likely**.\n\n### Connections\n- **Used by:** [[conditional-probability-bayes]] — conditioning is \"restrict the sample space, renormalise\".\n- **Used by:** [[expectation-linearity-indicators]] — indicator tricks often replace hard counting.", "summary": "<a id=\"probability-rules-counting\"><\/a>", "topic": "probability-bayes", "degree": 7}, {"id": "conditional-probability-bayes", "title": "Conditional Probability & Bayes' Theorem", "type": "concept", "domain": "prob-stats", "tags": ["bayes", "base-rate", "independence"], "path": "topics/probability-bayes.md", "content": "<a id=\"conditional-probability-bayes\"><\/a>\n\n## Conditional Probability & Bayes' Theorem\n<!-- section: conditional-probability-bayes | prerequisites: [probability-rules-counting] | related: [beta-bernoulli-conjugacy, total-expectation-variance, maximum-likelihood, hypothesis-testing] | tags: [bayes, base-rate, independence] -->\n\n### Formulas\n$$P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)},\\qquad P(D)=\\sum_j P(D\\mid H_j)P(H_j)$$\n$$P(H_i\\mid D)=\\frac{P(D\\mid H_i)P(H_i)}{\\sum_j P(D\\mid H_j)P(H_j)},\\qquad \\frac{P(H_1\\mid D)}{P(H_0\\mid D)}=\\frac{P(H_1)}{P(H_0)}\\cdot\\frac{P(D\\mid H_1)}{P(D\\mid H_0)}$$\n\n**Variables:**\n\n- $H_i$ disjoint hypotheses covering all cases\n- $D$ observed data\n- $P(H_i)$ prior\n- $P(D\\mid H_i)$ likelihood\n- $P(D)$ evidence (normaliser)\n- $P(H_i\\mid D)$ posterior\n\n### Worked examples\n- **Signal & base rate:** favourable state 10%; signal fires 80% when favourable, 20% otherwise → $P(F\\mid S)=\\frac{0.08}{0.08+0.18}=4/13\\approx30.8\\%$. Rare states make even good detectors imprecise.\n- **Selected coin:** fair coin A or coin B ($p=3/4$), each w.p. 1/2; see HHH → $P(B\\mid HHH)=27/35$; next-head prob $=\\frac{27}{35}\\cdot\\frac34+\\frac{8}{35}\\cdot\\frac12=97/140$.\n\n### Key points\n- **Conditional independence ≠ independence.** Tosses of the selected coin are independent *given the coin*, but unconditionally correlated because they share the hidden coin ($\\mathrm{Cov}=\\mathrm{Var}(\\Theta)=1/64$). See [[total-expectation-variance]].\n- Predict with the **posterior**, not the prior.\n\n### Connections\n- **Builds on:** [[probability-rules-counting]].\n- **Extends to:** [[beta-bernoulli-conjugacy]] — continuous-parameter version.\n- **Contrast with:** [[maximum-likelihood]] (no prior) and [[hypothesis-testing]] (a p-value is $P(\\text{data}\\mid H_0)$-type, not $P(H_0\\mid\\text{data})$).\n- **Finance link:** signal precision vs base rate → [[backtest-pitfalls]].", "summary": "<a id=\"conditional-probability-bayes\"><\/a>", "topic": "probability-bayes", "degree": 14}, {"id": "beta-bernoulli-conjugacy", "title": "Beta–Bernoulli Conjugacy", "type": "concept", "domain": "prob-stats", "tags": ["bayes", "conjugate-prior", "shrinkage"], "path": "topics/probability-bayes.md", "content": "<a id=\"beta-bernoulli-conjugacy\"><\/a>\n\n## Beta–Bernoulli Conjugacy\n<!-- section: beta-bernoulli-conjugacy | prerequisites: [conditional-probability-bayes, distributions-reference] | related: [maximum-likelihood, ridge-regression] | tags: [bayes, conjugate-prior, shrinkage] -->\n\n### Formulas\n$$\\theta\\sim\\mathrm{Beta}(a,b)\\ \\Rightarrow\\ \\theta\\mid D\\sim\\mathrm{Beta}(a+h,\\ b+t),\\qquad P(H_{\\text{next}}\\mid D)=\\frac{a+h}{a+b+h+t}$$\n$$\\frac{a+h}{a+b+n}=\\underbrace{\\frac{a+b}{a+b+n}}_{\\text{prior weight}}\\frac{a}{a+b}+\\underbrace{\\frac{n}{a+b+n}}_{\\text{data weight}}\\frac{h}{n}$$\n\n**Variables:**\n\n- $\\theta$ unknown head probability\n- $a,b>0$ prior pseudo-counts\n- $h$ heads, $t$ tails, $n=h+t$\n\n### Key points\n- Uniform prior = Beta(1,1). After HHH: Beta(4,1), predictive $4/5$ (Laplace's rule of succession).\n- Posterior mean is a **weighted average** of prior mean and MLE $h/n$ → prior washes out as $n$ grows.\n- Different model from \"choose between two specific coins\" (discrete prior).\n\n### Connections\n- **Builds on:** [[conditional-probability-bayes]], [[distributions-reference]] (Beta pdf/mean).\n- **Contrast with:** [[maximum-likelihood]] — MLE $h/n$, MAP (mode), posterior mean all differ.\n- **Same idea as:** [[ridge-regression]] — Gaussian prior ⇒ shrinkage toward prior mean.", "summary": "<a id=\"beta-bernoulli-conjugacy\"><\/a>", "topic": "probability-bayes", "degree": 8}, {"id": "probability-bayes", "title": "Probability Basics & Bayes", "type": "topic", "domain": "prob-stats", "tags": [], "path": "topics/probability-bayes.md", "content": "# Probability Basics & Bayes\n\n**Sections:** [[probability-rules-counting]] · [[conditional-probability-bayes]] · [[beta-bernoulli-conjugacy]]\n\n<a id=\"probability-rules-counting\"><\/a>\n\n## Probability Rules & Counting\n<!-- section: probability-rules-counting | prerequisites: [] | related: [conditional-probability-bayes, expectation-linearity-indicators] | tags: [counting, complement, inclusion-exclusion] -->\n\n### Formulas\n$$P(A\\cup B)=P(A)+P(B)-P(A\\cap B),\\qquad P(A^c)=1-P(A)$$\n$$P(n,k)=\\frac{n!}{(n-k)!},\\qquad \\binom{n}{k}=\\frac{n!}{k!\\,(n-k)!}$$\n$$P(\\text{at least one})=1-(1-p)^n$$\n\n**Variables:**\n\n- $A,B$ events\n- $n$ items / trials\n- $k$ items chosen\n- $p$ per-trial probability (independent trials)\n\n### Key points\n- **Mutually exclusive ≠ independent.** Two exclusive events with positive probability are *dependent* (one rules out the other).\n- Sampling **with** replacement → independent draws; **without** → dependent. E.g. two aces without replacement: $\\frac{4}{52}\\cdot\\frac{3}{51}=\\frac{1}{221}$.\n- At least one six in four rolls: $1-(5/6)^4\\approx 0.5177$.\n- Before using a ratio of counts, check the elementary outcomes are **equally likely**.\n\n### Connections\n- **Used by:** [[conditional-probability-bayes]] — conditioning is \"restrict the sample space, renormalise\".\n- **Used by:** [[expectation-linearity-indicators]] — indicator tricks often replace hard counting.\n\n<a id=\"conditional-probability-bayes\"><\/a>\n\n## Conditional Probability & Bayes' Theorem\n<!-- section: conditional-probability-bayes | prerequisites: [probability-rules-counting] | related: [beta-bernoulli-conjugacy, total-expectation-variance, maximum-likelihood, hypothesis-testing] | tags: [bayes, base-rate, independence] -->\n\n### Formulas\n$$P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)},\\qquad P(D)=\\sum_j P(D\\mid H_j)P(H_j)$$\n$$P(H_i\\mid D)=\\frac{P(D\\mid H_i)P(H_i)}{\\sum_j P(D\\mid H_j)P(H_j)},\\qquad \\frac{P(H_1\\mid D)}{P(H_0\\mid D)}=\\frac{P(H_1)}{P(H_0)}\\cdot\\frac{P(D\\mid H_1)}{P(D\\mid H_0)}$$\n\n**Variables:**\n\n- $H_i$ disjoint hypotheses covering all cases\n- $D$ observed data\n- $P(H_i)$ prior\n- $P(D\\mid H_i)$ likelihood\n- $P(D)$ evidence (normaliser)\n- $P(H_i\\mid D)$ posterior\n\n### Worked examples\n- **Signal & base rate:** favourable state 10%; signal fires 80% when favourable, 20% otherwise → $P(F\\mid S)=\\frac{0.08}{0.08+0.18}=4/13\\approx30.8\\%$. Rare states make even good detectors imprecise.\n- **Selected coin:** fair coin A or coin B ($p=3/4$), each w.p. 1/2; see HHH → $P(B\\mid HHH)=27/35$; next-head prob $=\\frac{27}{35}\\cdot\\frac34+\\frac{8}{35}\\cdot\\frac12=97/140$.\n\n### Key points\n- **Conditional independence ≠ independence.** Tosses of the selected coin are independent *given the coin*, but unconditionally correlated because they share the hidden coin ($\\mathrm{Cov}=\\mathrm{Var}(\\Theta)=1/64$). See [[total-expectation-variance]].\n- Predict with the **posterior**, not the prior.\n\n### Connections\n- **Builds on:** [[probability-rules-counting]].\n- **Extends to:** [[beta-bernoulli-conjugacy]] — continuous-parameter version.\n- **Contrast with:** [[maximum-likelihood]] (no prior) and [[hypothesis-testing]] (a p-value is $P(\\text{data}\\mid H_0)$-type, not $P(H_0\\mid\\text{data})$).\n- **Finance link:** signal precision vs base rate → [[backtest-pitfalls]].\n\n<a id=\"beta-bernoulli-conjugacy\"><\/a>\n\n## Beta–Bernoulli Conjugacy\n<!-- section: beta-bernoulli-conjugacy | prerequisites: [conditional-probability-bayes, distributions-reference] | related: [maximum-likelihood, ridge-regression] | tags: [bayes, conjugate-prior, shrinkage] -->\n\n### Formulas\n$$\\theta\\sim\\mathrm{Beta}(a,b)\\ \\Rightarrow\\ \\theta\\mid D\\sim\\mathrm{Beta}(a+h,\\ b+t),\\qquad P(H_{\\text{next}}\\mid D)=\\frac{a+h}{a+b+h+t}$$\n$$\\frac{a+h}{a+b+n}=\\underbrace{\\frac{a+b}{a+b+n}}_{\\text{prior weight}}\\frac{a}{a+b}+\\underbrace{\\frac{n}{a+b+n}}_{\\text{data weight}}\\frac{h}{n}$$\n\n**Variables:**\n\n- $\\theta$ unknown head probability\n- $a,b>0$ prior pseudo-counts\n- $h$ heads, $t$ tails, $n=h+t$\n\n### Key points\n- Uniform prior = Beta(1,1). After HHH: Beta(4,1), predictive $4/5$ (Laplace's rule of succession).\n- Posterior mean is a **weighted average** of prior mean and MLE $h/n$ → prior washes out as $n$ grows.\n- Different model from \"choose between two specific coins\" (discrete prior).\n\n### Connections\n- **Builds on:** [[conditional-probability-bayes]], [[distributions-reference]] (Beta pdf/mean).\n- **Contrast with:** [[maximum-likelihood]] — MLE $h/n$, MAP (mode), posterior mean all differ.\n- **Same idea as:** [[ridge-regression]] — Gaussian prior ⇒ shrinkage toward prior mean.", "summary": "", "topic": "", "sections": ["probability-rules-counting", "conditional-probability-bayes", "beta-bernoulli-conjugacy"], "degree": 5}, {"id": "model-release-regression-testing", "title": "Integrating Model-Library Releases (regression harness)", "type": "concept", "domain": "quant-dev", "tags": ["release", "regression-test", "versioning"], "path": "topics/production-coding.md", "content": "<a id=\"model-release-regression-testing\"><\/a>\n\n## Integrating Model-Library Releases (regression harness)\n<!-- section: model-release-regression-testing | prerequisites: [pricing-app-architecture] | related: [price-reconciliation, model-risk-governance, put-call-parity, design-patterns-pricing] | tags: [release, regression-test, versioning] -->\n\n1. Read release notes; classify (new model, parameter change, bug fix, API change).\n2. **Regression harness:** frozen market-data snapshot + representative trades (vanillas, each exotic family, edge cases: near-barrier, short-dated, zero-vol).\n3. Run old vs new; report price & Greek diffs with **per-product tolerances**.\n4. Every diff above tolerance is explained by release notes or escalated to quants.\n5. Update adapters/UI for new models/params.\n6. UAT → trader sign-off on known trades → release with rollback ready.\n7. Keep **model version visible** in the app and saved pricings (audit).\n\n**Invariant checks:** [[put-call-parity]] on European vanillas — a break is a bug.", "summary": "<a id=\"model-release-regression-testing\"><\/a>", "topic": "production-coding", "degree": 9}, {"id": "price-reconciliation", "title": "Price Reconciliation (\"app ≠ risk system\")", "type": "concept", "domain": "quant-dev", "tags": ["debugging", "reconciliation"], "path": "topics/production-coding.md", "content": "<a id=\"price-reconciliation\"><\/a>\n\n## Price Reconciliation (\"app ≠ risk system\")\n<!-- section: price-reconciliation | prerequisites: [pricing-app-architecture] | related: [greeks-conventions-bumping, model-release-regression-testing, forward-pricing, backtest-pitfalls] | tags: [debugging, reconciliation] -->\n\nIsolate before touching model code — diff inputs **field by field**:\n\n1. Same trade terms?\n2. Same market-data snapshot (time, dividends, borrow, surface)?\n3. Same model and model version?\n4. Same conventions (day count, settlement lag, vol by strike vs moneyness, Greek units)?\n5. Same numerical settings (paths, grid)?\n\n**Most breaks are data or conventions, not maths** (forward/dividend issues top the list).\n\n### Connections\n- **Same mindset as:** [[backtest-pitfalls]] (check implementation before theorising).", "summary": "<a id=\"price-reconciliation\"><\/a>", "topic": "production-coding", "degree": 9}, {"id": "floyd-cycle-detection", "title": "Floyd's Cycle Detection (tortoise & hare)", "type": "concept", "domain": "quant-dev", "tags": ["algorithms", "linked-list"], "path": "topics/production-coding.md", "content": "<a id=\"floyd-cycle-detection\"><\/a>\n\n## Floyd's Cycle Detection (tortoise & hare)\n<!-- section: floyd-cycle-detection | prerequisites: [] | related: [] | tags: [algorithms, linked-list] -->\n\n- Slow pointer +1, fast +2; if they meet → cycle.\n- **O(n) time, O(1) space.**\n- Cycle start: reset one pointer to head, move both +1 until they meet.\n- (Glassdoor-reported RBC quant-dev question alongside \"explain basic OO concepts\".)", "summary": "<a id=\"floyd-cycle-detection\"><\/a>", "topic": "production-coding", "degree": 3}, {"id": "production-coding", "title": "Production & Coding", "type": "topic", "domain": "quant-dev", "tags": [], "path": "topics/production-coding.md", "content": "# Production & Coding\n\n**Sections:** [[model-release-regression-testing]] · [[price-reconciliation]] · [[floyd-cycle-detection]]\n\n<a id=\"model-release-regression-testing\"><\/a>\n\n## Integrating Model-Library Releases (regression harness)\n<!-- section: model-release-regression-testing | prerequisites: [pricing-app-architecture] | related: [price-reconciliation, model-risk-governance, put-call-parity, design-patterns-pricing] | tags: [release, regression-test, versioning] -->\n\n1. Read release notes; classify (new model, parameter change, bug fix, API change).\n2. **Regression harness:** frozen market-data snapshot + representative trades (vanillas, each exotic family, edge cases: near-barrier, short-dated, zero-vol).\n3. Run old vs new; report price & Greek diffs with **per-product tolerances**.\n4. Every diff above tolerance is explained by release notes or escalated to quants.\n5. Update adapters/UI for new models/params.\n6. UAT → trader sign-off on known trades → release with rollback ready.\n7. Keep **model version visible** in the app and saved pricings (audit).\n\n**Invariant checks:** [[put-call-parity]] on European vanillas — a break is a bug.\n\n<a id=\"price-reconciliation\"><\/a>\n\n## Price Reconciliation (\"app ≠ risk system\")\n<!-- section: price-reconciliation | prerequisites: [pricing-app-architecture] | related: [greeks-conventions-bumping, model-release-regression-testing, forward-pricing, backtest-pitfalls] | tags: [debugging, reconciliation] -->\n\nIsolate before touching model code — diff inputs **field by field**:\n\n1. Same trade terms?\n2. Same market-data snapshot (time, dividends, borrow, surface)?\n3. Same model and model version?\n4. Same conventions (day count, settlement lag, vol by strike vs moneyness, Greek units)?\n5. Same numerical settings (paths, grid)?\n\n**Most breaks are data or conventions, not maths** (forward/dividend issues top the list).\n\n### Connections\n- **Same mindset as:** [[backtest-pitfalls]] (check implementation before theorising).\n\n<a id=\"floyd-cycle-detection\"><\/a>\n\n## Floyd's Cycle Detection (tortoise & hare)\n<!-- section: floyd-cycle-detection | prerequisites: [] | related: [] | tags: [algorithms, linked-list] -->\n\n- Slow pointer +1, fast +2; if they meet → cycle.\n- **O(n) time, O(1) space.**\n- Cycle start: reset one pointer to head, move both +1 until they meet.\n- (Glassdoor-reported RBC quant-dev question alongside \"explain basic OO concepts\".)", "summary": "", "topic": "", "sections": ["model-release-regression-testing", "price-reconciliation", "floyd-cycle-detection"], "degree": 5}, {"id": "first-step-analysis", "title": "First-Step Analysis (waiting times, stopping)", "type": "concept", "domain": "prob-stats", "tags": ["recursion", "waiting-time", "coupon-collector", "optimal-stopping"], "path": "topics/puzzles-markov.md", "content": "<a id=\"first-step-analysis\"><\/a>\n\n## First-Step Analysis (waiting times, stopping)\n<!-- section: first-step-analysis | prerequisites: [expectation-linearity-indicators] | related: [markov-chains, exponential-poisson-process, american-early-exercise] | tags: [recursion, waiting-time, coupon-collector, optimal-stopping] -->\n\n### Formulas\n$$E=1+(1-p)E\\Rightarrow E=\\tfrac1p\\qquad\\text{(first success)}$$\nTwo consecutive heads (fair coin): $E_0=1+\\tfrac12E_0+\\tfrac12E_1,\\ E_1=1+\\tfrac12E_0\\Rightarrow E_0=6$; general $E_0=\\frac{1+p}{p^2}$.\n\n$$E[T_{\\text{coupon}}]=n\\sum_{j=1}^n\\frac1j=nH_n$$\n\n**Variables:**\n\n- $p$ success/heads probability\n- $E_k$ expected remaining trials from state $k$\n- $n$ coupon types\n- $H_n$ harmonic number\n\n### More drills\n- Roll until first six, expected **sum** incl. the six: $m=3.5+\\tfrac56m\\Rightarrow m=21$.\n- One optional re-roll: keep 4–6, re-roll 1–3 → value $4.25$ (backward induction with continuation value 3.5).\n\n### Key points\n- Trap: HH has prob 1/4 per block but overlapping windows aren't independent — not geometric.\n\n### Connections\n- **Generalises to:** [[markov-chains]] (absorbing chains).\n- **Same logic as:** [[american-early-exercise]] — exercise if payoff ≥ continuation value (backward induction).", "summary": "<a id=\"first-step-analysis\"><\/a>", "topic": "puzzles-markov", "degree": 13}, {"id": "markov-chains", "title": "Markov Chains & Stationary Distributions", "type": "concept", "domain": "prob-stats", "tags": ["markov", "stationary", "regime"], "path": "topics/puzzles-markov.md", "content": "<a id=\"markov-chains\"><\/a>\n\n## Markov Chains & Stationary Distributions\n<!-- section: markov-chains | prerequisites: [first-step-analysis] | related: [stationarity-ar1] | tags: [markov, stationary, regime] -->\n\n### Formulas\n$$P(X_{t+1}=j\\mid X_t=i,\\dots)=P_{ij},\\qquad \\pi=\\pi P,\\ \\ \\sum_i\\pi_i=1$$\nTwo states (A→B w.p. $a$, B→A w.p. $b$): $\\pi_A=\\frac{b}{a+b},\\ \\pi_B=\\frac{a}{a+b}$.\n\n**Variables:**\n\n- $P$ transition matrix (rows sum to 1)\n- $\\pi$ stationary row vector\n\n### Key points\n- Finite + irreducible ⇒ unique $\\pi$; + aperiodic ⇒ convergence from any start.\n- Regime-switching intuition in finance (calm/stressed).\n\n### Connections\n- **Builds on:** [[first-step-analysis]]. **Contrast:** [[stationarity-ar1]] (continuous-state stationarity).", "summary": "<a id=\"markov-chains\"><\/a>", "topic": "puzzles-markov", "degree": 5}, {"id": "order-statistics", "title": "Order Statistics of Uniforms", "type": "concept", "domain": "prob-stats", "tags": ["max", "min", "uniform"], "path": "topics/puzzles-markov.md", "content": "<a id=\"order-statistics\"><\/a>\n\n## Order Statistics of Uniforms\n<!-- section: order-statistics | prerequisites: [distributions-reference] | related: [expectation-linearity-indicators] | tags: [max, min, uniform] -->\n\n### Formulas\n$$M=\\max_i U_i:\\ P(M\\le x)=x^n,\\ f_M(x)=nx^{n-1},\\ E[M]=\\frac{n}{n+1};\\qquad E[U_{(k)}]=\\frac{k}{n+1}$$\n\n**Variables:**\n\n- $U_i\\sim U(0,1)$ iid, $i=1..n$\n- $U_{(k)}$ the $k$-th smallest\n\n### Key points\n- $E[\\max(X,Y)]=2/3$ for two uniforms; $P(X+Y<1)=1/2$ (triangle area).\n- Trick: CDF of the max = product of CDFs (independence).\n\n### Connections\n- **Builds on:** [[distributions-reference]]. Related interview family: [[first-step-analysis]].", "summary": "<a id=\"order-statistics\"><\/a>", "topic": "puzzles-markov", "degree": 6}, {"id": "puzzles-markov", "title": "Puzzles & Markov Chains", "type": "topic", "domain": "prob-stats", "tags": [], "path": "topics/puzzles-markov.md", "content": "# Puzzles & Markov Chains\n\n**Sections:** [[first-step-analysis]] · [[markov-chains]] · [[order-statistics]]\n\n<a id=\"first-step-analysis\"><\/a>\n\n## First-Step Analysis (waiting times, stopping)\n<!-- section: first-step-analysis | prerequisites: [expectation-linearity-indicators] | related: [markov-chains, exponential-poisson-process, american-early-exercise] | tags: [recursion, waiting-time, coupon-collector, optimal-stopping] -->\n\n### Formulas\n$$E=1+(1-p)E\\Rightarrow E=\\tfrac1p\\qquad\\text{(first success)}$$\nTwo consecutive heads (fair coin): $E_0=1+\\tfrac12E_0+\\tfrac12E_1,\\ E_1=1+\\tfrac12E_0\\Rightarrow E_0=6$; general $E_0=\\frac{1+p}{p^2}$.\n\n$$E[T_{\\text{coupon}}]=n\\sum_{j=1}^n\\frac1j=nH_n$$\n\n**Variables:**\n\n- $p$ success/heads probability\n- $E_k$ expected remaining trials from state $k$\n- $n$ coupon types\n- $H_n$ harmonic number\n\n### More drills\n- Roll until first six, expected **sum** incl. the six: $m=3.5+\\tfrac56m\\Rightarrow m=21$.\n- One optional re-roll: keep 4–6, re-roll 1–3 → value $4.25$ (backward induction with continuation value 3.5).\n\n### Key points\n- Trap: HH has prob 1/4 per block but overlapping windows aren't independent — not geometric.\n\n### Connections\n- **Generalises to:** [[markov-chains]] (absorbing chains).\n- **Same logic as:** [[american-early-exercise]] — exercise if payoff ≥ continuation value (backward induction).\n\n<a id=\"markov-chains\"><\/a>\n\n## Markov Chains & Stationary Distributions\n<!-- section: markov-chains | prerequisites: [first-step-analysis] | related: [stationarity-ar1] | tags: [markov, stationary, regime] -->\n\n### Formulas\n$$P(X_{t+1}=j\\mid X_t=i,\\dots)=P_{ij},\\qquad \\pi=\\pi P,\\ \\ \\sum_i\\pi_i=1$$\nTwo states (A→B w.p. $a$, B→A w.p. $b$): $\\pi_A=\\frac{b}{a+b},\\ \\pi_B=\\frac{a}{a+b}$.\n\n**Variables:**\n\n- $P$ transition matrix (rows sum to 1)\n- $\\pi$ stationary row vector\n\n### Key points\n- Finite + irreducible ⇒ unique $\\pi$; + aperiodic ⇒ convergence from any start.\n- Regime-switching intuition in finance (calm/stressed).\n\n### Connections\n- **Builds on:** [[first-step-analysis]]. **Contrast:** [[stationarity-ar1]] (continuous-state stationarity).\n\n<a id=\"order-statistics\"><\/a>\n\n## Order Statistics of Uniforms\n<!-- section: order-statistics | prerequisites: [distributions-reference] | related: [expectation-linearity-indicators] | tags: [max, min, uniform] -->\n\n### Formulas\n$$M=\\max_i U_i:\\ P(M\\le x)=x^n,\\ f_M(x)=nx^{n-1},\\ E[M]=\\frac{n}{n+1};\\qquad E[U_{(k)}]=\\frac{k}{n+1}$$\n\n**Variables:**\n\n- $U_i\\sim U(0,1)$ iid, $i=1..n$\n- $U_{(k)}$ the $k$-th smallest\n\n### Key points\n- $E[\\max(X,Y)]=2/3$ for two uniforms; $P(X+Y<1)=1/2$ (triangle area).\n- Trick: CDF of the max = product of CDFs (independence).\n\n### Connections\n- **Builds on:** [[distributions-reference]]. Related interview family: [[first-step-analysis]].", "summary": "", "topic": "", "sections": ["first-step-analysis", "markov-chains", "order-statistics"], "degree": 5}, {"id": "risk-contribution", "title": "Marginal & Component Risk Contribution", "type": "concept", "domain": "portfolio-construction", "tags": ["euler", "risk-decomposition"], "path": "topics/risk-budgeting-position-sizing.md", "content": "<a id=\"risk-contribution\"><\/a>\n\n## Marginal & Component Risk Contribution\n<!-- section: risk-contribution | prerequisites: [portfolio-variance-diversification] | related: [risk-budgeting, marginal-sharpe-improvement] | tags: [euler, risk-decomposition] -->\n\n$$\\frac{\\partial\\sigma_p}{\\partial w_i}=\\frac{(\\Sigma w)_i}{\\sigma_p},\\qquad RC_i=w_i\\frac{(\\Sigma w)_i}{\\sigma_p},\\qquad \\sum_iRC_i=\\sigma_p$$\n\n**Variables:**\n\n- $w$ weights\n- $\\Sigma$ covariance\n- $\\sigma_p=\\sqrt{w^\\top\\Sigma w}$\n- $RC_i$ component contribution (Euler decomposition, since $\\sigma_p$ is homogeneous of degree 1)\n\nLow standalone vol ≠ low marginal risk (correlation matters).\n\n### Connections\n- **Inverted to solve for weights in:** [[risk-budgeting]].", "summary": "<a id=\"risk-contribution\"><\/a>", "topic": "risk-budgeting-position-sizing", "degree": 9}, {"id": "risk-budgeting", "title": "Risk Budgeting (Bruder & Roncalli 2012)", "type": "concept", "domain": "portfolio-construction", "tags": ["risk-parity", "erc", "risk-budget"], "path": "topics/risk-budgeting-position-sizing.md", "content": "<a id=\"risk-budgeting\"><\/a>\n\n## Risk Budgeting (Bruder & Roncalli 2012)\n<!-- section: risk-budgeting | prerequisites: [risk-contribution] | related: [signal-to-weight, mean-variance-optimization, minimum-variance-portfolio] | tags: [risk-parity, erc, risk-budget] -->\n\n$$RC_i(w)=w_i\\frac{(\\Sigma w)_i}{\\sigma(w)}=TE_i\\cdot\\sigma(w)$$\n\n**ρ = 0 closed form:** $w_i\\propto\\sqrt{TE_i}/\\sigma_i$.\n\n**Variables:**\n\n- $w_i$ weight of asset $i$\n- $\\Sigma$ covariance\n- $\\sigma(w)$ portfolio vol\n- $TE_i$ risk budget of asset $i$ (budgets sum to 1)\n- $\\sigma_i$ asset vol\n\n### Key points\n- The paper takes $TE_i$ as given; [[signal-to-weight]] shows how to feed a signal into $TE_i$.\n\n**References:**\n\n- Bruder, B. & Roncalli, T. (2012), *Managing Risk Exposures Using the Risk Budgeting Approach*.\n\n### Connections\n- **Builds on:** [[risk-contribution]] (turned around to solve for $w_i$).\n- **Fed by:** [[signal-to-weight]].", "summary": "<a id=\"risk-budgeting\"><\/a>", "topic": "risk-budgeting-position-sizing", "degree": 10}, {"id": "signal-to-weight", "title": "Signal-to-Weight Bridge (score → risk budget → weight)", "type": "concept", "domain": "portfolio-construction", "tags": ["position-sizing", "risk-budget", "vol-scaling"], "path": "topics/risk-budgeting-position-sizing.md", "content": "<a id=\"signal-to-weight\"><\/a>\n\n## Signal-to-Weight Bridge (score → risk budget → weight)\n<!-- section: signal-to-weight | prerequisites: [time-series-momentum, risk-budgeting] | related: [risk-contribution, portfolio-variance-diversification] | tags: [position-sizing, risk-budget, vol-scaling] -->\n\n$$\\textbf{exact: } TE_i\\propto s_i^2,\\quad w_i=\\mathrm{sign}(s_i)\\frac{\\sqrt{TE_i}}{\\sigma_i}\\propto\\frac{s_i}{\\sigma_i}\\qquad\\qquad \\textbf{shortcut: } w_i=s_i\\times\\frac{TE_i}{\\sigma_i}$$\n\n**Variables:**\n\n- $s_i$ clipped signal of asset $i$\n- $TE_i$ risk budget\n- $\\sigma_i$ asset vol\n- $w_i$ weight\n\n### Exact vs shortcut\n- **Exact** matches Bruder–Roncalli's ρ = 0 closed form ($w\\propto\\sqrt{TE}/\\sigma$). Needs $TE\\ge0$, hence $s^2$; `sign` restores direction. Risk used never exceeds the budget.\n- **Shortcut** = (weight per unit conviction $TE_i/\\sigma_i$) × conviction $s_i$. Risk used $w_i\\sigma_i=s_iTE_i$ scales **linearly** with $s$: at full clip ($|s|=2$) you spend $2\\times TE_i$. So $TE_i$ means \"risk per 1σ of conviction\", not a hard cap.\n\n### Connections\n- **Builds on:** [[time-series-momentum]] (the score), [[risk-budgeting]] (the budget→weight map).", "summary": "<a id=\"signal-to-weight\"><\/a>", "topic": "risk-budgeting-position-sizing", "degree": 8}, {"id": "risk-budgeting-position-sizing", "title": "Risk Budgeting & Position Sizing", "type": "topic", "domain": "portfolio-construction", "tags": [], "path": "topics/risk-budgeting-position-sizing.md", "content": "# Risk Budgeting & Position Sizing\n\n**Sections:** [[risk-contribution]] · [[risk-budgeting]] · [[signal-to-weight]]\n\n<a id=\"risk-contribution\"><\/a>\n\n## Marginal & Component Risk Contribution\n<!-- section: risk-contribution | prerequisites: [portfolio-variance-diversification] | related: [risk-budgeting, marginal-sharpe-improvement] | tags: [euler, risk-decomposition] -->\n\n$$\\frac{\\partial\\sigma_p}{\\partial w_i}=\\frac{(\\Sigma w)_i}{\\sigma_p},\\qquad RC_i=w_i\\frac{(\\Sigma w)_i}{\\sigma_p},\\qquad \\sum_iRC_i=\\sigma_p$$\n\n**Variables:**\n\n- $w$ weights\n- $\\Sigma$ covariance\n- $\\sigma_p=\\sqrt{w^\\top\\Sigma w}$\n- $RC_i$ component contribution (Euler decomposition, since $\\sigma_p$ is homogeneous of degree 1)\n\nLow standalone vol ≠ low marginal risk (correlation matters).\n\n### Connections\n- **Inverted to solve for weights in:** [[risk-budgeting]].\n\n<a id=\"risk-budgeting\"><\/a>\n\n## Risk Budgeting (Bruder & Roncalli 2012)\n<!-- section: risk-budgeting | prerequisites: [risk-contribution] | related: [signal-to-weight, mean-variance-optimization, minimum-variance-portfolio] | tags: [risk-parity, erc, risk-budget] -->\n\n$$RC_i(w)=w_i\\frac{(\\Sigma w)_i}{\\sigma(w)}=TE_i\\cdot\\sigma(w)$$\n\n**ρ = 0 closed form:** $w_i\\propto\\sqrt{TE_i}/\\sigma_i$.\n\n**Variables:**\n\n- $w_i$ weight of asset $i$\n- $\\Sigma$ covariance\n- $\\sigma(w)$ portfolio vol\n- $TE_i$ risk budget of asset $i$ (budgets sum to 1)\n- $\\sigma_i$ asset vol\n\n### Key points\n- The paper takes $TE_i$ as given; [[signal-to-weight]] shows how to feed a signal into $TE_i$.\n\n**References:**\n\n- Bruder, B. & Roncalli, T. (2012), *Managing Risk Exposures Using the Risk Budgeting Approach*.\n\n### Connections\n- **Builds on:** [[risk-contribution]] (turned around to solve for $w_i$).\n- **Fed by:** [[signal-to-weight]].\n\n<a id=\"signal-to-weight\"><\/a>\n\n## Signal-to-Weight Bridge (score → risk budget → weight)\n<!-- section: signal-to-weight | prerequisites: [time-series-momentum, risk-budgeting] | related: [risk-contribution, portfolio-variance-diversification] | tags: [position-sizing, risk-budget, vol-scaling] -->\n\n$$\\textbf{exact: } TE_i\\propto s_i^2,\\quad w_i=\\mathrm{sign}(s_i)\\frac{\\sqrt{TE_i}}{\\sigma_i}\\propto\\frac{s_i}{\\sigma_i}\\qquad\\qquad \\textbf{shortcut: } w_i=s_i\\times\\frac{TE_i}{\\sigma_i}$$\n\n**Variables:**\n\n- $s_i$ clipped signal of asset $i$\n- $TE_i$ risk budget\n- $\\sigma_i$ asset vol\n- $w_i$ weight\n\n### Exact vs shortcut\n- **Exact** matches Bruder–Roncalli's ρ = 0 closed form ($w\\propto\\sqrt{TE}/\\sigma$). Needs $TE\\ge0$, hence $s^2$; `sign` restores direction. Risk used never exceeds the budget.\n- **Shortcut** = (weight per unit conviction $TE_i/\\sigma_i$) × conviction $s_i$. Risk used $w_i\\sigma_i=s_iTE_i$ scales **linearly** with $s$: at full clip ($|s|=2$) you spend $2\\times TE_i$. So $TE_i$ means \"risk per 1σ of conviction\", not a hard cap.\n\n### Connections\n- **Builds on:** [[time-series-momentum]] (the score), [[risk-budgeting]] (the budget→weight map).", "summary": "", "topic": "", "sections": ["risk-contribution", "risk-budgeting", "signal-to-weight"], "degree": 6}, {"id": "scenario-risk-grids", "title": "Scenario & Risk Grids", "type": "concept", "domain": "risk-management", "tags": ["scenarios", "stress"], "path": "topics/risk-control-governance.md", "content": "<a id=\"scenario-risk-grids\"><\/a>\n\n## Scenario & Risk Grids\n<!-- section: scenario-risk-grids | prerequisites: [greeks] | related: [dotnet-concurrency-wpf, pricing-app-architecture] | tags: [scenarios, stress] -->\n\n- Spot ladder (±1%, ±5%, ±20%)\n- Vol bumps (parallel, skew tilt, term structure)\n- Spot × vol grid\n- Time roll (tomorrow, next week)\n- Dividend & borrow bumps\n- Correlation bumps for baskets\n\nFull revaluation captures non-linearity that [[greeks]] miss.", "summary": "<a id=\"scenario-risk-grids\"><\/a>", "topic": "risk-control-governance", "degree": 7}, {"id": "risk-measures", "title": "Drawdown, VaR, Expected Shortfall, Information Ratio", "type": "concept", "domain": "risk-management", "tags": ["var", "es", "drawdown"], "path": "topics/risk-control-governance.md", "content": "<a id=\"risk-measures\"><\/a>\n\n## Drawdown, VaR, Expected Shortfall, Information Ratio\n<!-- section: risk-measures | prerequisites: [sharpe-ratio] | related: [win-rate-expectancy] | tags: [var, es, drawdown] -->\n\n$$MDD=\\max_t\\Big(1-\\frac{W_t}{\\max_{s\\le t}W_s}\\Big),\\quad VaR_\\alpha=\\alpha\\text{-quantile of }L,\\quad ES_\\alpha=E[L\\mid L\\ge VaR_\\alpha],\\quad IR=\\frac{E[R-R_b]}{\\sigma(R-R_b)}$$\n\n**Variables:**\n\n- $W_t$ wealth\n- $L$ loss\n- $\\alpha$ confidence level\n- $R_b$ benchmark return (denominator = tracking error)\n\nSharpe only summarises mean & std; tails need these.", "summary": "<a id=\"risk-measures\"><\/a>", "topic": "risk-control-governance", "degree": 5}, {"id": "model-risk-governance", "title": "Model Risk, Reserves & Governance", "type": "concept", "domain": "risk-management", "tags": ["model-risk", "osfi-e23", "ipv", "reserves"], "path": "topics/risk-control-governance.md", "content": "<a id=\"model-risk-governance\"><\/a>\n\n## Model Risk, Reserves & Governance\n<!-- section: model-risk-governance | prerequisites: [pricing-app-architecture] | related: [model-release-regression-testing, call-spread-overhedge, autocallables, vol-surface-construction] | tags: [model-risk, osfi-e23, ipv, reserves] -->\n\n**Model risk:** wrong model, wrong implementation, or use outside validated range.\n\n- Controls: only approved models per product; version tracking; input validation & warnings (arbitrage in surface, extrapolated vol); audit log; alignment with validation (Canada: **OSFI Guideline E-23**).\n- **Reserves:** model reserve, barrier/digital overhedges, correlation and dividend reserves.\n- **Independent price verification:** vs consensus (S&P Global **Totem**: 150+ contributors, 10th/90th percentiles for prudent valuation); daily P&L explain.", "summary": "<a id=\"model-risk-governance\"><\/a>", "topic": "risk-control-governance", "degree": 9}, {"id": "risk-control-governance", "title": "Risk Control & Governance", "type": "topic", "domain": "risk-management", "tags": [], "path": "topics/risk-control-governance.md", "content": "# Risk Control & Governance\n\n**Sections:** [[scenario-risk-grids]] · [[risk-measures]] · [[model-risk-governance]]\n\n<a id=\"scenario-risk-grids\"><\/a>\n\n## Scenario & Risk Grids\n<!-- section: scenario-risk-grids | prerequisites: [greeks] | related: [dotnet-concurrency-wpf, pricing-app-architecture] | tags: [scenarios, stress] -->\n\n- Spot ladder (±1%, ±5%, ±20%)\n- Vol bumps (parallel, skew tilt, term structure)\n- Spot × vol grid\n- Time roll (tomorrow, next week)\n- Dividend & borrow bumps\n- Correlation bumps for baskets\n\nFull revaluation captures non-linearity that [[greeks]] miss.\n\n<a id=\"risk-measures\"><\/a>\n\n## Drawdown, VaR, Expected Shortfall, Information Ratio\n<!-- section: risk-measures | prerequisites: [sharpe-ratio] | related: [win-rate-expectancy] | tags: [var, es, drawdown] -->\n\n$$MDD=\\max_t\\Big(1-\\frac{W_t}{\\max_{s\\le t}W_s}\\Big),\\quad VaR_\\alpha=\\alpha\\text{-quantile of }L,\\quad ES_\\alpha=E[L\\mid L\\ge VaR_\\alpha],\\quad IR=\\frac{E[R-R_b]}{\\sigma(R-R_b)}$$\n\n**Variables:**\n\n- $W_t$ wealth\n- $L$ loss\n- $\\alpha$ confidence level\n- $R_b$ benchmark return (denominator = tracking error)\n\nSharpe only summarises mean & std; tails need these.\n\n<a id=\"model-risk-governance\"><\/a>\n\n## Model Risk, Reserves & Governance\n<!-- section: model-risk-governance | prerequisites: [pricing-app-architecture] | related: [model-release-regression-testing, call-spread-overhedge, autocallables, vol-surface-construction] | tags: [model-risk, osfi-e23, ipv, reserves] -->\n\n**Model risk:** wrong model, wrong implementation, or use outside validated range.\n\n- Controls: only approved models per product; version tracking; input validation & warnings (arbitrage in surface, extrapolated vol); audit log; alignment with validation (Canada: **OSFI Guideline E-23**).\n- **Reserves:** model reserve, barrier/digital overhedges, correlation and dividend reserves.\n- **Independent price verification:** vs consensus (S&P Global **Totem**: 150+ contributors, 10th/90th percentiles for prudent valuation); daily P&L explain.", "summary": "", "topic": "", "sections": ["scenario-risk-grids", "risk-measures", "model-risk-governance"], "degree": 7}, {"id": "time-series-momentum", "title": "Time-Series Momentum Signal (\"Is the trend still up?\")", "type": "concept", "domain": "signal-research", "tags": ["momentum", "signal", "z-score"], "path": "topics/signals-research-process.md", "content": "<a id=\"time-series-momentum\"><\/a>\n\n## Time-Series Momentum Signal (\"Is the trend still up?\")\n<!-- section: time-series-momentum | prerequisites: [returns-simple-log] | related: [signal-to-weight, cross-validation-leakage, backtest-pitfalls] | tags: [momentum, signal, z-score] -->\n\n$$raw_t=\\frac{P_t}{P_{t-12}}-1,\\qquad z_t=\\frac{raw_t-\\mu_{raw}}{\\sigma_{raw}},\\qquad s_t=\\mathrm{clip}(z_t,-2,+2)$$\n\n**Variables:**\n\n- $P_t$ price/index level at month $t$\n- $P_{t-12}$ price 12 months ago\n- $\\mu_{raw},\\sigma_{raw}$ mean/std of raw over a look-back window (window TBD)\n- $s_t$ signal\n\n### Reading the signal\n- $s=0$: momentum at its historical average → no conviction, no position.\n- $s=+1.5$: 1.5σ above average → moderately strong uptrend. $s=-2$: clipped floor (max bearish).\n- **Sign = direction, magnitude = conviction**, unitless → different raw signals are comparable.\n\n### Connections\n- **Feeds:** [[signal-to-weight]] → [[risk-budgeting]].", "summary": "<a id=\"time-series-momentum\"><\/a>", "topic": "signals-research-process", "degree": 8}, {"id": "capm-alpha-beta", "title": "Excess Return, Alpha, Beta & CAPM", "type": "concept", "domain": "signal-research", "tags": ["beta", "alpha", "factor"], "path": "topics/signals-research-process.md", "content": "<a id=\"capm-alpha-beta\"><\/a>\n\n## Excess Return, Alpha, Beta & CAPM\n<!-- section: capm-alpha-beta | prerequisites: [ols-regression, returns-simple-log] | related: [omitted-variable-bias, exposure-neutrality, sharpe-ratio] | tags: [beta, alpha, factor] -->\n\n$$R_i-r_f=\\alpha_i+\\beta_i(R_m-r_f)+\\varepsilon_i,\\qquad \\beta_i=\\frac{\\mathrm{Cov}(R_i,R_m)}{\\mathrm{Var}(R_m)},\\qquad \\text{CAPM: }E[R_i]-r_f=\\beta_i(E[R_m]-r_f)$$\n\n**Variables:**\n\n- $R_i$ asset return\n- $R_m$ market return\n- $r_f$ same-period risk-free return\n- $\\alpha_i$ intercept\n- $\\varepsilon_i$ residual\n\n- Beta = OLS slope. Positive alpha may be noise, an omitted factor ([[omitted-variable-bias]]) or selection bias.\n- CAPM is an equilibrium model, not a definition of realised returns.", "summary": "<a id=\"capm-alpha-beta\"><\/a>", "topic": "signals-research-process", "degree": 9}, {"id": "win-rate-expectancy", "title": "Win Rate vs Expected Value", "type": "concept", "domain": "signal-research", "tags": ["expectancy"], "path": "topics/signals-research-process.md", "content": "<a id=\"win-rate-expectancy\"><\/a>\n\n## Win Rate vs Expected Value\n<!-- section: win-rate-expectancy | prerequisites: [expectation-linearity-indicators] | related: [risk-measures, sharpe-ratio] | tags: [expectancy] -->\n\n$$E[\\Pi]=pg-(1-p)\\ell-c$$\n\n**Variables:**\n\n- $p$ win probability\n- $g$ gain on win\n- $\\ell$ loss on loss\n- $c$ cost per trade\n\n- 90% win rate, +1 / −20 → $0.9-2=-1.1$ per trade.\n- High win rate ≠ positive expectation (typical of short-option strategies).", "summary": "<a id=\"win-rate-expectancy\"><\/a>", "topic": "signals-research-process", "degree": 8}, {"id": "research-workflow", "title": "Research Workflow & Project Storytelling", "type": "concept", "domain": "signal-research", "tags": ["research", "communication"], "path": "topics/signals-research-process.md", "content": "<a id=\"research-workflow\"><\/a>\n\n## Research Workflow & Project Storytelling\n<!-- section: research-workflow | prerequisites: [] | related: [backtest-pitfalls, cross-validation-leakage, multiple-testing] | tags: [research, communication] -->\n\n1. Hypothesis + economic/operational reason.\n2. What information is available **at decision time**.\n3. Simple baseline.\n4. Chronological validation + uncertainty ([[cross-validation-leakage]]).\n5. Costs & feasibility.\n6. Stability across periods, instruments, parameters.\n7. Document failure modes; monitor deployment.\n\n### One project at three depths\n\n- **30 s:** problem, your contribution, result.\n- **2 min:** data, baseline, method, validation, result, limitation.\n- **10 min:** assumptions, features, model choice, failed experiments, uncertainty, debugging, improvements.\n- Be ready to explain every technical noun on your résumé.\n\n### Answering technique\n1. Clarify setup\n2. Define variables\n3. Name principle\n4. Write the first equation\n5. Solve & check a limiting case\n6. Interpret and state when it breaks\n\nIf stuck: say what you know, simplify (equal-vol case first).", "summary": "<a id=\"research-workflow\"><\/a>", "topic": "signals-research-process", "degree": 7}, {"id": "backtest-pitfalls", "title": "Backtest Pitfalls & Live Underperformance", "type": "concept", "domain": "signal-research", "tags": ["backtest", "overfitting", "survivorship"], "path": "topics/signals-research-process.md", "content": "<a id=\"backtest-pitfalls\"><\/a>\n\n## Backtest Pitfalls & Live Underperformance\n<!-- section: backtest-pitfalls | prerequisites: [research-workflow] | related: [multiple-testing, cross-validation-leakage, sharpe-ratio, price-reconciliation, conditional-probability-bayes] | tags: [backtest, overfitting, survivorship] -->\n\n### \"Sharpe 4 in backtest, loses immediately live\" — investigation order\n1. **Reconcile implementation:** inputs, signal timing, target positions, fills, costs, PnL accounting; timestamps, corporate actions, duplicates, look-ahead data.\n2. **Execution realism:** spread, slippage, delay, participation limits, borrow, financing.\n3. **Research process:** selection across many trials ([[multiple-testing]]), out-of-sample evidence.\n4. **Is the loss surprising** given sample length, exposures, return distribution? Regime/liquidity/crowding change?\n\n- Don't explain a bug as a regime change.\n- A bad first week alone doesn't prove failure.\n\n### Usual suspects\nFuture information / leakage, bad corporate-action adjustment, unrealistic execution, duplicated rows, survivorship bias, strategy selection, stale prices, ignored costs.\n\n### Connections\n- [[cross-validation-leakage]], [[sharpe-ratio]] (why high SR misleads), [[price-reconciliation]] (same \"diff the inputs first\" discipline).", "summary": "<a id=\"backtest-pitfalls\"><\/a>", "topic": "signals-research-process", "degree": 11}, {"id": "signals-research-process", "title": "Signals & Research Process", "type": "topic", "domain": "signal-research", "tags": [], "path": "topics/signals-research-process.md", "content": "# Signals & Research Process\n\n**Sections:** [[time-series-momentum]] · [[capm-alpha-beta]] · [[win-rate-expectancy]] · [[research-workflow]] · [[backtest-pitfalls]]\n\n<a id=\"time-series-momentum\"><\/a>\n\n## Time-Series Momentum Signal (\"Is the trend still up?\")\n<!-- section: time-series-momentum | prerequisites: [returns-simple-log] | related: [signal-to-weight, cross-validation-leakage, backtest-pitfalls] | tags: [momentum, signal, z-score] -->\n\n$$raw_t=\\frac{P_t}{P_{t-12}}-1,\\qquad z_t=\\frac{raw_t-\\mu_{raw}}{\\sigma_{raw}},\\qquad s_t=\\mathrm{clip}(z_t,-2,+2)$$\n\n**Variables:**\n\n- $P_t$ price/index level at month $t$\n- $P_{t-12}$ price 12 months ago\n- $\\mu_{raw},\\sigma_{raw}$ mean/std of raw over a look-back window (window TBD)\n- $s_t$ signal\n\n### Reading the signal\n- $s=0$: momentum at its historical average → no conviction, no position.\n- $s=+1.5$: 1.5σ above average → moderately strong uptrend. $s=-2$: clipped floor (max bearish).\n- **Sign = direction, magnitude = conviction**, unitless → different raw signals are comparable.\n\n### Connections\n- **Feeds:** [[signal-to-weight]] → [[risk-budgeting]].\n\n<a id=\"capm-alpha-beta\"><\/a>\n\n## Excess Return, Alpha, Beta & CAPM\n<!-- section: capm-alpha-beta | prerequisites: [ols-regression, returns-simple-log] | related: [omitted-variable-bias, exposure-neutrality, sharpe-ratio] | tags: [beta, alpha, factor] -->\n\n$$R_i-r_f=\\alpha_i+\\beta_i(R_m-r_f)+\\varepsilon_i,\\qquad \\beta_i=\\frac{\\mathrm{Cov}(R_i,R_m)}{\\mathrm{Var}(R_m)},\\qquad \\text{CAPM: }E[R_i]-r_f=\\beta_i(E[R_m]-r_f)$$\n\n**Variables:**\n\n- $R_i$ asset return\n- $R_m$ market return\n- $r_f$ same-period risk-free return\n- $\\alpha_i$ intercept\n- $\\varepsilon_i$ residual\n\n- Beta = OLS slope. Positive alpha may be noise, an omitted factor ([[omitted-variable-bias]]) or selection bias.\n- CAPM is an equilibrium model, not a definition of realised returns.\n\n<a id=\"win-rate-expectancy\"><\/a>\n\n## Win Rate vs Expected Value\n<!-- section: win-rate-expectancy | prerequisites: [expectation-linearity-indicators] | related: [risk-measures, sharpe-ratio] | tags: [expectancy] -->\n\n$$E[\\Pi]=pg-(1-p)\\ell-c$$\n\n**Variables:**\n\n- $p$ win probability\n- $g$ gain on win\n- $\\ell$ loss on loss\n- $c$ cost per trade\n\n- 90% win rate, +1 / −20 → $0.9-2=-1.1$ per trade.\n- High win rate ≠ positive expectation (typical of short-option strategies).\n\n<a id=\"research-workflow\"><\/a>\n\n## Research Workflow & Project Storytelling\n<!-- section: research-workflow | prerequisites: [] | related: [backtest-pitfalls, cross-validation-leakage, multiple-testing] | tags: [research, communication] -->\n\n1. Hypothesis + economic/operational reason.\n2. What information is available **at decision time**.\n3. Simple baseline.\n4. Chronological validation + uncertainty ([[cross-validation-leakage]]).\n5. Costs & feasibility.\n6. Stability across periods, instruments, parameters.\n7. Document failure modes; monitor deployment.\n\n### One project at three depths\n\n- **30 s:** problem, your contribution, result.\n- **2 min:** data, baseline, method, validation, result, limitation.\n- **10 min:** assumptions, features, model choice, failed experiments, uncertainty, debugging, improvements.\n- Be ready to explain every technical noun on your résumé.\n\n### Answering technique\n1. Clarify setup\n2. Define variables\n3. Name principle\n4. Write the first equation\n5. Solve & check a limiting case\n6. Interpret and state when it breaks\n\nIf stuck: say what you know, simplify (equal-vol case first).\n\n<a id=\"backtest-pitfalls\"><\/a>\n\n## Backtest Pitfalls & Live Underperformance\n<!-- section: backtest-pitfalls | prerequisites: [research-workflow] | related: [multiple-testing, cross-validation-leakage, sharpe-ratio, price-reconciliation, conditional-probability-bayes] | tags: [backtest, overfitting, survivorship] -->\n\n### \"Sharpe 4 in backtest, loses immediately live\" — investigation order\n1. **Reconcile implementation:** inputs, signal timing, target positions, fills, costs, PnL accounting; timestamps, corporate actions, duplicates, look-ahead data.\n2. **Execution realism:** spread, slippage, delay, participation limits, borrow, financing.\n3. **Research process:** selection across many trials ([[multiple-testing]]), out-of-sample evidence.\n4. **Is the loss surprising** given sample length, exposures, return distribution? Regime/liquidity/crowding change?\n\n- Don't explain a bug as a regime change.\n- A bad first week alone doesn't prove failure.\n\n### Usual suspects\nFuture information / leakage, bad corporate-action adjustment, unrealistic execution, duplicated rows, survivorship bias, strategy selection, stale prices, ignored costs.\n\n### Connections\n- [[cross-validation-leakage]], [[sharpe-ratio]] (why high SR misleads), [[price-reconciliation]] (same \"diff the inputs first\" discipline).", "summary": "", "topic": "", "sections": ["time-series-momentum", "capm-alpha-beta", "win-rate-expectancy", "research-workflow", "backtest-pitfalls"], "degree": 8}, {"id": "brownian-motion", "title": "Brownian Motion", "type": "concept", "domain": "stochastic-finance", "tags": ["wiener-process"], "path": "topics/stochastic-calculus.md", "content": "<a id=\"brownian-motion\"><\/a>\n\n## Brownian Motion\n<!-- section: brownian-motion | prerequisites: [normal-distribution] | related: [ito-lemma, martingales-ito-isometry] | tags: [wiener-process] -->\n\n$W_0=0$, continuous paths, independent increments, $W_t-W_s\\sim N(0,t-s)$.\n\n$$E[W_t]=0,\\quad \\mathrm{Var}(W_t)=t,\\quad \\mathrm{Cov}(W_s,W_t)=\\min(s,t)$$\n\n**Variables:**\n\n- $W_t$ Brownian motion at time $t$\n- $s<t$\n\n- $\\mathrm{Cov}(W_2,W_5)=2$, $\\mathrm{Corr}=\\sqrt{2/5}\\approx0.632$.\n- Paths continuous, nowhere differentiable; increments over $dt$ are $O(\\sqrt{dt})$ → quadratic variation $t$.\n\n### Connections\n- **Next:** [[ito-lemma]] ($(dW)^2=dt$), [[martingales-ito-isometry]], [[geometric-brownian-motion]].", "summary": "<a id=\"brownian-motion\"><\/a>", "topic": "stochastic-calculus", "degree": 7}, {"id": "ito-lemma", "title": "Itô's Lemma", "type": "concept", "domain": "stochastic-finance", "tags": ["ito", "quadratic-variation"], "path": "topics/stochastic-calculus.md", "content": "<a id=\"ito-lemma\"><\/a>\n\n## Itô's Lemma\n<!-- section: ito-lemma | prerequisites: [brownian-motion] | related: [geometric-brownian-motion, black-scholes-pde, martingales-ito-isometry] | tags: [ito, quadratic-variation] -->\n\n$$dX=a\\,dt+b\\,dW\\ \\Rightarrow\\ df(t,X)=\\Big(f_t+af_x+\\tfrac12b^2f_{xx}\\Big)dt+bf_x\\,dW;\\qquad (dW)^2=dt,\\ dt\\,dW=0,\\ (dt)^2=0$$\n\n**Variables:**\n\n- $a$ drift\n- $b$ diffusion coefficient\n- $f$ smooth function\n- subscripts = partial derivatives\n\n### Quick examples\n- $f=\\log S$ under GBM → $d\\log S=(\\mu-\\tfrac12\\sigma^2)dt+\\sigma dW$.\n- $d(S^2)=(2\\mu+\\sigma^2)S^2dt+2\\sigma S^2dW$.\n- $d(W^2)=dt+2W\\,dW$ ⇒ $\\int_0^TW\\,dW=(W_T^2-T)/2$ (mean 0, var $T^2/2$).\n\nThe extra $\\tfrac12 f_{xx}$ term exists because $(dW)^2$ is order $dt$ — convexity again ([[jensens-inequality]]).\n\n### Connections\n- **Used by:** [[geometric-brownian-motion]], [[black-scholes-pde]] (Itô on $V(S,t)$), [[gamma-theta-pnl]] (the ½ΓS²σ² term).", "summary": "<a id=\"ito-lemma\"><\/a>", "topic": "stochastic-calculus", "degree": 15}, {"id": "geometric-brownian-motion", "title": "Geometric Brownian Motion (GBM)", "type": "concept", "domain": "stochastic-finance", "tags": ["gbm", "lognormal"], "path": "topics/stochastic-calculus.md", "content": "<a id=\"geometric-brownian-motion\"><\/a>\n\n## Geometric Brownian Motion (GBM)\n<!-- section: geometric-brownian-motion | prerequisites: [ito-lemma, lognormal-distribution] | related: [black-scholes-formula, jensens-inequality, risk-neutral-pricing, monte-carlo-pricing] | tags: [gbm, lognormal] -->\n\n$$dS=\\mu S\\,dt+\\sigma S\\,dW\\ \\Rightarrow\\ S_t=S_0\\exp\\big[(\\mu-\\tfrac12\\sigma^2)t+\\sigma W_t\\big]$$\n$$E[S_t]=S_0e^{\\mu t},\\quad \\mathrm{Var}(S_t)=S_0^2e^{2\\mu t}(e^{\\sigma^2t}-1),\\quad E[\\log(S_t/S_0)]=(\\mu-\\tfrac12\\sigma^2)t$$\n\n**Variables:**\n\n- $\\mu$ drift\n- $\\sigma$ volatility\n- $W_t$ Brownian motion\n\n- μ = 8%, σ = 20% → expected log return 6%; expected simple return $e^{0.08}-1\\approx8.33\\%$.\n- The Black–Scholes assumption. Real markets break it (jumps, skew) → [[volatility-skew]].\n\n### Connections\n- **Under Q:** $\\mu\\to r-q$ ([[risk-neutral-pricing]]) ⇒ [[black-scholes-formula]]. **Simulated in:** [[monte-carlo-pricing]].", "summary": "<a id=\"geometric-brownian-motion\"><\/a>", "topic": "stochastic-calculus", "degree": 15}, {"id": "martingales-ito-isometry", "title": "Martingales & Itô Isometry", "type": "concept", "domain": "stochastic-finance", "tags": ["martingale", "isometry"], "path": "topics/stochastic-calculus.md", "content": "<a id=\"martingales-ito-isometry\"><\/a>\n\n## Martingales & Itô Isometry\n<!-- section: martingales-ito-isometry | prerequisites: [brownian-motion, ito-lemma] | related: [risk-neutral-pricing] | tags: [martingale, isometry] -->\n\n$$E[M_t\\mid\\mathcal F_s]=M_s;\\qquad E\\Big[\\int_0^TH_tdW_t\\Big]=0,\\quad E\\Big[\\Big(\\int_0^TH_tdW_t\\Big)^2\\Big]=E\\Big[\\int_0^TH_t^2dt\\Big]$$\n\n**Variables:**\n\n- $M$ martingale\n- $\\mathcal F_s$ information at $s$\n- $H$ adapted square-integrable integrand\n\n- $W_t^2$ is **not** a martingale ($E[W_t^2|\\mathcal F_s]=W_s^2+(t-s)$); $W_t^2-t$ is.\n- Martingale = zero *expected* change, not zero realised change.\n\n### Connections\n- **Foundation of:** [[risk-neutral-pricing]] (discounted prices are Q-martingales).", "summary": "<a id=\"martingales-ito-isometry\"><\/a>", "topic": "stochastic-calculus", "degree": 7}, {"id": "risk-neutral-pricing", "title": "Risk-Neutral Pricing (Q vs P)", "type": "concept", "domain": "stochastic-finance", "tags": ["risk-neutral", "measure", "numeraire"], "path": "topics/stochastic-calculus.md", "content": "<a id=\"risk-neutral-pricing\"><\/a>\n\n## Risk-Neutral Pricing (Q vs P)\n<!-- section: risk-neutral-pricing | prerequisites: [martingales-ito-isometry, binomial-replication] | related: [black-scholes-formula, delta-vs-itm-probability, realized-volatility, breeden-litzenberger] | tags: [risk-neutral, measure, numeraire] -->\n\n$$dS=(r-q)S\\,dt+\\sigma S\\,dW^Q,\\qquad V_t=e^{-r(T-t)}E^Q[h(S_T)\\mid\\mathcal F_t]$$\n\n**Variables:**\n\n- $Q$ risk-neutral measure\n- $r$ rate\n- $q$ dividend yield\n- $h$ payoff\n- $W^Q$ Q-Brownian motion\n\n### Key points\n- Price of a replicable payoff = cost of replication; Q-expectation is a **representation** of that, not a claim investors are risk-neutral.\n- Physical drift μ drops out → BS price independent of μ.\n- Incomplete markets: no unique Q / price.\n- **P vs Q:** historical/realised vol is a P-number (risk, forecasting); implied vol is a Q-number (pricing). Gap = variance risk premium.\n\n### Connections\n- **Discrete version:** [[binomial-replication]] ($q^*$). **Leads to:** [[black-scholes-formula]]; $N(d_2)$ = Q-prob of fin
