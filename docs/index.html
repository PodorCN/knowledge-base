ishing ITM ([[delta-vs-itm-probability]]).\n- **Density from prices:** [[breeden-litzenberger]].", "summary": "<a id=\"risk-neutral-pricing\"><\/a>", "topic": "stochastic-calculus", "degree": 17}, {"id": "stochastic-calculus", "title": "Stochastic Calculus", "type": "topic", "domain": "stochastic-finance", "tags": [], "path": "topics/stochastic-calculus.md", "content": "# Stochastic Calculus\n\n**Sections:** [[brownian-motion]] · [[ito-lemma]] · [[geometric-brownian-motion]] · [[martingales-ito-isometry]] · [[risk-neutral-pricing]]\n\n<a id=\"brownian-motion\"><\/a>\n\n## Brownian Motion\n<!-- section: brownian-motion | prerequisites: [normal-distribution] | related: [ito-lemma, martingales-ito-isometry] | tags: [wiener-process] -->\n\n$W_0=0$, continuous paths, independent increments, $W_t-W_s\\sim N(0,t-s)$.\n\n$$E[W_t]=0,\\quad \\mathrm{Var}(W_t)=t,\\quad \\mathrm{Cov}(W_s,W_t)=\\min(s,t)$$\n\n**Variables:**\n\n- $W_t$ Brownian motion at time $t$\n- $s<t$\n\n- $\\mathrm{Cov}(W_2,W_5)=2$, $\\mathrm{Corr}=\\sqrt{2/5}\\approx0.632$.\n- Paths continuous, nowhere differentiable; increments over $dt$ are $O(\\sqrt{dt})$ → quadratic variation $t$.\n\n### Connections\n- **Next:** [[ito-lemma]] ($(dW)^2=dt$), [[martingales-ito-isometry]], [[geometric-brownian-motion]].\n\n<a id=\"ito-lemma\"><\/a>\n\n## Itô's Lemma\n<!-- section: ito-lemma | prerequisites: [brownian-motion] | related: [geometric-brownian-motion, black-scholes-pde, martingales-ito-isometry] | tags: [ito, quadratic-variation] -->\n\n$$dX=a\\,dt+b\\,dW\\ \\Rightarrow\\ df(t,X)=\\Big(f_t+af_x+\\tfrac12b^2f_{xx}\\Big)dt+bf_x\\,dW;\\qquad (dW)^2=dt,\\ dt\\,dW=0,\\ (dt)^2=0$$\n\n**Variables:**\n\n- $a$ drift\n- $b$ diffusion coefficient\n- $f$ smooth function\n- subscripts = partial derivatives\n\n### Quick examples\n- $f=\\log S$ under GBM → $d\\log S=(\\mu-\\tfrac12\\sigma^2)dt+\\sigma dW$.\n- $d(S^2)=(2\\mu+\\sigma^2)S^2dt+2\\sigma S^2dW$.\n- $d(W^2)=dt+2W\\,dW$ ⇒ $\\int_0^TW\\,dW=(W_T^2-T)/2$ (mean 0, var $T^2/2$).\n\nThe extra $\\tfrac12 f_{xx}$ term exists because $(dW)^2$ is order $dt$ — convexity again ([[jensens-inequality]]).\n\n### Connections\n- **Used by:** [[geometric-brownian-motion]], [[black-scholes-pde]] (Itô on $V(S,t)$), [[gamma-theta-pnl]] (the ½ΓS²σ² term).\n\n<a id=\"geometric-brownian-motion\"><\/a>\n\n## Geometric Brownian Motion (GBM)\n<!-- section: geometric-brownian-motion | prerequisites: [ito-lemma, lognormal-distribution] | related: [black-scholes-formula, jensens-inequality, risk-neutral-pricing, monte-carlo-pricing] | tags: [gbm, lognormal] -->\n\n$$dS=\\mu S\\,dt+\\sigma S\\,dW\\ \\Rightarrow\\ S_t=S_0\\exp\\big[(\\mu-\\tfrac12\\sigma^2)t+\\sigma W_t\\big]$$\n$$E[S_t]=S_0e^{\\mu t},\\quad \\mathrm{Var}(S_t)=S_0^2e^{2\\mu t}(e^{\\sigma^2t}-1),\\quad E[\\log(S_t/S_0)]=(\\mu-\\tfrac12\\sigma^2)t$$\n\n**Variables:**\n\n- $\\mu$ drift\n- $\\sigma$ volatility\n- $W_t$ Brownian motion\n\n- μ = 8%, σ = 20% → expected log return 6%; expected simple return $e^{0.08}-1\\approx8.33\\%$.\n- The Black–Scholes assumption. Real markets break it (jumps, skew) → [[volatility-skew]].\n\n### Connections\n- **Under Q:** $\\mu\\to r-q$ ([[risk-neutral-pricing]]) ⇒ [[black-scholes-formula]]. **Simulated in:** [[monte-carlo-pricing]].\n\n<a id=\"martingales-ito-isometry\"><\/a>\n\n## Martingales & Itô Isometry\n<!-- section: martingales-ito-isometry | prerequisites: [brownian-motion, ito-lemma] | related: [risk-neutral-pricing] | tags: [martingale, isometry] -->\n\n$$E[M_t\\mid\\mathcal F_s]=M_s;\\qquad E\\Big[\\int_0^TH_tdW_t\\Big]=0,\\quad E\\Big[\\Big(\\int_0^TH_tdW_t\\Big)^2\\Big]=E\\Big[\\int_0^TH_t^2dt\\Big]$$\n\n**Variables:**\n\n- $M$ martingale\n- $\\mathcal F_s$ information at $s$\n- $H$ adapted square-integrable integrand\n\n- $W_t^2$ is **not** a martingale ($E[W_t^2|\\mathcal F_s]=W_s^2+(t-s)$); $W_t^2-t$ is.\n- Martingale = zero *expected* change, not zero realised change.\n\n### Connections\n- **Foundation of:** [[risk-neutral-pricing]] (discounted prices are Q-martingales).\n\n<a id=\"risk-neutral-pricing\"><\/a>\n\n## Risk-Neutral Pricing (Q vs P)\n<!-- section: risk-neutral-pricing | prerequisites: [martingales-ito-isometry, binomial-replication] | related: [black-scholes-formula, delta-vs-itm-probability, realized-volatility, breeden-litzenberger] | tags: [risk-neutral, measure, numeraire] -->\n\n$$dS=(r-q)S\\,dt+\\sigma S\\,dW^Q,\\qquad V_t=e^{-r(T-t)}E^Q[h(S_T)\\mid\\mathcal F_t]$$\n\n**Variables:**\n\n- $Q$ risk-neutral measure\n- $r$ rate\n- $q$ dividend yield\n- $h$ payoff\n- $W^Q$ Q-Brownian motion\n\n### Key points\n- Price of a replicable payoff = cost of replication; Q-expectation is a **representation** of that, not a claim investors are risk-neutral.\n- Physical drift μ drops out → BS price independent of μ.\n- Incomplete markets: no unique Q / price.\n- **P vs Q:** historical/realised vol is a P-number (risk, forecasting); implied vol is a Q-number (pricing). Gap = variance risk premium.\n\n### Connections\n- **Discrete version:** [[binomial-replication]] ($q^*$). **Leads to:** [[black-scholes-formula]]; $N(d_2)$ = Q-prob of finishing ITM ([[delta-vs-itm-probability]]).\n- **Density from prices:** [[breeden-litzenberger]].", "summary": "", "topic": "", "sections": ["brownian-motion", "ito-lemma", "geometric-brownian-motion", "martingales-ito-isometry", "risk-neutral-pricing"], "degree": 8}, {"id": "autocallables", "title": "Autocallables (worst-of, RBC case study)", "type": "concept", "domain": "pricing", "tags": ["autocallable", "structured-notes", "dividends", "rbc"], "path": "topics/structured-products-delta-one.md", "content": "<a id=\"autocallables\"><\/a>\n\n## Autocallables (worst-of, RBC case study)\n<!-- section: autocallables | prerequisites: [digital-options, barrier-options, worst-of-correlation] | related: [local-stochastic-volatility, monte-carlo-pricing, reverse-convertible, delta-one-products, volatility-skew, model-risk-governance] | tags: [autocallable, structured-notes, dividends, rbc] -->\n\n**Structure:**\n\n- Coupon (often contingent, with memory).\n- **Early redemption** if the (worst-of) underlying ≥ autocall level on an observation date.\n- At maturity, if below the knock-in barrier, investor takes the equity loss.\n\n**Decomposition:** bond + short down-and-in put + autocall digitals + coupon digitals.\n\n### RBC 424B2 case (public facts)\nDJIA / Nasdaq-100 / S&P 500 worst-of, 3y (Feb 2029); monthly contingent coupon $6.25/$1,000 (7.5% p.a.) if all ≥ 60%; monthly autocall from Feb 2027 if all ≥ 100%; principal loss if worst < 60% at maturity. Estimated value $937.50–$987.50; underwriting 0.15%.\n\n### Desk workflow (inferred)\nMark surfaces → calibrate LSV per underlier, mark correlations, imply dividends → MC in C++ (Greeks by AAD/bumps) → reserves (model, barrier & digital overhedges, correlation, dividends), verify vs consensus → hedge Δ with futures, vega with vanillas, dividends with div futures → recycle correlation / long-dated vol → discount at internal funding rate.\n\n### MC results (source's assumptions, not RBC's)\n| per $1,000 | Flat ATM vols | Downside vols +6 pts |\n|---|---|---|\n| Note value | 1007.7 | 958.5 |\n| P(autocall) | 67.8% | 64.3% |\n| P(principal loss) | 8.3% | 16.5% |\n\nFlat vol values the note **above par** — wrong: investor is short a deep OTM put priced in the steep skew ([[volatility-skew]]).\n\n### Sensitivities → what the issuer holds\nVols +1pt: −7.45 (issuer long vol); corr −0.1: −2.94; divs +0.5%: −2.80 (issuer long dividends); discount at r instead of r+60bp: +10.10.\nAfter Δ-hedging, issuers are **short delta, long vol, long dividends, short correlation**; awkward gamma near barriers/triggers. March 2020: 2020 dividends traded ~55% of model, 2021 ~70% → big losses on dividend hedges.\n\n### Why estimated value < $1,000\nIssue price covers underwriting, hedging cost, structuring margin; value uses internal funding rate & mid hedge terms.\n\n### Connections\n- **Components:** [[digital-options]], [[barrier-options]], [[worst-of-correlation]]. **Model:** [[local-stochastic-volatility]] + [[monte-carlo-pricing]].\n- **Sibling:** [[reverse-convertible]]. **Dividend hedge:** [[delta-one-products]].", "summary": "<a id=\"autocallables\"><\/a>", "topic": "structured-products-delta-one", "degree": 18}, {"id": "reverse-convertible", "title": "Reverse Convertible", "type": "concept", "domain": "pricing", "tags": ["structured-notes", "yield-enhancement"], "path": "topics/structured-products-delta-one.md", "content": "<a id=\"reverse-convertible\"><\/a>\n\n## Reverse Convertible\n<!-- section: reverse-convertible | prerequisites: [barrier-options] | related: [autocallables, principal-protected-note, worst-of-correlation] | tags: [structured-notes, yield-enhancement] -->\n\n**= bond + short (down-and-in) put.**\n\n- Investor sells the put and receives an enhanced coupon.\n- Adding early-redemption digitals and contingent coupon digitals turns it into an [[autocallables]].", "summary": "<a id=\"reverse-convertible\"><\/a>", "topic": "structured-products-delta-one", "degree": 7}, {"id": "principal-protected-note", "title": "Principal-Protected Note (PPN)", "type": "concept", "domain": "pricing", "tags": ["structured-notes", "participation-rate"], "path": "topics/structured-products-delta-one.md", "content": "<a id=\"principal-protected-note\"><\/a>\n\n## Principal-Protected Note (PPN)\n<!-- section: principal-protected-note | prerequisites: [static-replication, discounting-compounding] | related: [reverse-convertible, digital-options] | tags: [structured-notes, participation-rate] -->\n\n**= zero-coupon bond (guarantees principal) + call (or call spread) on the index.**\n\n$$\\text{Participation}=\\frac{\\text{Note price}-\\text{ZCB price}}{\\text{Option price}}$$\n- Higher rates → cheaper ZCB → more budget → **higher** participation.\n- Higher vol → dearer option → **lower** participation.\n- Same \"budget buys payoff\" logic as the digital payout ratio Q in [[digital-options]].", "summary": "<a id=\"principal-protected-note\"><\/a>", "topic": "structured-products-delta-one", "degree": 8}, {"id": "worst-of-correlation", "title": "Worst-of Payoffs & Correlation Risk", "type": "concept", "domain": "pricing", "tags": ["worst-of", "correlation", "dispersion"], "path": "topics/structured-products-delta-one.md", "content": "<a id=\"worst-of-correlation\"><\/a>\n\n## Worst-of Payoffs & Correlation Risk\n<!-- section: worst-of-correlation | prerequisites: [portfolio-variance-diversification, barrier-options] | related: [autocallables, reverse-convertible, digital-options] | tags: [worst-of, correlation, dispersion] -->\n\nPayoff depends on the worst performer in a basket.\n\n- Investor **sells** the desk a worst-of down-and-in put and **receives** worst-of coupon/autocall digitals.\n- **Lower correlation** → more dispersion → worst is lower → put worth **more**, digitals worth **less** → low-correlation baskets pay higher headline coupons.\n- Desk is long the put, short the digitals; both lose value as ρ rises ⇒ **desk is short correlation** (\"The dealer, conversely, is short correlation\" — Risk.net). Hurt in Q1 2020 when markets moved in unison. (Long-put/short-digital breakdown is 自己推理; direction matches sources.)\n- Example: correlations −0.1 → note −2.94 per $1,000; single index instead of worst-of → 1026.3 (worst-of cheaper, funds the coupon).\n\n### Connections\n- **Diversification maths:** [[portfolio-variance-diversification]]. **Products:** [[autocallables]], [[reverse-convertible]].", "summary": "<a id=\"worst-of-correlation\"><\/a>", "topic": "structured-products-delta-one", "degree": 11}, {"id": "swaptions", "title": "Swaptions (and why an equity desk cares)", "type": "concept", "domain": "pricing", "tags": ["swaption", "callable-notes", "rates"], "path": "topics/structured-products-delta-one.md", "content": "<a id=\"swaptions\"><\/a>\n\n## Swaptions (and why an equity desk cares)\n<!-- section: swaptions | prerequisites: [black-76] | related: [sabr, autocallables] | tags: [swaption, callable-notes, rates] -->\n\n$$PS=A\\,[F\\,N(d_1)-K\\,N(d_2)],\\qquad d_{1,2}=\\frac{\\ln(F/K)\\pm\\tfrac12\\sigma^2T}{\\sigma\\sqrt T},\\qquad A=\\sum_i\\tau_iP(0,t_i)$$\n\n**Variables:**\n\n- $PS$ payer swaption\n- $A$ annuity (PV01)\n- $F$ forward swap rate\n- $K$ strike rate\n- σ Black vol\n- $T$ option expiry\n- $\\tau_i$ accrual fractions\n- $P(0,t_i)$ discount factors\n\n- Rates desks quote **normal (Bachelier) vol** because rates can be negative → [[sabr]].\n- **Equity desk link (自己推理):** issuer-callable structured notes embed a **Bermudan receiver swaption** owned by the issuer, hedged with rates; long-dated equity products carry rho / equity–rates correlation. Or \"equity swaptions\" = options on a TRS. Ask which in the interview.", "summary": "<a id=\"swaptions\"><\/a>", "topic": "structured-products-delta-one", "degree": 6}, {"id": "delta-one-products", "title": "Delta One Products (futures, TRS, dividend swaps)", "type": "concept", "domain": "pricing", "tags": ["delta-one", "trs", "dividend-swap", "repo"], "path": "topics/structured-products-delta-one.md", "content": "<a id=\"delta-one-products\"><\/a>\n\n## Delta One Products (futures, TRS, dividend swaps)\n<!-- section: delta-one-products | prerequisites: [forward-pricing] | related: [implied-forward-regression, autocallables] | tags: [delta-one, trs, dividend-swap, repo] -->\n\n**Products moving 1:1 with the underlying:**\n\n- Futures, forwards\n- Total return swaps\n- ETFs, index arbitrage\n- Dividend swaps/futures\n- Stock loan/repo\n\nPricing is mostly **carry**: funding, dividends, borrow.\n\n- **TRS:** one leg pays total return (price + dividends), other pays funding (CORRA/SOFR + spread) → synthetic exposure.\n- **Implied dividends / borrow:** back out from futures or put–call parity; the desk marks them. Options and delta-one **must use the same forward** or you get parity breaks.\n- Dividend futures hedge the dividend risk left by [[autocallables]] (March 2020: 2020 dividends traded ~55% of model).\n\n### Connections\n- **Builds on:** [[forward-pricing]]. **Implied via:** [[implied-forward-regression]].", "summary": "<a id=\"delta-one-products\"><\/a>", "topic": "structured-products-delta-one", "degree": 9}, {"id": "structured-products-delta-one", "title": "Structured Products & Delta One", "type": "topic", "domain": "pricing", "tags": [], "path": "topics/structured-products-delta-one.md", "content": "# Structured Products & Delta One\n\n**Sections:** [[autocallables]] · [[reverse-convertible]] · [[principal-protected-note]] · [[worst-of-correlation]] · [[swaptions]] · [[delta-one-products]]\n\n<a id=\"autocallables\"><\/a>\n\n## Autocallables (worst-of, RBC case study)\n<!-- section: autocallables | prerequisites: [digital-options, barrier-options, worst-of-correlation] | related: [local-stochastic-volatility, monte-carlo-pricing, reverse-convertible, delta-one-products, volatility-skew, model-risk-governance] | tags: [autocallable, structured-notes, dividends, rbc] -->\n\n**Structure:**\n\n- Coupon (often contingent, with memory).\n- **Early redemption** if the (worst-of) underlying ≥ autocall level on an observation date.\n- At maturity, if below the knock-in barrier, investor takes the equity loss.\n\n**Decomposition:** bond + short down-and-in put + autocall digitals + coupon digitals.\n\n### RBC 424B2 case (public facts)\nDJIA / Nasdaq-100 / S&P 500 worst-of, 3y (Feb 2029); monthly contingent coupon $6.25/$1,000 (7.5% p.a.) if all ≥ 60%; monthly autocall from Feb 2027 if all ≥ 100%; principal loss if worst < 60% at maturity. Estimated value $937.50–$987.50; underwriting 0.15%.\n\n### Desk workflow (inferred)\nMark surfaces → calibrate LSV per underlier, mark correlations, imply dividends → MC in C++ (Greeks by AAD/bumps) → reserves (model, barrier & digital overhedges, correlation, dividends), verify vs consensus → hedge Δ with futures, vega with vanillas, dividends with div futures → recycle correlation / long-dated vol → discount at internal funding rate.\n\n### MC results (source's assumptions, not RBC's)\n| per $1,000 | Flat ATM vols | Downside vols +6 pts |\n|---|---|---|\n| Note value | 1007.7 | 958.5 |\n| P(autocall) | 67.8% | 64.3% |\n| P(principal loss) | 8.3% | 16.5% |\n\nFlat vol values the note **above par** — wrong: investor is short a deep OTM put priced in the steep skew ([[volatility-skew]]).\n\n### Sensitivities → what the issuer holds\nVols +1pt: −7.45 (issuer long vol); corr −0.1: −2.94; divs +0.5%: −2.80 (issuer long dividends); discount at r instead of r+60bp: +10.10.\nAfter Δ-hedging, issuers are **short delta, long vol, long dividends, short correlation**; awkward gamma near barriers/triggers. March 2020: 2020 dividends traded ~55% of model, 2021 ~70% → big losses on dividend hedges.\n\n### Why estimated value < $1,000\nIssue price covers underwriting, hedging cost, structuring margin; value uses internal funding rate & mid hedge terms.\n\n### Connections\n- **Components:** [[digital-options]], [[barrier-options]], [[worst-of-correlation]]. **Model:** [[local-stochastic-volatility]] + [[monte-carlo-pricing]].\n- **Sibling:** [[reverse-convertible]]. **Dividend hedge:** [[delta-one-products]].\n\n<a id=\"reverse-convertible\"><\/a>\n\n## Reverse Convertible\n<!-- section: reverse-convertible | prerequisites: [barrier-options] | related: [autocallables, principal-protected-note, worst-of-correlation] | tags: [structured-notes, yield-enhancement] -->\n\n**= bond + short (down-and-in) put.**\n\n- Investor sells the put and receives an enhanced coupon.\n- Adding early-redemption digitals and contingent coupon digitals turns it into an [[autocallables]].\n\n<a id=\"principal-protected-note\"><\/a>\n\n## Principal-Protected Note (PPN)\n<!-- section: principal-protected-note | prerequisites: [static-replication, discounting-compounding] | related: [reverse-convertible, digital-options] | tags: [structured-notes, participation-rate] -->\n\n**= zero-coupon bond (guarantees principal) + call (or call spread) on the index.**\n\n$$\\text{Participation}=\\frac{\\text{Note price}-\\text{ZCB price}}{\\text{Option price}}$$\n- Higher rates → cheaper ZCB → more budget → **higher** participation.\n- Higher vol → dearer option → **lower** participation.\n- Same \"budget buys payoff\" logic as the digital payout ratio Q in [[digital-options]].\n\n<a id=\"worst-of-correlation\"><\/a>\n\n## Worst-of Payoffs & Correlation Risk\n<!-- section: worst-of-correlation | prerequisites: [portfolio-variance-diversification, barrier-options] | related: [autocallables, reverse-convertible, digital-options] | tags: [worst-of, correlation, dispersion] -->\n\nPayoff depends on the worst performer in a basket.\n\n- Investor **sells** the desk a worst-of down-and-in put and **receives** worst-of coupon/autocall digitals.\n- **Lower correlation** → more dispersion → worst is lower → put worth **more**, digitals worth **less** → low-correlation baskets pay higher headline coupons.\n- Desk is long the put, short the digitals; both lose value as ρ rises ⇒ **desk is short correlation** (\"The dealer, conversely, is short correlation\" — Risk.net). Hurt in Q1 2020 when markets moved in unison. (Long-put/short-digital breakdown is 自己推理; direction matches sources.)\n- Example: correlations −0.1 → note −2.94 per $1,000; single index instead of worst-of → 1026.3 (worst-of cheaper, funds the coupon).\n\n### Connections\n- **Diversification maths:** [[portfolio-variance-diversification]]. **Products:** [[autocallables]], [[reverse-convertible]].\n\n<a id=\"swaptions\"><\/a>\n\n## Swaptions (and why an equity desk cares)\n<!-- section: swaptions | prerequisites: [black-76] | related: [sabr, autocallables] | tags: [swaption, callable-notes, rates] -->\n\n$$PS=A\\,[F\\,N(d_1)-K\\,N(d_2)],\\qquad d_{1,2}=\\frac{\\ln(F/K)\\pm\\tfrac12\\sigma^2T}{\\sigma\\sqrt T},\\qquad A=\\sum_i\\tau_iP(0,t_i)$$\n\n**Variables:**\n\n- $PS$ payer swaption\n- $A$ annuity (PV01)\n- $F$ forward swap rate\n- $K$ strike rate\n- σ Black vol\n- $T$ option expiry\n- $\\tau_i$ accrual fractions\n- $P(0,t_i)$ discount factors\n\n- Rates desks quote **normal (Bachelier) vol** because rates can be negative → [[sabr]].\n- **Equity desk link (自己推理):** issuer-callable structured notes embed a **Bermudan receiver swaption** owned by the issuer, hedged with rates; long-dated equity products carry rho / equity–rates correlation. Or \"equity swaptions\" = options on a TRS. Ask which in the interview.\n\n<a id=\"delta-one-products\"><\/a>\n\n## Delta One Products (futures, TRS, dividend swaps)\n<!-- section: delta-one-products | prerequisites: [forward-pricing] | related: [implied-forward-regression, autocallables] | tags: [delta-one, trs, dividend-swap, repo] -->\n\n**Products moving 1:1 with the underlying:**\n\n- Futures, forwards\n- Total return swaps\n- ETFs, index arbitrage\n- Dividend swaps/futures\n- Stock loan/repo\n\nPricing is mostly **carry**: funding, dividends, borrow.\n\n- **TRS:** one leg pays total return (price + dividends), other pays funding (CORRA/SOFR + spread) → synthetic exposure.\n- **Implied dividends / borrow:** back out from futures or put–call parity; the desk marks them. Options and delta-one **must use the same forward** or you get parity breaks.\n- Dividend futures hedge the dividend risk left by [[autocallables]] (March 2020: 2020 dividends traded ~55% of model).\n\n### Connections\n- **Builds on:** [[forward-pricing]]. **Implied via:** [[implied-forward-regression]].", "summary": "", "topic": "", "sections": ["autocallables", "reverse-convertible", "principal-protected-note", "worst-of-correlation", "swaptions", "delta-one-products"], "degree": 9}, {"id": "stationarity-ar1", "title": "Stationarity & AR(1)", "type": "concept", "domain": "signal-research", "tags": ["time-series", "random-walk", "spurious-regression"], "path": "topics/time-series-validation.md", "content": "<a id=\"stationarity-ar1\"><\/a>\n\n## Stationarity & AR(1)\n<!-- section: stationarity-ar1 | prerequisites: [variance-covariance-correlation] | related: [effective-sample-size, robust-standard-errors, sharpe-ratio, markov-chains] | tags: [time-series, random-walk, spurious-regression] -->\n\nWeak stationarity: constant mean, finite constant variance, $\\mathrm{Cov}(X_t,X_{t-k})=\\gamma_k$ depends only on lag.\n\n$$X_t=c+\\varphi X_{t-1}+\\varepsilon_t,\\ |\\varphi|<1:\\quad E=\\frac{c}{1-\\varphi},\\ \\mathrm{Var}=\\frac{\\sigma_\\varepsilon^2}{1-\\varphi^2},\\ \\rho_k=\\varphi^k$$\n\n**Variables:**\n\n- $c$ constant\n- $\\varphi$ AR coefficient\n- $\\varepsilon_t$ iid innovations (var $\\sigma_\\varepsilon^2$)\n- $\\rho_k=\\gamma_k/\\gamma_0$ autocorrelation\n\n- $\\varphi=1$: random walk, non-stationary → regressing unrelated price **levels** gives spurious \"relationships\".\n- A stable-looking plot is not proof of stationarity.\n\n### Connections\n- **Consequences:** [[effective-sample-size]], [[robust-standard-errors]], Sharpe annualisation in [[sharpe-ratio]].", "summary": "<a id=\"stationarity-ar1\"><\/a>", "topic": "time-series-validation", "degree": 14}, {"id": "effective-sample-size", "title": "Effective Sample Size under Autocorrelation", "type": "concept", "domain": "signal-research", "tags": ["autocorrelation", "standard-error"], "path": "topics/time-series-validation.md", "content": "<a id=\"effective-sample-size\"><\/a>\n\n## Effective Sample Size under Autocorrelation\n<!-- section: effective-sample-size | prerequisites: [stationarity-ar1, lln-clt] | related: [sharpe-ratio, regression-invariances, bootstrap] | tags: [autocorrelation, standard-error] -->\n\n$$\\mathrm{Var}(\\bar X)=\\frac{\\sigma^2}{n}\\Big[1+2\\sum_{k=1}^{n-1}\\big(1-\\tfrac kn\\big)\\rho_k\\Big],\\qquad n_{\\text{eff}}\\approx\\frac{n}{1+2\\sum_{k\\ge1}\\rho_k}\\overset{AR(1)}{=}n\\frac{1-\\varphi}{1+\\varphi}$$\n\n**Variables:**\n\n- $\\rho_k$ lag-$k$ autocorrelation\n- $\\varphi$ AR(1) coefficient\n\n- $\\varphi=0.5$ → $n_{\\text{eff}}\\approx n/3$. Negative dependence can give $n_{\\text{eff}}>n$.\n- 1,000 stocks on one date ≠ 1,000 independent observations (common shock) → cluster / block.\n\n### Connections\n- **Applies to:** [[sharpe-ratio]] (autocorrelated returns), [[regression-invariances]] (duplicated rows), [[bootstrap]] (block version).", "summary": "<a id=\"effective-sample-size\"><\/a>", "topic": "time-series-validation", "degree": 11}, {"id": "cross-validation-leakage", "title": "Validation, Walk-Forward CV & Leakage", "type": "concept", "domain": "signal-research", "tags": ["walk-forward", "purging", "leakage"], "path": "topics/time-series-validation.md", "content": "<a id=\"cross-validation-leakage\"><\/a>\n\n## Validation, Walk-Forward CV & Leakage\n<!-- section: cross-validation-leakage | prerequisites: [bias-variance-tradeoff] | related: [backtest-pitfalls, stationarity-ar1, research-workflow] | tags: [walk-forward, purging, leakage] -->\n\n- **Train** fits params; **validation** picks hyper-params; **test** is touched once. Re-using the test set turns it into validation.\n- Time series: **walk-forward** (train on past, test on next window, roll). **Purge / gap** overlapping label windows.\n\n### Leakage checklist\n- Random splits with overlapping labels.\n- Training labels extending into the validation period.\n- Standardising / selecting features using future data.\n- Revised (not point-in-time) economic data.\n- Trading at a close you couldn't have observed before deciding.\n\n### Connections\n- **Main cause of:** [[backtest-pitfalls]]. **Part of:** [[research-workflow]].", "summary": "<a id=\"cross-validation-leakage\"><\/a>", "topic": "time-series-validation", "degree": 11}, {"id": "time-series-validation", "title": "Time Series & Validation", "type": "topic", "domain": "signal-research", "tags": [], "path": "topics/time-series-validation.md", "content": "# Time Series & Validation\n\n**Sections:** [[stationarity-ar1]] · [[effective-sample-size]] · [[cross-validation-leakage]]\n\n<a id=\"stationarity-ar1\"><\/a>\n\n## Stationarity & AR(1)\n<!-- section: stationarity-ar1 | prerequisites: [variance-covariance-correlation] | related: [effective-sample-size, robust-standard-errors, sharpe-ratio, markov-chains] | tags: [time-series, random-walk, spurious-regression] -->\n\nWeak stationarity: constant mean, finite constant variance, $\\mathrm{Cov}(X_t,X_{t-k})=\\gamma_k$ depends only on lag.\n\n$$X_t=c+\\varphi X_{t-1}+\\varepsilon_t,\\ |\\varphi|<1:\\quad E=\\frac{c}{1-\\varphi},\\ \\mathrm{Var}=\\frac{\\sigma_\\varepsilon^2}{1-\\varphi^2},\\ \\rho_k=\\varphi^k$$\n\n**Variables:**\n\n- $c$ constant\n- $\\varphi$ AR coefficient\n- $\\varepsilon_t$ iid innovations (var $\\sigma_\\varepsilon^2$)\n- $\\rho_k=\\gamma_k/\\gamma_0$ autocorrelation\n\n- $\\varphi=1$: random walk, non-stationary → regressing unrelated price **levels** gives spurious \"relationships\".\n- A stable-looking plot is not proof of stationarity.\n\n### Connections\n- **Consequences:** [[effective-sample-size]], [[robust-standard-errors]], Sharpe annualisation in [[sharpe-ratio]].\n\n<a id=\"effective-sample-size\"><\/a>\n\n## Effective Sample Size under Autocorrelation\n<!-- section: effective-sample-size | prerequisites: [stationarity-ar1, lln-clt] | related: [sharpe-ratio, regression-invariances, bootstrap] | tags: [autocorrelation, standard-error] -->\n\n$$\\mathrm{Var}(\\bar X)=\\frac{\\sigma^2}{n}\\Big[1+2\\sum_{k=1}^{n-1}\\big(1-\\tfrac kn\\big)\\rho_k\\Big],\\qquad n_{\\text{eff}}\\approx\\frac{n}{1+2\\sum_{k\\ge1}\\rho_k}\\overset{AR(1)}{=}n\\frac{1-\\varphi}{1+\\varphi}$$\n\n**Variables:**\n\n- $\\rho_k$ lag-$k$ autocorrelation\n- $\\varphi$ AR(1) coefficient\n\n- $\\varphi=0.5$ → $n_{\\text{eff}}\\approx n/3$. Negative dependence can give $n_{\\text{eff}}>n$.\n- 1,000 stocks on one date ≠ 1,000 independent observations (common shock) → cluster / block.\n\n### Connections\n- **Applies to:** [[sharpe-ratio]] (autocorrelated returns), [[regression-invariances]] (duplicated rows), [[bootstrap]] (block version).\n\n<a id=\"cross-validation-leakage\"><\/a>\n\n## Validation, Walk-Forward CV & Leakage\n<!-- section: cross-validation-leakage | prerequisites: [bias-variance-tradeoff] | related: [backtest-pitfalls, stationarity-ar1, research-workflow] | tags: [walk-forward, purging, leakage] -->\n\n- **Train** fits params; **validation** picks hyper-params; **test** is touched once. Re-using the test set turns it into validation.\n- Time series: **walk-forward** (train on past, test on next window, roll). **Purge / gap** overlapping label windows.\n\n### Leakage checklist\n- Random splits with overlapping labels.\n- Training labels extending into the validation period.\n- Standardising / selecting features using future data.\n- Revised (not point-in-time) economic data.\n- Trading at a close you couldn't have observed before deciding.\n\n### Connections\n- **Main cause of:** [[backtest-pitfalls]]. **Part of:** [[research-workflow]].", "summary": "", "topic": "", "sections": ["stationarity-ar1", "effective-sample-size", "cross-validation-leakage"], "degree": 5}, {"id": "volatility-surface", "title": "The Volatility Surface σ(K,T)", "type": "concept", "domain": "quant-models", "tags": ["smile", "skew", "surface"], "path": "topics/vol-surface-construction-chapter.md", "content": "<a id=\"volatility-surface\"><\/a>\n\n## The Volatility Surface σ(K,T)\n<!-- section: volatility-surface | prerequisites: [implied-volatility] | related: [volatility-skew, vol-term-structure, vol-surface-construction, breeden-litzenberger, sticky-strike-vs-sticky-moneyness, local-volatility-dupire] | tags: [smile, skew, surface] -->\n\n$$\\sigma_{imp}=f(K,T)$$\n\n**Variables:**\n\n- $K$ strike (or moneyness $k=\\ln(K/F)$, or delta)\n- $T$ expiry\n\n- One point = single option IV; fix $T$ → **smile/skew**; fix $K$ → **term structure**; both → **surface**.\n- If BS were right: a flat plane. Departure from flat = how wrong BS is (equity skew in modern form since 1987).\n- Surface ⇔ full set of call prices ⇔ risk-neutral density per maturity ([[breeden-litzenberger]]) ⇒ **European payoffs are model-free**; BS is just a coordinate system.\n- **Interpolate vol (or total variance), not price**: prices are convex in K and grow ~√T → linear price interpolation is biased (2M 4800 put: price-interp 67.90, vol-interp 70.80, truth 71.98).\n- Where BS still bites: **Greeks** (surface dynamics) and **path-dependent / forward-start** payoffs.\n\n### Worked example (index at 5000, synthetic)\n| Expiry | ATM-fwd vol | 90% | 110% | 90–110 skew |\n|---|---|---|---|---|\n| 1M | 14.98% | 25.84% | 11.34% | 14.5 pts |\n| 3M | 16.49% | 23.30% | 11.91% | 11.4 pts |\n| 6M | 17.48% | 22.43% | 13.45% | 9.0 pts |\n\nTypical: upward ATM term structure, skew flattening with maturity.\n\n### Connections\n- **Shape:** [[volatility-skew]], [[vol-term-structure]]. **Build:** [[vol-surface-construction]]. **Dynamics:** [[sticky-strike-vs-sticky-moneyness]].\n- **Models on top:** [[local-volatility-dupire]], [[heston-model]], [[local-stochastic-volatility]].", "summary": "<a id=\"volatility-surface\"><\/a>", "topic": "vol-surface-construction-chapter", "degree": 24}, {"id": "vol-surface-construction", "title": "Building a Vol Surface (the desk recipe)", "type": "concept", "domain": "quant-models", "tags": ["pipeline", "calibration", "real-time"], "path": "topics/vol-surface-construction-chapter.md", "content": "<a id=\"vol-surface-construction\"><\/a>\n\n## Building a Vol Surface (the desk recipe)\n<!-- section: vol-surface-construction | prerequisites: [volatility-surface, put-call-parity] | related: [implied-forward-regression, otm-stitching, svi, surface-no-arbitrage, american-early-exercise, sticky-strike-vs-sticky-moneyness, model-risk-governance] | tags: [pipeline, calibration, real-time] -->\n\n### The 6-step recipe\n1. **Clean quotes** — mids; drop zero bids, crossed, stale, abnormally wide (VIX drops puts after two consecutive zero-bid strikes).\n2. **Extract $F$ and $D$** per expiry from parity → [[implied-forward-regression]].\n3. **Invert OTM options only** (puts below F, calls above) → [[otm-stitching]].\n4. **Fit a smooth smile** per expiry: [[svi]] (equity), [[sabr]] (rates/FX), spline/kernel. Weighted LS (1/spread², vega); fit **inside bid/ask**.\n5. **Interpolate across expiries in total variance** $w=\\sigma^2T$ at constant log-moneyness ([[vol-term-structure]]).\n6. **Check no-arbitrage**: calendar, butterfly, wings → [[surface-no-arbitrage]].\n\nThen: **state the dynamics** (sticky strike / moneyness) — Greeks are meaningless without it.\n\n### Real-time design (RBC Q5b.10)\nIngest bid/ask → filter → forward & IV per expiry → SVI/SSVI fit with **warm start** → arbitrage checks → publish **immutable versioned snapshot** → reprice only affected trades, throttled. Speed: incremental fits, vectorised IV, expiries in parallel.\n\n### Robustness to one bad quote\nVega / inverse-spread weights, bid–ask band, robust loss, reject no-arb violators, trader overrides with audit trail.\n\n### Asset-class differences\n- **Index:** dense listed strikes; recipe applies directly.\n- **Single stock:** de-Americanise ([[american-early-exercise]]), imply discrete dividends/borrow per expiry, strip earnings event variance; thinner liquidity.\n- **FX:** market quotes vols (ATM/RR/BF) → [[fx-vol-conventions]].\n- **Rates:** swaption cube, normal vol, (shifted) SABR → [[sabr]].\n\n### Daily practice\nSynchronise spot/option snapshots; trading-time not calendar-time; event variance; independent price verification vs consensus (Totem), P&L explain → [[model-risk-governance]].\n\n### Who builds them\nSell-side market makers (intraday; SVI/SSVI, Orc wing, SABR + trader overrides); buy-side consumes vendors (Bloomberg BVOL, OptionMetrics, ORATS); Cboe's VIX uses the same inputs (OTM + parity forward).", "summary": "<a id=\"vol-surface-construction\"><\/a>", "topic": "vol-surface-construction-chapter", "degree": 19}, {"id": "implied-forward-regression", "title": "Implied Forward & Discount via Parity Regression", "type": "concept", "domain": "quant-models", "tags": ["parity", "ols", "implied-dividend", "box-spread"], "path": "topics/vol-surface-construction-chapter.md", "content": "<a id=\"implied-forward-regression\"><\/a>\n\n## Implied Forward & Discount via Parity Regression\n<!-- section: implied-forward-regression | prerequisites: [put-call-parity, ols-regression] | related: [forward-pricing, black-76, delta-one-products, discounting-compounding, vol-surface-construction] | tags: [parity, ols, implied-dividend, box-spread] -->\n\n$$Y_i=C_{mkt}(K_i)-P_{mkt}(K_i)=\\underbrace{DF}_{\\alpha}+\\underbrace{(-D)}_{\\beta}K_i\\ \\Rightarrow\\ D=-\\beta,\\ \\ F=\\frac{\\alpha}{D}=-\\frac\\alpha\\beta$$\n$$r_{imp}=-\\frac{\\ln D}{T},\\qquad q_{imp}=r_{imp}-\\frac1T\\ln\\frac FS$$\n\n**Variables:**\n\n- $C,P$ call/put mids at strike $K_i$\n- $D$ discount factor\n- $F$ forward\n- α intercept, β slope\n- $S$ spot\n- $q_{imp}$ implied dividend + borrow\n\n### Why it's needed\nDiscrete dividends, hard-to-borrow repo and dealer funding are unobservable; plugging in Treasury rates / dividend guesses makes call and put IVs **diverge near ATM**.\n\n### Why regress, not solve from two strikes\nSlope is fragile when strikes are close:\n\n| Strikes used | D | implied r | F |\n|---|---|---|---|\n| 4900 & 5100 | 0.98250 | 7.08% ✗ | 5031.30 |\n| 4300 & 5700 | 0.98966 | 4.17% | 5031.16 |\n| All 15 (OLS) | 0.99004 | 4.02% | 5031.29 |\n| Truth | 0.99008 | 4.00% | 5031.26 |\n\n- **F** is robust (level of the line); **D** (slope) is not.\n- Alternative for illiquid names: take $D$ from the curve, solve $F_i=K_i+(C_i-P_i)/D$ near ATM.\n- VIX does a version at the strike with smallest $|C-P|$.\n\n### Interpretation\n- Slope = **box-spread** discount factor: $[C-P](K_1)-[C-P](K_2)=D(K_2-K_1)$.\n- Option-implied rates ≠ Treasuries — Treasuries yield ~40 bp less (convenience yield; van Binsbergen–Diamond–Grotteria).\n\n### Connections\n- **Uses:** [[put-call-parity]] + [[ols-regression]] — a nice cross-domain link (stats ↔ derivatives).\n- **Feeds:** [[black-76]] inversion, [[delta-one-products]] (implied dividends/borrow), [[vol-surface-construction]] step 2.", "summary": "<a id=\"implied-forward-regression\"><\/a>", "topic": "vol-surface-construction-chapter", "degree": 15}, {"id": "otm-stitching", "title": "OTM Liquidity Stitching (why discard ITM quotes)", "type": "concept", "domain": "quant-models", "tags": ["otm", "vega", "data-cleaning"], "path": "topics/vol-surface-construction-chapter.md", "content": "<a id=\"otm-stitching\"><\/a>\n\n## OTM Liquidity Stitching (why discard ITM quotes)\n<!-- section: otm-stitching | prerequisites: [put-call-parity, implied-volatility] | related: [vol-surface-construction, variance-swaps] | tags: [otm, vega, data-cleaning] -->\n\n**Rule:** left wing ($K<F$) from OTM **puts**, right wing ($K>F$) from OTM **calls**, blend around $K\\approx F$.\n\n### Why discard deep ITM\n1. **Vanishing vega:** ITM ≈ intrinsic value; $\\Delta\\sigma\\approx\\Delta\\text{Price}/\\mathcal V$ — a 1-tick bounce ÷ tiny vega = huge fake vol noise.\n2. **Wide, stale bid–ask:** capital-heavy, costly to delta-hedge.\n\nNothing is lost: by [[put-call-parity]], ITM call IV = OTM put IV at the same strike, so the surface joins seamlessly at $K=F$.\n\nAlso: filter quotes violating conversion/reversal or box bounds before SVI/SABR.\n\n### Connections\n- **Same OTM strip used in:** [[variance-swaps]] / VIX. **Step 3 of:** [[vol-surface-construction]].", "summary": "<a id=\"otm-stitching\"><\/a>", "topic": "vol-surface-construction-chapter", "degree": 9}, {"id": "svi", "title": "SVI Smile Parametrisation", "type": "concept", "domain": "quant-models", "tags": ["svi", "ssvi", "parametrisation"], "path": "topics/vol-surface-construction-chapter.md", "content": "<a id=\"svi\"><\/a>\n\n## SVI Smile Parametrisation\n<!-- section: svi | prerequisites: [volatility-surface, vol-term-structure] | related: [surface-no-arbitrage, vol-surface-construction, sabr, local-volatility-dupire] | tags: [svi, ssvi, parametrisation] -->\n\n$$w(k)=a+b\\Big[\\rho(k-m)+\\sqrt{(k-m)^2+\\sigma^2}\\Big]$$\n\n**Variables:**\n\n- $w=\\sigma_{BS}^2T$ total implied variance\n- $k=\\ln(K/F)$ log-moneyness\n- $a$ level\n- $b$ wing slope\n- ρ skew/rotation ($-1<\\rho<1$, negative for equity)\n- $m$ horizontal shift\n- σ ATM curvature\n\n- Weighted least squares (1/spread², vega). Example 3M fit: $a=0.0012,b=0.0443,\\rho=-0.595,m=0.0616,\\sigma=0.0645$, 15/15 inside bid/ask.\n- Linear wings in $|k|$ satisfy **Lee's bound** iff $b(1\\pm\\rho)\\le2$.\n- SSVI (surface SVI) has known no-arbitrage conditions (Gatheral & Jacquier).\n- Smooth fits matter because [[local-volatility-dupire]] divides by the density.\n\n### Connections\n- **Checked by:** [[surface-no-arbitrage]]. **Alternative:** [[sabr]].", "summary": "<a id=\"svi\"><\/a>", "topic": "vol-surface-construction-chapter", "degree": 14}, {"id": "surface-no-arbitrage", "title": "No-Arbitrage Conditions on a Vol Surface", "type": "concept", "domain": "quant-models", "tags": ["calendar", "butterfly", "lee"], "path": "topics/vol-surface-construction-chapter.md", "content": "<a id=\"surface-no-arbitrage\"><\/a>\n\n## No-Arbitrage Conditions on a Vol Surface\n<!-- section: surface-no-arbitrage | prerequisites: [volatility-surface, breeden-litzenberger, vol-term-structure] | related: [svi, option-price-bounds, no-arbitrage] | tags: [calendar, butterfly, lee] -->\n\n| Condition | Statement |\n|---|---|\n| **Calendar** | total variance $w(k,T)$ non-decreasing in $T$ at fixed $k$ |\n| **Butterfly** | $C$ convex in $K$ ⇔ density $q_T(K)=\\frac1D\\partial^2C/\\partial K^2\\ge0$ |\n| **Call spread** | $-D\\le\\partial C/\\partial K\\le0$ |\n| **Wings (Lee)** | $\\limsup_{|k|\\to\\infty}w(k)/|k|\\le2$ |\n\n**Variables:**\n\n- $w=\\sigma^2T$\n- $k=\\ln(K/F)$\n- $C(K)$ call price\n- $D$ discount factor\n- $q_T$ risk-neutral density\n\nFit inside bid/ask ≠ done: also check stability vs yesterday's parameters and choose dynamics.\n\n### Connections\n- **From:** [[breeden-litzenberger]] (butterfly), [[vol-term-structure]] (calendar), [[option-price-bounds]] (call spread). **Parametrisation satisfying Lee:** [[svi]].", "summary": "<a id=\"surface-no-arbitrage\"><\/a>", "topic": "vol-surface-construction-chapter", "degree": 14}, {"id": "breeden-litzenberger", "title": "Breeden–Litzenberger (density from option prices)", "type": "concept", "domain": "quant-models", "tags": ["risk-neutral-density", "butterfly", "static-replication"], "path": "topics/vol-surface-construction-chapter.md", "content": "<a id=\"breeden-litzenberger\"><\/a>\n\n## Breeden–Litzenberger (density from option prices)\n<!-- section: breeden-litzenberger | prerequisites: [risk-neutral-pricing, option-payoffs-moneyness] | related: [digital-options, surface-no-arbitrage, static-replication, volatility-surface] | tags: [risk-neutral-density, butterfly, static-replication] -->\n\n$$q_T(K)=\\frac1D\\frac{\\partial^2C(K,T)}{\\partial K^2}=e^{rT}\\frac{\\partial^2C}{\\partial K^2},\\qquad \\text{Digital}(K)=-\\frac{\\partial C}{\\partial K}$$\n\n**Variables:**\n\n- $q_T(K)$ risk-neutral density of $S_T$ at $K$\n- $C(K,T)$ call price read off the surface\n- $D=e^{-rT}$\n\n- 1st derivative in strike → digital (tight call spread); 2nd → density (tight butterfly).\n- Butterfly price ≥ 0 ⇔ density ≥ 0 → butterfly-arbitrage check.\n- Surface ⇔ densities ⇔ all European payoffs priced model-free.\n\n### Connections\n- **Gives:** [[digital-options]] (1st derivative), [[surface-no-arbitrage]] (2nd). **General principle:** [[static-replication]].", "summary": "<a id=\"breeden-litzenberger\"><\/a>", "topic": "vol-surface-construction-chapter", "degree": 16}, {"id": "vol-surface-construction-chapter", "title": "Building the Vol Surface", "type": "topic", "domain": "quant-models", "tags": [], "path": "topics/vol-surface-construction-chapter.md", "content": "# Building the Vol Surface\n\n**Sections:** [[volatility-surface]] · [[vol-surface-construction]] · [[implied-forward-regression]] · [[otm-stitching]] · [[svi]] · [[surface-no-arbitrage]] · [[breeden-litzenberger]]\n\n<a id=\"volatility-surface\"><\/a>\n\n## The Volatility Surface σ(K,T)\n<!-- section: volatility-surface | prerequisites: [implied-volatility] | related: [volatility-skew, vol-term-structure, vol-surface-construction, breeden-litzenberger, sticky-strike-vs-sticky-moneyness, local-volatility-dupire] | tags: [smile, skew, surface] -->\n\n$$\\sigma_{imp}=f(K,T)$$\n\n**Variables:**\n\n- $K$ strike (or moneyness $k=\\ln(K/F)$, or delta)\n- $T$ expiry\n\n- One point = single option IV; fix $T$ → **smile/skew**; fix $K$ → **term structure**; both → **surface**.\n- If BS were right: a flat plane. Departure from flat = how wrong BS is (equity skew in modern form since 1987).\n- Surface ⇔ full set of call prices ⇔ risk-neutral density per maturity ([[breeden-litzenberger]]) ⇒ **European payoffs are model-free**; BS is just a coordinate system.\n- **Interpolate vol (or total variance), not price**: prices are convex in K and grow ~√T → linear price interpolation is biased (2M 4800 put: price-interp 67.90, vol-interp 70.80, truth 71.98).\n- Where BS still bites: **Greeks** (surface dynamics) and **path-dependent / forward-start** payoffs.\n\n### Worked example (index at 5000, synthetic)\n| Expiry | ATM-fwd vol | 90% | 110% | 90–110 skew |\n|---|---|---|---|---|\n| 1M | 14.98% | 25.84% | 11.34% | 14.5 pts |\n| 3M | 16.49% | 23.30% | 11.91% | 11.4 pts |\n| 6M | 17.48% | 22.43% | 13.45% | 9.0 pts |\n\nTypical: upward ATM term structure, skew flattening with maturity.\n\n### Connections\n- **Shape:** [[volatility-skew]], [[vol-term-structure]]. **Build:** [[vol-surface-construction]]. **Dynamics:** [[sticky-strike-vs-sticky-moneyness]].\n- **Models on top:** [[local-volatility-dupire]], [[heston-model]], [[local-stochastic-volatility]].\n\n<a id=\"vol-surface-construction\"><\/a>\n\n## Building a Vol Surface (the desk recipe)\n<!-- section: vol-surface-construction | prerequisites: [volatility-surface, put-call-parity] | related: [implied-forward-regression, otm-stitching, svi, surface-no-arbitrage, american-early-exercise, sticky-strike-vs-sticky-moneyness, model-risk-governance] | tags: [pipeline, calibration, real-time] -->\n\n### The 6-step recipe\n1. **Clean quotes** — mids; drop zero bids, crossed, stale, abnormally wide (VIX drops puts after two consecutive zero-bid strikes).\n2. **Extract $F$ and $D$** per expiry from parity → [[implied-forward-regression]].\n3. **Invert OTM options only** (puts below F, calls above) → [[otm-stitching]].\n4. **Fit a smooth smile** per expiry: [[svi]] (equity), [[sabr]] (rates/FX), spline/kernel. Weighted LS (1/spread², vega); fit **inside bid/ask**.\n5. **Interpolate across expiries in total variance** $w=\\sigma^2T$ at constant log-moneyness ([[vol-term-structure]]).\n6. **Check no-arbitrage**: calendar, butterfly, wings → [[surface-no-arbitrage]].\n\nThen: **state the dynamics** (sticky strike / moneyness) — Greeks are meaningless without it.\n\n### Real-time design (RBC Q5b.10)\nIngest bid/ask → filter → forward & IV per expiry → SVI/SSVI fit with **warm start** → arbitrage checks → publish **immutable versioned snapshot** → reprice only affected trades, throttled. Speed: incremental fits, vectorised IV, expiries in parallel.\n\n### Robustness to one bad quote\nVega / inverse-spread weights, bid–ask band, robust loss, reject no-arb violators, trader overrides with audit trail.\n\n### Asset-class differences\n- **Index:** dense listed strikes; recipe applies directly.\n- **Single stock:** de-Americanise ([[american-early-exercise]]), imply discrete dividends/borrow per expiry, strip earnings event variance; thinner liquidity.\n- **FX:** market quotes vols (ATM/RR/BF) → [[fx-vol-conventions]].\n- **Rates:** swaption cube, normal vol, (shifted) SABR → [[sabr]].\n\n### Daily practice\nSynchronise spot/option snapshots; trading-time not calendar-time; event variance; independent price verification vs consensus (Totem), P&L explain → [[model-risk-governance]].\n\n### Who builds them\nSell-side market makers (intraday; SVI/SSVI, Orc wing, SABR + trader overrides); buy-side consumes vendors (Bloomberg BVOL, OptionMetrics, ORATS); Cboe's VIX uses the same inputs (OTM + parity forward).\n\n<a id=\"implied-forward-regression\"><\/a>\n\n## Implied Forward & Discount via Parity Regression\n<!-- section: implied-forward-regression | prerequisites: [put-call-parity, ols-regression] | related: [forward-pricing, black-76, delta-one-products, discounting-compounding, vol-surface-construction] | tags: [parity, ols, implied-dividend, box-spread] -->\n\n$$Y_i=C_{mkt}(K_i)-P_{mkt}(K_i)=\\underbrace{DF}_{\\alpha}+\\underbrace{(-D)}_{\\beta}K_i\\ \\Rightarrow\\ D=-\\beta,\\ \\ F=\\frac{\\alpha}{D}=-\\frac\\alpha\\beta$$\n$$r_{imp}=-\\frac{\\ln D}{T},\\qquad q_{imp}=r_{imp}-\\frac1T\\ln\\frac FS$$\n\n**Variables:**\n\n- $C,P$ call/put mids at strike $K_i$\n- $D$ discount factor\n- $F$ forward\n- α intercept, β slope\n- $S$ spot\n- $q_{imp}$ implied dividend + borrow\n\n### Why it's needed\nDiscrete dividends, hard-to-borrow repo and dealer funding are unobservable; plugging in Treasury rates / dividend guesses makes call and put IVs **diverge near ATM**.\n\n### Why regress, not solve from two strikes\nSlope is fragile when strikes are close:\n\n| Strikes used | D | implied r | F |\n|---|---|---|---|\n| 4900 & 5100 | 0.98250 | 7.08% ✗ | 5031.30 |\n| 4300 & 5700 | 0.98966 | 4.17% | 5031.16 |\n| All 15 (OLS) | 0.99004 | 4.02% | 5031.29 |\n| Truth | 0.99008 | 4.00% | 5031.26 |\n\n- **F** is robust (level of the line); **D** (slope) is not.\n- Alternative for illiquid names: take $D$ from the curve, solve $F_i=K_i+(C_i-P_i)/D$ near ATM.\n- VIX does a version at the strike with smallest $|C-P|$.\n\n### Interpretation\n- Slope = **box-spread** discount factor: $[C-P](K_1)-[C-P](K_2)=D(K_2-K_1)$.\n- Option-implied rates ≠ Treasuries — Treasuries yield ~40 bp less (convenience yield; van Binsbergen–Diamond–Grotteria).\n\n### Connections\n- **Uses:** [[put-call-parity]] + [[ols-regression]] — a nice cross-domain link (stats ↔ derivatives).\n- **Feeds:** [[black-76]] inversion, [[delta-one-products]] (implied dividends/borrow), [[vol-surface-construction]] step 2.\n\n<a id=\"otm-stitching\"><\/a>\n\n## OTM Liquidity Stitching (why discard ITM quotes)\n<!-- section: otm-stitching | prerequisites: [put-call-parity, implied-volatility] | related: [vol-surface-construction, variance-swaps] | tags: [otm, vega, data-cleaning] -->\n\n**Rule:** left wing ($K<F$) from OTM **puts**, right wing ($K>F$) from OTM **calls**, blend around $K\\approx F$.\n\n### Why discard deep ITM\n1. **Vanishing vega:** ITM ≈ intrinsic value; $\\Delta\\sigma\\approx\\Delta\\text{Price}/\\mathcal V$ — a 1-tick bounce ÷ tiny vega = huge fake vol noise.\n2. **Wide, stale bid–ask:** capital-heavy, costly to delta-hedge.\n\nNothing is lost: by [[put-call-parity]], ITM call IV = OTM put IV at the same strike, so the surface joins seamlessly at $K=F$.\n\nAlso: filter quotes violating conversion/reversal or box bounds before SVI/SABR.\n\n### Connections\n- **Same OTM strip used in:** [[variance-swaps]] / VIX. **Step 3 of:** [[vol-surface-construction]].\n\n<a id=\"svi\"><\/a>\n\n## SVI Smile Parametrisation\n<!-- section: svi | prerequisites: [volatility-surface, vol-term-structure] | related: [surface-no-arbitrage, vol-surface-construction, sabr, local-volatility-dupire] | tags: [svi, ssvi, parametrisation] -->\n\n$$w(k)=a+b\\Big[\\rho(k-m)+\\sqrt{(k-m)^2+\\sigma^2}\\Big]$$\n\n**Variables:**\n\n- $w=\\sigma_{BS}^2T$ total implied variance\n- $k=\\ln(K/F)$ log-moneyness\n- $a$ level\n- $b$ wing slope\n- ρ skew/rotation ($-1<\\rho<1$, negative for equity)\n- $m$ horizontal shift\n- σ ATM curvature\n\n- Weighted least squares (1/spread², vega). Example 3M fit: $a=0.0012,b=0.0443,\\rho=-0.595,m=0.0616,\\sigma=0.0645$, 15/15 inside bid/ask.\n- Linear wings in $|k|$ satisfy **Lee's bound** iff $b(1\\pm\\rho)\\le2$.\n- SSVI (surface SVI) has known no-arbitrage conditions (Gatheral & Jacquier).\n- Smooth fits matter because [[local-volatility-dupire]] divides by the density.\n\n### Connections\n- **Checked by:** [[surface-no-arbitrage]]. **Alternative:** [[sabr]].\n\n<a id=\"surface-no-arbitrage\"><\/a>\n\n## No-Arbitrage Conditions on a Vol Surface\n<!-- section: surface-no-arbitrage | prerequisites: [volatility-surface, breeden-litzenberger, vol-term-structure] | related: [svi, option-price-bounds, no-arbitrage] | tags: [calendar, butterfly, lee] -->\n\n| Condition | Statement |\n|---|---|\n| **Calendar** | total variance $w(k,T)$ non-decreasing in $T$ at fixed $k$ |\n| **Butterfly** | $C$ convex in $K$ ⇔ density $q_T(K)=\\frac1D\\partial^2C/\\partial K^2\\ge0$ |\n| **Call spread** | $-D\\le\\partial C/\\partial K\\le0$ |\n| **Wings (Lee)** | $\\limsup_{|k|\\to\\infty}w(k)/|k|\\le2$ |\n\n**Variables:**\n\n- $w=\\sigma^2T$\n- $k=\\ln(K/F)$\n- $C(K)$ call price\n- $D$ discount factor\n- $q_T$ risk-neutral density\n\nFit inside bid/ask ≠ done: also check stability vs yesterday's parameters and choose dynamics.\n\n### Connections\n- **From:** [[breeden-litzenberger]] (butterfly), [[vol-term-structure]] (calendar), [[option-price-bounds]] (call spread). **Parametrisation satisfying Lee:** [[svi]].\n\n<a id=\"breeden-litzenberger\"><\/a>\n\n## Breeden–Litzenberger (density from option prices)\n<!-- section: breeden-litzenberger | prerequisites: [risk-neutral-pricing, option-payoffs-moneyness] | related: [digital-options, surface-no-arbitrage, static-replication, volatility-surface] | tags: [risk-neutral-density, butterfly, static-replication] -->\n\n$$q_T(K)=\\frac1D\\frac{\\partial^2C(K,T)}{\\partial K^2}=e^{rT}\\frac{\\partial^2C}{\\partial K^2},\\qquad \\text{Digital}(K)=-\\frac{\\partial C}{\\partial K}$$\n\n**Variables:**\n\n- $q_T(K)$ risk-neutral density of $S_T$ at $K$\n- $C(K,T)$ call price read off the surface\n- $D=e^{-rT}$\n\n- 1st derivative in strike → digital (tight call spread); 2nd → density (tight butterfly).\n- Butterfly price ≥ 0 ⇔ density ≥ 0 → butterfly-arbitrage check.\n- Surface ⇔ densities ⇔ all European payoffs priced model-free.\n\n### Connections\n- **Gives:** [[digital-options]] (1st derivative), [[surface-no-arbitrage]] (2nd). **General principle:** [[static-replication]].", "summary": "", "topic": "", "sections": ["volatility-surface", "vol-surface-construction", "implied-forward-regression", "otm-stitching", "svi", "surface-no-arbitrage", "breeden-litzenberger"], "degree": 11}, {"id": "local-volatility-dupire", "title": "Local Volatility (Dupire)", "type": "concept", "domain": "quant-models", "tags": ["local-vol", "dupire"], "path": "topics/volatility-models.md", "content": "<a id=\"local-volatility-dupire\"><\/a>\n\n## Local Volatility (Dupire)\n<!-- section: local-volatility-dupire | prerequisites: [volatility-surface, breeden-litzenberger] | related: [heston-model, local-stochastic-volatility, forward-smile, barrier-options, svi, pde-finite-difference] | tags: [local-vol, dupire] -->\n\n$$\\sigma_{loc}^2(K,T)=\\frac{\\partial C/\\partial T+(r-q)K\\,\\partial C/\\partial K+qC}{\\tfrac12K^2\\,\\partial^2C/\\partial K^2}$$\n\n**Variables:**\n\n- $C(K,T)$ call-price surface\n- $\\sigma_{loc}(S,t)$ local vol at spot level $K$ and time $T$\n- $r,q$ rate and dividend yield\n\n| Pros | Cons |\n|---|---|\n| Fits today's surface **exactly**; fast PDE | **Forward smile too flat** → misprices forward-start, cliquets; wrong dynamics |\n\n- Denominator ∝ density → numerically unstable unless the surface is smooth & arbitrage-free → fit [[svi]] first.\n- Standard for short-dated barriers / first pass.\n\n### Connections\n- **Needs:** [[breeden-litzenberger]] density. **Fails at:** [[forward-smile]]. **Fixed by:** [[local-stochastic-volatility]].", "summary": "<a id=\"local-volatility-dupire\"><\/a>", "topic": "volatility-models", "degree": 16}, {"id": "heston-model", "title": "Heston Stochastic Volatility", "type": "concept", "domain": "quant-models", "tags": ["stochastic-vol", "heston", "feller"], "path": "topics/volatility-models.md", "content": "<a id=\"heston-model\"><\/a>\n\n## Heston Stochastic Volatility\n<!-- section: heston-model | prerequisites: [geometric-brownian-motion, ito-lemma] | related: [local-volatility-dupire, local-stochastic-volatility, volatility-skew, forward-smile, jump-diffusion] | tags: [stochastic-vol, heston, feller] -->\n\n$$dS_t=(r-q)S_tdt+\\sqrt{v_t}S_tdW^S_t,\\qquad dv_t=\\kappa(\\theta-v_t)dt+\\xi\\sqrt{v_t}dW^v_t,\\qquad d\\langle W^S,W^v\\rangle=\\rho\\,dt$$\n\n**Variables:**\n\n- $v_t$ instantaneous variance\n- κ mean-reversion speed\n- θ long-run variance\n- ξ vol-of-vol (smile curvature)\n- ρ spot–vol correlation (skew\n- negative for equity)\n\n- **Feller:** $2\\kappa\\theta>\\xi^2$ keeps $v_t>0$.\n- Pros: realistic dynamics, semi-closed-form vanillas. Cons: can't fit short-dated skew well; calibration unstable. (Bergomi family also used.)\n\n### Connections\n- **Skew source:** ρ < 0 → [[volatility-skew]]. **Short-dated fix:** [[jump-diffusion]]. **Combined with LV:** [[local-stochastic-volatility]].", "summary": "<a id=\"heston-model\"><\/a>", "topic": "volatility-models", "degree": 14}, {"id": "jump-diffusion", "title": "Jump-Diffusion (Merton, Bates)", "type": "concept", "domain": "quant-models", "tags": ["jumps", "short-dated-skew"], "path": "topics/volatility-models.md", "content": "<a id=\"jump-diffusion\"><\/a>\n\n## Jump-Diffusion (Merton, Bates)\n<!-- section: jump-diffusion | prerequisites: [geometric-brownian-motion, exponential-poisson-process] | related: [heston-model, volatility-skew, variance-swaps] | tags: [jumps, short-dated-skew] -->\n\nGBM + Poisson-arriving jumps (Merton); + stochastic vol (Bates).\n\n- **Pro:** generates steep **short-dated skew** that pure diffusions can't.\n- **Con:** jumps can't be delta-hedged; more parameters.\n- Jumps also cause replication error in [[variance-swaps]].", "summary": "<a id=\"jump-diffusion\"><\/a>", "topic": "volatility-models", "degree": 8}, {"id": "local-stochastic-volatility", "title": "Local-Stochastic Volatility (LSV)", "type": "concept", "domain": "quant-models", "tags": ["lsv", "leverage-function", "particle-method"], "path": "topics/volatility-models.md", "content": "<a id=\"local-stochastic-volatility\"><\/a>\n\n## Local-Stochastic Volatility (LSV)\n<!-- section: local-stochastic-volatility | prerequisites: [local-volatility-dupire, heston-model] | related: [autocallables, forward-smile, monte-carlo-pricing, barrier-options] | tags: [lsv, leverage-function, particle-method] -->\n\n$$\\frac{dS_t}{S_t}=(r-q)dt+L(S_t,t)\\sqrt{v_t}\\,dW_t$$\n\n**Variables:**\n\n- $L(S,t)$ leverage function calibrated so every vanilla is matched (particle methods standard)\n- $v_t$ stochastic variance (sets how the smile evolves)\n\n- Fits surface **exactly** + realistic dynamics → **industry standard for equity exotics**. Cons: complex, slow, needs a mixing parameter.\n- Around it: discrete cash dividends near-dated/yield further out; stochastic rates for long notes; correlation matrix for multi-asset.\n\n| Model | Fits vanillas | Dynamics | Used for |\n|---|---|---|---|\n| Flat BS | no | none | quoting, sanity |\n| Local vol | exactly | forward smile too flat | short barriers |\n| SV (Heston, Bergomi) | approx. | realistic | forward-start, vol-of-vol |\n| **LSV** | exactly | realistic | equity exotics |\n\n### Connections\n- **Used to price:** [[autocallables]], [[barrier-options]], [[cliquets-forward-start]] via [[monte-carlo-pricing]].", "summary": "<a id=\"local-stochastic-volatility\"><\/a>", "topic": "volatility-models", "degree": 14}, {"id": "sabr", "title": "SABR & Normal (Bachelier) Vol", "type": "concept", "domain": "quant-models", "tags": ["sabr", "rates", "normal-vol"], "path": "topics/volatility-models.md", "content": "<a id=\"sabr\"><\/a>\n\n## SABR & Normal (Bachelier) Vol\n<!-- section: sabr | prerequisites: [volatility-surface] | related: [svi, swaptions, fx-vol-conventions, black-76] | tags: [sabr, rates, normal-vol] -->\n\n- Stochastic-vol smile model fitted **per expiry** (per expiry–tenor pair in rates).\n- Standard for rates and FX smiles.\n- Since negative rates, rates vol quoted as **normal (Bachelier) vol in bp**, often with **shifted SABR**.\n- (Hagan et al.)\n\n### Connections\n- **Equity counterpart:** [[svi]]. **Used for:** [[swaptions]] cube, [[fx-vol-conventions]].", "summary": "<a id=\"sabr\"><\/a>", "topic": "volatility-models", "degree": 9}, {"id": "forward-smile", "title": "Forward Smile", "type": "concept", "domain": "quant-models", "tags": ["forward-skew", "model-risk"], "path": "topics/volatility-models.md", "content": "<a id=\"forward-smile\"><\/a>\n\n## Forward Smile\n<!-- section: forward-smile | prerequisites: [vol-term-structure, local-volatility-dupire] | related: [cliquets-forward-start, heston-model, local-stochastic-volatility] | tags: [forward-skew, model-risk] -->\n\nThe smile the model implies **at a future date**. Today's surface doesn't pin it down.\n\n- Local vol reproduces today's surface but flattens future smiles → **underprices forward skew**.\n- SV / LSV keep a realistic forward smile → needed for forward-starts, cliquets.\n- Classic example of \"model choice changes price materially\".\n\n### Connections\n- **Priced products:** [[cliquets-forward-start]]. **Right models:** [[heston-model]], [[local-stochastic-volatility]].", "summary": "<a id=\"forward-smile\"><\/a>", "topic": "volatility-models", "degree": 10}, {"id": "volatility-models", "title": "Volatility Models", "type": "topic", "domain": "quant-models", "tags": [], "path": "topics/volatility-models.md", "content": "# Volatility Models\n\n**Sections:** [[local-volatility-dupire]] · [[heston-model]] · [[jump-diffusion]] · [[local-stochastic-volatility]] · [[sabr]] · [[forward-smile]]\n\n<a id=\"local-volatility-dupire\"><\/a>\n\n## Local Volatility (Dupire)\n<!-- section: local-volatility-dupire | prerequisites: [volatility-surface, breeden-litzenberger] | related: [heston-model, local-stochastic-volatility, forward-smile, barrier-options, svi, pde-finite-difference] | tags: [local-vol, dupire] -->\n\n$$\\sigma_{loc}^2(K,T)=\\frac{\\partial C/\\partial T+(r-q)K\\,\\partial C/\\partial K+qC}{\\tfrac12K^2\\,\\partial^2C/\\partial K^2}$$\n\n**Variables:**\n\n- $C(K,T)$ call-price surface\n- $\\sigma_{loc}(S,t)$ local vol at spot level $K$ and time $T$\n- $r,q$ rate and dividend yield\n\n| Pros | Cons |\n|---|---|\n| Fits today's surface **exactly**; fast PDE | **Forward smile too flat** → misprices forward-start, cliquets; wrong dynamics |\n\n- Denominator ∝ density → numerically unstable unless the surface is smooth & arbitrage-free → fit [[svi]] first.\n- Standard for short-dated barriers / first pass.\n\n### Connections\n- **Needs:** [[breeden-litzenberger]] density. **Fails at:** [[forward-smile]]. **Fixed by:** [[local-stochastic-volatility]].\n\n<a id=\"heston-model\"><\/a>\n\n## Heston Stochastic Volatility\n<!-- section: heston-model | prerequisites: [geometric-brownian-motion, ito-lemma] | related: [local-volatility-dupire, local-stochastic-volatility, volatility-skew, forward-smile, jump-diffusion] | tags: [stochastic-vol, heston, feller] -->\n\n$$dS_t=(r-q)S_tdt+\\sqrt{v_t}S_tdW^S_t,\\qquad dv_t=\\kappa(\\theta-v_t)dt+\\xi\\sqrt{v_t}dW^v_t,\\qquad d\\langle W^S,W^v\\rangle=\\rho\\,dt$$\n\n**Variables:**\n\n- $v_t$ instantaneous variance\n- κ mean-reversion speed\n- θ long-run variance\n- ξ vol-of-vol (smile curvature)\n- ρ spot–vol correlation (skew\n- negative for equity)\n\n- **Feller:** $2\\kappa\\theta>\\xi^2$ keeps $v_t>0$.\n- Pros: realistic dynamics, semi-closed-form vanillas. Cons: can't fit short-dated skew well; calibration unstable. (Bergomi family also used.)\n\n### Connections\n- **Skew source:** ρ < 0 → [[volatility-skew]]. **Short-dated fix:** [[jump-diffusion]]. **Combined with LV:** [[local-stochastic-volatility]].\n\n<a id=\"jump-diffusion\"><\/a>\n\n## Jump-Diffusion (Merton, Bates)\n<!-- section: jump-diffusion | prerequisites: [geometric-brownian-motion, exponential-poisson-process] | related: [heston-model, volatility-skew, variance-swaps] | tags: [jumps, short-dated-skew] -->\n\nGBM + Poisson-arriving jumps (Merton); + stochastic vol (Bates).\n\n- **Pro:** generates steep **short-dated skew** that pure diffusions can't.\n- **Con:** jumps can't be delta-hedged; more parameters.\n- Jumps also cause replication error in [[variance-swaps]].\n\n<a id=\"local-stochastic-volatility\"><\/a>\n\n## Local-Stochastic Volatility (LSV)\n<!-- section: local-stochastic-volatility | prerequisites: [local-volatility-dupire, heston-model] | related: [autocallables, forward-smile, monte-carlo-pricing, barrier-options] | tags: [lsv, leverage-function, particle-method] -->\n\n$$\\frac{dS_t}{S_t}=(r-q)dt+L(S_t,t)\\sqrt{v_t}\\,dW_t$$\n\n**Variables:**\n\n- $L(S,t)$ leverage function calibrated so every vanilla is matched (particle methods standard)\n- $v_t$ stochastic variance (sets how the smile evolves)\n\n- Fits surface **exactly** + realistic dynamics → **industry standard for equity exotics**. Cons: complex, slow, needs a mixing parameter.\n- Around it: discrete cash dividends near-dated/yield further out; stochastic rates for long notes; correlation matrix for multi-asset.\n\n| Model | Fits vanillas | Dynamics | Used for |\n|---|---|---|---|\n| Flat BS | no | none | quoting, sanity |\n| Local vol | exactly | forward smile too flat | short barriers |\n| SV (Heston, Bergomi) | approx. | realistic | forward-start, vol-of-vol |\n| **LSV** | exactly | realistic | equity exotics |\n\n### Connections\n- **Used to price:** [[autocallables]], [[barrier-options]], [[cliquets-forward-start]] via [[monte-carlo-pricing]].\n\n<a id=\"sabr\"><\/a>\n\n## SABR & Normal (Bachelier) Vol\n<!-- section: sabr | prerequisites: [volatility-surface] | related: [svi, swaptions, fx-vol-conventions, black-76] | tags: [sabr, rates, normal-vol] -->\n\n- Stochastic-vol smile model fitted **per expiry** (per expiry–tenor pair in rates).\n- Standard for rates and FX smiles.\n- Since negative rates, rates vol quoted as **normal (Bachelier) vol in bp**, often with **shifted SABR**.\n- (Hagan et al.)\n\n### Connections\n- **Equity counterpart:** [[svi]]. **Used for:** [[swaptions]] cube, [[fx-vol-conventions]].\n\n<a id=\"forward-smile\"><\/a>\n\n## Forward Smile\n<!-- section: forward-smile | prerequisites: [vol-term-structure, local-volatility-dupire] | related: [cliquets-forward-start, heston-model, local-stochastic-volatility] | tags: [forward-skew, model-risk] -->\n\nThe smile the model implies **at a future date**. Today's surface doesn't pin it down.\n\n- Local vol reproduces today's surface but flattens future smiles → **underprices forward skew**.\n- SV / LSV keep a realistic forward smile → needed for forward-starts, cliquets.\n- Classic example of \"model choice changes price materially\".\n\n### Connections\n- **Priced products:** [[cliquets-forward-start]]. **Right models:** [[heston-model]], [[local-stochastic-volatility]].", "summary": "", "topic": "", "sections": ["local-volatility-dupire", "heston-model", "jump-diffusion", "local-stochastic-volatility", "sabr", "forward-smile"], "degree": 9}], "links": [{"source": "home", "target": "map-foundations", "type": "mention"}, {"source": "home", "target": "map-prob-stats", "type": "mention"}, {"source": "home", "target": "map-stochastic-finance", "type": "mention"}, {"source": "home", "target": "map-buyside", "type": "mention"}, {"source": "home", "target": "map-signal-research", "type": "mention"}, {"source": "home", "target": "map-portfolio-construction", "type": "mention"}, {"source": "home", "target": "map-sellside", "type": "mention"}, {"source": "home", "target": "map-pricing", "t function md(src, eq) {
  const math = [], code = [];
  // keep code spans/blocks away from math and wikilink parsing
  src = src.replace(/```[\s\S]*?```|`[^`\n]+`/g, m => `@@CODE${code.push(m) - 1}@@`);
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, (m, body) => {
    if (eq && !/\\tag/.test(body)) m = `$$${body}\\tag{${eq.prefix}.${++eq.n}}$$`;
    return `@@MATH${math.push(m) - 1}@@`;
  })
           .replace(/(^|[^\\$])\$([^$\n]+?)\$/g, (m, pre, body) => `${pre}@@MATH${math.push("$" + body + "$") - 1}@@`);
  src = src.replace(WIKI, (m, id, label) => {
    id = id.trim(); const n = byId.get(id);
    const text = esc(label || (n ? cleanTitle(n.title) : id));
    return n ? `<a class="wl" href="#${esc(id)}" data-id="${esc(id)}">${text}</a>` : `<a class="wl broken">${text}</a>`;
  });
  src = src.replace(/@@CODE(\d+)@@/g, (m, i) => code[+i]);
  let html = marked.parse(src, { gfm: true });
  html = html.replace(/@@MATH(\d+)@@/g, (m, i) => esc(math[+i]));
  return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
}

function enhance(root) {

    if (lead.some(el => /\$\$/.test(el.textContent))) {

      lead[0].before(box); lead.forEach(el => box.appendChild(el));

    }

    const st = p.firstElementChild;

    p.replaceWith(div);
  });
}
