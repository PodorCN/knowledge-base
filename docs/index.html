<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quant Interview Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root {
  --ground: #f4f5f3;
  --surface: #ffffff;
  --ink: #17212a;
  --muted: #5b6770;
  --faint: #8a949b;
  --rule: #dde2e0;
  --accent: #1d6b86;
  --accent-soft: #e3eff3;
  --code-bg: #f0f2f1;
  --d-prob-stats: #4a67b0;
  --d-stochastic-finance: #6f5bb8;
  --d-signal-research: #c0642a;
  --d-portfolio-construction: #b8402f;
  --d-pricing: #1d6b86;
  --d-black-scholes: #3f5fa8;
  --d-quant-models: #2e8f5a;
  --d-risk-management: #8a7a1c;
  --d-quant-dev: #5d6b78;
  --edge: rgba(23, 33, 42, 0.16);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0f1417; --surface: #161d22; --ink: #e3e9ec; --muted: #9aa6ae; --faint: #6f7b83; --rule: #27323a;
    --accent: #6bb8d3; --accent-soft: #1a3039; --code-bg: #1d262c; --edge: rgba(227, 233, 236, 0.14);
    --d-prob-stats: #8aa4ee; --d-stochastic-finance: #ad9cf0; --d-signal-research: #ec9a5c; --d-portfolio-construction: #ef7f6c;
    --d-pricing: #6bb8d3; --d-black-scholes: #8ea6ee; --d-quant-models: #66c98f; --d-risk-management: #d6c45a; --d-quant-dev: #9aa8b4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0f1417; --surface: #161d22; --ink: #e3e9ec; --muted: #9aa6ae; --faint: #6f7b83; --rule: #27323a;
  --accent: #6bb8d3; --accent-soft: #1a3039; --code-bg: #1d262c; --edge: rgba(227, 233, 236, 0.14);
  --d-prob-stats: #8aa4ee; --d-stochastic-finance: #ad9cf0; --d-signal-research: #ec9a5c; --d-portfolio-construction: #ef7f6c;
  --d-pricing: #6bb8d3; --d-black-scholes: #8ea6ee; --d-quant-models: #66c98f; --d-risk-management: #d6c45a; --d-quant-dev: #9aa8b4;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); font-size: 14px; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { height: 100%; display: grid; grid-template-columns: 290px minmax(0, 1fr); }

.side { background: var(--surface); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--rule); }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand a { font-weight: 600; font-size: 15px; color: var(--ink); text-decoration: none; }
.brand .count { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
.search { position: relative; }
.search input { width: 100%; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--ground); color: var(--ink); font: inherit; }
.results { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; width: min(420px, 86vw); margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 10px 28px rgba(0,0,0,0.14); max-height: 60vh; overflow-y: auto; }
.results button { display: grid; grid-template-columns: 62px 1fr; gap: 8px; width: 100%; text-align: left; padding: 6px 8px; border: 0; background: none; border-radius: 4px; cursor: pointer; line-height: 1.35; }
.results button:hover, .results button.active { background: var(--accent-soft); }
.results .kind { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); padding-top: 2px; }
.toc { overflow-y: auto; padding: 10px 8px 40px; flex: 1; }
.toc a, .toc summary { display: block; padding: 4px 8px; border-radius: 4px; color: var(--ink); text-decoration: none; line-height: 1.35; cursor: pointer; }
.toc a:hover, .toc summary:hover { background: var(--accent-soft); }
.toc a.current { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.toc .glabel { display: block; margin: 16px 8px 4px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 0; }
.toc a.glabel:hover { color: var(--accent); background: none; }
.toc details > summary { list-style: none; display: flex; align-items: center; gap: 8px; font-weight: 500; }
.toc details > summary::-webkit-details-marker { display: none; }
.toc details > summary::before { content: ""; width: 0; height: 0; border-left: 4px solid var(--faint); border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; flex: none; }
.toc details[open] > summary::before { transform: rotate(90deg); }
.toc .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.toc .n { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); font-weight: 400; }
.toc .lvl { margin: 2px 0 8px 12px; padding-left: 6px; border-left: 1px solid var(--rule); }
.toc a.ov, .toc a.qb { font-size: 12.5px; color: var(--muted); display: flex; }
.toc a.qb .n { margin-left: auto; }
.toc a.tp { font-size: 13.5px; }
.toc ul.secs { list-style: none; margin: 1px 0 6px 10px; padding: 0; }
.toc ul.secs a { font-size: 12.5px; color: var(--muted); padding-top: 3px; padding-bottom: 3px; }

.main { overflow-y: auto; min-height: 0; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px 24px; background: var(--ground); border-bottom: 1px solid var(--rule); }
.crumbs { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { color: var(--faint); }
.topbar .spacer { flex: 1; }
.btn { padding: 5px 11px; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; cursor: pointer; font-size: 12.5px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.menu-btn { display: none; }

.page { display: grid; grid-template-columns: minmax(0, 720px) 240px; gap: 48px; padding: 28px 24px 80px; max-width: 1080px; }
.article { min-width: 0; }
.kicker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.kicker .swatch { width: 9px; height: 9px; border-radius: 2px; }
.article h1.title { font-family: var(--font-read); font-size: 32px; line-height: 1.18; font-weight: 600; margin: 8px 0 14px; text-wrap: balance; letter-spacing: -0.01em; }
.lead { font-family: var(--font-read); font-size: 19px; line-height: 1.5; margin: 0 0 22px; padding-left: 14px; border-left: 3px solid var(--dcolor, var(--accent)); }

.prose { font-family: var(--font-read); font-size: 16.5px; line-height: 1.65; overflow-wrap: anywhere; }
.prose > :first-child { margin-top: 0; }
.prose h1 { display: none; }
.prose h2 { font-family: var(--font-read); font-size: 25px; line-height: 1.25; font-weight: 600; margin: 8px 0 12px; text-wrap: balance; letter-spacing: -0.005em; }
.prose h3 { font-family: var(--font-ui); font-size: 12.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin: 26px 0 8px; }
.prose h4 { font-family: var(--font-ui); font-size: 14.5px; font-weight: 600; margin: 20px 0 6px; }
.intro > p:first-child { font-size: 18.5px; line-height: 1.55; }
.chapter-toc { margin: 22px 0 8px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
.chapter-toc span { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.chapter-toc ol { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; }
.chapter-toc a { color: var(--ink); text-decoration: none; }
.chapter-toc a:hover { color: var(--accent); }
.sec { margin-top: 44px; padding-top: 26px; border-top: 1px solid var(--rule); scroll-margin-top: 60px; }
.sec.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.prose a[id] { scroll-margin-top: 64px; display: block; position: relative; top: -30px; }
.secq { margin-top: 18px; }
.secq h5 { margin: 0 0 4px; font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.secq h5 .n { color: var(--faint); }
.qa { scroll-margin-top: 64px; }
.pagelist .secs { font-size: 12.5px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 2px 0; }
.pagelist .secs a { color: var(--muted); text-decoration: none; }
.pagelist .secs a:hover { color: var(--accent); }
.dot-sep { margin: 0 6px; color: var(--faint); }
.results small { color: var(--faint); font-size: 11.5px; }
.prose p { margin: 10px 0; }
.prose ul, .prose ol { padding-left: 22px; margin: 10px 0; }
.prose li { margin: 4px 0; }
.prose strong { font-weight: 600; }
.prose code { font-family: var(--font-mono); font-size: 13px; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
.prose pre { background: var(--code-bg); padding: 12px 14px; border-radius: 6px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; }
.prose pre code { background: none; padding: 0; }
.prose .table-wrap { overflow-x: auto; margin: 14px 0; }
.prose table { border-collapse: collapse; font-family: var(--font-read); font-size: 15px; font-variant-numeric: tabular-nums; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
.prose th, .prose td { padding: 5px 12px; text-align: left; vertical-align: top; }
.prose th { font-weight: 600; border-bottom: 1px solid var(--ink); }
.prose tbody tr + tr td { border-top: 0; }

/* course-notes typesetting */
.chapno { font-family: var(--font-read); font-size: 15px; font-style: italic; color: var(--muted); margin-top: 18px; }
.article h1.title.chapter { font-size: 34px; margin-top: 2px; padding-bottom: 14px; border-bottom: 1.5px solid var(--ink); }
.chapter-toc .num, .toc .num, .rail .num { font-family: var(--font-mono); font-size: 0.85em; color: var(--faint); margin-right: 8px; font-variant-numeric: tabular-nums; }
.chapter-toc ol { list-style: none; padding-left: 0; }
.box { border: 1px solid var(--rule); border-left: 3px solid var(--dcolor, var(--accent)); background: var(--surface); border-radius: 3px; padding: 2px 18px 10px; margin: 16px 0; }
.box.def::before { content: "Formula"; display: block; font-family: var(--font-ui); font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dcolor, var(--accent)); margin: 10px 0 2px; }
.box.def > h3 { display: none; }
.box.titled > h3 { color: var(--dcolor, var(--accent)); margin: 10px 0 2px; font-size: 11.5px; }
.box.example { border-left-style: dashed; background: transparent; }
.box.example::before { content: "Example"; display: block; font-family: var(--font-ui); font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px; }
.box.example > h3 { display: none; }
.block.seealso { font-size: 14.5px; color: var(--muted); margin-top: 18px; }
.block.seealso h3 { margin-bottom: 4px; }
.vars { margin: 6px 0 12px; }
.vars-h { font-family: var(--font-read); font-style: italic; color: var(--muted); }
.vars table { border: 0; margin-top: 2px; font-size: 15px; }
.vars td { padding: 2px 12px 2px 0; border: 0; }
.vars td.sym { white-space: nowrap; text-align: right; padding-right: 14px; }
.exercise { margin: 12px 0; }
.lockbox { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; margin: 8px 0; border: 1px dashed var(--rule); border-radius: 6px; font-size: 14px; color: var(--muted); }
.lockrow { display: flex; gap: 8px; flex-wrap: wrap; }
.lockrow input { flex: 1 1 180px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--ground); color: var(--ink); font: inherit; }
.lockerr { font-size: 12.5px; color: var(--d-portfolio-construction); min-height: 1em; }
.ex-q { font-family: var(--font-read); font-size: 16px; line-height: 1.5; }
.ex-label { font-family: var(--font-ui); font-weight: 600; font-size: 13.5px; margin-right: 6px; color: var(--dcolor, var(--accent)); }
.exercise .qa { margin: 6px 0 0; border: 0; background: none; }
.exercise .qa > summary { display: inline-block; font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; color: var(--accent); padding: 2px 0; }
.exercise .qa > summary::before { content: "▸ "; font-family: inherit; font-size: inherit; color: inherit; padding: 0; }
.exercise .qa[open] > summary::before { content: "▾ "; }
.exercise .qa[open] > summary { border: 0; }
.exercise .qa .qbody { padding: 4px 0 4px 16px; border-left: 2px solid var(--rule); margin-top: 4px; }
.prose mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 6px 0; margin: 8px 0 !important; }
a.wl { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); cursor: pointer; }
a.wl:hover { border-bottom-color: var(--accent); }
a.wl.broken { color: var(--muted); border-bottom-style: dashed; cursor: default; }

.qsection { margin-top: 40px; }
.qsection > h2 { font-family: var(--font-ui); font-size: 13px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; gap: 8px; align-items: baseline; }
.qsection > h2 .n { font-family: var(--font-mono); font-weight: 400; }
.qsection > h2 a { color: inherit; text-decoration: none; }
.qsection > h2 a:hover { color: var(--accent); }
.qa { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); margin: 10px 0; }
.qa > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-family: var(--font-read); font-size: 16px; line-height: 1.45; font-weight: 600; }
.qa > summary::-webkit-details-marker { display: none; }
.qa > summary::before { content: "Q"; font-family: var(--font-mono); font-size: 12px; color: var(--dcolor, var(--accent)); padding-top: 3px; font-weight: 500; }
.qa[open] > summary { border-bottom: 1px solid var(--rule); }
.qa .qbody { padding: 4px 16px 14px 40px; font-size: 15.5px; }
.qtools { display: flex; gap: 8px; margin: 0 0 8px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin: 16px 0 8px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border-top: 3px solid var(--dcolor, var(--accent)); }
.card h3 { margin: 0; font-family: var(--font-ui); font-size: 15px; }
.card h3 a { color: var(--ink); text-decoration: none; }
.card h3 a:hover { color: var(--accent); }
.card .stat { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.card li a { color: var(--muted); text-decoration: none; }
.card li a:hover { color: var(--accent); }
.pagelist { list-style: none; padding: 0; margin: 4px 0; display: flex; flex-direction: column; }
.pagelist li { padding: 10px 0; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 3px; }
.pagelist a.t { font-family: var(--font-ui); font-weight: 600; font-size: 15px; color: var(--ink); text-decoration: none; }
.pagelist a.t:hover { color: var(--accent); }
.pagelist .s { font-family: var(--font-read); font-size: 15px; color: var(--muted); line-height: 1.45; }
.pagelist .qn { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }

.rail { position: sticky; top: 64px; align-self: start; display: flex; flex-direction: column; gap: 18px; font-size: 13px; max-height: calc(100vh - 80px); overflow-y: auto; padding-bottom: 20px; }
.rail h4 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-family: var(--font-mono); font-weight: 500; }
.rail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.rail a { display: flex; gap: 7px; align-items: baseline; color: var(--ink); text-decoration: none; padding: 3px 6px; border-radius: 4px; line-height: 1.35; }
.rail a:hover { background: var(--accent-soft); }
.rail ul.onpage a, .toc ul.secs a { border-left: 2px solid transparent; border-radius: 0 4px 4px 0; }
.rail a.active, .toc ul.secs a.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }
.rail .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.rail .path { font-family: var(--font-mono); font-size: 11px; color: var(--faint); word-break: break-all; }

.graph-overlay { position: fixed; inset: 0; z-index: 50; background: var(--ground); display: grid; grid-template-rows: auto 1fr; }
.graph-overlay header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--rule); background: var(--surface); }
.graph-overlay header p { margin: 0; color: var(--muted); font-size: 12.5px; flex: 1; }
#graph { position: relative; min-height: 0; overflow: hidden; }
.scrim { display: none; }

@media (max-width: 1180px) {
  .page { grid-template-columns: minmax(0, 720px); }
  .rail { position: static; max-height: none; border-top: 1px solid var(--rule); padding-top: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
}
@media (max-width: 860px) {
  .shell { display: block; height: auto; }
  html, body { height: auto; }
  .main { overflow: visible; }
  .side { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(320px, 86vw); transform: translateX(-100%); transition: transform .2s; padding-top: env(safe-area-inset-top, 0px); }
  .side.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,0.25); }
  .scrim.open { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,0.3); }
  .menu-btn { display: inline-block; }
  .topbar { padding: 10px 16px; top: env(safe-area-inset-top, 0px); }
  .page { padding: 20px 16px 60px; }
  .article h1.title { font-size: 26px; }
  .lead { font-size: 17px; }
  .prose { font-size: 16px; }
  .qa .qbody { padding-left: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="shell">
  <nav class="side" id="side" aria-label="Contents">
    <div class="side-head">
      <div class="brand"><a href="#home" data-id="home">Quant Interview Wiki</a><span class="count" id="count"></span></div>
      <div class="search">
        <input id="q" type="search" placeholder="Search pages and questions" autocomplete="off" aria-label="Search pages and questions">
        <ul class="results" id="results" hidden></ul>
      </div>
    </div>
    <div class="toc" id="toc"></div>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div class="main" id="main">
    <div class="topbar">
      <button type="button" class="btn menu-btn" id="menuBtn">Contents</button>
      <div class="crumbs" id="crumbs"></div>
      <span class="spacer"></span>
      <button type="button" class="btn" id="graphBtn">Graph</button>
    </div>
    <div class="page">
      <article class="article" id="article" aria-live="polite"></article>
      <aside class="rail" id="rail" aria-label="Connections"></aside>
    </div>
  </div>
</div>
<div class="graph-overlay" id="graphOverlay" hidden>
  <header><strong>Graph</strong><p>Pages linked to the current page are highlighted. Click a node to open it.</p><button type="button" class="btn" id="graphClose">Close</button></header>
  <div id="graph"></div>
</div>

<script>
window.MathJax = {
  tex: { inlineMath: [["$", "$"]], displayMath: [["$$", "$$"]], processEscapes: true },
  svg: { fontCache: "global" },
  startup: { typeset: false }
};
</script>

main": "pricing", "tags": ["map", "track"], "path": "maps/map-pricing.md", "content": "# Pricing\n\nPart of [[map-sellside]].\n\n## Topics (in reading order)\n\n- [[no-arbitrage-parity]]\n- [[exotic-options]]\n- [[structured-products-delta-one]]", "summary": "Part of map-sellside.", "topic": "", "degree": 6}, {"id": "map-prob-stats", "title": "Probability & Statistics", "type": "map", "domain": "prob-stats", "tags": ["map", "track"], "path": "maps/map-prob-stats.md", "content": "# Probability & Statistics\n\nPart of [[map-foundations]].\n\n## Topics (in reading order)\n\n- [[probability-bayes]]\n- [[distributions]]\n- [[moments-covariance]]\n- [[puzzles-markov]]\n- [[estimation-testing]]", "summary": "Part of map-foundations.", "topic": "", "degree": 7}, {"id": "map-quant-dev", "title": "Quant Dev", "type": "map", "domain": "quant-dev", "tags": ["map", "track"], "path": "maps/map-quant-dev.md", "content": "# Quant Dev\n\nPart of [[map-sellside]].\n\n## Topics (in reading order)\n\n- [[oop-design]]\n- [[csharp-dotnet]]\n- [[production-coding]]", "summary": "Part of map-sellside.", "topic": "", "degree": 5}, {"id": "map-quant-models", "title": "Quant Models", "type": "map", "domain": "quant-models", "tags": ["map", "track"], "path": "maps/map-quant-models.md", "content": "# Quant Models (vol surface, models, numerics)\n\nPart of [[map-sellside]].\n\n## Topics (in reading order)\n\n- [[implied-volatility-skew]]\n- [[vol-surface-construction-chapter]]\n- [[volatility-models]]\n- [[numerical-methods]]", "summary": "Part of map-sellside.", "topic": "", "degree": 6}, {"id": "map-risk-management", "title": "Risk Management", "type": "map", "domain": "risk-management", "tags": ["map", "track"], "path": "maps/map-risk-management.md", "content": "# Risk Management\n\nPart of [[map-sellside]].\n\n## Topics (in reading order)\n\n- [[hedging]]\n- [[risk-control-governance]]", "summary": "Part of map-sellside.", "topic": "", "degree": 4}, {"id": "map-sellside", "title": "Sell-side", "type": "map", "domain": "", "tags": ["map", "group"], "path": "maps/map-sellside.md", "content": "# Sell-side\n\n- [[map-pricing]]\n- [[map-black-scholes]]\n- [[map-quant-models]]\n- [[map-risk-management]]\n- [[map-quant-dev]]\n\nBack to [[home]].", "summary": "Back to home.", "topic": "", "degree": 6}, {"id": "map-signal-research", "title": "Signal Research", "type": "map", "domain": "signal-research", "tags": ["map", "track"], "path": "maps/map-signal-research.md", "content": "# Signal Research\n\nPart of [[map-buyside]].\n\n## Topics (in reading order)\n\n- [[linear-regression]]\n- [[ml-regularisation]]\n- [[time-series-validation]]\n- [[signals-research-process]]", "summary": "Part of map-buyside.", "topic": "", "degree": 6}, {"id": "map-stochastic-finance", "title": "Stochastic Calculus & Finance Basics", "type": "map", "domain": "stochastic-finance", "tags": ["map", "track"], "path": "maps/map-stochastic-finance.md", "content": "# Stochastic Calculus & Finance Basics\n\nPart of [[map-foundations]].\n\n## Topics (in reading order)\n\n- [[stochastic-calculus]]\n- [[no-arbitrage-finance-basics]]", "summary": "Part of map-foundations.", "topic": "", "degree": 4}, {"id": "black-scholes-pde", "title": "Black–Scholes PDE (derivation)", "type": "concept", "domain": "black-scholes", "tags": ["pde", "delta-hedging", "replication"], "path": "topics/black-scholes.md", "content": "<a id=\"black-scholes-pde\"><\/a>\n\n## Black–Scholes PDE (derivation)\n<!-- section: black-scholes-pde | prerequisites: [ito-lemma, binomial-replication] | related: [black-scholes-formula, gamma-theta-pnl, pde-finite-difference, delta-hedging] | tags: [pde, delta-hedging, replication] -->\n\n$$\\frac{\\partial V}{\\partial t}+\\tfrac12\\sigma^2S^2\\frac{\\partial^2V}{\\partial S^2}+(r-q)S\\frac{\\partial V}{\\partial S}-rV=0,\\qquad V(T,S)=h(S)$$\n\n**Variables:**\n\n- $V(S,t)$ option value\n- $\\sigma$ vol\n- $r$ rate\n- $q$ dividend yield\n- $h$ payoff\n\n### Derivation (4 steps)\n1. Itô on $V(S,t)$: $dV=(V_t+\\mu SV_S+\\tfrac12\\sigma^2S^2V_{SS})dt+\\sigma SV_SdW$.\n2. Hold $\\Delta=V_S$ shares → the $dW$ term cancels.\n3. Hedged portfolio is riskless ⇒ must earn $r$ (else arbitrage).\n4. μ cancels → PDE contains only $r,\\sigma$, contract terms.\n\n**Why no μ:** dynamic replication prices the risk away; your stock forecast is irrelevant.\n\n### Connections\n- **Rearranged as:** $\\Theta+\\tfrac12\\Gamma\\sigma^2S^2+rSV_S-rV=0$ → [[gamma-theta-pnl]].\n- **Solved numerically by:** [[pde-finite-difference]].", "summary": "<a id=\"black-scholes-pde\"><\/a>", "topic": "black-scholes", "degree": 13}, {"id": "black-scholes-formula", "title": "Black–Scholes Formula", "type": "concept", "domain": "black-scholes", "tags": ["black-scholes", "bsm"], "path": "topics/black-scholes.md", "content": "<a id=\"black-scholes-formula\"><\/a>\n\n## Black–Scholes Formula\n<!-- section: black-scholes-formula | prerequisites: [geometric-brownian-motion, risk-neutral-pricing] | related: [black-scholes-pde, greeks, implied-volatility, black-76, put-call-parity, delta-vs-itm-probability] | tags: [black-scholes, bsm] -->\n\n$$C=Se^{-q\\tau}N(d_1)-Ke^{-r\\tau}N(d_2),\\qquad P=Ke^{-r\\tau}N(-d_2)-Se^{-q\\tau}N(-d_1)$$\n$$d_1=\\frac{\\ln(S/K)+(r-q+\\tfrac12\\sigma^2)\\tau}{\\sigma\\sqrt\\tau},\\qquad d_2=d_1-\\sigma\\sqrt\\tau$$\n\n**Variables:**\n\n- $S$ spot\n- $K$ strike\n- $\\tau=T-t$ years to expiry\n- $r$ rate\n- $q$ dividend yield (or borrow-adjusted carry)\n- $\\sigma$ volatility\n- $N$ standard normal CDF\n\n### Reference numbers\n$S=K=100,T=1,r=q=0,\\sigma=20\\%$: $d_1=0.1,d_2=-0.1$, $C=100(0.5398-0.4602)=7.97$.\n\n**ATM shortcut:** $C_{ATM}\\approx0.4\\,S\\sigma\\sqrt T$ ($0.4\\approx1/\\sqrt{2\\pi}$) → 8.0.\n\n### Assumptions and where they break (equities)\nGBM with constant σ, frictionless continuous hedging, constant r, no jumps, known dividends → broken by skew, jumps/gaps, discrete dividends, borrow, costs. BS survives as a **quoting language** ([[implied-volatility]]).\n\n### Connections\n- **Derived from:** [[black-scholes-pde]] or [[risk-neutral-pricing]]. **Sensitivities:** [[greeks]]. **Forward form:** [[black-76]].\n- **Decomposition:** $C=\\text{AoN}-K\\cdot\\text{CoN}$ → [[digital-options]].", "summary": "<a id=\"black-scholes-formula\"><\/a>", "topic": "black-scholes", "degree": 21}, {"id": "delta-vs-itm-probability", "title": "Delta vs Probability of Finishing ITM (N(d1) vs N(d2))", "type": "concept", "domain": "black-scholes", "tags": ["delta", "probability", "measure"], "path": "topics/black-scholes.md", "content": "<a id=\"delta-vs-itm-probability\"><\/a>\n\n## Delta vs Probability of Finishing ITM (N(d1) vs N(d2))\n<!-- section: delta-vs-itm-probability | prerequisites: [greeks, risk-neutral-pricing] | related: [digital-options, lognormal-distribution] | tags: [delta, probability, measure] -->\n\n- $N(d_2)$ = **risk-neutral** probability $S_T>K$ (= undiscounted cash-or-nothing digital).\n- $N(d_1)$ = that probability under the **share measure** (stock as numeraire); call delta $=e^{-q\\tau}N(d_1)$.\n- Neither is the physical probability. Close for short-dated ATM, diverge for long-dated / high vol.\n- **ATM-forward call delta > 0.5:** at $K=F$, $d_1=\\tfrac12\\sigma\\sqrt T>0$. Lognormal is right-skewed: median < forward.\n\n### Connections\n- **Why it matters:** [[digital-options]] are priced off $N(d_2)$; skew adjusts it. Built on [[lognormal-distribution]].", "summary": "<a id=\"delta-vs-itm-probability\"><\/a>", "topic": "black-scholes", "degree": 10}, {"id": "black-76", "title": "Black-76 (forward-based Black formula)", "type": "concept", "domain": "black-scholes", "tags": ["black-76", "forward", "swaption"], "path": "topics/black-scholes.md", "content": "<a id=\"black-76\"><\/a>\n\n## Black-76 (forward-based Black formula)\n<!-- section: black-76 | prerequisites: [black-scholes-formula, forward-pricing] | related: [implied-forward-regression, swaptions, sabr] | tags: [black-76, forward, swaption] -->\n\n$$C=D\\,[F\\,N(d_1)-K\\,N(d_2)],\\qquad d_{1,2}=\\frac{\\ln(F/K)\\pm\\tfrac12\\sigma^2T}{\\sigma\\sqrt T}$$\n\n**Variables:**\n\n- $D$ discount factor\n- $F$ forward\n- $K$ strike\n- σ Black vol\n- $T$ expiry\n\n- Surface practice: get $D,F$ from [[implied-forward-regression]], then invert Black-76 → no dividend/rate guesses needed.\n- Swaptions: replace $D$ by annuity $A$ and $F$ by forward swap rate → [[swaptions]]. Rates often quoted in **normal (Bachelier)** vol.", "summary": "<a id=\"black-76\"><\/a>", "topic": "black-scholes", "degree": 9}, {"id": "american-early-exercise", "title": "American Options, Early Exercise & De-Americanisation", "type": "concept", "domain": "black-scholes", "tags": ["american", "early-exercise", "dividends"], "path": "topics/black-scholes.md", "content": "<a id=\"american-early-exercise\"><\/a>\n\n## American Options, Early Exercise & De-Americanisation\n<!-- section: american-early-exercise | prerequisites: [option-payoffs-moneyness, forward-pricing] | related: [first-step-analysis, pde-finite-difference, vol-surface-construction, put-call-parity] | tags: [american, early-exercise, dividends] -->\n\n- **American call, no dividends, r ≥ 0:** never exercise early (lose optionality, pay K early).\n- **With dividends:** exercise only just before an ex-date, if dividend > time value lost (≈ $D>K(1-e^{-r\\Delta t})$ + remaining optionality).\n- **American put:** early exercise when deep ITM (receive K earlier, earn interest). Borrow costs matter.\n- Parity becomes an inequality.\n\n### De-Americanisation (for vol surfaces)\nSingle-stock listed options are American → convert prices to European-equivalents (tree / PDE) **before** inverting to IV, or invert the American pricer directly. Surface always built on European-equivalent vols; mixing is a common consistency bug.\n\n### Connections\n- **Backward induction:** [[first-step-analysis]], [[pde-finite-difference]], Longstaff–Schwartz in [[monte-carlo-pricing]].\n- **Feeds:** [[vol-surface-construction]] (single-stock case).", "summary": "<a id=\"american-early-exercise\"><\/a>", "topic": "black-scholes", "degree": 15}, {"id": "black-scholes", "title": "Black–Scholes Model", "type": "topic", "domain": "black-scholes", "tags": [], "path": "topics/black-scholes.md", "content": "# Black–Scholes Model\n\n**Sections:** [[black-scholes-pde]] · [[black-scholes-formula]] · [[delta-vs-itm-probability]] · [[black-76]] · [[american-early-exercise]]\n\n<a id=\"black-scholes-pde\"><\/a>\n\n## Black–Scholes PDE (derivation)\n<!-- section: black-scholes-pde | prerequisites: [ito-lemma, binomial-replication] | related: [black-scholes-formula, gamma-theta-pnl, pde-finite-difference, delta-hedging] | tags: [pde, delta-hedging, replication] -->\n\n$$\\frac{\\partial V}{\\partial t}+\\tfrac12\\sigma^2S^2\\frac{\\partial^2V}{\\partial S^2}+(r-q)S\\frac{\\partial V}{\\partial S}-rV=0,\\qquad V(T,S)=h(S)$$\n\n**Variables:**\n\n- $V(S,t)$ option value\n- $\\sigma$ vol\n- $r$ rate\n- $q$ dividend yield\n- $h$ payoff\n\n### Derivation (4 steps)\n1. Itô on $V(S,t)$: $dV=(V_t+\\mu SV_S+\\tfrac12\\sigma^2S^2V_{SS})dt+\\sigma SV_SdW$.\n2. Hold $\\Delta=V_S$ shares → the $dW$ term cancels.\n3. Hedged portfolio is riskless ⇒ must earn $r$ (else arbitrage).\n4. μ cancels → PDE contains only $r,\\sigma$, contract terms.\n\n**Why no μ:** dynamic replication prices the risk away; your stock forecast is irrelevant.\n\n### Connections\n- **Rearranged as:** $\\Theta+\\tfrac12\\Gamma\\sigma^2S^2+rSV_S-rV=0$ → [[gamma-theta-pnl]].\n- **Solved numerically by:** [[pde-finite-difference]].\n\n<a id=\"black-scholes-formula\"><\/a>\n\n## Black–Scholes Formula\n<!-- section: black-scholes-formula | prerequisites: [geometric-brownian-motion, risk-neutral-pricing] | related: [black-scholes-pde, greeks, implied-volatility, black-76, put-call-parity, delta-vs-itm-probability] | tags: [black-scholes, bsm] -->\n\n$$C=Se^{-q\\tau}N(d_1)-Ke^{-r\\tau}N(d_2),\\qquad P=Ke^{-r\\tau}N(-d_2)-Se^{-q\\tau}N(-d_1)$$\n$$d_1=\\frac{\\ln(S/K)+(r-q+\\tfrac12\\sigma^2)\\tau}{\\sigma\\sqrt\\tau},\\qquad d_2=d_1-\\sigma\\sqrt\\tau$$\n\n**Variables:**\n\n- $S$ spot\n- $K$ strike\n- $\\tau=T-t$ years to expiry\n- $r$ rate\n- $q$ dividend yield (or borrow-adjusted carry)\n- $\\sigma$ volatility\n- $N$ standard normal CDF\n\n### Reference numbers\n$S=K=100,T=1,r=q=0,\\sigma=20\\%$: $d_1=0.1,d_2=-0.1$, $C=100(0.5398-0.4602)=7.97$.\n\n**ATM shortcut:** $C_{ATM}\\approx0.4\\,S\\sigma\\sqrt T$ ($0.4\\approx1/\\sqrt{2\\pi}$) → 8.0.\n\n### Assumptions and where they break (equities)\nGBM with constant σ, frictionless continuous hedging, constant r, no jumps, known dividends → broken by skew, jumps/gaps, discrete dividends, borrow, costs. BS survives as a **quoting language** ([[implied-volatility]]).\n\n### Connections\n- **Derived from:** [[black-scholes-pde]] or [[risk-neutral-pricing]]. **Sensitivities:** [[greeks]]. **Forward form:** [[black-76]].\n- **Decomposition:** $C=\\text{AoN}-K\\cdot\\text{CoN}$ → [[digital-options]].\n\n<a id=\"delta-vs-itm-probability\"><\/a>\n\n## Delta vs Probability of Finishing ITM (N(d1) vs N(d2))\n<!-- section: delta-vs-itm-probability | prerequisites: [greeks, risk-neutral-pricing] | related: [digital-options, lognormal-distribution] | tags: [delta, probability, measure] -->\n\n- $N(d_2)$ = **risk-neutral** probability $S_T>K$ (= undiscounted cash-or-nothing digital).\n- $N(d_1)$ = that probability under the **share measure** (stock as numeraire); call delta $=e^{-q\\tau}N(d_1)$.\n- Neither is the physical probability. Close for short-dated ATM, diverge for long-dated / high vol.\n- **ATM-forward call delta > 0.5:** at $K=F$, $d_1=\\tfrac12\\sigma\\sqrt T>0$. Lognormal is right-skewed: median < forward.\n\n### Connections\n- **Why it matters:** [[digital-options]] are priced off $N(d_2)$; skew adjusts it. Built on [[lognormal-distribution]].\n\n<a id=\"black-76\"><\/a>\n\n## Black-76 (forward-based Black formula)\n<!-- section: black-76 | prerequisites: [black-scholes-formula, forward-pricing] | related: [implied-forward-regression, swaptions, sabr] | tags: [black-76, forward, swaption] -->\n\n$$C=D\\,[F\\,N(d_1)-K\\,N(d_2)],\\qquad d_{1,2}=\\frac{\\ln(F/K)\\pm\\tfrac12\\sigma^2T}{\\sigma\\sqrt T}$$\n\n**Variables:**\n\n- $D$ discount factor\n- $F$ forward\n- $K$ strike\n- σ Black vol\n- $T$ expiry\n\n- Surface practice: get $D,F$ from [[implied-forward-regression]], then invert Black-76 → no dividend/rate guesses needed.\n- Swaptions: replace $D$ by annuity $A$ and $F$ by forward swap rate → [[swaptions]]. Rates often quoted in **normal (Bachelier)** vol.\n\n<a id=\"american-early-exercise\"><\/a>\n\n## American Options, Early Exercise & De-Americanisation\n<!-- section: american-early-exercise | prerequisites: [option-payoffs-moneyness, forward-pricing] | related: [first-step-analysis, pde-finite-difference, vol-surface-construction, put-call-parity] | tags: [american, early-exercise, dividends] -->\n\n- **American call, no dividends, r ≥ 0:** never exercise early (lose optionality, pay K early).\n- **With dividends:** exercise only just before an ex-date, if dividend > time value lost (≈ $D>K(1-e^{-r\\Delta t})$ + remaining optionality).\n- **American put:** early exercise when deep ITM (receive K earlier, earn interest). Borrow costs matter.\n- Parity becomes an inequality.\n\n### De-Americanisation (for vol surfaces)\nSingle-stock listed options are American → convert prices to European-equivalents (tree / PDE) **before** inverting to IV, or invert the American pricer directly. Surface always built on European-equivalent vols; mixing is a common consistency bug.\n\n### Connections\n- **Backward induction:** [[first-step-analysis]], [[pde-finite-difference]], Longstaff–Schwartz in [[monte-carlo-pricing]].\n- **Feeds:** [[vol-surface-construction]] (single-stock case).", "summary": "", "topic": "", "sections": ["black-scholes-pde", "black-scholes-formula", "delta-vs-itm-probability", "black-76", "american-early-exercise"], "degree": 10}, {"id": "csharp-abstract-classes", "title": "Abstract Classes & Abstract Methods", "type": "concept", "domain": "quant-dev", "tags": ["csharp", "abstract", "polymorphism", "override"], "path": "topics/csharp-dotnet.md", "content": "<a id=\"csharp-abstract-classes\"><\/a>\n\n## Abstract Classes & Abstract Methods\n<!-- section: csharp-abstract-classes | prerequisites: [oop-pillars] | related: [csharp-essentials, pricing-app-architecture, csharp-constructors-base] | tags: [csharp, abstract, polymorphism, override] -->\n\nExamples come from equity-derivative pricing class design (Payoff / Exercise / Option / PricingEngine).\n\n```csharp\npublic abstract class Instrument { public abstract double NPV(); }\n```\n\n| Part | Meaning |\n|---|---|\n| `abstract class` | Abstract class: you **cannot** `new Instrument()`; it can only be inherited |\n| `public abstract double NPV();` | Abstract method: declaration only, **no implementation** (no `{ }`) |\n| `NPV` | Net Present Value, the product's value today |\n\n**Rule:** a non-abstract subclass **must** implement every abstract method with `override`, otherwise it doesn't compile.\n\n```csharp\npublic abstract class Option : Instrument { ... }            // still abstract, may leave NPV unimplemented\n\npublic abstract class OneAssetOption<TSelf> : Option\n{\n    public override double NPV() => _engine.Calculate((TSelf)this);   // actually implemented here\n}\n```\n\n**Why this design:** one common interface, so different products can be handled polymorphically.\n\n```csharp\nvar portfolio = new List<Instrument> { euCall, amPut, asian /*, bond, swap */ };\ndouble total = 0;\nforeach (var inst in portfolio)\n    total += inst.NPV();      // no need to know the concrete product; each calls its own implementation\n```\n\n- Abstract class vs interface: see [[csharp-essentials]].\n\n### C++ equivalent\n\n```cpp\nclass Instrument {\npublic:\n    virtual ~Instrument() = default;   // a polymorphic base class must have a virtual destructor\n    virtual double NPV() const = 0;    // pure virtual function = C# abstract\n};\n```\n\n### Connections\n- **Builds on:** [[oop-pillars]] (abstraction, polymorphism).\n- **Used in:** [[pricing-app-architecture]].", "summary": "<a id=\"csharp-abstract-classes\"><\/a>", "topic": "csharp-dotnet", "degree": 10}, {"id": "csharp-arrow-syntax", "title": "The Two Uses of `=>`", "type": "concept", "domain": "quant-dev", "tags": ["csharp", "lambda", "expression-bodied", "linq"], "path": "topics/csharp-dotnet.md", "content": "<a id=\"csharp-arrow-syntax\"><\/a>\n\n## The Two Uses of `=>`\n<!-- section: csharp-arrow-syntax | prerequisites: [csharp-abstract-classes] | related: [csharp-essentials, csharp-constructors-base] | tags: [csharp, lambda, expression-bodied, linq] -->\n\n### Use 1: expression-bodied member\n\n`=>` means **\"the method body is this one expression\"**.\n\n| Member's return type | `=> expression` is equivalent to |\n|---|---|\n| **Returns a value** (e.g. `double`) | `{ return expression; }` |\n| **No return value** (`void`, constructor) | `{ expression; }`: executes only, **no return** |\n\n**Returns a value, same as `return`:**\n\n```csharp\npublic override double Value(double s) => Math.Max(s - Strike, 0.0);\n// equivalent to\npublic override double Value(double s) { return Math.Max(s - Strike, 0.0); }\n```\n\n**No return value, executes only:**\n\n```csharp\npublic void SetPricingEngine(IPricingEngine<TSelf> engine) => _engine = engine;\n// equivalent to\npublic void SetPricingEngine(IPricingEngine<TSelf> engine) { _engine = engine; }\n```\n\n**Read-only property:**\n\n```csharp\npublic double Moneyness => Spot / Strike;   // same as get { return Spot / Strike; }\n```\n\n**Rules:**\n\n- Only **one expression** can follow `=>`.\n- An assignment `_cash = cash` is also an expression in C#, so it can follow `=>`.\n\n### Use 2: lambda expression (anonymous function)\n\nLeft of `=>` are the parameters, right of it is the function body.\n\n```csharp\nFunc<double, double> callPayoff = s => Math.Max(s - 100, 0);\ncallPayoff(120);                                     // 20\n\nvar itm   = portfolio.Where(opt => opt.NPV() > 1.0); // LINQ filter\nvar total = portfolio.Sum(inst => inst.NPV());       // aggregate\n```\n\n| Form | Meaning |\n|---|---|\n| `x => x * 2` | one parameter |\n| `(x, y) => x + y` | several parameters |\n| `() => 42` | no parameters |\n| `x => { var y = x * 2; return y + 1; }` | several statements need `{ }` and `return` |\n\n### Telling the two uses apart\n\n| Where `=>` appears | Which use |\n|---|---|\n| After the **declaration** of a method, property or constructor | expression-bodied member |\n| Passed as an **argument**, or assigned to a `Func` / `Action` | lambda |\n\n**Lambdas in other languages:**\n\n- Python: `lambda s: max(s - 100, 0)`\n- C++: `[](double s) { return std::max(s - 100.0, 0.0); }`\n\n### Connections\n- **Used with:** LINQ and `Func` in [[csharp-essentials]].\n- **In constructors:** [[csharp-constructors-base]].", "summary": "<a id=\"csharp-arrow-syntax\"><\/a>", "topic": "csharp-dotnet", "degree": 7}, {"id": "csharp-constructors-base", "title": "Constructors & `: base(...)`", "type": "concept", "domain": "quant-dev", "tags": ["csharp", "constructor", "inheritance", "initialization-order"], "path": "topics/csharp-dotnet.md", "content": "<a id=\"csharp-constructors-base\"><\/a>\n\n## Constructors & `: base(...)`\n<!-- section: csharp-constructors-base | prerequisites: [csharp-abstract-classes, csharp-arrow-syntax] | related: [oop-pillars] | tags: [csharp, constructor, inheritance, initialization-order] -->\n\n```csharp\npublic CashOrNothingPayoff(OptionType type, double strike, double cash) : base(type, strike) => _cash = cash;\n//     ①                   ②                                            ③                      ④\n```\n\n| Part | Meaning |\n|---|---|\n| ① `public CashOrNothingPayoff` | Same name as the class, no return type → **constructor** (runs on `new`) |\n| ② `(OptionType type, double strike, double cash)` | Arguments passed when the object is created |\n| ③ `: base(type, strike)` | **First calls the base class** `StrikedPayoff` constructor, handing type and strike to the base class to store |\n| ④ `=> _cash = cash;` | Then runs its own code: stores `_cash`. A constructor has no return value, so this `=>` only executes, no return |\n\n### Full form (equivalent to the line above)\n\n```csharp\npublic CashOrNothingPayoff(OptionType type, double strike, double cash)\n    : base(type, strike)      // step 1: the base class stores Type and Strike\n{\n    _cash = cash;             // step 2: the subclass stores its own _cash\n}\n```\n\n### Why two steps\n\nEach class initialises only the data **it** defines:\n\n```\nStrikedPayoff (base)       defines Type, Strike  → base constructor assigns them\n  └─ CashOrNothingPayoff   defines _cash         → subclass assigns it itself\n```\n\n`Type` and `Strike` are read-only properties (`{ get; }`) of the base class. They can only be assigned in the base class's own constructor; the subclass cannot write `Strike = strike` directly.\n\n### Execution order\n\nFor `new CashOrNothingPayoff(OptionType.Call, 100, 1.0)`:\n\n1. Enter the subclass constructor and receive the arguments.\n2. Run `: base(type, strike)` → base class: `Type = Call; Strike = 100;`.\n3. Back in the subclass: `_cash = 1.0;`.\n4. Object creation complete.\n\n**Rule: the base class is constructed first, then the subclass.**\n\n### Comparison\n\n**Python:**\n\n```python\nclass CashOrNothingPayoff(StrikedPayoff):\n    def __init__(self, type, strike, cash):\n        super().__init__(type, strike)   # ← : base(type, strike)\n        self._cash = cash                # ← => _cash = cash\n```\n\n**C++:**\n\n```cpp\nCashOrNothingPayoff(OptionType t, double K, double cash)\n    : StrikedPayoff(t, K), cash_(cash) {}   // done in the initializer list\n```\n\n### Connections\n- **Builds on:** [[csharp-abstract-classes]], [[csharp-arrow-syntax]].", "summary": "<a id=\"csharp-constructors-base\"><\/a>", "topic": "csharp-dotnet", "degree": 8}, {"id": "csharp-ternary-operator", "title": "The Ternary Operator `? :`", "type": "concept", "domain": "quant-dev", "tags": ["csharp", "operators", "control-flow"], "path": "topics/csharp-dotnet.md", "content": "<a id=\"csharp-ternary-operator\"><\/a>\n\n## The Ternary Operator `? :`\n<!-- section: csharp-ternary-operator | prerequisites: [] | related: [csharp-constructors-base] | tags: [csharp, operators, control-flow] -->\n\n**Format:**\n\n```\ncondition ? value if true : value if false\n```\n\nIt compresses if-else into one line, to pick one of two values.\n\n```csharp\npublic override double Value(double s)\n{\n    bool itm = Type == OptionType.Call ? s > Strike : s < Strike;   // a call checks S>K, a put checks S<K\n    return itm ? _cash : 0.0;                                       // pays cash if in the money, else 0\n}\n```\n\n**`return itm ? _cash : 0.0;` is equivalent to:**\n\n```csharp\nif (itm)\n    return _cash;\nelse\n    return 0.0;\n```\n\n**Example:** call, Strike = 100, cash = 1.0:\n\n| Price at expiry s | itm | Returns |\n|---|---|---|\n| 120 | `120 > 100` → true | 1.0 |\n| 90 | `90 > 100` → false | 0.0 |\n\n**Other languages:**\n\n| Language | Syntax |\n|---|---|\n| C# / C++ / Java | `itm ? cash : 0.0` |\n| Python | `cash if itm else 0.0` (value first, condition in the middle) |\n\n- Once the logic gets complicated, switch to if-else for readability.\n\n### Connections\n- **Payoff example:** cash-or-nothing digital, see [[digital-options]].", "summary": "<a id=\"csharp-ternary-operator\"><\/a>", "topic": "csharp-dotnet", "degree": 6}, {"id": "csharp-syntax-cheatsheet", "title": "C# Syntax Cheat Sheet", "type": "concept", "domain": "quant-dev", "tags": ["csharp", "syntax", "reference"], "path": "topics/csharp-dotnet.md", "content": "<a id=\"csharp-syntax-cheatsheet\"><\/a>\n\n## C# Syntax Cheat Sheet\n<!-- section: csharp-syntax-cheatsheet | prerequisites: [csharp-abstract-classes] | related: [csharp-essentials, csharp-arrow-syntax, csharp-constructors-base] | tags: [csharp, syntax, reference] -->\n\n| Syntax | Example | Meaning |\n|---|---|---|\n| `: BaseClass` | `class PlainVanillaPayoff : StrikedPayoff` | inheritance |\n| `: Interface` | `class MCEuropeanEngine : IPricingEngine<VanillaOption>` | implements an interface |\n| `override` | `public override double Value(...)` | implements or overrides a base-class abstract / virtual method |\n| `sealed` | `public sealed class PlainVanillaPayoff` | cannot be inherited further |\n| `protected` | `protected StrikedPayoff(...)` | accessible only to the class itself and subclasses |\n| `internal` | `internal static class Normal` | visible only inside the current project (assembly) |\n| `static class` | `Normal.Cdf(x)` | cannot be `new`ed, all static methods, like a utility-function module |\n| `{ get; }` | `public double Strike { get; }` | read-only auto-property, assignable only in the constructor |\n| `readonly` | `private readonly double _cash;` | read-only field, assignable only in the constructor |\n| `enum` | `enum OptionType { Call, Put }` | a set of named constants, safer than strings |\n| generics `<T>` | `IPricingEngine<TOption>` | type parameter, specified when used |\n| `where T : X` | `where TOption : Option` | generic constraint: T must be X or a subclass of X |\n| `?` (after a type) | `IPricingEngine<TSelf>? _engine` | may be null |\n| `??` | `_engine ?? throw new ...` | use the left side if not null, otherwise evaluate the right side |\n| `throw` expression | `x ?? throw new InvalidOperationException(...)` | throw can appear inside an expression (C# 7+) |\n| `is not T x` | `if (opt.Payoff is not PlainVanillaPayoff pay) throw ...;` | pattern matching: checks the type, and casts and assigns to `pay` at the same time |\n| `(T)x` | `(TSelf)this` | explicit cast |\n| `record` | `record BlackScholesProcess(double Spot, ...)` | immutable data class; constructor, properties and equality generated automatically |\n| `with` | `process with { Spot = 101 }` | copies a record with some fields changed; the original is unchanged |\n| `var` | `var v = new double[n + 1];` | let the compiler infer the type |\n| optional parameter | `int seed = 42` | uses the default if not passed |\n| named argument | `new BlackScholesProcess(Spot: 100, ...)` | write parameter names at the call site for readability |\n| `$\"...\"` | `$\"NPV: {npv:F4}\"` | string interpolation; `:F4` means 4 decimal places |\n| `200_000` | `new MCEuropeanEngine(process, 200_000)` | digit separator, equals 200000 |\n| `*=` / `+=` | `s *= Math.Exp(...)` | `s = s * ...` / `s = s + ...` |\n| `try / catch` | `try { ... } catch (ArgumentException e) { ... }` | catch exceptions |\n\n*All of the above is standard C# / C++ syntax. The `Instrument` / `NPV()` / `PricingEngine` naming follows QuantLib conventions.*\n\n### Connections\n- **Details:** [[csharp-abstract-classes]], [[csharp-arrow-syntax]], [[csharp-constructors-base]], [[csharp-ternary-operator]]. **Records & `with`:** [[csharp-essentials]].", "summary": "<a id=\"csharp-syntax-cheatsheet\"><\/a>", "topic": "csharp-dotnet", "degree": 7}, {"id": "csharp-essentials", "title": "C# / .NET Essentials for Quant Dev", "type": "concept", "domain": "quant-dev", "tags": ["csharp", "dotnet", "gc", "interop"], "path": "topics/csharp-dotnet.md", "content": "<a id=\"csharp-essentials\"><\/a>\n\n## C# / .NET Essentials for Quant Dev\n<!-- section: csharp-essentials | prerequisites: [oop-pillars] | related: [dotnet-concurrency-wpf, pricing-app-architecture, monte-carlo-pricing, csharp-abstract-classes, csharp-syntax-cheatsheet] | tags: [csharp, dotnet, gc, interop] -->\n\n- **Interface vs abstract class:** interface = contract, multiple implementation, no state (default methods since C# 8) → pluggable things (models, data sources). Abstract class = shared state + partial implementation, single inheritance → shared instrument behaviour.\n\n| | `abstract class` | `interface` |\n|---|---|---|\n| Can it have implementation? | Can mix: some methods implemented, some abstract | Usually not (C# 8+ allows default implementations) |\n| Can it have fields? | Yes | No instance fields |\n| How many? | A class can inherit only **one** class | A class can implement **many** interfaces |\n\n- **struct / class / record:** struct = value type, copied (small immutable data like a tenor); class = reference, identity; **record** = reference type with value equality + `with` → ideal for immutable trades / market snapshots.\n- **Immutability:** lock-free concurrent pricing, reproducible results, scenarios = `md with { Spot = 105 }`.\n- **GC:** generational (Gen 0/1/2, LOH > 85 KB). In MC hot loops reuse arrays, `Span<T>`, `ArrayPool<T>`. Unsubscribed event handlers leak memory in long-running desktop apps.\n- **Errors:** validate inputs up front (negative vol, past expiry, missing dividend); clear trader-readable error; never silently return 0/NaN; log trade ID + model version.\n- **Generics/LINQ:** `Dictionary<string, Func<Instrument, IPricingModel>>` registry; `trades.GroupBy(t => t.Underlying).Select(g => new { g.Key, Delta = g.Sum(t => t.Delta) })`.\n- **C++ interop:** P/Invoke to a C API, C++/CLI wrapper, COM, or out-of-process service (gRPC/REST). Watch marshalling cost, memory ownership, version pinning.\n- **Python → C#:** ABCs ≈ interfaces, dataclasses ≈ records; add static typing and explicit threading.", "summary": "<a id=\"csharp-essentials\"><\/a>", "topic": "csharp-dotnet", "degree": 15}, {"id": "dotnet-concurrency-wpf", "title": ".NET Concurrency, WPF & MVVM", "type": "concept", "domain": "quant-dev", "tags": ["async", "wpf", "mvvm", "threading"], "path": "topics/csharp-dotnet.md", "content": "<a id=\"dotnet-concurrency-wpf\"><\/a>\n\n## .NET Concurrency, WPF & MVVM\n<!-- section: dotnet-concurrency-wpf | prerequisites: [csharp-essentials] | related: [pricing-app-architecture, scenario-risk-grids] | tags: [async, wpf, mvvm, threading] -->\n\n- **async/await** → I/O-bound (fetch market data, call a pricing service); frees the UI thread.\n- **Parallel.For / PLINQ / Task.Run** → CPU-bound (MC paths, scenario grids).\n- Never `.Result` / `.Wait()` on the UI thread → deadlock with WPF sync context.\n- **500 scenarios, responsive UI:** `await Task.Run(...)`, `IProgress<T>`, `CancellationToken`, batch `ObservableCollection` updates on the Dispatcher, virtualise grids.\n- **MVVM:** Model = domain (trades, pricers); View = XAML; ViewModel = state + commands (`INotifyPropertyChanged`, `ICommand`) → testable without UI. Toolkits: CommunityToolkit.Mvvm, Prism, ReactiveUI.", "summary": "<a id=\"dotnet-concurrency-wpf\"><\/a>", "topic": "csharp-dotnet", "degree": 7}, {"id": "csharp-dotnet", "title": "C# & .NET", "type": "topic", "domain": "quant-dev", "tags": [], "path": "topics/csharp-dotnet.md", "content": "# C# & .NET\n\n**Sections:** [[csharp-abstract-classes]] · [[csharp-arrow-syntax]] · [[csharp-constructors-base]] · [[csharp-ternary-operator]] · [[csharp-syntax-cheatsheet]] · [[csharp-essentials]] · [[dotnet-concurrency-wpf]]\n\n<a id=\"csharp-abstract-classes\"><\/a>\n\n## Abstract Classes & Abstract Methods\n<!-- section: csharp-abstract-classes | prerequisites: [oop-pillars] | related: [csharp-essentials, pricing-app-architecture, csharp-constructors-base] | tags: [csharp, abstract, polymorphism, override] -->\n\nExamples come from equity-derivative pricing class design (Payoff / Exercise / Option / PricingEngine).\n\n```csharp\npublic abstract class Instrument { public abstract double NPV(); }\n```\n\n| Part | Meaning |\n|---|---|\n| `abstract class` | Abstract class: you **cannot** `new Instrument()`; it can only be inherited |\n| `public abstract double NPV();` | Abstract method: declaration only, **no implementation** (no `{ }`) |\n| `NPV` | Net Present Value, the product's value today |\n\n**Rule:** a non-abstract subclass **must** implement every abstract method with `override`, otherwise it doesn't compile.\n\n```csharp\npublic abstract class Option : Instrument { ... }            // still abstract, may leave NPV unimplemented\n\npublic abstract class OneAssetOption<TSelf> : Option\n{\n    public override double NPV() => _engine.Calculate((TSelf)this);   // actually implemented here\n}\n```\n\n**Why this design:** one common interface, so different products can be handled polymorphically.\n\n```csharp\nvar portfolio = new List<Instrument> { euCall, amPut, asian /*, bond, swap */ };\ndouble total = 0;\nforeach (var inst in portfolio)\n    total += inst.NPV();      // no need to know the concrete product; each calls its own implementation\n```\n\n- Abstract class vs interface: see [[csharp-essentials]].\n\n### C++ equivalent\n\n```cpp\nclass Instrument {\npublic:\n    virtual ~Instrument() = default;   // a polymorphic base class must have a virtual destructor\n    virtual double NPV() const = 0;    // pure virtual function = C# abstract\n};\n```\n\n### Connections\n- **Builds on:** [[oop-pillars]] (abstraction, polymorphism).\n- **Used in:** [[pricing-app-architecture]].\n\n<a id=\"csharp-arrow-syntax\"><\/a>\n\n## The Two Uses of `=>`\n<!-- section: csharp-arrow-syntax | prerequisites: [csharp-abstract-classes] | related: [csharp-essentials, csharp-constructors-base] | tags: [csharp, lambda, expression-bodied, linq] -->\n\n### Use 1: expression-bodied member\n\n`=>` means **\"the method body is this one expression\"**.\n\n| Member's return type | `=> expression` is equivalent to |\n|---|---|\n| **Returns a value** (e.g. `double`) | `{ return expression; }` |\n| **No return value** (`void`, constructor) | `{ expression; }`: executes only, **no return** |\n\n**Returns a value, same as `return`:**\n\n```csharp\npublic override double Value(double s) => Math.Max(s - Strike, 0.0);\n// equivalent to\npublic override double Value(double s) { return Math.Max(s - Strike, 0.0); }\n```\n\n**No return value, executes only:**\n\n```csharp\npublic void SetPricingEngine(IPricingEngine<TSelf> engine) => _engine = engine;\n// equivalent to\npublic void SetPricingEngine(IPricingEngine<TSelf> engine) { _engine = engine; }\n```\n\n**Read-only property:**\n\n```csharp\npublic double Moneyness => Spot / Strike;   // same as get { return Spot / Strike; }\n```\n\n**Rules:**\n\n- Only **one expression** can follow `=>`.\n- An assignment `_cash = cash` is also an expression in C#, so it can follow `=>`.\n\n### Use 2: lambda expression (anonymous function)\n\nLeft of `=>` are the parameters, right of it is the function body.\n\n```csharp\nFunc<double, double> callPayoff = s => Math.Max(s - 100, 0);\ncallPayoff(120);                                     // 20\n\nvar itm   = portfolio.Where(opt => opt.NPV() > 1.0); // LINQ filter\nvar total = portfolio.Sum(inst => inst.NPV());       // aggregate\n```\n\n| Form | Meaning |\n|---|---|\n| `x => x * 2` | one parameter |\n| `(x, y) => x + y` | several parameters |\n| `() => 42` | no parameters |\n| `x => { var y = x * 2; return y + 1; }` | several statements need `{ }` and `return` |\n\n### Telling the two uses apart\n\n| Where `=>` appears | Which use |\n|---|---|\n| After the **declaration** of a method, property or constructor | expression-bodied member |\n| Passed as an **argument**, or assigned to a `Func` / `Action` | lambda |\n\n**Lambdas in other languages:**\n\n- Python: `lambda s: max(s - 100, 0)`\n- C++: `[](double s) { return std::max(s - 100.0, 0.0); }`\n\n### Connections\n- **Used with:** LINQ and `Func` in [[csharp-essentials]].\n- **In constructors:** [[csharp-constructors-base]].\n\n<a id=\"csharp-constructors-base\"><\/a>\n\n## Constructors & `: base(...)`\n<!-- section: csharp-constructors-base | prerequisites: [csharp-abstract-classes, csharp-arrow-syntax] | related: [oop-pillars] | tags: [csharp, constructor, inheritance, initialization-order] -->\n\n```csharp\npublic CashOrNothingPayoff(OptionType type, double strike, double cash) : base(type, strike) => _cash = cash;\n//     ①                   ②                                            ③                      ④\n```\n\n| Part | Meaning |\n|---|---|\n| ① `public CashOrNothingPayoff` | Same name as the class, no return type → **constructor** (runs on `new`) |\n| ② `(OptionType type, double strike, double cash)` | Arguments passed when the object is created |\n| ③ `: base(type, strike)` | **First calls the base class** `StrikedPayoff` constructor, handing type and strike to the base class to store |\n| ④ `=> _cash = cash;` | Then runs its own code: stores `_cash`. A constructor has no return value, so this `=>` only executes, no return |\n\n### Full form (equivalent to the line above)\n\n```csharp\npublic CashOrNothingPayoff(OptionType type, double strike, double cash)\n    : base(type, strike)      // step 1: the base class stores Type and Strike\n{\n    _cash = cash;             // step 2: the subclass stores its own _cash\n}\n```\n\n### Why two steps\n\nEach class initialises only the data **it** defines:\n\n```\nStrikedPayoff (base)       defines Type, Strike  → base constructor assigns them\n  └─ CashOrNothingPayoff   defines _cash         → subclass assigns it itself\n```\n\n`Type` and `Strike` are read-only properties (`{ get; }`) of the base class. They can only be assigned in the base class's own constructor; the subclass cannot write `Strike = strike` directly.\n\n### Execution order\n\nFor `new CashOrNothingPayoff(OptionType.Call, 100, 1.0)`:\n\n1. Enter the subclass constructor and receive the arguments.\n2. Run `: base(type, strike)` → base class: `Type = Call; Strike = 100;`.\n3. Back in the subclass: `_cash = 1.0;`.\n4. Object creation complete.\n\n**Rule: the base class is constructed first, then the subclass.**\n\n### Comparison\n\n**Python:**\n\n```python\nclass CashOrNothingPayoff(StrikedPayoff):\n    def __init__(self, type, strike, cash):\n        super().__init__(type, strike)   # ← : base(type, strike)\n        self._cash = cash                # ← => _cash = cash\n```\n\n**C++:**\n\n```cpp\nCashOrNothingPayoff(OptionType t, double K, double cash)\n    : StrikedPayoff(t, K), cash_(cash) {}   // done in the initializer list\n```\n\n### Connections\n- **Builds on:** [[csharp-abstract-classes]], [[csharp-arrow-syntax]].\n\n<a id=\"csharp-ternary-operator\"><\/a>\n\n## The Ternary Operator `? :`\n<!-- section: csharp-ternary-operator | prerequisites: [] | related: [csharp-constructors-base] | tags: [csharp, operators, control-flow] -->\n\n**Format:**\n\n```\ncondition ? value if true : value if false\n```\n\nIt compresses if-else into one line, to pick one of two values.\n\n```csharp\npublic override double Value(double s)\n{\n    bool itm = Type == OptionType.Call ? s > Strike : s < Strike;   // a call checks S>K, a put checks S<K\n    return itm ? _cash : 0.0;                                       // pays cash if in the money, else 0\n}\n```\n\n**`return itm ? _cash : 0.0;` is equivalent to:**\n\n```csharp\nif (itm)\n    return _cash;\nelse\n    return 0.0;\n```\n\n**Example:** call, Strike = 100, cash = 1.0:\n\n| Price at expiry s | itm | Returns |\n|---|---|---|\n| 120 | `120 > 100` → true | 1.0 |\n| 90 | `90 > 100` → false | 0.0 |\n\n**Other languages:**\n\n| Language | Syntax |\n|---|---|\n| C# / C++ / Java | `itm ? cash : 0.0` |\n| Python | `cash if itm else 0.0` (value first, condition in the middle) |\n\n- Once the logic gets complicated, switch to if-else for readability.\n\n### Connections\n- **Payoff example:** cash-or-nothing digital, see [[digital-options]].\n\n<a id=\"csharp-syntax-cheatsheet\"><\/a>\n\n## C# Syntax Cheat Sheet\n<!-- section: csharp-syntax-cheatsheet | prerequisites: [csharp-abstract-classes] | related: [csharp-essentials, csharp-arrow-syntax, csharp-constructors-base] | tags: [csharp, syntax, reference] -->\n\n| Syntax | Example | Meaning |\n|---|---|---|\n| `: BaseClass` | `class PlainVanillaPayoff : StrikedPayoff` | inheritance |\n| `: Interface` | `class MCEuropeanEngine : IPricingEngine<VanillaOption>` | implements an interface |\n| `override` | `public override double Value(...)` | implements or overrides a base-class abstract / virtual method |\n| `sealed` | `public sealed class PlainVanillaPayoff` | cannot be inherited further |\n| `protected` | `protected StrikedPayoff(...)` | accessible only to the class itself and subclasses |\n| `internal` | `internal static class Normal` | visible only inside the current project (assembly) |\n| `static class` | `Normal.Cdf(x)` | cannot be `new`ed, all static methods, like a utility-function module |\n| `{ get; }` | `public double Strike { get; }` | read-only auto-property, assignable only in the constructor |\n| `readonly` | `private readonly double _cash;` | read-only field, assignable only in the constructor |\n| `enum` | `enum OptionType { Call, Put }` | a set of named constants, safer than strings |\n| generics `<T>` | `IPricingEngine<TOption>` | type parameter, specified when used |\n| `where T : X` | `where TOption : Option` | generic constraint: T must be X or a subclass of X |\n| `?` (after a type) | `IPricingEngine<TSelf>? _engine` | may be null |\n| `??` | `_engine ?? throw new ...` | use the left side if not null, otherwise evaluate the right side |\n| `throw` expression | `x ?? throw new InvalidOperationException(...)` | throw can appear inside an expression (C# 7+) |\n| `is not T x` | `if (opt.Payoff is not PlainVanillaPayoff pay) throw ...;` | pattern matching: checks the type, and casts and assigns to `pay` at the same time |\n| `(T)x` | `(TSelf)this` | explicit cast |\n| `record` | `record BlackScholesProcess(double Spot, ...)` | immutable data class; constructor, properties and equality generated automatically |\n| `with` | `process with { Spot = 101 }` | copies a record with some fields changed; the original is unchanged |\n| `var` | `var v = new double[n + 1];` | let the compiler infer the type |\n| optional parameter | `int seed = 42` | uses the default if not passed |\n| named argument | `new BlackScholesProcess(Spot: 100, ...)` | write parameter names at the call site for readability |\n| `$\"...\"` | `$\"NPV: {npv:F4}\"` | string interpolation; `:F4` means 4 decimal places |\n| `200_000` | `new MCEuropeanEngine(process, 200_000)` | digit separator, equals 200000 |\n| `*=` / `+=` | `s *= Math.Exp(...)` | `s = s * ...` / `s = s + ...` |\n| `try / catch` | `try { ... } catch (ArgumentException e) { ... }` | catch exceptions |\n\n*All of the above is standard C# / C++ syntax. The `Instrument` / `NPV()` / `PricingEngine` naming follows QuantLib conventions.*\n\n### Connections\n- **Details:** [[csharp-abstract-classes]], [[csharp-arrow-syntax]], [[csharp-constructors-base]], [[csharp-ternary-operator]]. **Records & `with`:** [[csharp-essentials]].\n\n<a id=\"csharp-essentials\"><\/a>\n\n## C# / .NET Essentials for Quant Dev\n<!-- section: csharp-essentials | prerequisites: [oop-pillars] | related: [dotnet-concurrency-wpf, pricing-app-architecture, monte-carlo-pricing, csharp-abstract-classes, csharp-syntax-cheatsheet] | tags: [csharp, dotnet, gc, interop] -->\n\n- **Interface vs abstract class:** interface = contract, multiple implementation, no state (default methods since C# 8) → pluggable things (models, data sources). Abstract class = shared state + partial implementation, single inheritance → shared instrument behaviour.\n\n| | `abstract class` | `interface` |\n|---|---|---|\n| Can it have implementation? | Can mix: some methods implemented, some abstract | Usually not (C# 8+ allows default implementations) |\n| Can it have fields? | Yes | No instance fields |\n| How many? | A class can inherit only **one** class | A class can implement **many** interfaces |\n\n- **struct / class / record:** struct = value type, copied (small immutable data like a tenor); class = reference, identity; **record** = reference type with value equality + `with` → ideal for immutable trades / market snapshots.\n- **Immutability:** lock-free concurrent pricing, reproducible results, scenarios = `md with { Spot = 105 }`.\n- **GC:** generational (Gen 0/1/2, LOH > 85 KB). In MC hot loops reuse arrays, `Span<T>`, `ArrayPool<T>`. Unsubscribed event handlers leak memory in long-running desktop apps.\n- **Errors:** validate inputs up front (negative vol, past expiry, missing dividend); clear trader-readable error; never silently return 0/NaN; log trade ID + model version.\n- **Generics/LINQ:** `Dictionary<string, Func<Instrument, IPricingModel>>` registry; `trades.GroupBy(t => t.Underlying).Select(g => new { g.Key, Delta = g.Sum(t => t.Delta) })`.\n- **C++ interop:** P/Invoke to a C API, C++/CLI wrapper, COM, or out-of-process service (gRPC/REST). Watch marshalling cost, memory ownership, version pinning.\n- **Python → C#:** ABCs ≈ interfaces, dataclasses ≈ records; add static typing and explicit threading.\n\n<a id=\"dotnet-concurrency-wpf\"><\/a>\n\n## .NET Concurrency, WPF & MVVM\n<!-- section: dotnet-concurrency-wpf | prerequisites: [csharp-essentials] | related: [pricing-app-architecture, scenario-risk-grids] | tags: [async, wpf, mvvm, threading] -->\n\n- **async/await** → I/O-bound (fetch market data, call a pricing service); frees the UI thread.\n- **Parallel.For / PLINQ / Task.Run** → CPU-bound (MC paths, scenario grids).\n- Never `.Result` / `.Wait()` on the UI thread → deadlock with WPF sync context.\n- **500 scenarios, responsive UI:** `await Task.Run(...)`, `IProgress<T>`, `CancellationToken`, batch `ObservableCollection` updates on the Dispatcher, virtualise grids.\n- **MVVM:** Model = domain (trades, pricers); View = XAML; ViewModel = state + commands (`INotifyPropertyChanged`, `ICommand`) → testable without UI. Toolkits: CommunityToolkit.Mvvm, Prism, ReactiveUI.", "summary": "", "topic": "", "sections": ["csharp-abstract-classes", "csharp-arrow-syntax", "csharp-constructors-base", "csharp-ternary-operator", "csharp-syntax-cheatsheet", "csharp-essentials", "dotnet-concurrency-wpf"], "degree": 10}, {"id": "distributions-reference", "title": "Common Distributions (reference)", "type": "concept", "domain": "prob-stats", "tags": ["distributions", "reference"], "path": "topics/distributions.md", "content": "<a id=\"distributions-reference\"><\/a>\n\n## Common Distributions (reference)\n<!-- section: distributions-reference | prerequisites: [probability-rules-counting] | related: [normal-distribution, lognormal-distribution, exponential-poisson-process] | tags: [distributions, reference] -->\n\n| Distribution | PMF / PDF | Mean | Variance |\n|---|---|---|---|\n| Bernoulli($p$) | $P(1)=p$ | $p$ | $p(1-p)$ |\n| Binomial($n,p$) | $\\binom nk p^k(1-p)^{n-k}$ | $np$ | $np(1-p)$ |\n| Geometric($p$), trials to 1st success | $(1-p)^{k-1}p$ | $1/p$ | $(1-p)/p^2$ |\n| Poisson($\\lambda$) | $e^{-\\lambda}\\lambda^k/k!$ | $\\lambda$ | $\\lambda$ |\n| Uniform($a,b$) | $1/(b-a)$ | $(a+b)/2$ | $(b-a)^2/12$ |\n| Exponential($\\lambda$) | $\\lambda e^{-\\lambda x}$ | $1/\\lambda$ | $1/\\lambda^2$ |\n| Normal($\\mu,\\sigma^2$) | $\\frac{1}{\\sigma\\sqrt{2\\pi}}e^{-(x-\\mu)^2/2\\sigma^2}$ | $\\mu$ | $\\sigma^2$ |\n| Beta($a,b$) | $x^{a-1}(1-x)^{b-1}/B(a,b)$ | $\\frac{a}{a+b}$ | $\\frac{ab}{(a+b)^2(a+b+1)}$ |\n\n**Variables:**\n\n- $p$ success prob\n- $n$ trials\n- $k$ outcome\n- $\\lambda$ rate\n- $a,b$ bounds (Uniform) or shape params (Beta)\n- $\\mu,\\sigma^2$ mean/variance\n\n### Key points\n- **Convention trap:** geometric \"failures before success\" has support from 0 and mean $(1-p)/p$.\n- A density value is not a probability and can exceed 1.\n- Memoryless: Exponential (continuous) and Geometric (discrete) only.\n\n### Connections\n- **Detailed in:** [[normal-distribution]], [[lognormal-distribution]], [[exponential-poisson-process]], [[beta-bernoulli-conjugacy]].\n- **Used by:** [[order-statistics]], [[first-step-analysis]].", "summary": "<a id=\"distributions-reference\"><\/a>", "topic": "distributions", "degree": 10}, {"id": "normal-distribution", "title": "Normal Distribution & Friends (χ², t, F)", "type": "concept", "domain": "prob-stats", "tags": ["normal", "chi-square", "t-distribution"], "path": "topics/distributions.md", "content": "<a id=\"normal-distribution\"><\/a>\n\n## Normal Distribution & Friends (χ², t, F)\n<!-- section: normal-distribution | prerequisites: [distributions-reference] | related: [lln-clt, hypothesis-testing, lognormal-distribution, brownian-motion] | tags: [normal, chi-square, t-distribution] -->\n\n### Formulas\n$$Z=\\frac{X-\\mu}{\\sigma}\\sim N(0,1);\\quad \\sum_{i=1}^{\\nu}Z_i^2\\sim\\chi^2_\\nu;\\quad \\frac{Z}{\\sqrt{U/\\nu}}\\sim t_\\nu;\\quad \\frac{U/a}{V/b}\\sim F_{a,b}$$\n\n**Variables:**\n\n- $\\mu,\\sigma$ mean and std dev\n- $Z_i$ iid standard normals\n- $U\\sim\\chi^2_\\nu$, $V\\sim\\chi^2_b$ independent\n- $\\nu,a,b$ degrees of freedom\n\n### Key points\n- 68 / 95 / 99.7% within 1/2/3 σ; central 95% uses 1.96.\n- Linear combos of **jointly** normal variables are normal; normal marginals alone are not enough.\n- $t$ has heavier tails, → normal as $\\nu\\to\\infty$. $\\chi^2_\\nu$ has mean $\\nu$, variance $2\\nu$.\n- $E[X^4]=3$ for standard normal (used in $\\mathrm{Var}(X^2)=2$).\n\n### Connections\n- **Used by:** [[hypothesis-testing]] (t and F tests), [[confidence-intervals]], [[brownian-motion]] (normal increments), [[black-scholes-formula]] ($N(d_1), N(d_2)$).", "summary": "<a id=\"normal-distribution\"><\/a>", "topic": "distributions", "degree": 13}, {"id": "lognormal-distribution", "title": "Lognormal Distribution", "type": "concept", "domain": "prob-stats", "tags": ["lognormal"], "path": "topics/distributions.md", "content": "<a id=\"lognormal-distribution\"><\/a>\n\n## Lognormal Distribution\n<!-- section: lognormal-distribution | prerequisites: [normal-distribution] | related: [geometric-brownian-motion, black-scholes-formula, jensens-inequality] | tags: [lognormal] -->\n\n### Formula\n$$\\log X\\sim N(m,s^2)\\Rightarrow E[X]=e^{m+s^2/2},\\quad \\mathrm{Var}(X)=(e^{s^2}-1)e^{2m+s^2}$$\n\n**Variables:** $m,s^2$ mean and variance of $\\log X$.\n\n### Key points\n- Right-skewed: median $e^m$ < mean $e^{m+s^2/2}$ — why ATM-forward call delta > 0.5 ([[delta-vs-itm-probability]]).\n- The $s^2/2$ term is [[jensens-inequality]] in action.\n\n### Connections\n- **Is the terminal law of:** [[geometric-brownian-motion]]; the BS assumption whose failure creates the [[volatility-skew]].", "summary": "<a id=\"lognormal-distribution\"><\/a>", "topic": "distributions", "degree": 10}, {"id": "exponential-poisson-process", "title": "Exponential Distribution & Poisson Process", "type": "concept", "domain": "prob-stats", "tags": ["memoryless", "arrivals", "order-flow"], "path": "topics/distributions.md", "content": "<a id=\"exponential-poisson-process\"><\/a>\n\n## Exponential Distribution & Poisson Process\n<!-- section: exponential-poisson-process | prerequisites: [distributions-reference] | related: [first-step-analysis, total-expectation-variance, jump-diffusion] | tags: [memoryless, arrivals, order-flow] -->\n\n### Formulas\n$$P(T>s+t\\mid T>s)=P(T>t)=e^{-\\lambda t}$$\n$$N(t)\\sim\\mathrm{Poisson}(\\lambda t),\\qquad \\min(X,Y)\\sim\\mathrm{Exp}(\\lambda+\\mu),\\qquad P(X<Y)=\\frac{\\lambda}{\\lambda+\\mu}$$\n\n**Variables:**\n\n- $T$ waiting time\n- $\\lambda,\\mu$ rates\n- $N(t)$ arrivals in $[0,t]$\n- $X\\sim\\mathrm{Exp}(\\lambda)$, $Y\\sim\\mathrm{Exp}(\\mu)$ independent\n\n### Key points\n- Orders at 3/min: $P(\\text{none in 30s})=e^{-1.5}$.\n- Counts in disjoint intervals are independent — real order flow **clusters**, so check before assuming.\n- Memorylessness is a *model* property, not a law of waiting times.\n\n### Connections\n- **Builds on:** [[distributions-reference]].\n- **Used by:** [[total-expectation-variance]] (Poisson random sums: $E=\\lambda m$, $\\mathrm{Var}=\\lambda(v+m^2)$); [[jump-diffusion]] (Poisson jump arrivals).", "summary": "<a id=\"exponential-poisson-process\"><\/a>", "topic": "distributions", "degree": 9}, {"id": "distributions", "title": "Distributions", "type": "topic", "domain": "prob-stats", "tags": [], "path": "topics/distributions.md", "content": "# Distributions\n\n**Sections:** [[distributions-reference]] · [[normal-distribution]] · [[lognormal-distribution]] · [[exponential-poisson-process]]\n\n<a id=\"distributions-reference\"><\/a>\n\n## Common Distributions (reference)\n<!-- section: distributions-reference | prerequisites: [probability-rules-counting] | related: [normal-distribution, lognormal-distribution, exponential-poisson-process] | tags: [distributions, reference] -->\n\n| Distribution | PMF / PDF | Mean | Variance |\n|---|---|---|---|\n| Bernoulli($p$) | $P(1)=p$ | $p$ | $p(1-p)$ |\n| Binomial($n,p$) | $\\binom nk p^k(1-p)^{n-k}$ | $np$ | $np(1-p)$ |\n| Geometric($p$), trials to 1st success | $(1-p)^{k-1}p$ | $1/p$ | $(1-p)/p^2$ |\n| Poisson($\\lambda$) | $e^{-\\lambda}\\lambda^k/k!$ | $\\lambda$ | $\\lambda$ |\n| Uniform($a,b$) | $1/(b-a)$ | $(a+b)/2$ | $(b-a)^2/12$ |\n| Exponential($\\lambda$) | $\\lambda e^{-\\lambda x}$ | $1/\\lambda$ | $1/\\lambda^2$ |\n| Normal($\\mu,\\sigma^2$) | $\\frac{1}{\\sigma\\sqrt{2\\pi}}e^{-(x-\\mu)^2/2\\sigma^2}$ | $\\mu$ | $\\sigma^2$ |\n| Beta($a,b$) | $x^{a-1}(1-x)^{b-1}/B(a,b)$ | $\\frac{a}{a+b}$ | $\\frac{ab}{(a+b)^2(a+b+1)}$ |\n\n**Variables:**\n\n- $p$ success prob\n- $n$ trials\n- $k$ outcome\n- $\\lambda$ rate\n- $a,b$ bounds (Uniform) or shape params (Beta)\n- $\\mu,\\sigma^2$ mean/variance\n\n### Key points\n- **Convention trap:** geometric \"failures before success\" has support from 0 and mean $(1-p)/p$.\n- A density value is not a probability and can exceed 1.\n- Memoryless: Exponential (continuous) and Geometric (discrete) only.\n\n### Connections\n- **Detailed in:** [[normal-distribution]], [[lognormal-distribution]], [[exponential-poisson-process]], [[beta-bernoulli-conjugacy]].\n- **Used by:** [[order-statistics]], [[first-step-analysis]].\n\n<a id=\"normal-distribution\"><\/a>\n\n## Normal Distribution & Friends (χ², t, F)\n<!-- section: normal-distribution | prerequisites: [distributions-reference] | related: [lln-clt, hypothesis-testing, lognormal-distribution, brownian-motion] | tags: [normal, chi-square, t-distribution] -->\n\n### Formulas\n$$Z=\\frac{X-\\mu}{\\sigma}\\sim N(0,1);\\quad \\sum_{i=1}^{\\nu}Z_i^2\\sim\\chi^2_\\nu;\\quad \\frac{Z}{\\sqrt{U/\\nu}}\\sim t_\\nu;\\quad \\frac{U/a}{V/b}\\sim F_{a,b}$$\n\n**Variables:**\n\n- $\\mu,\\sigma$ mean and std dev\n- $Z_i$ iid standard normals\n- $U\\sim\\chi^2_\\nu$, $V\\sim\\chi^2_b$ independent\n- $\\nu,a,b$ degrees of freedom\n\n### Key points\n- 68 / 95 / 99.7% within 1/2/3 σ; central 95% uses 1.96.\n- Linear combos of **jointly** normal variables are normal; normal marginals alone are not enough.\n- $t$ has heavier tails, → normal as $\\nu\\to\\infty$. $\\chi^2_\\nu$ has mean $\\nu$, variance $2\\nu$.\n- $E[X^4]=3$ for standard normal (used in $\\mathrm{Var}(X^2)=2$).\n\n### Connections\n- **Used by:** [[hypothesis-testing]] (t and F tests), [[confidence-intervals]], [[brownian-motion]] (normal increments), [[black-scholes-formula]] ($N(d_1), N(d_2)$).\n\n<a id=\"lognormal-distribution\"><\/a>\n\n## Lognormal Distribution\n<!-- section: lognormal-distribution | prerequisites: [normal-distribution] | related: [geometric-brownian-motion, black-scholes-formula, jensens-inequality] | tags: [lognormal] -->\n\n### Formula\n$$\\log X\\sim N(m,s^2)\\Rightarrow E[X]=e^{m+s^2/2},\\quad \\mathrm{Var}(X)=(e^{s^2}-1)e^{2m+s^2}$$\n\n**Variables:** $m,s^2$ mean and variance of $\\log X$.\n\n### Key points\n- Right-skewed: median $e^m$ < mean $e^{m+s^2/2}$ — why ATM-forward call delta > 0.5 ([[delta-vs-itm-probability]]).\n- The $s^2/2$ term is [[jensens-inequality]] in action.\n\n### Connections\n- **Is the terminal law of:** [[geometric-brownian-motion]]; the BS assumption whose failure creates the [[volatility-skew]].\n\n<a id=\"exponential-poisson-process\"><\/a>\n\n## Exponential Di
