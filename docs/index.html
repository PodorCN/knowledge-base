stribution & Poisson Process\n<!-- section: exponential-poisson-process | prerequisites: [distributions-reference] | related: [first-step-analysis, total-expectation-variance, jump-diffusion] | tags: [memoryless, arrivals, order-flow] -->\n\n### Formulas\n$$P(T>s+t\\mid T>s)=P(T>t)=e^{-\\lambda t}$$\n$$N(t)\\sim\\mathrm{Poisson}(\\lambda t),\\qquad \\min(X,Y)\\sim\\mathrm{Exp}(\\lambda+\\mu),\\qquad P(X<Y)=\\frac{\\lambda}{\\lambda+\\mu}$$\n\n**Variables:**\n\n- $T$ waiting time\n- $\\lambda,\\mu$ rates\n- $N(t)$ arrivals in $[0,t]$\n- $X\\sim\\mathrm{Exp}(\\lambda)$, $Y\\sim\\mathrm{Exp}(\\mu)$ independent\n\n### Key points\n- Orders at 3/min: $P(\\text{none in 30s})=e^{-1.5}$.\n- Counts in disjoint intervals are independent — real order flow **clusters**, so check before assuming.\n- Memorylessness is a *model* property, not a law of waiting times.\n\n### Connections\n- **Builds on:** [[distributions-reference]].\n- **Used by:** [[total-expectation-variance]] (Poisson random sums: $E=\\lambda m$, $\\mathrm{Var}=\\lambda(v+m^2)$); [[jump-diffusion]] (Poisson jump arrivals).", "summary": "", "topic": "", "sections": ["distributions-reference", "normal-distribution", "lognormal-distribution", "exponential-poisson-process"], "degree": 6}, {"id": "estimator-properties", "title": "Estimator Properties (bias, variance, MSE, consistency)", "type": "concept", "domain": "prob-stats", "tags": ["bias", "mse", "degrees-of-freedom"], "path": "topics/estimation-testing.md", "content": "<a id=\"estimator-properties\"><\/a>\n\n## Estimator Properties (bias, variance, MSE, consistency)\n<!-- section: estimator-properties | prerequisites: [variance-covariance-correlation] | related: [bias-variance-tradeoff, ridge-regression, maximum-likelihood, lln-clt] | tags: [bias, mse, degrees-of-freedom] -->\n\n### Formulas\n$$\\mathrm{Bias}(\\hat\\theta)=E[\\hat\\theta]-\\theta,\\qquad \\mathrm{MSE}(\\hat\\theta)=\\mathrm{Var}(\\hat\\theta)+\\mathrm{Bias}(\\hat\\theta)^2$$\n$$s^2=\\frac{1}{n-1}\\sum_i(X_i-\\bar X)^2\\ \\ \\text{(unbiased)},\\qquad \\mathrm{Var}(\\bar X)=\\frac{\\sigma^2}{n}$$\n\n**Variables:**\n\n- $\\theta$ true parameter\n- $\\hat\\theta$ estimator\n- $X_i$ iid sample\n- $\\bar X$ sample mean\n- $n$ sample size\n\n### Key points\n- **Why $n-1$:** estimating $\\bar X$ forces $\\sum(X_i-\\bar X)=0$ → one residual degree of freedom lost; $E[\\sum(X_i-\\bar X)^2]=(n-1)\\sigma^2$.\n- Dividing by $n$ is biased downward but is the normal MLE.\n- **Unbiased ≠ consistent**; and an unbiased estimator need not minimise MSE → motivates shrinkage.\n- Standard error of mean $=\\sigma/\\sqrt n$ (estimated by $s/\\sqrt n$).\n\n### Connections\n- **Motivates:** [[ridge-regression]] (accept bias to cut variance), [[bias-variance-tradeoff]].\n- **Related:** [[maximum-likelihood]], [[lln-clt]].", "summary": "<a id=\"estimator-properties\"><\/a>", "topic": "estimation-testing", "degree": 8}, {"id": "lln-clt", "title": "Law of Large Numbers & Central Limit Theorem", "type": "concept", "domain": "prob-stats", "tags": ["clt", "standard-error"], "path": "topics/estimation-testing.md", "content": "<a id=\"lln-clt\"><\/a>\n\n## Law of Large Numbers & Central Limit Theorem\n<!-- section: lln-clt | prerequisites: [estimator-properties, normal-distribution] | related: [confidence-intervals, effective-sample-size, monte-carlo-pricing] | tags: [clt, standard-error] -->\n\n### Formula\n$$\\frac{\\sqrt n(\\bar X-\\mu)}{\\sigma}\\Rightarrow N(0,1)$$\n\n**Variables:**\n\n- $\\bar X$ sample mean of $n$ iid draws\n- $\\mu,\\sigma$ population mean / std dev (finite, $\\sigma>0$)\n\n### Key points\n- LLN: $\\bar X\\to\\mu$. CLT: the **sample mean** is ≈ normal; the observations themselves don't become normal.\n- 4× data halves the SE — only for **independent** data (duplicated / correlated rows don't count).\n- Fails / slow with dependence, heavy tails (infinite variance), tiny samples.\n\n### Connections\n- **Used by:** [[confidence-intervals]], [[monte-carlo-pricing]] (MC error $\\propto 1/\\sqrt{N}$).\n- **Adjust for dependence:** [[effective-sample-size]].", "summary": "<a id=\"lln-clt\"><\/a>", "topic": "estimation-testing", "degree": 8}, {"id": "maximum-likelihood", "title": "Maximum Likelihood Estimation (MLE)", "type": "concept", "domain": "prob-stats", "tags": ["mle", "map", "likelihood"], "path": "topics/estimation-testing.md", "content": "<a id=\"maximum-likelihood\"><\/a>\n\n## Maximum Likelihood Estimation (MLE)\n<!-- section: maximum-likelihood | prerequisites: [distributions-reference, estimator-properties] | related: [beta-bernoulli-conjugacy, logistic-regression, ols-regression] | tags: [mle, map, likelihood] -->\n\n### Formulas\n$$\\ell(\\theta)=\\sum_i\\log f(x_i;\\theta),\\qquad \\text{Bernoulli: }\\hat p=\\frac hn,\\qquad \\text{Normal: }\\hat\\mu=\\bar x,\\ \\hat\\sigma^2_{\\text{MLE}}=\\frac1n\\sum(x_i-\\bar x)^2$$\n\n**Variables:**\n\n- $f(x;\\theta)$ density/pmf\n- $\\theta$ parameter\n- $h$ successes in $n$ trials\n\n### Key points\n- Data fixed, $\\theta$ varies. MLE gives a point, **not** a distribution over $\\theta$ (that needs a prior).\n- Boundary case: all 0s or all 1s → maximum at boundary; don't divide by zero in the FOC.\n- 60 heads / 100: $\\hat p=0.6$, SE $\\approx\\sqrt{0.6\\cdot0.4/100}=0.049$ (Wald interval; poor near 0/1 — use score intervals).\n- MLE vs **MAP** (posterior mode) vs **posterior mean** — generally different.\n\n### Connections\n- **Contrast:** [[beta-bernoulli-conjugacy]] (Bayesian). **Special cases:** [[ols-regression]] = Gaussian MLE; [[logistic-regression]] = Bernoulli MLE (cross-entropy).", "summary": "<a id=\"maximum-likelihood\"><\/a>", "topic": "estimation-testing", "degree": 11}, {"id": "confidence-intervals", "title": "Confidence Intervals", "type": "concept", "domain": "prob-stats", "tags": ["ci", "t-interval"], "path": "topics/estimation-testing.md", "content": "<a id=\"confidence-intervals\"><\/a>\n\n## Confidence Intervals\n<!-- section: confidence-intervals | prerequisites: [lln-clt, normal-distribution] | related: [hypothesis-testing, prediction-vs-confidence-interval, bootstrap] | tags: [ci, t-interval] -->\n\n### Formulas\n$$\\bar x\\pm1.96\\frac{\\sigma}{\\sqrt n}\\ \\ (\\sigma\\text{ known}),\\qquad \\bar x\\pm t_{n-1,0.975}\\frac{s}{\\sqrt n}\\ \\ (\\sigma\\text{ unknown, normal data})$$\n\n**Variables:**\n\n- $\\bar x$ sample mean\n- $\\sigma$ / $s$ true / sample std dev\n- $n$ sample size\n- $t_{\\nu,u}$ $u$-quantile of $t_\\nu$\n\n### Key points\n- **Interpretation:** 95% of intervals *built by this procedure* cover the fixed true $\\mu$. A realised interval is not a 95% posterior probability.\n- Example: $n=100$, $\\bar x=0.2$, $s=1$ → approx $[0.004, 0.396]$.\n\n### Connections\n- **Dual of:** [[hypothesis-testing]]. **Non-parametric alternative:** [[bootstrap]]. **Regression version:** [[prediction-vs-confidence-interval]].", "summary": "<a id=\"confidence-intervals\"><\/a>", "topic": "estimation-testing", "degree": 10}, {"id": "hypothesis-testing", "title": "Hypothesis Testing, p-values & Power", "type": "concept", "domain": "prob-stats", "tags": ["p-value", "t-test", "power"], "path": "topics/estimation-testing.md", "content": "<a id=\"hypothesis-testing\"><\/a>\n\n## Hypothesis Testing, p-values & Power\n<!-- section: hypothesis-testing | prerequisites: [confidence-intervals] | related: [multiple-testing, sharpe-ratio, conditional-probability-bayes, gauss-markov-assumptions] | tags: [p-value, t-test, power] -->\n\n### Formula\n$$t=\\frac{\\bar x-\\mu_0}{s/\\sqrt n}\\sim t_{n-1}\\ \\text{under }H_0\\ (\\text{iid normal})$$\n\n**Variables:**\n\n- $\\mu_0$ null mean\n- $\\bar x,s,n$ sample mean, std dev, size\n\n### Key points\n- p-value $=P_{H_0}(|T|\\ge|t_{obs}|)$. **Not** $P(H_0\\text{ true})$, not \"prob. it happened by chance\". p = 0.03 ≠ 97% the alternative is true.\n- Type I (reject true $H_0$, rate α) / Type II (miss, β) / power $=1-\\beta$ ↑ with $n$, effect size, lower noise.\n- Example: $n=100,\\bar x=0.2,s=1$ → $t=2$, p ≈ 0.0455.\n- Statistical significance ≠ profit after costs.\n- **Sharpe link:** $t=\\sqrt n\\,\\widehat{SR}_{\\text{period}}$.\n\n### Connections\n- **Pitfall:** [[multiple-testing]]. **Finance:** [[sharpe-ratio]]. **Bayesian contrast:** [[conditional-probability-bayes]].", "summary": "<a id=\"hypothesis-testing\"><\/a>", "topic": "estimation-testing", "degree": 12}, {"id": "multiple-testing", "title": "Multiple Testing & Selection Bias", "type": "concept", "domain": "prob-stats", "tags": ["bonferroni", "fdr", "data-snooping"], "path": "topics/estimation-testing.md", "content": "<a id=\"multiple-testing\"><\/a>\n\n## Multiple Testing & Selection Bias\n<!-- section: multiple-testing | prerequisites: [hypothesis-testing] | related: [backtest-pitfalls, sharpe-ratio] | tags: [bonferroni, fdr, data-snooping] -->\n\n### Formulas\n$$E[\\#\\text{false rejections}]=m\\alpha,\\qquad P(\\ge1\\text{ false})=1-(1-\\alpha)^m\\ (\\text{indep.}),\\qquad \\text{Bonferroni: test at }\\alpha/m$$\n\n**Variables:**\n\n- $m$ number of true-null tests\n- $\\alpha$ per-test level\n\n### Key points\n- 1,000 true nulls at 5% → expect 50 false positives (no independence needed for the expectation).\n- Bonferroni controls FWER without independence (conservative). FDR (e.g. BH) controls the expected share of false discoveries.\n- **Finance:** searching thousands of signals and reporting the best Sharpe is selection bias; nominal p-values are misleading.\n\n### Connections\n- **Core cause of:** [[backtest-pitfalls]]. **Inflates:** [[sharpe-ratio]].", "summary": "<a id=\"multiple-testing\"><\/a>", "topic": "estimation-testing", "degree": 9}, {"id": "bootstrap", "title": "Bootstrap (iid and block)", "type": "concept", "domain": "prob-stats", "tags": ["resampling"], "path": "topics/estimation-testing.md", "content": "<a id=\"bootstrap\"><\/a>\n\n## Bootstrap (iid and block)\n<!-- section: bootstrap | prerequisites: [confidence-intervals] | related: [stationarity-ar1, effective-sample-size] | tags: [resampling] -->\n\n### Key points\n- Row-wise resampling assumes (approximately) iid rows.\n- Serial dependence → **block bootstrap** (contiguous blocks; block length & stationarity matter).\n- Not a cure for tiny samples or extreme tails.\n\n### Connections\n- **Alternative to:** analytic [[confidence-intervals]]. **Dependence issues:** [[stationarity-ar1]], [[effective-sample-size]].", "summary": "<a id=\"bootstrap\"><\/a>", "topic": "estimation-testing", "degree": 6}, {"id": "estimation-testing", "title": "Estimation & Hypothesis Testing", "type": "topic", "domain": "prob-stats", "tags": [], "path": "topics/estimation-testing.md", "content": "# Estimation & Hypothesis Testing\n\n**Sections:** [[estimator-properties]] · [[lln-clt]] · [[maximum-likelihood]] · [[confidence-intervals]] · [[hypothesis-testing]] · [[multiple-testing]] · [[bootstrap]]\n\n<a id=\"estimator-properties\"><\/a>\n\n## Estimator Properties (bias, variance, MSE, consistency)\n<!-- section: estimator-properties | prerequisites: [variance-covariance-correlation] | related: [bias-variance-tradeoff, ridge-regression, maximum-likelihood, lln-clt] | tags: [bias, mse, degrees-of-freedom] -->\n\n### Formulas\n$$\\mathrm{Bias}(\\hat\\theta)=E[\\hat\\theta]-\\theta,\\qquad \\mathrm{MSE}(\\hat\\theta)=\\mathrm{Var}(\\hat\\theta)+\\mathrm{Bias}(\\hat\\theta)^2$$\n$$s^2=\\frac{1}{n-1}\\sum_i(X_i-\\bar X)^2\\ \\ \\text{(unbiased)},\\qquad \\mathrm{Var}(\\bar X)=\\frac{\\sigma^2}{n}$$\n\n**Variables:**\n\n- $\\theta$ true parameter\n- $\\hat\\theta$ estimator\n- $X_i$ iid sample\n- $\\bar X$ sample mean\n- $n$ sample size\n\n### Key points\n- **Why $n-1$:** estimating $\\bar X$ forces $\\sum(X_i-\\bar X)=0$ → one residual degree of freedom lost; $E[\\sum(X_i-\\bar X)^2]=(n-1)\\sigma^2$.\n- Dividing by $n$ is biased downward but is the normal MLE.\n- **Unbiased ≠ consistent**; and an unbiased estimator need not minimise MSE → motivates shrinkage.\n- Standard error of mean $=\\sigma/\\sqrt n$ (estimated by $s/\\sqrt n$).\n\n### Connections\n- **Motivates:** [[ridge-regression]] (accept bias to cut variance), [[bias-variance-tradeoff]].\n- **Related:** [[maximum-likelihood]], [[lln-clt]].\n\n<a id=\"lln-clt\"><\/a>\n\n## Law of Large Numbers & Central Limit Theorem\n<!-- section: lln-clt | prerequisites: [estimator-properties, normal-distribution] | related: [confidence-intervals, effective-sample-size, monte-carlo-pricing] | tags: [clt, standard-error] -->\n\n### Formula\n$$\\frac{\\sqrt n(\\bar X-\\mu)}{\\sigma}\\Rightarrow N(0,1)$$\n\n**Variables:**\n\n- $\\bar X$ sample mean of $n$ iid draws\n- $\\mu,\\sigma$ population mean / std dev (finite, $\\sigma>0$)\n\n### Key points\n- LLN: $\\bar X\\to\\mu$. CLT: the **sample mean** is ≈ normal; the observations themselves don't become normal.\n- 4× data halves the SE — only for **independent** data (duplicated / correlated rows don't count).\n- Fails / slow with dependence, heavy tails (infinite variance), tiny samples.\n\n### Connections\n- **Used by:** [[confidence-intervals]], [[monte-carlo-pricing]] (MC error $\\propto 1/\\sqrt{N}$).\n- **Adjust for dependence:** [[effective-sample-size]].\n\n<a id=\"maximum-likelihood\"><\/a>\n\n## Maximum Likelihood Estimation (MLE)\n<!-- section: maximum-likelihood | prerequisites: [distributions-reference, estimator-properties] | related: [beta-bernoulli-conjugacy, logistic-regression, ols-regression] | tags: [mle, map, likelihood] -->\n\n### Formulas\n$$\\ell(\\theta)=\\sum_i\\log f(x_i;\\theta),\\qquad \\text{Bernoulli: }\\hat p=\\frac hn,\\qquad \\text{Normal: }\\hat\\mu=\\bar x,\\ \\hat\\sigma^2_{\\text{MLE}}=\\frac1n\\sum(x_i-\\bar x)^2$$\n\n**Variables:**\n\n- $f(x;\\theta)$ density/pmf\n- $\\theta$ parameter\n- $h$ successes in $n$ trials\n\n### Key points\n- Data fixed, $\\theta$ varies. MLE gives a point, **not** a distribution over $\\theta$ (that needs a prior).\n- Boundary case: all 0s or all 1s → maximum at boundary; don't divide by zero in the FOC.\n- 60 heads / 100: $\\hat p=0.6$, SE $\\approx\\sqrt{0.6\\cdot0.4/100}=0.049$ (Wald interval; poor near 0/1 — use score intervals).\n- MLE vs **MAP** (posterior mode) vs **posterior mean** — generally different.\n\n### Connections\n- **Contrast:** [[beta-bernoulli-conjugacy]] (Bayesian). **Special cases:** [[ols-regression]] = Gaussian MLE; [[logistic-regression]] = Bernoulli MLE (cross-entropy).\n\n<a id=\"confidence-intervals\"><\/a>\n\n## Confidence Intervals\n<!-- section: confidence-intervals | prerequisites: [lln-clt, normal-distribution] | related: [hypothesis-testing, prediction-vs-confidence-interval, bootstrap] | tags: [ci, t-interval] -->\n\n### Formulas\n$$\\bar x\\pm1.96\\frac{\\sigma}{\\sqrt n}\\ \\ (\\sigma\\text{ known}),\\qquad \\bar x\\pm t_{n-1,0.975}\\frac{s}{\\sqrt n}\\ \\ (\\sigma\\text{ unknown, normal data})$$\n\n**Variables:**\n\n- $\\bar x$ sample mean\n- $\\sigma$ / $s$ true / sample std dev\n- $n$ sample size\n- $t_{\\nu,u}$ $u$-quantile of $t_\\nu$\n\n### Key points\n- **Interpretation:** 95% of intervals *built by this procedure* cover the fixed true $\\mu$. A realised interval is not a 95% posterior probability.\n- Example: $n=100$, $\\bar x=0.2$, $s=1$ → approx $[0.004, 0.396]$.\n\n### Connections\n- **Dual of:** [[hypothesis-testing]]. **Non-parametric alternative:** [[bootstrap]]. **Regression version:** [[prediction-vs-confidence-interval]].\n\n<a id=\"hypothesis-testing\"><\/a>\n\n## Hypothesis Testing, p-values & Power\n<!-- section: hypothesis-testing | prerequisites: [confidence-intervals] | related: [multiple-testing, sharpe-ratio, conditional-probability-bayes, gauss-markov-assumptions] | tags: [p-value, t-test, power] -->\n\n### Formula\n$$t=\\frac{\\bar x-\\mu_0}{s/\\sqrt n}\\sim t_{n-1}\\ \\text{under }H_0\\ (\\text{iid normal})$$\n\n**Variables:**\n\n- $\\mu_0$ null mean\n- $\\bar x,s,n$ sample mean, std dev, size\n\n### Key points\n- p-value $=P_{H_0}(|T|\\ge|t_{obs}|)$. **Not** $P(H_0\\text{ true})$, not \"prob. it happened by chance\". p = 0.03 ≠ 97% the alternative is true.\n- Type I (reject true $H_0$, rate α) / Type II (miss, β) / power $=1-\\beta$ ↑ with $n$, effect size, lower noise.\n- Example: $n=100,\\bar x=0.2,s=1$ → $t=2$, p ≈ 0.0455.\n- Statistical significance ≠ profit after costs.\n- **Sharpe link:** $t=\\sqrt n\\,\\widehat{SR}_{\\text{period}}$.\n\n### Connections\n- **Pitfall:** [[multiple-testing]]. **Finance:** [[sharpe-ratio]]. **Bayesian contrast:** [[conditional-probability-bayes]].\n\n<a id=\"multiple-testing\"><\/a>\n\n## Multiple Testing & Selection Bias\n<!-- section: multiple-testing | prerequisites: [hypothesis-testing] | related: [backtest-pitfalls, sharpe-ratio] | tags: [bonferroni, fdr, data-snooping] -->\n\n### Formulas\n$$E[\\#\\text{false rejections}]=m\\alpha,\\qquad P(\\ge1\\text{ false})=1-(1-\\alpha)^m\\ (\\text{indep.}),\\qquad \\text{Bonferroni: test at }\\alpha/m$$\n\n**Variables:**\n\n- $m$ number of true-null tests\n- $\\alpha$ per-test level\n\n### Key points\n- 1,000 true nulls at 5% → expect 50 false positives (no independence needed for the expectation).\n- Bonferroni controls FWER without independence (conservative). FDR (e.g. BH) controls the expected share of false discoveries.\n- **Finance:** searching thousands of signals and reporting the best Sharpe is selection bias; nominal p-values are misleading.\n\n### Connections\n- **Core cause of:** [[backtest-pitfalls]]. **Inflates:** [[sharpe-ratio]].\n\n<a id=\"bootstrap\"><\/a>\n\n## Bootstrap (iid and block)\n<!-- section: bootstrap | prerequisites: [confidence-intervals] | related: [stationarity-ar1, effective-sample-size] | tags: [resampling] -->\n\n### Key points\n- Row-wise resampling assumes (approximately) iid rows.\n- Serial dependence → **block bootstrap** (contiguous blocks; block length & stationarity matter).\n- Not a cure for tiny samples or extreme tails.\n\n### Connections\n- **Alternative to:** analytic [[confidence-intervals]]. **Dependence issues:** [[stationarity-ar1]], [[effective-sample-size]].", "summary": "", "topic": "", "sections": ["estimator-properties", "lln-clt", "maximum-likelihood", "confidence-intervals", "hypothesis-testing", "multiple-testing", "bootstrap"], "degree": 9}, {"id": "digital-options", "title": "Digital (Binary) Options & the Skew Adjustment", "type": "concept", "domain": "pricing", "tags": ["digital", "binary", "skew-adjustment", "chain-rule"], "path": "topics/exotic-options.md", "content": "<a id=\"digital-options\"><\/a>\n\n## Digital (Binary) Options & the Skew Adjustment\n<!-- section: digital-options | prerequisites: [black-scholes-formula, breeden-litzenberger, volatility-skew] | related: [call-spread-overhedge, delta-vs-itm-probability, autocallables, static-replication] | tags: [digital, binary, skew-adjustment, chain-rule] -->\n\n### Flat-vol prices\n$$\\text{CoN}=e^{-rT}N(d_2),\\qquad \\text{AoN}=Se^{-qT}N(d_1),\\qquad C_{vanilla}=\\text{AoN}-K\\cdot\\text{CoN}$$\n\n**Variables:**\n\n- CoN pays 1 if $S_T>K$\n- AoN pays $S_T$ if $S_T>K$\n- others as in BS. Example $S=K=100,T=1,r=q=0,\\sigma=20\\%$: CoN $=N(-0.1)=0.4602$\n\n### With a smile — chain rule\nDigital = limit of a tight call spread: $\\frac{C(K-\\varepsilon)-C(K+\\varepsilon)}{2\\varepsilon}\\to-\\frac{dC(K,\\sigma(K))}{dK}$. Because σ depends on K:\n\n$$D(K)=-\\frac{\\partial C_{BS}}{\\partial K}-\\frac{\\partial C_{BS}}{\\partial\\sigma}\\frac{\\partial\\sigma}{\\partial K}=\\underbrace{e^{-rT}N(d_2)}_{\\text{flat-vol}}\\ \\underbrace{-\\ \\mathcal V_{BS}(K)\\,\\frac{\\partial\\sigma}{\\partial K}}_{\\text{skew term}}$$\n\n**Variables:**\n\n- $\\mathcal V_{BS}=S_0e^{-qT}\\sqrt T\\,n(d_1)>0$ vega at $K$\n- $\\partial\\sigma/\\partial K$ smile slope\n\n### Sign analysis (equity, $\\partial\\sigma/\\partial K<0$)\n- Skew term > 0 ⇒ **digital call dearer** than $e^{-rT}N(d_2)$; digital put $e^{-rT}N(-d_2)+\\mathcal V\\,\\partial\\sigma/\\partial K$ **cheaper**.\n- ATM example: flat 0.508 → surface 0.644 (+27%). Digitals trade off the **slope** of the smile, not its level.\n- **Call-spread intuition:** buy $K-\\varepsilon$ at higher IV, sell $K+\\varepsilon$ at lower IV → net cost inflated.\n\n### Structured payout ratio Q\nOption budget $C(K)$ funds $Q$ digitals: $Q=\\frac{C(K)}{D(K)}=\\frac{C_{BS}(K,\\sigma(K))}{e^{-rT}N(d_2)-\\mathcal V\\,\\partial\\sigma/\\partial K}<Q_{BS\\text{-flat}}$. Ignoring skew ⇒ over-promise $Q$ and lose at inception.\n\n**Three pricing tiers:** ① analytic skew-adjusted, ② discrete call spread with market vols at each strike, ③ dynamic smile model (Dupire, SABR/Heston) via PDE/MC.\n\n### Connections\n- **Derived from:** [[breeden-litzenberger]] + [[volatility-skew]]. **Hedged by:** [[call-spread-overhedge]].\n- **Inside:** [[autocallables]] (coupon & autocall digitals). **Probability link:** [[delta-vs-itm-probability]].", "summary": "<a id=\"digital-options\"><\/a>", "topic": "exotic-options", "degree": 19}, {"id": "barrier-options", "title": "Barrier Options (knock-in/out)", "type": "concept", "domain": "pricing", "tags": ["barrier", "knock-out", "bgk", "reverse-barrier"], "path": "topics/exotic-options.md", "content": "<a id=\"barrier-options\"><\/a>\n\n## Barrier Options (knock-in/out)\n<!-- section: barrier-options | prerequisites: [black-scholes-formula, volatility-surface] | related: [local-volatility-dupire, local-stochastic-volatility, monte-carlo-pricing, pde-finite-difference, autocallables, call-spread-overhedge, second-order-greeks] | tags: [barrier, knock-out, bgk, reverse-barrier] -->\n\n### In–out parity & closed form ($H\\le K$, continuous monitoring)\n$$C_{DO}=C_{vanilla}-C_{DI},\\qquad C_{DI}=Se^{-qT}\\Big(\\frac HS\\Big)^{2\\lambda}N(y)-Ke^{-rT}\\Big(\\frac HS\\Big)^{2\\lambda-2}N(y-\\sigma\\sqrt T)$$\n$$\\lambda=\\frac{r-q+\\sigma^2/2}{\\sigma^2},\\qquad y=\\frac{\\ln(H^2/(SK))}{\\sigma\\sqrt T}+\\lambda\\sigma\\sqrt T$$\n\n**Variables:**\n\n- $H$ barrier\n- $C_{DI}$ down-and-in call\n- others as BS. Example $S=K=100,H=90,T=1,r=q=0,\\sigma=20\\%$: vanilla 7.966, DI 1.498, DO 6.467\n\n### Discrete monitoring — BGK correction\nShift barrier $H\\to He^{\\pm0.5826\\sigma\\sqrt{\\Delta t}}$ (away from spot). Daily monitoring MC: 6.730 ± 0.029; BGK 6.669; continuous formula understates by ~4%. Price the frequency on the term sheet.\n\n### No single \"right\" vol\n3M DO call, K 5000, H 4500: knock-out discount 0.89 at ATM vol vs 9.03 at barrier-level vol — **10×**. Value depends on vol near the barrier and how the smile moves → local vol / LSV.\n\n### Greeks near the barrier\n- DO call near H: large Δ, Γ flips sign, vega can turn negative.\n- **Reverse knock-out (up-and-out call):** barrier ITM; payoff largest right before it dies → Δ flips large +/−, huge Γ/vega, gap risk. Desks apply **barrier shifts / reserves**.\n\n### Numerics\nPDE with barrier as boundary (align nodes); MC with Brownian-bridge crossing probability.\n\n### Connections\n- **Inside:** [[autocallables]] (down-and-in put). **Models:** [[local-volatility-dupire]], [[local-stochastic-volatility]]. **Overhedge cousin:** [[call-spread-overhedge]].", "summary": "<a id=\"barrier-options\"><\/a>", "topic": "exotic-options", "degree": 22}, {"id": "asian-options", "title": "Asian Options", "type": "concept", "domain": "pricing", "tags": ["asian", "averaging"], "path": "topics/exotic-options.md", "content": "<a id=\"asian-options\"><\/a>\n\n## Asian Options\n<!-- section: asian-options | prerequisites: [black-scholes-formula] | related: [monte-carlo-pricing] | tags: [asian, averaging] -->\n\nPayoff on the average price → **averaging kills vol** → cheaper.\n\n- 3M ATM call, daily averaging, 16.49% vol, 200k paths: Asian 102.99 vs vanilla 178.98 (ratio 0.58).\n- Continuous averaging from inception: effective vol ≈ $\\sigma/\\sqrt3$ ($1/\\sqrt3=0.577$) — geometric-average approximation (inferred in source).\n- Geometric Asian has closed form → MC **control variate** for arithmetic.", "summary": "<a id=\"asian-options\"><\/a>", "topic": "exotic-options", "degree": 5}, {"id": "variance-swaps", "title": "Variance Swaps & the VIX Strip", "type": "concept", "domain": "pricing", "tags": ["variance-swap", "vix", "replication"], "path": "topics/exotic-options.md", "content": "<a id=\"variance-swaps\"><\/a>\n\n## Variance Swaps & the VIX Strip\n<!-- section: variance-swaps | prerequisites: [static-replication, otm-stitching] | related: [gamma-theta-pnl, volatility-skew, realized-volatility, jump-diffusion] | tags: [variance-swap, vix, replication] -->\n\nPayoff: notional × (realised variance − $K_{var}$).\n\n$$K_{var}^2=\\frac{2}{TD}\\Big[\\int_0^F\\frac{P(K)}{K^2}dK+\\int_F^\\infty\\frac{C(K)}{K^2}dK\\Big]$$\n\n**Variables:**\n\n- $K_{var}$ fair variance strike (quoted as vol)\n- $P,C$ OTM put/call prices from the surface\n- $1/K^2$ weights\n- $F$ forward\n- $D$ discount factor\n- $T$ tenor\n\n- Replicated statically by the OTM strip + delta-hedged forward — **same construction as VIX**.\n- Low strikes weigh most and are expensive under skew → **var strike > ATM vol** (19.72% vs 16.49% in example).\n- Replication error: jumps, strike truncation. Vol swaps / VIX options need vol-of-vol.\n\n### Connections\n- **Removes path-dependence of:** [[gamma-theta-pnl]]. **Priced by:** [[volatility-skew]].", "summary": "<a id=\"variance-swaps\"><\/a>", "topic": "exotic-options", "degree": 10}, {"id": "cliquets-forward-start", "title": "Cliquets & Forward-Start Options", "type": "concept", "domain": "pricing", "tags": ["cliquet", "forward-start"], "path": "topics/exotic-options.md", "content": "<a id=\"cliquets-forward-start\"><\/a>\n\n## Cliquets & Forward-Start Options\n<!-- section: cliquets-forward-start | prerequisites: [forward-smile] | related: [heston-model, local-stochastic-volatility, vol-term-structure] | tags: [cliquet, forward-start] -->\n\n- **Cliquet:** sum of capped/floored periodic returns.\n- **Forward-start:** option whose strike is set at a future date.\n- Value depends on the **forward smile** → local vol underprices; use SV / LSV.\n- \"Model choice changes price materially\".", "summary": "<a id=\"cliquets-forward-start\"><\/a>", "topic": "exotic-options", "degree": 8}, {"id": "quanto-options", "title": "Quanto Options", "type": "concept", "domain": "pricing", "tags": ["quanto", "fx", "correlation"], "path": "topics/exotic-options.md", "content": "<a id=\"quanto-options\"><\/a>\n\n## Quanto Options\n<!-- section: quanto-options | prerequisites: [risk-neutral-pricing] | related: [worst-of-correlation, pricing-app-architecture] | tags: [quanto, fx, correlation] -->\n\nPayoff on a foreign underlying paid in domestic currency at a **fixed** FX rate.\n\n$$\\text{drift adjustment}=-\\rho\\,\\sigma_S\\,\\sigma_{FX}$$\n\n**Variables:**\n\n- ρ stock/FX correlation\n- $\\sigma_S$ stock vol\n- $\\sigma_{FX}$ FX vol\n\nExtra market data: FX vol and stock–FX correlation.", "summary": "<a id=\"quanto-options\"><\/a>", "topic": "exotic-options", "degree": 6}, {"id": "exotic-options", "title": "Exotic Options", "type": "topic", "domain": "pricing", "tags": [], "path": "topics/exotic-options.md", "content": "# Exotic Options\n\n**Sections:** [[digital-options]] · [[barrier-options]] · [[asian-options]] · [[variance-swaps]] · [[cliquets-forward-start]] · [[quanto-options]]\n\n<a id=\"digital-options\"><\/a>\n\n## Digital (Binary) Options & the Skew Adjustment\n<!-- section: digital-options | prerequisites: [black-scholes-formula, breeden-litzenberger, volatility-skew] | related: [call-spread-overhedge, delta-vs-itm-probability, autocallables, static-replication] | tags: [digital, binary, skew-adjustment, chain-rule] -->\n\n### Flat-vol prices\n$$\\text{CoN}=e^{-rT}N(d_2),\\qquad \\text{AoN}=Se^{-qT}N(d_1),\\qquad C_{vanilla}=\\text{AoN}-K\\cdot\\text{CoN}$$\n\n**Variables:**\n\n- CoN pays 1 if $S_T>K$\n- AoN pays $S_T$ if $S_T>K$\n- others as in BS. Example $S=K=100,T=1,r=q=0,\\sigma=20\\%$: CoN $=N(-0.1)=0.4602$\n\n### With a smile — chain rule\nDigital = limit of a tight call spread: $\\frac{C(K-\\varepsilon)-C(K+\\varepsilon)}{2\\varepsilon}\\to-\\frac{dC(K,\\sigma(K))}{dK}$. Because σ depends on K:\n\n$$D(K)=-\\frac{\\partial C_{BS}}{\\partial K}-\\frac{\\partial C_{BS}}{\\partial\\sigma}\\frac{\\partial\\sigma}{\\partial K}=\\underbrace{e^{-rT}N(d_2)}_{\\text{flat-vol}}\\ \\underbrace{-\\ \\mathcal V_{BS}(K)\\,\\frac{\\partial\\sigma}{\\partial K}}_{\\text{skew term}}$$\n\n**Variables:**\n\n- $\\mathcal V_{BS}=S_0e^{-qT}\\sqrt T\\,n(d_1)>0$ vega at $K$\n- $\\partial\\sigma/\\partial K$ smile slope\n\n### Sign analysis (equity, $\\partial\\sigma/\\partial K<0$)\n- Skew term > 0 ⇒ **digital call dearer** than $e^{-rT}N(d_2)$; digital put $e^{-rT}N(-d_2)+\\mathcal V\\,\\partial\\sigma/\\partial K$ **cheaper**.\n- ATM example: flat 0.508 → surface 0.644 (+27%). Digitals trade off the **slope** of the smile, not its level.\n- **Call-spread intuition:** buy $K-\\varepsilon$ at higher IV, sell $K+\\varepsilon$ at lower IV → net cost inflated.\n\n### Structured payout ratio Q\nOption budget $C(K)$ funds $Q$ digitals: $Q=\\frac{C(K)}{D(K)}=\\frac{C_{BS}(K,\\sigma(K))}{e^{-rT}N(d_2)-\\mathcal V\\,\\partial\\sigma/\\partial K}<Q_{BS\\text{-flat}}$. Ignoring skew ⇒ over-promise $Q$ and lose at inception.\n\n**Three pricing tiers:** ① analytic skew-adjusted, ② discrete call spread with market vols at each strike, ③ dynamic smile model (Dupire, SABR/Heston) via PDE/MC.\n\n### Connections\n- **Derived from:** [[breeden-litzenberger]] + [[volatility-skew]]. **Hedged by:** [[call-spread-overhedge]].\n- **Inside:** [[autocallables]] (coupon & autocall digitals). **Probability link:** [[delta-vs-itm-probability]].\n\n<a id=\"barrier-options\"><\/a>\n\n## Barrier Options (knock-in/out)\n<!-- section: barrier-options | prerequisites: [black-scholes-formula, volatility-surface] | related: [local-volatility-dupire, local-stochastic-volatility, monte-carlo-pricing, pde-finite-difference, autocallables, call-spread-overhedge, second-order-greeks] | tags: [barrier, knock-out, bgk, reverse-barrier] -->\n\n### In–out parity & closed form ($H\\le K$, continuous monitoring)\n$$C_{DO}=C_{vanilla}-C_{DI},\\qquad C_{DI}=Se^{-qT}\\Big(\\frac HS\\Big)^{2\\lambda}N(y)-Ke^{-rT}\\Big(\\frac HS\\Big)^{2\\lambda-2}N(y-\\sigma\\sqrt T)$$\n$$\\lambda=\\frac{r-q+\\sigma^2/2}{\\sigma^2},\\qquad y=\\frac{\\ln(H^2/(SK))}{\\sigma\\sqrt T}+\\lambda\\sigma\\sqrt T$$\n\n**Variables:**\n\n- $H$ barrier\n- $C_{DI}$ down-and-in call\n- others as BS. Example $S=K=100,H=90,T=1,r=q=0,\\sigma=20\\%$: vanilla 7.966, DI 1.498, DO 6.467\n\n### Discrete monitoring — BGK correction\nShift barrier $H\\to He^{\\pm0.5826\\sigma\\sqrt{\\Delta t}}$ (away from spot). Daily monitoring MC: 6.730 ± 0.029; BGK 6.669; continuous formula understates by ~4%. Price the frequency on the term sheet.\n\n### No single \"right\" vol\n3M DO call, K 5000, H 4500: knock-out discount 0.89 at ATM vol vs 9.03 at barrier-level vol — **10×**. Value depends on vol near the barrier and how the smile moves → local vol / LSV.\n\n### Greeks near the barrier\n- DO call near H: large Δ, Γ flips sign, vega can turn negative.\n- **Reverse knock-out (up-and-out call):** barrier ITM; payoff largest right before it dies → Δ flips large +/−, huge Γ/vega, gap risk. Desks apply **barrier shifts / reserves**.\n\n### Numerics\nPDE with barrier as boundary (align nodes); MC with Brownian-bridge crossing probability.\n\n### Connections\n- **Inside:** [[autocallables]] (down-and-in put). **Models:** [[local-volatility-dupire]], [[local-stochastic-volatility]]. **Overhedge cousin:** [[call-spread-overhedge]].\n\n<a id=\"asian-options\"><\/a>\n\n## Asian Options\n<!-- section: asian-options | prerequisites: [black-scholes-formula] | related: [monte-carlo-pricing] | tags: [asian, averaging] -->\n\nPayoff on the average price → **averaging kills vol** → cheaper.\n\n- 3M ATM call, daily averaging, 16.49% vol, 200k paths: Asian 102.99 vs vanilla 178.98 (ratio 0.58).\n- Continuous averaging from inception: effective vol ≈ $\\sigma/\\sqrt3$ ($1/\\sqrt3=0.577$) — geometric-average approximation (inferred in source).\n- Geometric Asian has closed form → MC **control variate** for arithmetic.\n\n<a id=\"variance-swaps\"><\/a>\n\n## Variance Swaps & the VIX Strip\n<!-- section: variance-swaps | prerequisites: [static-replication, otm-stitching] | related: [gamma-theta-pnl, volatility-skew, realized-volatility, jump-diffusion] | tags: [variance-swap, vix, replication] -->\n\nPayoff: notional × (realised variance − $K_{var}$).\n\n$$K_{var}^2=\\frac{2}{TD}\\Big[\\int_0^F\\frac{P(K)}{K^2}dK+\\int_F^\\infty\\frac{C(K)}{K^2}dK\\Big]$$\n\n**Variables:**\n\n- $K_{var}$ fair variance strike (quoted as vol)\n- $P,C$ OTM put/call prices from the surface\n- $1/K^2$ weights\n- $F$ forward\n- $D$ discount factor\n- $T$ tenor\n\n- Replicated statically by the OTM strip + delta-hedged forward — **same construction as VIX**.\n- Low strikes weigh most and are expensive under skew → **var strike > ATM vol** (19.72% vs 16.49% in example).\n- Replication error: jumps, strike truncation. Vol swaps / VIX options need vol-of-vol.\n\n### Connections\n- **Removes path-dependence of:** [[gamma-theta-pnl]]. **Priced by:** [[volatility-skew]].\n\n<a id=\"cliquets-forward-start\"><\/a>\n\n## Cliquets & Forward-Start Options\n<!-- section: cliquets-forward-start | prerequisites: [forward-smile] | related: [heston-model, local-stochastic-volatility, vol-term-structure] | tags: [cliquet, forward-start] -->\n\n- **Cliquet:** sum of capped/floored periodic returns.\n- **Forward-start:** option whose strike is set at a future date.\n- Value depends on the **forward smile** → local vol underprices; use SV / LSV.\n- \"Model choice changes price materially\".\n\n<a id=\"quanto-options\"><\/a>\n\n## Quanto Options\n<!-- section: quanto-options | prerequisites: [risk-neutral-pricing] | related: [worst-of-correlation, pricing-app-architecture] | tags: [quanto, fx, correlation] -->\n\nPayoff on a foreign underlying paid in domestic currency at a **fixed** FX rate.\n\n$$\\text{drift adjustment}=-\\rho\\,\\sigma_S\\,\\sigma_{FX}$$\n\n**Variables:**\n\n- ρ stock/FX correlation\n- $\\sigma_S$ stock vol\n- $\\sigma_{FX}$ FX vol\n\nExtra market data: FX vol and stock–FX correlation.", "summary": "", "topic": "", "sections": ["digital-options", "barrier-options", "asian-options", "variance-swaps", "cliquets-forward-start", "quanto-options"], "degree": 10}, {"id": "greeks", "title": "The Greeks (Δ, Γ, vega, Θ, ρ)", "type": "concept", "domain": "black-scholes", "tags": ["delta", "gamma", "vega", "theta", "rho"], "path": "topics/greeks-sensitivities.md", "content": "<a id=\"greeks\"><\/a>\n\n## The Greeks (Δ, Γ, vega, Θ, ρ)\n<!-- section: greeks | prerequisites: [black-scholes-formula] | related: [delta-hedging, gamma-theta-pnl, second-order-greeks, greeks-conventions-bumping, delta-vs-itm-probability, sticky-strike-vs-sticky-moneyness] | tags: [delta, gamma, vega, theta, rho] -->\n\n$$\\Delta_C=e^{-q\\tau}N(d_1),\\quad \\Delta_P=e^{-q\\tau}(N(d_1)-1),\\quad \\Gamma=\\frac{e^{-q\\tau}n(d_1)}{S\\sigma\\sqrt\\tau},\\quad \\mathcal V=Se^{-q\\tau}n(d_1)\\sqrt\\tau$$\n$$\\Theta_C=-\\frac{Se^{-q\\tau}n(d_1)\\sigma}{2\\sqrt\\tau}+qSe^{-q\\tau}N(d_1)-rKe^{-r\\tau}N(d_2),\\qquad \\rho_C=\\tau Ke^{-r\\tau}N(d_2)$$\n\n**Variables:**\n\n- $n$ standard normal pdf\n- others as in [[black-scholes-formula]]. Γ and vega identical for call and put\n\n### Reference ($S=K=100,T=1,r=q=0,\\sigma=20\\%$)\nΔ = 0.54, Γ = 0.397/20 = 0.0199, vega = 39.7 per 100% vol = 0.397 per vol point.\n\n### Profiles\n- Γ peaks near ATM, grows as expiry approaches (ATM Γ ~ $1/\\sqrt T$) → short-dated = gamma-heavy.\n- Vega peaks near ATM, grows with $\\sqrt T$ → long-dated = vega-heavy.\n- Long vanilla: Γ, vega > 0; Θ usually < 0 (not always for puts/with dividends).\n\n### Local P&L\n$$\\Delta V\\approx\\Delta\\,\\delta S+\\tfrac12\\Gamma(\\delta S)^2+\\mathcal V\\,\\delta\\sigma+\\Theta\\,\\delta t+\\rho\\,\\delta r$$\nΔ = 0.5, Γ = 0.02, stock +2 → ≈ 1.04. A long call can lose while the stock rises (Θ, vol crush).\n\n### Connections\n- [[delta-hedging]], [[gamma-theta-pnl]], [[second-order-greeks]], units & bumps in [[greeks-conventions-bumping]].\n- **Surface-aware delta:** [[sticky-strike-vs-sticky-moneyness]].", "summary": "<a id=\"greeks\"><\/a>", "topic": "greeks-sensitivities", "degree": 20}, {"id": "second-order-greeks", "title": "Vanna, Volga & Vanna–Volga", "type": "concept", "domain": "black-scholes", "tags": ["vanna", "volga", "cross-greeks"], "path": "topics/greeks-sensitivities.md", "content": "<a id=\"second-order-greeks\"><\/a>\n\n## Vanna, Volga & Vanna–Volga\n<!-- section: second-order-greeks | prerequisites: [greeks] | related: [fx-vol-conventions, barrier-options, sticky-strike-vs-sticky-moneyness] | tags: [vanna, volga, cross-greeks] -->\n\n$$\\text{Vanna}=\\frac{\\partial\\Delta}{\\partial\\sigma}=\\frac{\\partial\\mathcal V}{\\partial S},\\qquad \\text{Volga}=\\frac{\\partial\\mathcal V}{\\partial\\sigma}$$\n\n**Variables:**\n\n- Δ delta\n- $\\mathcal V$ vega\n- σ vol\n- $S$ spot\n\n- Matter when spot and vol move together (equities: spot ↓ vol ↑) and for exotic / barrier books.\n- **Vanna–volga**: quick smile-adjustment pricing method; FX market standard for interpolating across delta (not arbitrage-free).", "summary": "<a id=\"second-order-greeks\"><\/a>", "topic": "greeks-sensitivities", "degree": 8}, {"id": "greeks-conventions-bumping", "title": "Greek Units, Conventions & Bump-and-Reprice", "type": "concept", "domain": "black-scholes", "tags": ["finite-difference", "cash-greeks", "conventions"], "path": "topics/greeks-sensitivities.md", "content": "<a id=\"greeks-conventions-bumping\"><\/a>\n\n## Greek Units, Conventions & Bump-and-Reprice\n<!-- section: greeks-conventions-bumping | prerequisites: [greeks] | related: [price-reconciliation, sticky-strike-vs-sticky-moneyness, monte-carlo-pricing] | tags: [finite-difference, cash-greeks, conventions] -->\n\n### Units (be explicit in an app)\n- Delta in shares and **$ delta** $=\\Delta S\\cdot qty$; gamma as $ gamma per 1% move ($\\tfrac12\\Gamma S^2(1\\%)^2$ or $\\Gamma S\\cdot qty$ per 1%).\n- Vega per 1 vol point (analytic vega × 0.01); theta per calendar or business day; rho per 1 bp.\n- Mismatched conventions between app and risk system = classic \"numbers don't match\" ticket.\n\n### Bump-and-reprice\n$$\\Delta\\approx\\frac{V(S+h)-V(S-h)}{2h},\\qquad \\Gamma\\approx\\frac{V(S+h)-2V(S)+V(S-h)}{h^2}$$\n\n**Variables:** $h$ bump size (~1% of spot).\n\n- Too small → round-off / MC noise; too large → truncation error.\n- Desk \"cash\" Greeks bump the whole surface → must define sticky strike vs sticky delta.\n\n### Connections\n- [[price-reconciliation]], [[sticky-strike-vs-sticky-moneyness]], [[monte-carlo-pricing]] (AAD alternative).", "summary": "<a id=\"greeks-conventions-bumping\"><\/a>", "topic": "greeks-sensitivities", "degree": 10}, {"id": "greeks-sensitivities", "title": "Greeks", "type": "topic", "domain": "black-scholes", "tags": [], "path": "topics/greeks-sensitivities.md", "content": "# Greeks\n\n**Sections:** [[greeks]] · [[second-order-greeks]] · [[greeks-conventions-bumping]]\n\n<a id=\"greeks\"><\/a>\n\n## The Greeks (Δ, Γ, vega, Θ, ρ)\n<!-- section: greeks | prerequisites: [black-scholes-formula] | related: [delta-hedging, gamma-theta-pnl, second-order-greeks, greeks-conventions-bumping, delta-vs-itm-probability, sticky-strike-vs-sticky-moneyness] | tags: [delta, gamma, vega, theta, rho] -->\n\n$$\\Delta_C=e^{-q\\tau}N(d_1),\\quad \\Delta_P=e^{-q\\tau}(N(d_1)-1),\\quad \\Gamma=\\frac{e^{-q\\tau}n(d_1)}{S\\sigma\\sqrt\\tau},\\quad \\mathcal V=Se^{-q\\tau}n(d_1)\\sqrt\\tau$$\n$$\\Theta_C=-\\frac{Se^{-q\\tau}n(d_1)\\sigma}{2\\sqrt\\tau}+qSe^{-q\\tau}N(d_1)-rKe^{-r\\tau}N(d_2),\\qquad \\rho_C=\\tau Ke^{-r\\tau}N(d_2)$$\n\n**Variables:**\n\n- $n$ standard normal pdf\n- others as in [[black-scholes-formula]]. Γ and vega identical for call and put\n\n### Reference ($S=K=100,T=1,r=q=0,\\sigma=20\\%$)\nΔ = 0.54, Γ = 0.397/20 = 0.0199, vega = 39.7 per 100% vol = 0.397 per vol point.\n\n### Profiles\n- Γ peaks near ATM, grows as expiry approaches (ATM Γ ~ $1/\\sqrt T$) → short-dated = gamma-heavy.\n- Vega peaks near ATM, grows with $\\sqrt T$ → long-dated = vega-heavy.\n- Long vanilla: Γ, vega > 0; Θ usually < 0 (not always for puts/with dividends).\n\n### Local P&L\n$$\\Delta V\\approx\\Delta\\,\\delta S+\\tfrac12\\Gamma(\\delta S)^2+\\mathcal V\\,\\delta\\sigma+\\Theta\\,\\delta t+\\rho\\,\\delta r$$\nΔ = 0.5, Γ = 0.02, stock +2 → ≈ 1.04. A long call can lose while the stock rises (Θ, vol crush).\n\n### Connections\n- [[delta-hedging]], [[gamma-theta-pnl]], [[second-order-greeks]], units & bumps in [[greeks-conventions-bumping]].\n- **Surface-aware delta:** [[sticky-strike-vs-sticky-moneyness]].\n\n<a id=\"second-order-greeks\"><\/a>\n\n## Vanna, Volga & Vanna–Volga\n<!-- section: second-order-greeks | prerequisites: [greeks] | related: [fx-vol-conventions, barrier-options, sticky-strike-vs-sticky-moneyness] | tags: [vanna, volga, cross-greeks] -->\n\n$$\\text{Vanna}=\\frac{\\partial\\Delta}{\\partial\\sigma}=\\frac{\\partial\\mathcal V}{\\partial S},\\qquad \\text{Volga}=\\frac{\\partial\\mathcal V}{\\partial\\sigma}$$\n\n**Variables:**\n\n- Δ delta\n- $\\mathcal V$ vega\n- σ vol\n- $S$ spot\n\n- Matter when spot and vol move together (equities: spot ↓ vol ↑) and for exotic / barrier books.\n- **Vanna–volga**: quick smile-adjustment pricing method; FX market standard for interpolating across delta (not arbitrage-free).\n\n<a id=\"greeks-conventions-bumping\"><\/a>\n\n## Greek Units, Conventions & Bump-and-Reprice\n<!-- section: greeks-conventions-bumping | prerequisites: [greeks] | related: [price-reconciliation, sticky-strike-vs-sticky-moneyness, monte-carlo-pricing] | tags: [finite-difference, cash-greeks, conventions] -->\n\n### Units (be explicit in an app)\n- Delta in shares and **$ delta** $=\\Delta S\\cdot qty$; gamma as $ gamma per 1% move ($\\tfrac12\\Gamma S^2(1\\%)^2$ or $\\Gamma S\\cdot qty$ per 1%).\n- Vega per 1 vol point (analytic vega × 0.01); theta per calendar or business day; rho per 1 bp.\n- Mismatched conventions between app and risk system = classic \"numbers don't match\" ticket.\n\n### Bump-and-reprice\n$$\\Delta\\approx\\frac{V(S+h)-V(S-h)}{2h},\\qquad \\Gamma\\approx\\frac{V(S+h)-2V(S)+V(S-h)}{h^2}$$\n\n**Variables:** $h$ bump size (~1% of spot).\n\n- Too small → round-off / MC noise; too large → truncation error.\n- Desk \"cash\" Greeks bump the whole surface → must define sticky strike vs sticky delta.\n\n### Connections\n- [[price-reconciliation]], [[sticky-strike-vs-sticky-moneyness]], [[monte-carlo-pricing]] (AAD alternative).", "summary": "", "topic": "", "sections": ["greeks", "second-order-greeks", "greeks-conventions-bumping"], "degree": 8}, {"id": "delta-hedging", "title": "Delta Hedging & Its Residual Risks", "type": "concept", "domain": "risk-management", "tags": ["hedging", "delta-neutral"], "path": "topics/hedging.md", "content": "<a id=\"delta-hedging\"><\/a>\n\n## Delta Hedging & Its Residual Risks\n<!-- section: delta-hedging | prerequisites: [greeks] | related: [gamma-theta-pnl, call-spread-overhedge, barrier-options] | tags: [hedging, delta-neutral] -->\n\n- Short call with position delta −50 → **buy 50 shares**. Check contract multipliers.\n- Delta-neutral ≠ risk-free: gamma, vega, jumps, discrete rebalancing, costs remain.\n- Breaks down when Δ is discontinuous: digitals and barriers near expiry/barrier → **pin risk** → [[call-spread-overhedge]], barrier shifts.\n\n### Connections\n- **P&L of a hedged option:** [[gamma-theta-pnl]]. **Discrete analogue:** [[binomial-replication]]. **Hedging gamma too:** [[delta-gamma-hedging]].", "summary": "<a id=\"delta-hedging\"><\/a>", "topic": "hedging", "degree": 13}, {"id": "gamma-theta-pnl", "title": "Gamma–Theta Trade-off & Realised vs Implied Vol P&L", "type": "concept", "domain": "risk-management", "tags": ["gamma", "theta", "realised-vol", "variance-risk-premium"], "path": "topics/hedging.md", "content": "<a id=\"gamma-theta-pnl\"><\/a>\n\n## Gamma–Theta Trade-off & Realised vs Implied Vol P&L\n<!-- section: gamma-theta-pnl | prerequisites: [black-scholes-pde, greeks] | related: [realized-volatility, implied-volatility, variance-swaps, jensens-inequality, delta-gamma-hedging] | tags: [gamma, theta, realised-vol, variance-risk-premium] -->\n\n$$\\text{P\\&L}_{\\text{hedged}}\\approx\\tfrac12\\Gamma S^2\\big(\\sigma_{\\text{realised}}^2-\\sigma_{\\text{implied}}^2\\big)\\Delta t$$\n\n**Variables:**\n\n- Γ gamma\n- $S$ spot\n- $\\sigma_{\\text{realised}}$ vol over the step\n- $\\sigma_{\\text{implied}}$ vol paid\n- $\\Delta t$ time step\n\n- Long gamma pays theta; wins iff realised > implied. It's about movement **relative to what you paid**, not \"a lot of movement\".\n- Heuristic: ignores vol repricing, jumps, costs.\n- Path-dependent P&L (weighted by Γ, i.e. where spot went) → [[variance-swaps]] remove that dependence.\n\n### Why long gamma loses money on average\nLong gamma is paying an insurance premium for convexity, and that premium is usually priced rich. Running example: $S=100$, $\\sigma_{imp}=20\\%$, $\\Gamma=0.0398$, $\\Theta\\approx-0.032$/day.\n\n#### 1. Theta is charged every day, so the price must move enough to break even\n\nUnder BS ($r=0$) theta and gamma are tied together:\n\n$$\\Theta=-\\tfrac12\\,\\Gamma\\,\\sigma_{imp}^2\\,S^2$$\n\n**Variables:**\n\n- $\\Theta$ time decay per unit time\n- $\\Gamma$ gamma\n- $\\sigma_{imp}$ implied vol paid for the option\n- $S$ underlying price\n\nThe daily break-even move is\n\n$$|\\Delta S^*|=\\sigma_{imp}\\,S\\,\\sqrt{\\Delta t}$$\n\n**Variables:**\n\n- $\\Delta S^*$ the price move whose gamma gain exactly offsets theta\n- $\\Delta t$ time step, 1 day = 1/252\n\n- With the numbers: $20\\%\\times100\\times\\sqrt{1/252}\\approx1.26$ per day.\n- If the price moves less than 1.26 a day on average, you lose.\n- Equivalently, you only make money if realised vol > the implied vol you paid (BS result; Hull ch. 19 gives the Θ–Γ relation).\n\n#### 2. Implied vol usually exceeds realised vol (variance risk premium)\n\n- Empirically, index-option implied variance is on average above the variance subsequently realised.\n- So systematic long gamma / long vol has negative long-run returns ([[realized-volatility]]).\n- This is also why short-gamma (option-selling) strategies usually collect steadily and lose big in one go in a crash.\n\n#### 3. Path dependence: when and where the move happens matters\n\n- Gamma P&L ≈ ½Γ(ΔS)², but Γ itself changes with $S$ and time: largest ATM, near 0 deep ITM or OTM.\n- A big move after the option is already deep OTM earns almost nothing.\n- So P&L can be negative even if realised vol > implied over the whole period.\n- Actual P&L is driven by **gamma-weighted realised variance** (自己推理; a common result in the vol-trading literature, e.g. Sinclair, *Volatility Trading*).\n\n#### 4. Usually also long vega: IV crush risk\n\n- Buying options is usually long vega too.\n- Typical case: buying a straddle before earnings.\n- After the announcement implied vol drops sharply; even if the stock moves, the vega loss can wipe out the gamma gain.\n\n#### 5. Transaction costs + discrete hedging\n\n- The option bid–ask is often wide (entry cost).\n- Gamma scalping re-hedges delta frequently, paying costs each time.\n- Hedging too infrequently makes P&L very noisy (discrete-hedging error).\n\n#### 6. Near expiry, gamma and theta both blow up\n\n- ATM options near expiry have sharply rising Γ and equally rising Θ.\n- Daily theta cost is high.\n- With $S$ near the strike delta flips between 0 and 1 (pin risk), making hedging hard ([[call-spread-overhedge]]).\n\n#### 7. Negative carry: psychological and career pressure (自己推理)\n\n- Most of the time you lose a little; you make money only in a few big moves.\n- Drawdowns can be long, testing PM evaluations and LP patience.\n\n**References:**\n\n- Hull, *Options, Futures, and Other Derivatives*, ch. 19\n- Carr & Wu (2009), \"Variance Risk Premiums\", *RFS*\n- Bakshi & Kapadia (2003), \"Delta-Hedged Gains and the Negative Market Volatility Risk Premium\", *RFS*\n\n### Connections\n- **From:** [[black-scholes-pde]] rearranged. **Compares:** [[realized-volatility]] vs [[implied-volatility]].\n- **Vega side:** [[greeks]]. **Neutralising gamma instead:** [[delta-gamma-hedging]].", "summary": "<a id=\"gamma-theta-pnl\"><\/a>", "topic": "hedging", "degree": 17}, {"id": "delta-gamma-hedging", "title": "Delta-Gamma Hedging (is it cheaper?)", "type": "concept", "domain": "risk-management", "tags": ["gamma-neutral", "speed", "hedging-cost"], "path": "topics/hedging.md", "content": "<a id=\"delta-gamma-hedging\"><\/a>\n\n## Delta-Gamma Hedging (is it cheaper?)\n<!-- section: delta-gamma-hedging | prerequisites: [delta-hedging, gamma-theta-pnl] | related: [greeks, vol-term-structure, volatility-skew] | tags: [gamma-neutral, speed, hedging-cost] -->\n\nShort answer: **not cheaper, it is a different position.**\n\n- Hedging gamma also removes theta, so you stop paying for convexity and also stop receiving it.\n- The real savings are in hedge execution, not in the price of convexity.\n- (Numbers below computed with BS, flat vol 20%, $r=0$.)\n\n### Why theta disappears with gamma\nFor a delta-neutral book the BS PDE ($r=0$) reads\n\n$$\\Theta+\\tfrac12\\,\\sigma^2S^2\\,\\Gamma=0$$\n\n**Variables:**\n\n- $\\Theta$ book time decay\n- $\\sigma$ implied vol\n- $S$ underlying price\n- $\\Gamma$ book gamma\n\n- So $\\Gamma=0\\Rightarrow\\Theta\\approx0$ (Hull ch. 19, \"Relationship between delta, theta, and gamma\").\n- The hedge option has to be **sold** (you were long gamma); the theta it earns offsets the theta you paid.\n- The price of convexity doesn't change; you have just sold the insurance back.\n\n### Worked example: long 1 ATM call ($K=100$, 3 months)\nOriginal position: Γ = 0.0398, Θ = −0.0316/day, vega = 0.199.\n\n| Hedge option | Sell $w=-\\Gamma/\\Gamma_T$ | Θ after hedge | Vega after hedge |\n|---|---|---|---|\n| 110 call, same 3 months | 1.50 | 0 | 0 |\n| 100 call, 6 months | 1.42 | 0 | −0.199 |\n\nP&L after an instantaneous jump:\n\n| ΔS | Delta hedge only | Δ-Γ hedge (110 call) | Δ-Γ hedge (6M ATM) |\n|---|---|---|---|\n| −10 | +1.92 | +0.48 | −0.08 |\n| −5 | +0.50 | +0.07 | −0.01 |\n| +5 | +0.48 | −0.08 | −0.01 |\n| +10 | +1.77 | −0.64 | −0.06 |\n\n- The gamma gain essentially disappears; that is the price.\n- **Same expiry, different strike:** under BS vega ∝ Γ within one expiry, so vega is hedged too, but an asymmetric third-order term remains (**speed**, $\\partial\\Gamma/\\partial S$): gain on down moves, loss on up moves.\n- **Different expiry:** gamma- and theta-neutral, but now short vega, i.e. a bet on the term structure (自己推理 from the flat-vol model).\n\n### Where it actually saves / costs\n**Saves:**\n\n- Much smaller delta drift in big moves → rebalance less often → lower stock trading costs and discrete-hedging error.\n- Less gap risk (you can't re-hedge in the middle of a gap).\n- For a short-gamma dealer it is insurance: tail risk falls sharply.\n\n**Costs:**\n\n- Option bid–ask is far wider than stock → each round trip costs more.\n- The hedge option has a different IV (skew / term structure) → Θ is not exactly 0; you effectively hold a vol-spread position.\n- Residual risks: vega, speed, skew moves, model risk.\n- Both options' Greeks change over time, so gamma-neutrality drifts and must be rebalanced.\n\n### It depends on who you are (自己推理)\n| You are | What Δ-Γ hedging means |\n|---|---|\n| Deliberately long gamma, betting realised > implied | Hedges away your alpha; pointless |\n| Dealer who sold options to clients, passively short gamma | Very valuable: locks in bid–ask profit, removes tail risk |\n| Just want a steadier delta hedge | Less frequent rebalancing and less gap risk, but you pay option bid–ask |\n\n**References:**\n\n- Hull, *Options, Futures, and Other Derivatives*, ch. 19 \"The Greek Letters\" (gamma neutrality; delta–theta–gamma relation)\n\n### Connections\n- **Builds on:** [[delta-hedging]], [[gamma-theta-pnl]].\n- **Residual exposures:** vega and term structure ([[vol-term-structure]]), skew ([[volatility-skew]]).", "summary": "<a id=\"delta-gamma-hedging\"><\/a>", "topic": "hedging", "degree": 8}, {"id": "sticky-strike-vs-sticky-moneyness", "title": "Sticky Strike vs Sticky Moneyness (smile dynamics)", "type": "concept", "domain": "risk-management", "tags": ["smile-dynamics", "shadow-delta"], "path": "topics/hedging.md", "content": "<a id=\"sticky-strike-vs-sticky-moneyness\"><\/a>\n\n## Sticky Strike vs Sticky Moneyness (smile dynamics)\n<!-- section: sticky-strike-vs-sticky-moneyness | prerequisites: [volatility-surface, greeks] | related: [greeks-conventions-bumping, second-order-greeks, local-volatility-dupire] | tags: [smile-dynamics, shadow-delta] -->\n\n- **Sticky strike:** each strike keeps its IV when spot moves.\n- **Sticky moneyness / delta:** smile moves with spot. Delta gains $\\mathcal V\\cdot\\partial\\sigma/\\partial S$ (\"shadow delta\").\n\n### Example — index 5000 → 4900, 3M 5000 put\n| Rule | Vol | Put | Change | Delta |\n|---|---|---|---|---|\n| Before | 16.92% | 152.26 | — | — |\n| Sticky strike | 16.92% | 202.20 | +49.9 | −0.452 |\n| Sticky moneyness | 15.52% | 188.76 | +36.5 | −0.315 |\n\n- Hedge ratios differ by ~30%.\n- With negative skew, sticky-moneyness call delta < sticky-strike delta.\n\n### Regimes (Derman)\nCalm trending ≈ sticky strike; fearful ≈ **sticky implied tree** (ATM vol moves ~2× sticky-strike speed). A surface without stated dynamics gives unusable Greeks.\n\n### Connections\n- **Implemented in:** [[greeks-conventions-bumping]] (surface bumps). **Model-implied dynamics:** [[local-volatility-dupire]] (≈ sticky tree).", "summary": "<a id=\"sticky-strike-vs-sticky-moneyness\"><\/a>", "topic": "hedging", "degree": 13}, {"id": "call-spread-overhedge", "title": "Call-Spread Overhedge & Pin Risk", "type": "concept", "domain": "risk-management", "tags": ["pin-risk", "overhedge", "digital", "reserves"], "path": "topics/hedging.md", "content": "<a id=\"call-spread-overhedge\"><\/a>\n\n## Call-Spread Overhedge & Pin Risk\n<!-- section: call-spread-overhedge | prerequisites: [digital-options, delta-hedging] | related: [barrier-options, model-risk-governance, static-replication] | tags: [pin-risk, overhedge, digital, reserves] -->\n\n### Why digitals can't be delta-hedged near expiry\nPayoff jumps 0 → 1 at $K$; as $t\\to T$ near $K$, Δ → δ-function, Γ flips ±∞ → infinite rebalancing = **pin risk**.\n\n### The desk solution: left-shifted call spread\nShort a digital call at $K$ → buy $1/\\varepsilon$ call spreads on $[K-\\varepsilon,K]$:\n\n- $S_T\\le K-\\varepsilon$: both 0. $S_T\\ge K$: both 1. In between: hedge pays > 0, digital pays 0 → **cushion** (super-replication).\n- Symmetric $[K-\\varepsilon,K+\\varepsilon]$ would be **under-hedged** on $(K,K+\\varepsilon)$.\n- Example: $\\varepsilon=1$ → $(C(99)-C(100))/1=0.4701$ vs flat digital 0.4602; desk books the conservative side.\n\n### Width ε = quoting margin\nWider ε tames Γ and pin risk but costs more (K−ε deeper ITM, higher IV). Chosen by liquidity, pin risk, time to expiry.\n\n### App design (RBC Q5b.3)\nHuge digital gamma the day before expiry is a **feature**; show theoretical and overhedged Greeks and flag the regime rather than silently capping.\n\n### Connections\n- **Same idea for barriers:** barrier shift in [[barrier-options]]. **Booked as reserves:** [[model-risk-governance]].", "summary": "<a id=\"call-spread-overhedge\"><\/a>", "topic": "hedging", "degree": 11}, {"id": "hedging", "title": "Hedging", "type": "topic", "domain": "risk-management", "tags": [], "path": "topics/hedging.md", "content": "# Hedging\n\n**Sections:** [[delta-hedging]] · [[gamma-theta-pnl]] · [[delta-gamma-hedging]] · [[sticky-strike-vs-sticky-moneyness]] · [[call-spread-overhedge]]\n\n<a id=\"delta-hedging\"><\/a>\n\n## Delta Hedging & Its Residual Risks\n<!-- section: delta-hedging | prerequisites: [greeks] | related: [gamma-theta-pnl, call-spread-overhedge, barrier-options] | tags: [hedging, delta-neutral] -->\n\n- Short call with position delta −50 → **buy 50 shares**. Check contract multipliers.\n- Delta-neutral ≠ risk-free: gamma, vega, jumps, discrete rebalancing, costs remain.\n- Breaks down when Δ is discontinuous: digitals and barriers near expiry/barrier → **pin risk** → [[call-spread-overhedge]], barrier shifts.\n\n### Connections\n- **P&L of a hedged option:** [[gamma-theta-pnl]]. **Discrete analogue:** [[binomial-replication]]. **Hedging gamma too:** [[delta-gamma-hedging]].\n\n<a id=\"gamma-theta-pnl\"><\/a>\n\n## Gamma–Theta Trade-off & Realised vs Implied Vol P&L\n<!-- section: gamma-theta-pnl | prerequisites: [black-scholes-pde, greeks] | related: [realized-volatility, implied-volatility, variance-swaps, jensens-inequality, delta-gamma-hedging] | tags: [gamma, theta, realised-vol, variance-risk-premium] -->\n\n$$\\text{P\\&L}_{\\text{hedged}}\\approx\\tfrac12\\Gamma S^2\\big(\\sigma_{\\text{realised}}^2-\\sigma_{\\text{implied}}^2\\big)\\Delta t$$\n\n**Variables:**\n\n- Γ gamma\n- $S$ spot\n- $\\sigma_{\\text{realised}}$ vol over the step\n- $\\sigma_{\\text{implied}}$ vol paid\n- $\\Delta t$ time step\n\n- Long gamma pays theta; wins iff realised > implied. It's about movement **relative to what you paid**, not \"a lot of movement\".\n- Heuristic: ignores vol repricing, jumps, costs.\n- Path-dependent P&L (weighted by Γ, i.e. where spot went) → [[variance-swaps]] remove that dependence.\n\n### Why long gamma loses money on average\nLong gamma is paying an insurance premium for convexity, and that premium is usually priced rich. Running example: $S=100$, $\\sigma_{imp}=20\\%$, $\\Gamma=0.0398$, $\\Theta\\approx-0.032$/day.\n\n#### 1. Theta is charged every day, so the price must move enough to break even\n\nUnder BS ($r=0$) theta and gamma are tied together:\n\n$$\\Theta=-\\tfrac12\\,\\Gamma\\,\\sigma_{imp}^2\\,S^2$$\n\n**Variables:**\n\n- $\\Theta$ time decay per unit time\n- $\\Gamma$ gamma\n- $\\sigma_{imp}$ implied vol paid for the option\n- $S$ underlying price\n\nThe daily break-even move is\n\n$$|\\Delta S^*|=\\sigma_{imp}\\,S\\,\\sqrt{\\Delta t}$$\n\n**Variables:**\n\n- $\\Delta S^*$ the price move whose gamma gain exactly offsets theta\n- $\\Delta t$ time step, 1 day = 1/252\n\n- With the numbers: $20\\%\\times100\\times\\sqrt{1/252}\\approx1.26$ per day.\n- If the price moves less than 1.26 a day on average, you lose.\n- Equivalently, you only make money if realised vol > the implied vol you paid (BS result; Hull ch. 19 gives the Θ–Γ relation).\n\n#### 2. Implied vol usually exceeds realised vol (variance risk premium)\n\n- Empirically, index-option implied variance is on average above the variance subsequently realised.\n- So systematic long gamma / long vol has negative long-run returns ([[realized-volatility]]).\n- This is also why short-gamma (option-selling) strategies usually collect steadily and lose big in one go in a crash.\n\n#### 3. Path dependence: when and where the move happens matters\n\n- Gamma P&L ≈ ½Γ(ΔS)², but Γ itself changes with $S$ and time: largest ATM, near 0 deep ITM or OTM.\n- A big move after the option is already deep OTM earns almost nothing.\n- So P&L can be negative even if realised vol > implied over the whole period.\n- Actual P&L is driven by **gamma-weighted realised variance** (自己推理; a common result in the vol-trading literature, e.g. Sinclair, *Volatility Trading*).\n\n#### 4. Usually also long vega: IV crush risk\n\n- Buying options is usually long vega too.\n- Typical case: buying a straddle before earnings.\n- After the announcement implied vol drops sharply; even if the stock moves, the vega loss can wipe out the gamma gain.\n\n#### 5. Transaction costs + discrete hedging\n\n- The option bid–ask is often wide (entry cost).\n- Gamma scalping re-hedges delta frequently, paying costs each time.\n- Hedging too infrequently makes P&L very noisy (discrete-hedging error).\n\n#### 6. Near expiry, gamma and theta both blow up\n\n- ATM options near expiry have sharply rising Γ and equally rising Θ.\n- Daily theta cost is high.\n- With $S$ near the strike delta flips between 0 and 1 (pin risk), making hedging hard ([[call-spread-overhedge]]).\n\n#### 7. Negative carry: psychological and career pressure (自己推理)\n\n- Most of the time you lose a little; you make money only in a few big moves.\n- Drawdowns can be long, testing PM evaluations and LP patience.\n\n**References:**\n\n- Hull, *Options, Futures, and Other Derivatives*, ch. 19\n- Carr & Wu (2009), \"Variance Risk Premiums\", *RFS*\n- Bakshi & Kapadia (2003), \"Delta-Hedged Gains and the Negative Market Volatility Risk Premium\", *RFS*\n\n### Connections\n- **From:** [[black-scholes-pde]] rearranged. **Compares:** [[realized-volatility]] vs [[implied-volatility]].\n- **Vega side:** [[greeks]]. **Neutralising gamma instead:** [[delta-gamma-hedging]].\n\n<a id=\"delta-gamma-hedging\"><\/a>\n\n## Delta-Gamma Hedging (is it cheaper?)\n<!-- section: delta-gamma-hedging | prerequisites: [delta-hedging, gamma-theta-pnl] | related: [greeks, vol-term-structure, volatility-skew] | tags: [gamma-neutral, speed, hedging-cost] -->\n\nShort answer: **not cheaper, it is a different position.**\n\n- Hedging gamma also removes theta, so you stop paying for convexity and also stop receiving it.\n- The real savings are in hedge execution, not in the price of convexity.\n- (Numbers below computed with BS, flat vol 20%, $r=0$.)\n\n### Why theta disappears with gamma\nFor a delta-neutral book the BS PDE ($r=0$) reads\n\n$$\\Theta+\\tfrac12\\,\\sigma^2S^2\\,\\Gamma=0$$\n\n**Variables:**\n\n- $\\Theta$ book time decay\n- $\\sigma$ implied vol\n- $S$ underlying price\n- $\\Gamma$ book gamma\n\n- So $\\Gamma=0\\Rightarrow\\Theta\\approx0$ (Hull ch. 19, \"Relationship between delta, theta, and gamma\").\n- The hedge option has to be **sold** (you were long gamma); the theta it earns offsets the theta you paid.\n- The price of convexity doesn't change; you have just sold the insurance back.\n\n### Worked example: long 1 ATM call ($K=100$, 3 months)\nOriginal position: Γ = 0.0398, Θ = −0.0316/day, vega = 0.199.\n\n| Hedge option | Sell $w=-\\Gamma/\\Gamma_T$ | Θ after hedge | Vega after hedge |\n|---|---|---|---|\n| 110 call, same 3 months | 1.50 | 0 | 0 |\n| 100 call, 6 months | 1.42 | 0 | −0.199 |\n\nP&L after an instantaneous jump:\n\n| ΔS | Delta hedge only | Δ-Γ hedge (110 call) | Δ-Γ hedge (6M ATM) |\n|---|---|---|---|\n| −10 | +1.92 | +0.48 | −0.08 |\n| −5 | +0.50 | +0.07 | −0.01 |\n| +5 | +0.48 | −0.08 | −0.01 |\n| +10 | +1.77 | −0.64 | −0.06 |\n\n- The gamma gain essentially disappears; that is the price.\n- **Same expiry, different strike:** under BS vega ∝ Γ within one expiry, so vega is hedged too, but an asymmetric third-order term remains (**speed**, $\\partial\\Gamma/\\partial S$): gain on down moves, loss on up moves.\n- **Different expiry:** gamma- and theta-neutral, but now short vega, i.e. a bet on the term structure (自己推理 from the flat-vol model).\n\n### Where it actually saves / costs\n**Saves:**\n\n- Much smaller delta drift in big moves → rebalance less often → lower stock trading costs and discrete-hedging error.\n- Less gap risk (you can't re-hedge in the middle of a gap).\n- For a short-gamma dealer it is insurance: tail risk falls sharply.\n\n**Costs:**\n\n- Option bid–ask is far wider than stock → each round trip costs more.\n- The hedge option has a different IV (skew / term structure) → Θ is not exactly 0; you effectively hold a vol-spread position.\n- Residual risks: vega, speed, skew moves, model risk.\n- Both options' Greeks change over time, so gamma-neutrality drifts and must be rebalanced.\n\n### It depends on who you are (自己推理)\n| You are | What Δ-Γ hedging means |\n|---|---|\n| Deliberately long gamma, betting realised > implied | Hedges away your alpha; pointless |\n| Dealer who sold options to clients, passively short gamma | Very valuable: locks in bid–ask profit, removes tail risk |\n| Just want a steadier delta hedge | Less frequent rebalancing and less gap risk, but you pay option bid–ask |\n\n**References:**\n\n- Hull, *Options, Futures, and Other Derivatives*, ch. 19 \"The Greek Letters\" (gamma neutrality; delta–theta–gamma relation)\n\n### Connections\n- **Builds on:** [[delta-hedging]], [[gamma-theta-pnl]].\n- **Residual exposures:** vega and term structure ([[vol-term-structure]]), skew ([[volatility-skew]]).\n\n<a id=\"sticky-strike-vs-sticky-moneyness\"><\/a>\n\n## Sticky Strike vs Sticky Moneyness (smile dynamics)\n<!-- section: sticky-strike-vs-sticky-moneyness | prerequisites: [volatility-surface, greeks] | related: [greeks-conventions-bumping, second-order-greeks, local-volatility-dupire] | tags: [smile-dynamics, shadow-delta] -->\n\n- **Sticky strike:** each strike keeps its IV when spot moves.\n- **Sticky moneyness / delta:** smile moves with spot. Delta gains $\\mathcal V\\cdot\\partial\\sigma/\\partial S$ (\"shadow delta\").\n\n### Example — index 5000 → 4900, 3M 5000 put\n| Rule | Vol | Put | Change | Delta |\n|---|---|---|---|---|\n| Before | 16.92% | 152.26 | — | — |\n| Sticky strike | 16.92% | 202.20 | +49.9 | −0.452 |\n| Sticky moneyness | 15.52% | 188.76 | +36.5 | −0.315 |\n\n- Hedge ratios differ by ~30%.\n- With negative skew, sticky-moneyness call delta < sticky-strike delta.\n\n### Regimes (Derman)\nCalm trending ≈ sticky strike; fearful ≈ **sticky implied tree** (ATM vol moves ~2× sticky-strike speed). A surface without stated dynamics gives unusable Greeks.\n\n### Connections\n- **Implemented in:** [[greeks-conventions-bumping]] (surface bumps). **Model-implied dynamics:** [[local-volatility-dupire]] (≈ sticky tree).\n\n<a id=\"call-spread-overhedge\"><\/a>\n\n## Call-Spread Overhedge & Pin Risk\n<!-- section: call-spread-overhedge | prerequisites: [digital-options, delta-hedging] | related: [barrier-options, model-risk-governance, static-replication] | tags: [pin-risk, overhedge, digital, reserves] -->\n\n### Why digitals can't be delta-hedged near expiry\nPayoff jumps 0 → 1 at $K$; as $t\\to T$ near $K$, Δ → δ-function, Γ flips ±∞ → infinite rebalancing = **pin risk**.\n\n### The desk solution: left-shifted call spread\nShort a digital call at $K$ → buy $1/\\varepsilon$ call spreads on $[K-\\varepsilon,K]$:\n\n- $S_T\\le K-\\varepsilon$: both 0. $S_T\\ge K$: both 1. In between: hedge pays > 0, digital pays 0 → **cushion** (super-replication).\n- Symmetric $[K-\\varepsilon,K+\\varepsilon]$ would be **under-hedged** on $(K,K+\\varepsilon)$.\n- Example: $\\varepsilon=1$ → $(C(99)-C(100))/1=0.4701$ vs flat digital 0.4602; desk books the conservative side.\n\n### Width ε = quoting margin\nWider ε tames Γ and pin risk but costs more (K−ε deeper ITM, higher IV). Chosen by liquidity, pin risk, time to expiry.\n\n### App design (RBC Q5b.3)\nHuge digital gamma the day before expiry is a **feature**; show theoretical and overhedged Greeks and flag the regime rather than silently capping.\n\n### Connections\n- **Same idea for barriers:** barrier shift in [[barrier-options]]. **Booked as reserves:** [[model-risk-governance]].", "summary": "", "topic": "", "sections": ["delta-hedging", "gamma-theta-pnl", "delta-gamma-hedging", "sticky-strike-vs-sticky-moneyness", "call-spread-overhedge"], "degree": 10}, {"id": "implied-volatility", "title": "Implied Volatility (inversion & quoting convention)", "type": "concept", "domain": "quant-models", "tags": ["implied-vol", "newton", "quoting"], "path": "topics/implied-volatility-skew.md", "content": "<a id=\"implied-volatility\"><\/a>\n\n## Implied Volatility (inversion & quoting convention)\n<!-- section: implied-volatility | prerequisites: [black-scholes-formula, root-finding] | related: [volatility-surface, realized-volatility, put-call-parity, bond-duration, otm-stitching] | tags: [implied-vol, newton, quoting] -->\n\n$$C_{BS}(F,K,T,D,\\sigma)=C_{mkt},\\qquad \\sigma_{n+1}=\\sigma_n-\\frac{C_{BS}(\\sigma_n)-C_{mkt}}{\\mathcal V(\\sigma_n)}$$\n\n**Variables:**\n\n- $F$ forward\n- $K$ strike\n- $T$ expiry\n- $D$ discount factor\n- σ implied vol solved for\n- $\\mathcal V=\\partial C/\\partial\\sigma$ vega\n\n### Key points\n- Vega > 0 ⇒ price strictly increasing in σ ⇒ **unique** solution (if price within [[option-price-bounds]]).\n- Newton converges in ~1 step near ATM (vega large, ~constant): 5000 put, mid 151.20 → 16.81%.\n- Deep OTM / short-dated: vega → 0, Newton explodes → bisection / Brent. Production: Jäckel's *\"Let's be rational\"*. Good seed $\\sigma_0\\approx\\sqrt{2\\pi/T}\\,C/S$.\n- **Call IV = put IV** at same $(K,T)$ by [[put-call-parity]].\n- **Three meanings of \"calibrating vol\":** (1) invert each option (what desks do), (2) fit one σ to the chain (fails: −86% on 4300 put, +541% on 5700 call), (3) estimate realised vol (P-measure, risk only).\n- **Circular?** Price → IV → price adds nothing for one option; value is as a common unit, an interpolator, and because European payoffs are model-free given the whole surface.\n\n| Bond world | Option world |\n|---|---|\n| YTM (flat curve — false) | IV (constant σ — false) |\n| Yield curve | Vol surface |\n| Callable bonds need a term-structure model | Barriers/cliquets need LV/SV |\n\n### Connections\n- **Collect across (K,T):** [[volatility-surface]]. **Contrast:** [[realized-volatility]]. **Analogy:** [[bond-duration]] (YTM).", "summary": "<a id=\"implied-volatility\"><\/a>", "topic": "implied-volatility-skew", "degree": 21}, {"id": "realized-volatility", "title": "Realised / Historical Volatility (EWMA) & Variance Risk Premium", "type": "concept", "domain": "quant-models", "tags": ["ewma", "garch", "vrp"], "path": "topics/implied-volatility-skew.md", "content": "<a id=\"realized-volatility\"><\/a>\n\n## Realised / Historical Volatility (EWMA) & Variance Risk Premium\n<!-- section: realized-volatility | prerequisites: [returns-simple-log] | related: [implied-volatility, gamma-theta-pnl, variance-swaps, risk-neutral-pricing] | tags: [ewma, garch, vrp] -->\n\n$$\\hat\\sigma_{ann}=\\mathrm{std}(r_t)\\sqrt{252},\\qquad \\sigma_t^2=\\lambda\\sigma_{t-1}^2+(1-\\lambda)r_{t-1}^2$$\n\n**Variables:**\n\n- $r_t$ daily log return\n- 252 trading days/yr\n- λ EWMA decay (0.94 daily, RiskMetrics)\n\n- 1% daily std → ≈ 15.9% annual.\n- P-measure (risk, forecasting) vs implied = Q-measure (pricing). Implied usually > subsequently realised → **variance risk premium**.\n\n### Connections\n- **Traded against implied via:** [[gamma-theta-pnl]], [[variance-swaps]].", "summary": "<a id=\"realized-volatility\"><\/a>", "topic": "implied-volatility-skew", "degree": 10}, {"id": "vol-term-structure", "title": "Vol Term Structure, Forward Vol & Event Variance", "type": "concept", "domain": "quant-models", "tags": ["forward-vol", "total-variance", "earnings"], "path": "topics/implied-volatility-skew.md", "content": "<a id=\"vol-term-structure\"><\/a>\n\n## Vol Term Structure, Forward Vol & Event Variance\n<!-- section: vol-term-structure | prerequisites: [implied-volatility] | related: [volatility-surface, surface-no-arbitrage, forward-smile, cliquets-forward-start] | tags: [forward-vol, total-variance, earnings] -->\n\n$$\\bar\\sigma^2=\\frac1T\\int_0^T\\sigma(t)^2dt,\\qquad \\sigma_{fwd}(T_1,T_2)=\\sqrt{\\frac{\\sigma_2^2T_2-\\sigma_1^2T_1}{T_2-T_1}},\\qquad \\sigma_T^2T=\\sigma_{base}^2T+\\sigma_{event}^2$$\n\n**Variables:**\n\n- σ(t) instantaneous deterministic vol\n- $\\bar\\sigma$ RMS vol to plug into BS\n- $\\sigma_1,\\sigma_2$ implied vols for $T_1<T_2$\n- $\\sigma_{base}$ diffusive vol\n- $\\sigma_{event}$ std of the one-day event move\n\n### Examples\n- 3M 20%, 6M 22% → forward vol $\\sqrt{(0.0242-0.01)/0.25}=23.8\\%$.\n- Base 25%, 1M expiry spanning earnings at 40% → $\\sigma_{event}^2=(0.16-0.0625)/12=0.0081$ → ±9% implied move.\n\n### Key idea\n**Total variance $w=\\sigma^2T$ is additive in time** → interpolate in $w$ (at constant log-moneyness), require $w$ non-decreasing in $T$.\n\n### Connections\n- **Constraint:** calendar arbitrage in [[surface-no-arbitrage]]. **Future smiles:** [[forward-smile]].", "summary": "<a id=\"vol-term-structure\"><\/a>", "topic": "implied-volatility-skew", "degree": 15}, {"id": "volatility-skew", "title": "Volatility Skew & Smile (why equity skew is negative)", "type": "concept", "domain": "quant-models", "tags": ["skew", "smile", "leverage-effect"], "path": "topics/implied-volatility-skew.md", "content": "<a id=\"volatility-skew\"><\/a>\n\n## Volatility Skew & Smile (why equity skew is negative)\n<!-- section: volatility-skew | prerequisites: [volatility-surface] | related: [digital-options, variance-swaps, autocallables, heston-model, jump-diffusion, fx-vol-conventions] | tags: [skew, smile, leverage-effect] -->\n\n- **Skew** (left wing up) = equity; **smile** (both wings up) = FX typical.\n- 3M chain, S = 100: 90 put 26% (price 1.45 vs 0.71 at flat 20%) — the market charges ~2× for downside protection.\n\n### Why equity skew is negative\n1. **Leverage effect** — price ↓ → leverage ↑ → vol ↑.\n2. **Crash fear** — hedgers' demand for downside puts (post-1987).\n3. **Supply of upside calls** from overwriters.\n→ OTM puts richer than OTM calls; $\\partial\\sigma/\\partial K<0$.\n\n### Where skew shows up in prices\n- [[digital-options]]: skew term $-\\mathcal V\\,\\partial\\sigma/\\partial K>0$ makes digital calls dearer.\n- [[variance-swaps]]: $1/K^2$ weights on expensive puts → var strike > ATM vol.\n- [[autocallables]]: investor sells a deep OTM put priced in the steep part of the skew.\n- [[sticky-strike-vs-sticky-moneyness]]: skew makes delta depend on dynamics.\n\n### Models producing skew\nHeston ρ < 0 ([[heston-model]]); jumps for short-dated skew ([[jump-diffusion]]); SVI ρ parameter.", "summary": "<a id=\"volatility-skew\"><\/a>", "topic": "implied-volatility-skew", "degree": 22}, {"id": "fx-vol-conventions", "title": "FX Vol Quoting (ATM, Risk Reversal, Butterfly)", "type": "concept", "domain": "quant-models", "tags": ["fx", "risk-reversal", "butterfly", "delta-quoting"], "path": "topics/implied-volatility-skew.md", "content": "<a id=\"fx-vol-conventions\"><\/a>\n\n## FX Vol Quoting (ATM, Risk Reversal, Butterfly)\n<!-- section: fx-vol-conventions | prerequisites: [volatility-surface] | related: [second-order-greeks, sabr, volatility-skew] | tags: [fx, risk-reversal, butterfly, delta-quoting] -->\n\n$$\\sigma_{25C}=\\sigma_{ATM}+\\tfrac12RR+BF,\\qquad \\sigma_{25P}=\\sigma_{ATM}-\\tfrac12RR+BF$$\n\n**Variables:**\n\n- $\\sigma_{ATM}$ delta-neutral straddle vol\n- $RR$ 25-delta risk reversal (call vol − put vol\n- skew)\n- $BF$ 25-delta butterfly (avg wing − ATM\n- curvature)\n\nATM 7.0%, RR −0.5%, BF 0.2% → 25Δ call 6.95%, put 7.45%.\n\n- OTC market quotes **vol**, not price; per tenor, often also 10Δ.\n- Interpolate across delta: vanna–volga (standard, not arb-free), SABR, polynomial.\n- Traps: delta conventions (spot vs forward, premium-adjusted), market vs smile strangle.", "summary": "<a id=\"fx-vol-conventions\"><\/a>", "topic": "implied-volatility-skew", "degree": 8}, {"id": "implied-volatility-skew", "title": "Implied Volatility & Skew", "type": "topic", "domain": "quant-models", "tags": [], "path": "topics/implied-volatility-skew.md", "content": "# Implied Volatility & Skew\n\n**Sections:** [[implied-volatility]] · [[realized-volatility]] · [[vol-term-structure]] · [[volatility-skew]] · [[fx-vol-conventions]]\n\n<a id=\"implied-volatility\"><\/a>\n\n## Implied Volatility (inversion & quoting convention)\n<!-- section: implied-volatility | prerequisites: [black-scholes-formula, root-finding] | related: [volatility-surface, realized-volatility, put-call-parity, bond-duration, otm-stitching] | tags: [implied-vol, newton, quoting] -->\n\n$$C_{BS}(F,K,T,D,\\sigma)=C_{mkt},\\qquad \\sigma_{n+1}=\\sigma_n-\\frac{C_{BS}(\\sigma_n)-C_{mkt}}{\\mathcal V(\\sigma_n)}$$\n\n**Variables:**\n\n- $F$ forward\n- $K$ strike\n- $T$ expiry\n- $D$ discount factor\n- σ implied vol solved for\n- $\\mathcal V=\\partial C/\\partial\\sigma$ vega\n\n### Key points\n- Vega > 0 ⇒ price strictly increasing in σ ⇒ **unique** solution (if price within [[option-price-bounds]]).\n- Newton converges in ~1 step near ATM (vega large, ~constant): 5000 put, mid 151.20 → 16.81%.\n- Deep OTM / short-dated: vega → 0, Newton explodes → bisection / Brent. Production: Jäckel's *\"Let's be rational\"*. Good seed $\\sigma_0\\approx\\sqrt{2\\pi/T}\\,C/S$.\n- **Call IV = put IV** at same $(K,T)$ by [[put-call-parity]].\n- **Three meanings of \"calibrating vol\":** (1) invert each option (what desks do), (2) fit one σ to the chain (fails: −86% on 4300 put, +541% on 5700 call), (3) estimate realised vol (P-measure, risk only).\n- **Circular?** Price → IV → price adds nothing for one option; value is as a common unit, an interpolator, and because European payoffs are model-free given the whole surface.\n\n| Bond world | Option world |\n|---|---|\n| YTM (flat curve — false) | IV (constant σ — false) |\n| Yield curve | Vol surface |\n| Callable bonds need a term-structure model | Barriers/cliquets need LV/SV |\n\n### Connections\n- **Collect across (K,T):** [[volatility-surface]]. **Contrast:** [[realized-volatility]]. **Analogy:** [[bond-duration]] (YTM).\n\n<a id=\"realized-volatility\"><\/a>\n\n## Realised / Historical Volatility (EWMA) & Variance Risk Premium\n<!-- section: realized-volatility | prerequisites: [returns-simple-log] | related: [implied-volatility, gamma-theta-pnl, variance-swaps, risk-neutral-pricing] | tags: [ewma, garch, vrp] -->\n\n$$\\hat\\sigma_{ann}=\\mathrm{std}(r_t)\\sqrt{252},\\qquad \\sigma_t^2=\\lambda\\sigma_{t-1}^2+(1-\\lambda)r_{t-1}^2$$\n\n**Variables:**\n\n- $r_t$ daily log return\n- 252 trading days/yr\n- λ EWMA decay (0.94 daily, RiskMetrics)\n\n- 1% daily std → ≈ 15.9% annual.\n- P-measure (risk, forecasting) vs implied = Q-measure (pricing). Implied usually > subsequently realised → **variance risk premium**.\n\n### Connections\n- **Traded against implied via:** [[gamma-theta-pnl]], [[variance-swaps]].\n\n<a id=\"vol-term-structure\"><\/a>\n\n## Vol Term Structure, Forward Vol & Event Variance\n<!-- section: vol-term-structure | prerequisites: [implied-volatility] | related: [volatility-surface, surface-no-arbitrage, forward-smile, cliquets-forward-start] | tags: [forward-vol, total-variance, earnings] -->\n\n$$\\bar\\sigma^2=\\frac1T\\int_0^T\\sigma(t)^2dt,\\qquad \\sigma_{fwd}(T_1,T_2)=\\sqrt{\\frac{\\sigma_2^2T_2-\\sigma_1^2T_1}{T_2-T_1}},\\qquad \\sigma_T^2T=\\sigma_{base}^2T+\\sigma_{event}^2$$\n\n**Variables:**\n\n- σ(t) instantaneous deterministic vol\n- $\\bar\\sigma$ RMS vol to plug into BS\n- $\\sigma_1,\\sigma_2$ implied vols for $T_1<T_2$\n- $\\sigma_{base}$ diffusive vol\n- $\\sigma_{event}$ std of the one-day event move\n\n### Examples\n- 3M 20%, 6M 22% → forward vol $\\sqrt{(0.0242-0.01)/0.25}=23.8\\%$.\n- Base 25%, 1M expiry spanning earnings at 40% → $\\sigma_{event}^2=(0.16-0.0625)/12=0.0081$ → ±9% implied move.\n\n### Key idea\n**Total variance $w=\\sigma^2T$ is additive in time** → interpolate in $w$ (at constant log-moneyness), require $w$ non-decreasing in $T$.\n\n### Connections\n- **Constraint:** calendar arbitrage in [[surface-no-arbitrage]]. **Future smiles:** [[forward-smile]].\n\n<a id=\"volatility-skew\"><\/a>\n\n## Volatility Skew & Smile (why equity skew is negative)\n<!-- section: volatility-skew | prerequisites: [volatility-surface] | related: [digital-options, variance-swaps, autocallables, heston-model, jump-diffusion, fx-vol-conventions] | tags: [skew, smile, leverage-effect] -->\n\n- **Skew** (left wing up) = equity; **smile** (both wings up) = FX typical.\n- 3M chain, S = 100: 90 put 26% (price 1.45 vs 0.71 at flat 20%) — the market charges ~2× for downside protection.\n\n### Why equity skew is nega
